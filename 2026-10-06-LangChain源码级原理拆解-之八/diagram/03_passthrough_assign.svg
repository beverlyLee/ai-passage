  <text x="181" y="168" text-anchor="middle" fill="#cbd5e1" font-size="12">invoke (:226) = identity</text>
  <text x="181" y="190" text-anchor="middle" fill="#cbd5e1" font-size="12">原样返回输入</text>
  <text x="181" y="214" text-anchor="middle" fill="#cbd5e1" font-size="12">stream (:327) = transform(iter([input]))</text>
