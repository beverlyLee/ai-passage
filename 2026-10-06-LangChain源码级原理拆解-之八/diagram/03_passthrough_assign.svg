  <text x="340" y="34" text-anchor="middle" fill="#e2e8f0" font-size="18">RunnablePassthrough 与 assign：原样透传 / 透传加字段</text>
  <text x="340" y="54" text-anchor="middle" fill="#64748b" font-size="11">langchain-core 1.3.2  ·  runnables/passthrough.py:74 / 226 / 327 / 207 / 223 / 489</text>

