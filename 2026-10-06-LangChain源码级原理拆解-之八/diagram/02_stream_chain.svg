  <text x="66" y="344" fill="#94a3b8" font-size="13">默认 Runnable.transform（base.py:1563）</text>
  <text x="66" y="368" fill="#cbd5e1" font-size="12">把所有 chunk 在内存里攒齐（final = final + chunk），再 yield from self.stream(final)</text>
  <text x="66" y="388" fill="#fbbf24" font-size="11">坑：链里一旦出现只支持"攒齐再出"的节点，流式就被截断，下游只拿到整体结果</text>

