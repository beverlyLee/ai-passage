  <rect x="474" y="110" width="160" height="86" rx="8" fill="#1e293b" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="554" y="136" text-anchor="middle" fill="#a78bfa" font-size="13">step3.transform</text>
