<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 450">
  <defs>
    <style>
      text { font-family: "JetBrains Mono","Menlo","Noto Sans SC","PingFang SC","Microsoft YaHei",monospace; fill:#e2e8f0; }
      .t { font-size:18px; fill:#22d3ee; font-weight:bold; }
      .s { font-size:12px; fill:#94a3b8; }
      .b { font-size:13px; fill:#e2e8f0; }
      .c { font-size:12px; fill:#22d3ee; }
      .a { font-size:12px; fill:#fbbf24; }
    </style>
  </defs>
  <rect width="680" height="450" fill="#0f172a"/>
  <text x="24" y="34" class="t">FP4(E2M1) + 分组缩放：每 16 通道 1 个 E4M3 scale</text>

  <!-- 16 channel rects (cyan) + 1 scale (amber) -->
  <text x="24" y="78" class="s">一组 K 通道（16 个值）：</text>
  <!-- 16 small rects width 26, gap 4, start x=24 -->
  <!-- x: 24,54,84,...; 16*30-4 = 476 -> last x=24+15*30=474, +26=500 -->
  <g fill="#0e7490" stroke="#22d3ee" stroke-width="1">
    <rect x="24" y="92" width="26" height="34" rx="3"/>
    <rect x="54" y="92" width="26" height="34" rx="3"/>
    <rect x="84" y="92" width="26" height="34" rx="3"/>
    <rect x="114" y="92" width="26" height="34" rx="3"/>
    <rect x="144" y="92" width="26" height="34" rx="3"/>
    <rect x="174" y="92" width="26" height="34" rx="3"/>
    <rect x="204" y="92" width="26" height="34" rx="3"/>
    <rect x="234" y="92" width="26" height="34" rx="3"/>
    <rect x="264" y="92" width="26" height="34" rx="3"/>
    <rect x="294" y="92" width="26" height="34" rx="3"/>
    <rect x="324" y="92" width="26" height="34" rx="3"/>
    <rect x="354" y="92" width="26" height="34" rx="3"/>
    <rect x="384" y="92" width="26" height="34" rx="3"/>
    <rect x="414" y="92" width="26" height="34" rx="3"/>
    <rect x="444" y="92" width="26" height="34" rx="3"/>
    <rect x="474" y="92" width="26" height="34" rx="3"/>
  </g>
  <text x="317" y="124" text-anchor="middle" class="c">16 × 4 bit</text>
  <!-- scale rect -->
  <rect x="510" y="84" width="40" height="50" rx="3" fill="#78350f" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="530" y="113" text-anchor="middle" class="a">8bit</text>
  <text x="530" y="138" text-anchor="middle" class="s">scale</text>
  <line x1="500" y1="109" x2="510" y2="109" stroke="#64748b" stroke-width="1.5"/>
  <polygon points="510,109 502,105 502,113" fill="#64748b"/>

  <text x="24" y="172" class="b">16 × 4bit + 1 × 8bit = 72 bit = 9 byte / 16 val = <tspan fill="#22d3ee">0.5625 B/val</tspan></text>

  <!-- bars: FP16 / FP8 / FP4-group -->
  <text x="24" y="212" class="s">同元素数下的字节/值对比（条宽 ∝ 字节）：</text>
  <rect x="200" y="230" width="200" height="26" rx="3" fill="#334155"/>
  <text x="24" y="248" class="b">FP16</text>
  <text x="408" y="248" class="s">2.00 B/val</text>

  <rect x="200" y="266" width="100" height="26" rx="3" fill="#0e7490"/>
  <text x="24" y="284" class="b">FP8</text>
  <text x="308" y="284" class="s">1.00 B/val</text>

  <rect x="200" y="302" width="56" height="26" rx="3" fill="#22d3ee"/>
  <text x="24" y="320" class="b">FP4+group</text>
  <text x="264" y="320" class="s">0.5625 B/val</text>

  <rect x="24" y="350" width="632" height="74" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="40" y="380" class="b">精度压缩比：FP16 / FP4-group = 2.00 / 0.5625 = <tspan fill="#22d3ee">3.56x</tspan></text>
  <text x="40" y="404" class="s">脚本实测：精度贡献 3.56x，结构性贡献 1.125x，合计 ≈ 4.0x（≈ V4-Flash 的 1/4）</text>
</svg>
