<svg xmlns="http://www.w3.org/2000/svg" width="680" height="450" viewBox="0 0 680 450">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="680" height="450" fill="#0f172a"/>

  <text x="22" y="30" fill="#e2e8f0" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="700">一次交互全流程：从发请求到确定性路由</text>

  <g fill="none" stroke="#64748b" stroke-width="1.5">
    <path d="M164,139 L186,139" marker-end="url(#arrow)"/>
    <path d="M328,139 L350,139" marker-end="url(#arrow)"/>
    <path d="M492,139 L514,139" marker-end="url(#arrow)"/>
  </g>

  <rect x="24" y="80" width="140" height="118" rx="8" fill="#0f172a"/>
  <rect x="24" y="80" width="140" height="118" rx="8" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="94" y="108" text-anchor="middle" fill="#22d3ee" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="600">① 应用发起请求</text>
  <text x="94" y="132" text-anchor="middle" fill="#cbd5e1" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="9">POST /v1/systemone</text>
  <text x="94" y="154" text-anchor="middle" fill="#cbd5e1" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="10">state + model</text>
  <text x="94" y="176" text-anchor="middle" fill="#cbd5e1" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="10">questions{...}</text>

  <rect x="188" y="80" width="140" height="118" rx="8" fill="#0f172a"/>
  <rect x="188" y="80" width="140" height="118" rx="8" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="258" y="108" text-anchor="middle" fill="#34d399" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="600">② Jev 收到请求</text>
  <text x="258" y="132" text-anchor="middle" fill="#cbd5e1" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="10">一次前向</text>
  <text x="258" y="154" text-anchor="middle" fill="#cbd5e1" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="9">parallel sampler 并行</text>
  <text x="258" y="176" text-anchor="middle" fill="#94a3b8" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="9">无自回归 decode</text>

  <rect x="352" y="80" width="140" height="118" rx="8" fill="#0f172a"/>
  <rect x="352" y="80" width="140" height="118" rx="8" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="422" y="108" text-anchor="middle" fill="#a78bfa" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="600">③ 返回 answers</text>
  <text x="422" y="132" text-anchor="middle" fill="#cbd5e1" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="9">Choice / Score / Noul</text>
  <text x="422" y="154" text-anchor="middle" fill="#cbd5e1" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="9">usage.output_tokens=0</text>
  <text x="422" y="176" text-anchor="middle" fill="#fbbf24" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="9">（输出免费）</text>

  <rect x="516" y="80" width="140" height="118" rx="8" fill="#0f172a"/>
  <rect x="516" y="80" width="140" height="118" rx="8" fill="rgba(59,130,246,0.3)" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="586" y="108" text-anchor="middle" fill="#60a5fa" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="600">④ 确定性路由</text>
  <text x="586" y="132" text-anchor="middle" fill="#cbd5e1" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="10">派部门 / 排序 / 升级</text>
  <text x="586" y="154" text-anchor="middle" fill="#cbd5e1" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="10">代码直接执行</text>
  <text x="586" y="176" text-anchor="middle" fill="#94a3b8" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="10">不解析长文本</text>

  <rect x="24" y="228" width="632" height="46" rx="8" fill="#0f172a"/>
  <rect x="24" y="228" width="632" height="46" rx="8" fill="rgba(136,19,55,0.35)" stroke="#fb7185" stroke-width="1.5"/>
  <text x="340" y="257" text-anchor="middle" fill="#fb7185" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="12">对照 LLM：自回归逐 token 生成 N 个计费 token → 慢（3~329s）、贵，且要解析 / 校验 / 重试</text>

  <text x="340" y="320" text-anchor="middle" fill="#fbbf24" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="700">一句话认知</text>
  <text x="340" y="352" text-anchor="middle" fill="#cbd5e1" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="13">Jev 把「判断」做成一次前向的零件：你给状态 + 问题，</text>
  <text x="340" y="376" text-anchor="middle" fill="#cbd5e1" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="13">它给带概率的答案，代码拿答案去确定性路由。</text>
</svg>
