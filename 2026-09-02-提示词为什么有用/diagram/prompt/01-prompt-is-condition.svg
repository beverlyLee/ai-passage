<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 450">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;family=Noto+Sans+SC:wght@400;500;700&amp;display=swap');
    text { font-family: 'JetBrains Mono','Noto Sans SC','PingFang SC',sans-serif; }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/></marker>
    <marker id="arrow-rose" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#fb7185"/></marker>
    <marker id="arrow-amber" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#fbbf24"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#0f172a"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <text x="20" y="30" fill="#e2e8f0" font-size="16" font-weight="700">图1 · 你写的每句话，都是它“接下一句”的条件</text>
  <text x="20" y="46" fill="#64748b" font-size="9">先搞懂一个词 — 大模型 = 超级接话高手（它一个字一个字“猜”出来，不是“想”出来）</text>

  <!-- prompt input -->
  <rect x="24" y="74" width="280" height="44" rx="8" fill="rgba(30,41,59,0.5)" stroke="#60a5fa" stroke-width="1.4"/>
  <text x="40" y="101" fill="#e2e8f0" font-size="12">你写的话（提示词）</text>
  <line x1="304" y1="96" x2="348" y2="96" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- model -->
  <rect x="350" y="64" width="306" height="64" rx="8" fill="rgba(59,130,246,0.18)" stroke="#60a5fa" stroke-width="1.4"/>
  <text x="366" y="92" fill="#e2e8f0" font-size="12" font-weight="700">大模型（超级接话高手）</text>
  <text x="366" y="113" fill="#94a3b8" font-size="9">看过几千亿字，熟到能“猜”你下一句</text>

  <!-- arrows to next word -->
  <line x1="503" y1="128" x2="120" y2="178" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="360" y="158" fill="#94a3b8" font-size="9">它盯着“你写过的全部内容”</text>

  <!-- next word row -->
  <text x="24" y="200" fill="#94a3b8" font-size="10">下一步要接的“最可能的字”（概率最高那个）：</text>
  <rect x="40" y="212" width="80" height="42" rx="8" fill="rgba(251,113,133,0.18)" stroke="#fb7185" stroke-width="1.2"/>
  <text x="80" y="238" fill="#fecdd3" font-size="13" text-anchor="middle">因</text>
  <line x1="120" y1="233" x2="156" y2="233" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="160" y="212" width="80" height="42" rx="8" fill="rgba(251,113,133,0.18)" stroke="#fb7185" stroke-width="1.2"/>
  <text x="200" y="238" fill="#fecdd3" font-size="13" text-anchor="middle">为</text>
  <line x1="240" y1="233" x2="276" y2="233" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="280" y="212" width="80" height="42" rx="8" fill="rgba(251,113,133,0.18)" stroke="#fb7185" stroke-width="1.2"/>
  <text x="320" y="238" fill="#fecdd3" font-size="13" text-anchor="middle">…</text>

  <!-- insight box -->
  <rect x="20" y="276" width="640" height="140" rx="8" fill="rgba(30,41,59,0.4)" stroke="#475569" stroke-width="1"/>
  <text x="36" y="298" fill="#e2e8f0" font-size="12" font-weight="600">关键：你写的话，就是它“猜下一个字”的全部依据（术语叫“条件”）。</text>
  <text x="36" y="322" fill="#94a3b8" font-size="10">· 你给得多、给得准 → 它猜的词被“框”在你想要的那一块，回答就贴题。</text>
  <text x="36" y="344" fill="#94a3b8" font-size="10">· 你给得空 → 它只能瞎猜，哪个方向概率高就往哪接，容易跑偏。</text>
  <text x="36" y="370" fill="#fbbf24" font-size="11" font-weight="600">→ 所以“换种问法答案就变好”，本质是：换了条件，概率分布就变了。</text>
  <text x="36" y="400" fill="#cbd5e1" font-size="9">类比：同一个开头，写不同续写要求，编辑接出的故事走向完全不同。</text>
</svg>
