<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 450">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;family=Noto+Sans+SC:wght@400;500;700&amp;display=swap');
    text { font-family: 'JetBrains Mono','Noto Sans SC','PingFang SC',sans-serif; }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/></marker>
    <marker id="arrow-rose" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#fb7185"/></marker>
    <marker id="arrow-amber" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#fbbf24"/></marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#34d399"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#0f172a"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <text x="20" y="30" fill="#e2e8f0" font-size="16" font-weight="700">图4 · 关于提示词的 4 个误区</text>
  <text x="20" y="46" fill="#64748b" font-size="9">别把“会问”做成“迷信”</text>

  <!-- row 1 -->
  <rect x="24" y="66" width="300" height="78" rx="8" fill="rgba(251,113,133,0.12)" stroke="#fb7185" stroke-width="1.1"/>
  <text x="40" y="90" fill="#fecdd3" font-size="10" font-weight="600">误区① 越长越好</text>
  <text x="40" y="112" fill="#cbd5e1" font-size="9">堆字会稀释重点，它照样</text>
  <text x="40" y="130" fill="#cbd5e1" font-size="9">抓不住你真要啥</text>
  <rect x="356" y="66" width="300" height="78" rx="8" fill="rgba(52,211,153,0.12)" stroke="#34d399" stroke-width="1.1"/>
  <text x="372" y="90" fill="#a7f3d0" font-size="10" font-weight="600">正解① 结构清晰</text>
  <text x="372" y="112" fill="#cbd5e1" font-size="9">角色/任务/上下文/格式</text>
  <text x="372" y="130" fill="#cbd5e1" font-size="9">分块写，比字数重要</text>

  <!-- row 2 -->
  <rect x="24" y="156" width="300" height="78" rx="8" fill="rgba(251,113,133,0.12)" stroke="#fb7185" stroke-width="1.1"/>
  <text x="40" y="180" fill="#fecdd3" font-size="10" font-weight="600">误区② 有“万能咒语”</text>
  <text x="40" y="202" fill="#cbd5e1" font-size="9">“请一步步思考”不是银弹，</text>
  <text x="40" y="220" fill="#cbd5e1" font-size="9">换任务要换写法</text>
  <rect x="356" y="156" width="300" height="78" rx="8" fill="rgba(52,211,153,0.12)" stroke="#34d399" stroke-width="1.1"/>
  <text x="372" y="180" fill="#a7f3d0" font-size="10" font-weight="600">正解② 按任务调</text>
  <text x="372" y="202" fill="#cbd5e1" font-size="9">算数就“一步步”，写文案</text>
  <text x="372" y="220" fill="#cbd5e1" font-size="9">就给风格示例</text>

  <!-- row 3 -->
  <rect x="24" y="246" width="300" height="78" rx="8" fill="rgba(251,113,133,0.12)" stroke="#fb7185" stroke-width="1.1"/>
  <text x="40" y="270" fill="#fecdd3" font-size="10" font-weight="600">误区③ 模型“懂”我意图</text>
  <text x="40" y="292" fill="#cbd5e1" font-size="9">它只是按概率接话，</text>
  <text x="40" y="310" fill="#cbd5e1" font-size="9">空泛=高随机</text>
  <rect x="356" y="246" width="300" height="78" rx="8" fill="rgba(52,211,153,0.12)" stroke="#34d399" stroke-width="1.1"/>
  <text x="372" y="270" fill="#a7f3d0" font-size="10" font-weight="600">正解③ 写具体</text>
  <text x="372" y="292" fill="#cbd5e1" font-size="9">把背景、对象、目标、</text>
  <text x="372" y="310" fill="#cbd5e1" font-size="9">限制一次性说清</text>

  <!-- row 4 mini -->
  <rect x="24" y="336" width="632" height="86" rx="8" fill="rgba(30,41,59,0.4)" stroke="#475569" stroke-width="1"/>
  <text x="40" y="362" fill="#e2e8f0" font-size="11" font-weight="600">误区④ 提示词是“玄学”、不可复制 → 错。</text>
  <text x="40" y="386" fill="#94a3b8" font-size="9">它有规律（角色/任务/上下文/格式/约束），能模板化、可复用；同一模板换个主题就能再用。</text>
  <text x="40" y="410" fill="#fbbf24" font-size="10" font-weight="600">→ 把“我运气好问对了”变成“我知道怎么问对”。</text>
</svg>
