<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 450">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;family=Noto+Sans+SC:wght@400;500;700&amp;display=swap');
    text { font-family: 'JetBrains Mono','Noto Sans SC','PingFang SC',sans-serif; }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/></marker>
    <marker id="arrow-rose" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#fb7185"/></marker>
    <marker id="arrow-amber" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#fbbf24"/></marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#34d399"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#0f172a"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <text x="20" y="30" fill="#e2e8f0" font-size="16" font-weight="700">图2 · 同一件事，问法不同 → 接出来的走向不同</text>
  <text x="20" y="46" fill="#64748b" font-size="9">不是模型“变聪明了”，是它手里的“条件”变了</text>

  <!-- left: vague -->
  <rect x="24" y="70" width="300" height="56" rx="8" fill="rgba(251,113,133,0.12)" stroke="#fb7185" stroke-width="1.2"/>
  <text x="40" y="94" fill="#fecdd3" font-size="11" font-weight="600">空泛问法</text>
  <text x="40" y="116" fill="#cbd5e1" font-size="10">“帮我写个方案”</text>

  <text x="40" y="158" fill="#94a3b8" font-size="10">它可能接向（概率分散，乱猜）：</text>
  <rect x="40" y="170" width="280" height="34" rx="6" fill="rgba(251,113,133,0.10)" stroke="#fb7185" stroke-width="0.8"/>
  <text x="52" y="192" fill="#fecdd3" font-size="9">营销方案 / 技术方案 / 婚礼方案 / 随便编一个…</text>
  <text x="40" y="232" fill="#fb7185" font-size="10" font-weight="600">→ 答非所问、泛泛而谈</text>

  <line x1="324" y1="98" x2="356" y2="98" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- right: specific -->
  <rect x="356" y="70" width="300" height="56" rx="8" fill="rgba(52,211,153,0.12)" stroke="#34d399" stroke-width="1.2"/>
  <text x="372" y="94" fill="#a7f3d0" font-size="11" font-weight="600">具体问法</text>
  <text x="372" y="116" fill="#cbd5e1" font-size="10">“给10人小团队写1页短视频</text>
  <text x="372" y="130" fill="#cbd5e1" font-size="9">运营方案，列3个动作+预算”</text>

  <text x="372" y="158" fill="#94a3b8" font-size="10">它被“框”向（概率集中，贴题）：</text>
  <rect x="372" y="170" width="284" height="34" rx="6" fill="rgba(52,211,153,0.10)" stroke="#34d399" stroke-width="0.8"/>
  <text x="384" y="192" fill="#a7f3d0" font-size="9">动作1…动作2…动作3… 预算≈X元</text>
  <text x="372" y="232" fill="#34d399" font-size="10" font-weight="600">→ 贴题、能直接用</text>

  <!-- bottom insight -->
  <rect x="20" y="262" width="640" height="160" rx="8" fill="rgba(30,41,59,0.4)" stroke="#475569" stroke-width="1"/>
  <text x="36" y="288" fill="#e2e8f0" font-size="12" font-weight="600">一句话原理：提示词不是“命令”，是“给接话高手设定的剧本”。</text>
  <text x="36" y="314" fill="#94a3b8" font-size="10">· 剧本空 → 高手不知道演哪出，按概率随便接，就容易偏。</text>
  <text x="36" y="338" fill="#94a3b8" font-size="10">· 剧本实 → 高手按你写的场景、角色、格式接，接出来就贴题。</text>
  <text x="36" y="364" fill="#fbbf24" font-size="11" font-weight="600">→ 模型没变，变的是你给它的“条件”，所以答案质量跟着变。</text>
  <text x="36" y="396" fill="#cbd5e1" font-size="9">记住：好答案不是“求”出来的，是“框”出来的。</text>
</svg>
