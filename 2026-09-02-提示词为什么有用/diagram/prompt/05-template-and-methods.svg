<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 450">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;family=Noto+Sans+SC:wght@400;500;700&amp;display=swap');
    text { font-family: 'JetBrains Mono','Noto Sans SC','PingFang SC',sans-serif; }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/></marker>
    <marker id="arrow-rose" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#fb7185"/></marker>
    <marker id="arrow-amber" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#fbbf24"/></marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#34d399"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#0f172a"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <text x="20" y="30" fill="#e2e8f0" font-size="16" font-weight="700">图5 · 两个马上能用的写法 + 一个能抄的模板</text>
  <text x="20" y="46" fill="#64748b" font-size="9">上游写清楚 + 下游迭代验证，比背“咒语”实在</text>

  <!-- two methods -->
  <rect x="24" y="64" width="312" height="108" rx="8" fill="rgba(52,211,153,0.12)" stroke="#34d399" stroke-width="1.2"/>
  <text x="40" y="90" fill="#a7f3d0" font-size="11" font-weight="600">写法A · 五段式写清楚</text>
  <text x="40" y="114" fill="#cbd5e1" font-size="9">角色 + 任务 + 上下文</text>
  <text x="40" y="134" fill="#cbd5e1" font-size="9">+ 格式 + 约束</text>
  <text x="40" y="160" fill="#94a3b8" font-size="9">→ 把“条件”一次给足，少返工</text>

  <rect x="356" y="64" width="300" height="108" rx="8" fill="rgba(52,211,153,0.12)" stroke="#34d399" stroke-width="1.2"/>
  <text x="372" y="90" fill="#a7f3d0" font-size="11" font-weight="600">写法B · 把它当“第一稿”</text>
  <text x="372" y="114" fill="#cbd5e1" font-size="9">输出不对 → 改提示词再跑</text>
  <text x="372" y="134" fill="#cbd5e1" font-size="9">建立“问→答→调问”循环</text>
  <text x="372" y="160" fill="#94a3b8" font-size="9">→ 几次迭代就稳了</text>

  <!-- template box -->
  <rect x="20" y="188" width="640" height="150" rx="8" fill="rgba(30,41,59,0.5)" stroke="#60a5fa" stroke-width="1.2"/>
  <text x="36" y="212" fill="#bfdbfe" font-size="11" font-weight="600">能直接抄的模板（把括号里填上即可）：</text>
  <text x="36" y="236" fill="#e2e8f0" font-size="10">【角色】你是一位{领域}专家</text>
  <text x="36" y="258" fill="#e2e8f0" font-size="10">【任务】帮我{具体要做什么}</text>
  <text x="36" y="280" fill="#e2e8f0" font-size="10">【上下文】对象/{背景}/{限制}是{…}</text>
  <text x="36" y="302" fill="#e2e8f0" font-size="10">【格式】用{几条/表格/清单}输出</text>
  <text x="36" y="324" fill="#fbbf24" font-size="10" font-weight="600">【约束】拿不准的地方请标【不确定】</text>

  <!-- bottom -->
  <rect x="20" y="352" width="640" height="76" rx="8" fill="rgba(30,41,59,0.4)" stroke="#475569" stroke-width="1"/>
  <text x="36" y="380" fill="#e2e8f0" font-size="11" font-weight="600">记住一句大白话：好答案不是“求”出来的，是“框”出来的。</text>
  <text x="36" y="406" fill="#94a3b8" font-size="10">你给方向、给样例、给格式，再靠迭代逼近，它就能从“答非所问”变成“靠谱搭档”。</text>
</svg>
