<svg viewBox="0 0 680 450" font-family="Noto Sans SC, sans-serif" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="680" height="450" fill="#0f172a"/>
  <g stroke="#1e293b" stroke-width="1">
    <line x1="90" y1="70" x2="640" y2="70"/>
    <line x1="90" y1="160" x2="640" y2="160"/>
    <line x1="90" y1="250" x2="640" y2="250"/>
    <line x1="90" y1="340" x2="640" y2="340"/>
  </g>

  <text x="24" y="30" fill="#e2e8f0" font-size="16" font-weight="700">图4 过度思考：给的预算超过最优，准确率反而往下走</text>

  <!-- 过度思考区阴影 -->
  <rect x="115" y="70" width="525" height="330" fill="#fb7185" opacity="0.08"/>

  <!-- 坐标轴 -->
  <line x1="90" y1="70" x2="90" y2="400" stroke="#475569" stroke-width="1.5"/>
  <line x1="90" y1="400" x2="640" y2="400" stroke="#475569" stroke-width="1.5"/>

  <!-- 曲线（上升 -> 峰值 -> 回落 -> 平台） -->
  <polyline points="93,271 104,122 107,98 124,225 228,222 640,221"
            fill="none" stroke="#22d3ee" stroke-width="3" stroke-linejoin="round"/>

  <!-- 峰值点 -->
  <circle cx="107" cy="98" r="5" fill="#fbbf24"/>
  <text x="120" y="92" fill="#fbbf24" font-size="12" font-weight="700">最优预算≈250 · 峰值 0.91</text>

  <!-- 过度思考标注 -->
  <text x="430" y="200" fill="#fb7185" font-size="13" font-weight="700" text-anchor="middle">过度思考区</text>
  <text x="430" y="218" fill="#fecdd3" font-size="11" text-anchor="middle">预算远超最优 → 准确率回落</text>

  <!-- 轴标签 -->
  <text x="365" y="424" fill="#94a3b8" font-size="12" text-anchor="middle">思考预算 token（越多越长）</text>
  <text x="34" y="235" fill="#94a3b8" font-size="12" text-anchor="middle" transform="rotate(-90 34 235)">准确率</text>

  <!-- 脚注 -->
  <text x="90" y="442" fill="#94a3b8" font-size="11">示意来自脚本 02 的「加法」任务曲线；论文实测：简单题多耗 5–20×（有的 18×）却无实质增益</text>
</svg>
