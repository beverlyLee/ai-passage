<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 450">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap');
    text { font-family: 'JetBrains Mono','Noto Sans SC','PingFang SC',sans-serif; }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/></pattern>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#94a3b8"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#0f172a"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>
  <text x="20" y="30" fill="#e2e8f0" font-size="15" font-weight="700">图1 · 「跑不长」这个症状的故障树</text>
  <text x="20" y="48" fill="#94a3b8" font-size="9.5">一个模糊症状，拆成三个可各自解决的失败模式，共享同一个总根</text>

  <rect x="150" y="70" width="380" height="50" rx="9" fill="rgba(34,211,238,0.10)" stroke="#22d3ee" stroke-width="1.3"/>
  <text x="340" y="90" fill="#67e8f9" font-size="10.5" font-weight="700" text-anchor="middle">症状：同一个模型，别人的 agent 跑 7 天，你的跑 3 轮就崩</text>
  <text x="340" y="108" fill="#cbd5e1" font-size="8.5" text-anchor="middle">退化 · 空转 · 宣布完成但其实没完成</text>

  <line x1="340" y1="120" x2="340" y2="140" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="340" y1="140" x2="130" y2="140" stroke="#334155" stroke-width="1"/>
  <line x1="130" y1="140" x2="130" y2="160" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="340" y1="140" x2="340" y2="160" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="340" y1="140" x2="550" y2="140" stroke="#334155" stroke-width="1"/>
  <line x1="550" y1="140" x2="550" y2="160" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arrow)"/>

  <rect x="40" y="162" width="180" height="104" rx="8" fill="rgba(251,113,133,0.10)" stroke="#fb7185" stroke-width="1.1"/>
  <text x="130" y="182" fill="#fda4af" font-size="11" font-weight="700" text-anchor="middle">失败模式 1 · 记忆断了</text>
  <text x="54" y="202" fill="#cbd5e1" font-size="8">上下文一满，试过什么、</text>
  <text x="54" y="216" fill="#cbd5e1" font-size="8">哪条路走不通、profiler</text>
  <text x="54" y="230" fill="#cbd5e1" font-size="8">吐了什么，全部清零</text>
  <text x="54" y="252" fill="#64748b" font-size="7.5">→ 下一轮重踩同一个坑</text>

  <rect x="250" y="162" width="180" height="104" rx="8" fill="rgba(251,113,133,0.10)" stroke="#fb7185" stroke-width="1.1"/>
  <text x="340" y="182" fill="#fda4af" font-size="11" font-weight="700" text-anchor="middle">失败模式 2 · 循环断了</text>
  <text x="264" y="202" fill="#cbd5e1" font-size="8">没有外部评估器，判断</text>
  <text x="264" y="216" fill="#cbd5e1" font-size="8">「做完了没有」的</text>
  <text x="264" y="230" fill="#cbd5e1" font-size="8">是模型自己</text>
  <text x="264" y="252" fill="#64748b" font-size="7.5">→ 它说 done 就是 done</text>

  <rect x="460" y="162" width="180" height="104" rx="8" fill="rgba(251,113,133,0.10)" stroke="#fb7185" stroke-width="1.1"/>
  <text x="550" y="182" fill="#fda4af" font-size="11" font-weight="700" text-anchor="middle">失败模式 3 · 兜底断了</text>
  <text x="474" y="202" fill="#cbd5e1" font-size="8">没有停滞检测，也没有</text>
  <text x="474" y="216" fill="#cbd5e1" font-size="8">硬停止条件</text>
  <text x="474" y="230" fill="#cbd5e1" font-size="8">在死胡同里空转</text>
  <text x="474" y="252" fill="#64748b" font-size="7.5">→ 或烧钱到天亮</text>

  <line x1="130" y1="266" x2="130" y2="292" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="340" y1="266" x2="340" y2="292" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="550" y1="266" x2="550" y2="292" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arrow)"/>

  <rect x="90" y="294" width="500" height="66" rx="9" fill="rgba(251,191,36,0.10)" stroke="#fbbf24" stroke-width="1.3"/>
  <text x="340" y="315" fill="#fbbf24" font-size="11.5" font-weight="700" text-anchor="middle">总根：你把 agent 当成更强的单次生成器，而它是跨时间运行的系统</text>
  <text x="110" y="335" fill="#cbd5e1" font-size="8">单次生成的能力在模型里；跨时间的能力在组件的耦合里 —— 什么状态能活到下一轮、何时换策略、走错了能不能爬回来</text>
  <text x="110" y="351" fill="#94a3b8" font-size="7.5">换模型只换掉了「提议质量」，没换掉这三样</text>

  <line x1="40" y1="378" x2="640" y2="378" stroke="#334155" stroke-width="1"/>
  <text x="40" y="398" fill="#67e8f9" font-size="9" font-weight="700">分治顺序</text>
  <text x="40" y="416" fill="#cbd5e1" font-size="8">问题1 立总根 → 问题2 治记忆断 → 问题3 治循环断 → 问题4 治兜底断 → 问题5 守底线（可证伪）</text>
  <text x="40" y="434" fill="#64748b" font-size="7.5">三个失败模式各自有对应机制，总根也清楚：模型不是系统，模型是系统里的一个组件</text>
</svg>
