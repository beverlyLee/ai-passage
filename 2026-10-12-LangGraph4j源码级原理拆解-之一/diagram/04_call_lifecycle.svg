<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 450" width="680" height="450">
  <rect x="0" y="0" width="680" height="450" fill="#0f172a"/>
  <text x="28" y="34" fill="#e2e8f0" font-family="'JetBrains Mono','Noto Sans SC',monospace" font-size="18">调用生命周期：从 StateGraph 到 StateSnapshot</text>

  <!-- 步骤 1 构建 -->
  <rect x="28" y="66" width="139" height="72" rx="8" fill="#0b2a3a" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="97" y="94" fill="#22d3ee" font-family="'Noto Sans SC',sans-serif" font-size="13" text-anchor="middle">1 构建</text>
  <text x="97" y="115" fill="#7dd3fc" font-family="'JetBrains Mono',monospace" font-size="10" text-anchor="middle">new StateGraph</text>
  <text x="97" y="130" fill="#7dd3fc" font-family="'Noto Sans SC',sans-serif" font-size="10" text-anchor="middle">addNode/addEdge</text>

  <!-- 步骤 2 编译 -->
  <rect x="189" y="66" width="139" height="72" rx="8" fill="#13251c" stroke="#34d399" stroke-width="1.5"/>
  <text x="258" y="94" fill="#34d399" font-family="'Noto Sans SC',sans-serif" font-size="13" text-anchor="middle">2 编译</text>
  <text x="258" y="115" fill="#6ee7b7" font-family="'JetBrains Mono',monospace" font-size="10" text-anchor="middle">compile(</text>
  <text x="258" y="130" fill="#6ee7b7" font-family="'JetBrains Mono',monospace" font-size="10" text-anchor="middle">CheckpointSaver)</text>

  <!-- 步骤 3 运行 -->
  <rect x="350" y="66" width="139" height="72" rx="8" fill="#241c33" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="419" y="94" fill="#a78bfa" font-family="'Noto Sans SC',sans-serif" font-size="13" text-anchor="middle">3 运行</text>
  <text x="419" y="115" fill="#c4b5fd" font-family="'JetBrains Mono',monospace" font-size="10" text-anchor="middle">stream(</text>
  <text x="419" y="130" fill="#c4b5fd" font-family="'Noto Sans SC',sans-serif" font-size="10" text-anchor="middle">inputs, config)</text>

  <!-- 步骤 4 取状态 -->
  <rect x="511" y="66" width="139" height="72" rx="8" fill="#3a2a13" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="580" y="94" fill="#fbbf24" font-family="'Noto Sans SC',sans-serif" font-size="13" text-anchor="middle">4 取状态</text>
  <text x="580" y="115" fill="#fcd34d" font-family="'JetBrains Mono',monospace" font-size="10" text-anchor="middle">getState</text>
  <text x="580" y="130" fill="#fcd34d" font-family="'Noto Sans SC',sans-serif" font-size="10" text-anchor="middle">StateSnapshot</text>

  <!-- 主箭头 -->
  <line x1="167" y1="102" x2="187" y2="102" stroke="#94a3b8" stroke-width="2" marker-end="url(#aGray)"/>
  <line x1="328" y1="102" x2="348" y2="102" stroke="#94a3b8" stroke-width="2" marker-end="url(#aGray)"/>
  <line x1="489" y1="102" x2="509" y2="102" stroke="#94a3b8" stroke-width="2" marker-end="url(#aGray)"/>

  <!-- 从 getState 到检查点层的恢复连线 -->
  <path d="M556 138 C 556 196, 576 212, 545 246" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#aGray)"/>
  <text x="600" y="200" fill="#94a3b8" font-family="'Noto Sans SC',sans-serif" font-size="11" text-anchor="end">getState 依 threadId 从检查点恢复</text>

  <!-- Checkpoint 层 -->
  <rect x="28" y="250" width="624" height="120" rx="10" fill="#1c1409" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="44" y="276" fill="#fbbf24" font-family="'Noto Sans SC',sans-serif" font-size="13">持久化与中断横切编译与运行</text>
  <g font-family="'JetBrains Mono',monospace" font-size="12" text-anchor="middle">
    <rect x="44" y="288" width="190" height="40" rx="6" fill="#0f172a" stroke="#fbbf24" stroke-width="1"/>
    <text x="139" y="306" fill="#fcd34d">BaseCheckpointSaver</text>
    <text x="139" y="321" fill="#fcd34d" font-family="'Noto Sans SC',sans-serif" font-size="9">抽象接口</text>
    <rect x="258" y="288" width="150" height="40" rx="6" fill="#0f172a" stroke="#fbbf24" stroke-width="1"/>
    <text x="333" y="306" fill="#fcd34d">MemorySaver</text>
    <text x="333" y="321" fill="#fcd34d" font-family="'Noto Sans SC',sans-serif" font-size="9">进程内 / 开发</text>
    <rect x="430" y="288" width="222" height="40" rx="6" fill="#0f172a" stroke="#fbbf24" stroke-width="1"/>
    <text x="541" y="306" fill="#fcd34d">PostgresSaver / RedisSaver</text>
    <text x="541" y="321" fill="#fcd34d" font-family="'Noto Sans SC',sans-serif" font-size="9">生产持久化</text>
  </g>
  <text x="44" y="356" fill="#fcd34d" font-family="'Noto Sans SC',sans-serif" font-size="11">每个节点执行后写检查点；interruptBefore / interruptAfter 决定在何处暂停等待人工。</text>

  <!-- 流式快照说明 -->
  <rect x="28" y="388" width="624" height="40" rx="8" fill="#0f172a" stroke="#a78bfa" stroke-width="1"/>
  <text x="44" y="413" fill="#c4b5fd" font-family="'Noto Sans SC',sans-serif" font-size="12">stream 返回 AsyncGenerator：每个元素是一张 StateSnapshot，含 node()、state()、next()，贯穿整张图的执行轨迹。</text>

  <defs>
    <marker id="aGray" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
  </defs>
</svg>
