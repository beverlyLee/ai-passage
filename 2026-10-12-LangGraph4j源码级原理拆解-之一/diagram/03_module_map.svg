<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 450" width="680" height="450">
  <rect x="0" y="0" width="680" height="450" fill="#0f172a"/>
  <text x="28" y="34" fill="#e2e8f0" font-family="'JetBrains Mono','Noto Sans SC',monospace" font-size="18">模块地图：org.bsc.langgraph4j 坐标与依赖关系</text>

  <!-- 中心 core -->
  <rect x="252" y="170" width="176" height="86" rx="10" fill="#13251c" stroke="#34d399" stroke-width="2"/>
  <text x="340" y="200" fill="#34d399" font-family="'JetBrains Mono',monospace" font-size="14" text-anchor="middle">langgraph4j-core</text>
  <text x="340" y="222" fill="#6ee7b7" font-family="'Noto Sans SC',sans-serif" font-size="12" text-anchor="middle">稳定版 1.5.14</text>
  <text x="340" y="242" fill="#6ee7b7" font-family="'Noto Sans SC',sans-serif" font-size="11" text-anchor="middle">Java 17+</text>

  <!-- BOM 左上 -->
  <rect x="40" y="60" width="200" height="66" rx="8" fill="#0b2a3a" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="140" y="86" fill="#22d3ee" font-family="'JetBrains Mono',monospace" font-size="13" text-anchor="middle">langgraph4j-bom</text>
  <text x="140" y="108" fill="#7dd3fc" font-family="'Noto Sans SC',sans-serif" font-size="11" text-anchor="middle">统一版本管理（import）</text>

  <!-- studio 右上 -->
  <rect x="440" y="60" width="200" height="66" rx="8" fill="#2a1320" stroke="#fb7185" stroke-width="1.5"/>
  <text x="540" y="86" fill="#fb7185" font-family="'JetBrains Mono',monospace" font-size="13" text-anchor="middle">langgraph4j-studio-jetty</text>
  <text x="540" y="108" fill="#fda4af" font-family="'Noto Sans SC',sans-serif" font-size="11" text-anchor="middle">可视化 Playground 1.0-rc1</text>

  <!-- langchain4j 左下 -->
  <rect x="40" y="320" width="200" height="66" rx="8" fill="#0b2a3a" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="140" y="346" fill="#22d3ee" font-family="'Noto Sans SC',sans-serif" font-size="13" text-anchor="middle">与 Langchain4j 集成</text>
  <text x="140" y="368" fill="#7dd3fc" font-family="'Noto Sans SC',sans-serif" font-size="11" text-anchor="middle">官方模块 · ChatModel / Tool</text>

  <!-- spring-ai 右下 -->
  <rect x="440" y="320" width="200" height="66" rx="8" fill="#2a1320" stroke="#fb7185" stroke-width="1.5"/>
  <text x="540" y="346" fill="#fb7185" font-family="'Noto Sans SC',sans-serif" font-size="13" text-anchor="middle">与 Spring AI 集成</text>
  <text x="540" y="368" fill="#fda4af" font-family="'Noto Sans SC',sans-serif" font-size="11" text-anchor="middle">官方模块 · 应用集成</text>

  <!-- 连线 -->
  <line x1="140" y1="126" x2="290" y2="175" stroke="#22d3ee" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#aCyan)"/>
  <line x1="540" y1="126" x2="390" y2="175" stroke="#fb7185" stroke-width="1.5" marker-end="url(#aRose)"/>
  <line x1="140" y1="320" x2="290" y2="236" stroke="#22d3ee" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#aCyan)"/>
  <line x1="540" y1="320" x2="390" y2="236" stroke="#fb7185" stroke-width="1.5" marker-end="url(#aRose)"/>

  <text x="28" y="418" fill="#64748b" font-family="'Noto Sans SC',sans-serif" font-size="11">BOM 与集成模块都依赖 core；bom 用 &lt;dependencyManagement&gt; import 统管版本，依赖集成模块不必再写版本号。</text>
  <text x="28" y="436" fill="#64748b" font-family="'Noto Sans SC',sans-serif" font-size="11">生产环境用稳定版 1.5.14；studio 仍为 rc 阶段，仅本地调试与演示使用。</text>

  <defs>
    <marker id="aCyan" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#22d3ee"/>
    </marker>
    <marker id="aRose" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#fb7185"/>
    </marker>
  </defs>
</svg>
