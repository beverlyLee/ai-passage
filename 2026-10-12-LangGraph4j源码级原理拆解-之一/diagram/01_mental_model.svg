<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 450" width="680" height="450">
  <rect x="0" y="0" width="680" height="450" fill="#0f172a"/>
  <line x1="0" y1="176" x2="680" y2="176" stroke="#1e293b" stroke-width="1"/>

  <!-- 标题 -->
  <text x="28" y="38" fill="#e2e8f0" font-family="'JetBrains Mono','Noto Sans SC',monospace" font-size="18">心智模型：LangGraph4j 在生态中的位置与图的两种形态</text>

  <!-- 顶部生态三件套 -->
  <text x="28" y="88" fill="#94a3b8" font-family="'Noto Sans SC',sans-serif" font-size="13">它补充 Langchain4j 与 Spring AI，而非取代</text>

  <g>
    <rect x="28" y="102" width="180" height="56" rx="8" fill="#0b2a3a" stroke="#22d3ee" stroke-width="1.5"/>
    <text x="118" y="130" fill="#22d3ee" font-family="'Noto Sans SC',sans-serif" font-size="15" text-anchor="middle">Langchain4j</text>
    <text x="118" y="149" fill="#7dd3fc" font-family="'Noto Sans SC',sans-serif" font-size="11" text-anchor="middle">模型 / 工具 / RAG 抽象</text>
  </g>
  <g>
    <rect x="250" y="102" width="180" height="56" rx="8" fill="#0b2a3a" stroke="#22d3ee" stroke-width="1.5"/>
    <text x="340" y="130" fill="#22d3ee" font-family="'Noto Sans SC',sans-serif" font-size="15" text-anchor="middle">Spring AI</text>
    <text x="340" y="149" fill="#7dd3fc" font-family="'Noto Sans SC',sans-serif" font-size="11" text-anchor="middle">应用集成与编排</text>
  </g>
  <g>
    <rect x="472" y="102" width="180" height="56" rx="8" fill="#13251c" stroke="#34d399" stroke-width="1.5"/>
    <text x="562" y="130" fill="#34d399" font-family="'Noto Sans SC',sans-serif" font-size="15" text-anchor="middle">LangGraph4j</text>
    <text x="562" y="149" fill="#6ee7b7" font-family="'Noto Sans SC',sans-serif" font-size="11" text-anchor="middle">有状态、可循环编排</text>
  </g>

  <!-- 左：固定 DAG -->
  <text x="28" y="206" fill="#94a3b8" font-family="'Noto Sans SC',sans-serif" font-size="13">传统线性编排（一次性、无环）</text>
  <g>
    <rect x="32" y="222" width="88" height="40" rx="8" fill="#1e293b" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="76" y="247" fill="#cbd5e1" font-family="'Noto Sans SC',sans-serif" font-size="13" text-anchor="middle">输入</text>
    <rect x="152" y="222" width="88" height="40" rx="8" fill="#1e293b" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="196" y="247" fill="#cbd5e1" font-family="'Noto Sans SC',sans-serif" font-size="13" text-anchor="middle">处理</text>
    <rect x="272" y="222" width="88" height="40" rx="8" fill="#1e293b" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="316" y="247" fill="#cbd5e1" font-family="'Noto Sans SC',sans-serif" font-size="13" text-anchor="middle">输出</text>
    <line x1="120" y1="242" x2="150" y2="242" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="240" y1="242" x2="270" y2="242" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  </g>

  <!-- 右：状态图（可循环 / 分支） -->
  <text x="404" y="206" fill="#94a3b8" font-family="'Noto Sans SC',sans-serif" font-size="13">状态图（有状态、可循环、可分支）</text>
  <g>
    <rect x="396" y="232" width="88" height="40" rx="8" fill="#13251c" stroke="#34d399" stroke-width="1.5"/>
    <text x="440" y="257" fill="#6ee7b7" font-family="'Noto Sans SC',sans-serif" font-size="13" text-anchor="middle">节点 A</text>
    <rect x="524" y="232" width="88" height="40" rx="8" fill="#13251c" stroke="#34d399" stroke-width="1.5"/>
    <text x="568" y="257" fill="#6ee7b7" font-family="'Noto Sans SC',sans-serif" font-size="13" text-anchor="middle">节点 B</text>
    <!-- A -> B -->
    <line x1="484" y1="252" x2="522" y2="252" stroke="#34d399" stroke-width="2" marker-end="url(#arrowGreen)"/>
    <!-- 循环回边：B 顶部回到 A 顶部 -->
    <path d="M528 230 C 516 198, 496 198, 484 229" fill="none" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrowAmber)"/>
    <text x="506" y="192" fill="#fbbf24" font-family="'Noto Sans SC',sans-serif" font-size="11" text-anchor="middle">循环</text>
    <!-- 状态共享 -->
    <rect x="396" y="312" width="216" height="34" rx="8" fill="#241c33" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="504" y="334" fill="#c4b5fd" font-family="'Noto Sans SC',sans-serif" font-size="12" text-anchor="middle">共享状态 State（Map）</text>
    <line x1="440" y1="272" x2="466" y2="312" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="3 3"/>
    <line x1="568" y1="272" x2="542" y2="312" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="3 3"/>
  </g>

  <text x="28" y="392" fill="#64748b" font-family="'Noto Sans SC',sans-serif" font-size="11">核心差异：把控制流从代码里抽出来，变成可被持久化、可中断、可回放的数据结构。</text>
  <text x="28" y="412" fill="#64748b" font-family="'Noto Sans SC',sans-serif" font-size="11">State 在节点之间以 Map 形式累积传递，是整张图唯一的事实来源。</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#34d399"/>
    </marker>
    <marker id="arrowAmber" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#fbbf24"/>
    </marker>
  </defs>
</svg>
