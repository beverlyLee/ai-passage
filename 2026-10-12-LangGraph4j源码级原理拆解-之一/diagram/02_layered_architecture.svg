<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 450" width="680" height="450">
  <rect x="0" y="0" width="680" height="450" fill="#0f172a"/>
  <text x="28" y="34" fill="#e2e8f0" font-family="'JetBrains Mono','Noto Sans SC',monospace" font-size="18">分层架构：四层内核加两个横向集成面</text>

  <!-- 层 1 -->
  <rect x="28" y="54" width="624" height="62" rx="8" fill="#0b2a3a" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="44" y="76" fill="#22d3ee" font-family="'Noto Sans SC',sans-serif" font-size="13">1 应用 API 层</text>
  <g font-family="'JetBrains Mono',monospace" font-size="13" text-anchor="middle">
    <rect x="44" y="84" width="140" height="24" rx="6" fill="#0f172a" stroke="#22d3ee" stroke-width="1"/>
    <text x="114" y="101" fill="#7dd3fc">StateGraph</text>
    <rect x="200" y="84" width="140" height="24" rx="6" fill="#0f172a" stroke="#22d3ee" stroke-width="1"/>
    <text x="270" y="101" fill="#7dd3fc">CompiledGraph</text>
    <rect x="356" y="84" width="140" height="24" rx="6" fill="#0f172a" stroke="#22d3ee" stroke-width="1"/>
    <text x="426" y="101" fill="#7dd3fc">AgentState</text>
    <rect x="512" y="84" width="140" height="24" rx="6" fill="#0f172a" stroke="#22d3ee" stroke-width="1"/>
    <text x="582" y="101" fill="#7dd3fc">RunnableConfig</text>
  </g>

  <!-- 层 2 -->
  <rect x="28" y="128" width="624" height="62" rx="8" fill="#13251c" stroke="#34d399" stroke-width="1.5"/>
  <text x="44" y="150" fill="#34d399" font-family="'Noto Sans SC',sans-serif" font-size="13">2 图模型层</text>
  <g font-family="'JetBrains Mono',monospace" font-size="13" text-anchor="middle">
    <rect x="44" y="158" width="148" height="24" rx="6" fill="#0f172a" stroke="#34d399" stroke-width="1"/>
    <text x="118" y="175" fill="#6ee7b7">AsyncNodeAction</text>
    <rect x="202" y="158" width="196" height="24" rx="6" fill="#0f172a" stroke="#34d399" stroke-width="1"/>
    <text x="300" y="175" fill="#6ee7b7">Edge / ConditionalEdge</text>
    <rect x="408" y="158" width="134" height="24" rx="6" fill="#0f172a" stroke="#34d399" stroke-width="1"/>
    <text x="475" y="175" fill="#6ee7b7">GraphCompiler</text>
    <rect x="552" y="158" width="100" height="24" rx="6" fill="#0f172a" stroke="#34d399" stroke-width="1"/>
    <text x="602" y="175" fill="#6ee7b7">START/END</text>
  </g>

  <!-- 层 3 -->
  <rect x="28" y="202" width="624" height="62" rx="8" fill="#241c33" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="44" y="224" fill="#a78bfa" font-family="'Noto Sans SC',sans-serif" font-size="13">3 状态与通道层</text>
  <g font-family="'JetBrains Mono',monospace" font-size="13" text-anchor="middle">
    <rect x="44" y="232" width="190" height="24" rx="6" fill="#0f172a" stroke="#a78bfa" stroke-width="1"/>
    <text x="139" y="249" fill="#c4b5fd">State + SCHEMA</text>
    <rect x="246" y="232" width="200" height="24" rx="6" fill="#0f172a" stroke="#a78bfa" stroke-width="1"/>
    <text x="346" y="249" fill="#c4b5fd">Channels.appender</text>
    <rect x="458" y="232" width="184" height="24" rx="6" fill="#0f172a" stroke="#a78bfa" stroke-width="1"/>
    <text x="550" y="249" fill="#c4b5fd">AppenderChannel</text>
  </g>

  <!-- 层 4 -->
  <rect x="28" y="276" width="624" height="62" rx="8" fill="#3a2a13" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="44" y="298" fill="#fbbf24" font-family="'Noto Sans SC',sans-serif" font-size="13">4 持久化与中断层</text>
  <g font-family="'JetBrains Mono',monospace" font-size="13" text-anchor="middle">
    <rect x="44" y="306" width="190" height="24" rx="6" fill="#0f172a" stroke="#fbbf24" stroke-width="1"/>
    <text x="139" y="323" fill="#fcd34d">BaseCheckpointSaver</text>
    <rect x="246" y="306" width="130" height="24" rx="6" fill="#0f172a" stroke="#fbbf24" stroke-width="1"/>
    <text x="311" y="323" fill="#fcd34d">MemorySaver</text>
    <rect x="388" y="306" width="132" height="24" rx="6" fill="#0f172a" stroke="#fbbf24" stroke-width="1"/>
    <text x="454" y="323" fill="#fcd34d">PostgresSaver</text>
    <rect x="532" y="306" width="110" height="24" rx="6" fill="#0f172a" stroke="#fbbf24" stroke-width="1"/>
    <text x="587" y="323" fill="#fcd34d">RedisSaver</text>
  </g>

  <!-- 横向集成面 -->
  <rect x="28" y="350" width="624" height="64" rx="8" fill="#2a1320" stroke="#fb7185" stroke-width="1.5"/>
  <text x="44" y="372" fill="#fb7185" font-family="'Noto Sans SC',sans-serif" font-size="13">横向集成面：Langchain4j（ChatModel / Tool） · Spring AI · Studio 可视化与可观测</text>
  <g font-family="'Noto Sans SC',sans-serif" font-size="12" text-anchor="middle" fill="#fda4af">
    <rect x="44" y="382" width="190" height="24" rx="6" fill="#0f172a" stroke="#fb7185" stroke-width="1"/>
    <text x="139" y="399">langchain4j 模块</text>
    <rect x="246" y="382" width="190" height="24" rx="6" fill="#0f172a" stroke="#fb7185" stroke-width="1"/>
    <text x="341" y="399">spring-ai 模块</text>
    <rect x="448" y="382" width="194" height="24" rx="6" fill="#0f172a" stroke="#fb7185" stroke-width="1"/>
    <text x="545" y="399">langgraph4j-studio</text>
  </g>

  <text x="28" y="438" fill="#64748b" font-family="'Noto Sans SC',sans-serif" font-size="11">箭头方向即依赖方向：上层调用下层，集成面横向接入；持久化层让图可断点续跑。</text>
</svg>
