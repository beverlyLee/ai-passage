<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 450" width="680" height="450">
<defs>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;family=Noto+Sans+SC:wght@400;500;700&amp;display=swap');
text{font-family:'Noto Sans SC','JetBrains Mono',sans-serif;}
.mono{font-family:'JetBrains Mono','Noto Sans SC',monospace;}
</style>
</defs>

<rect width="680" height="450" fill="#0f172a"/>

<text x="24" y="32" font-size="18" font-weight="700" fill="#e2e8f0">四个流派：分歧不在用什么数据库，在决策权归谁</text>
<text x="24" y="52" font-size="11" fill="#94a3b8">选错了流派，换数据库救不回来</text>

<!-- 卡1 抽取式 -->
<rect x="24" y="68" width="306" height="155" rx="8" fill="#1e293b" stroke="#22d3ee"/>
<text x="40" y="94" font-size="14" font-weight="700" fill="#22d3ee">抽取式</text>
<text x="300" y="94" font-size="10" fill="#64748b" text-anchor="end" class="mono">Mem0</text>
<line x1="40" y1="104" x2="314" y2="104" stroke="#334155"/>
<text x="40" y="124" font-size="10" fill="#94a3b8">决策权：</text>
<text x="96" y="124" font-size="10" fill="#e2e8f0">抽取 LLM（每轮蒸馏成原子事实）</text>
<text x="40" y="142" font-size="10" fill="#94a3b8">做法：</text>
<text x="80" y="142" font-size="10" fill="#e2e8f0">矛盾由 LLM 裁判决定更新 / 合并</text>
<text x="40" y="160" font-size="10" fill="#94a3b8">优点：</text>
<text x="80" y="160" font-size="10" fill="#e2e8f0">接入快、跨框架通用</text>
<rect x="40" y="170" width="274" height="38" rx="4" fill="#3f1d29" stroke="#fb7185"/>
<text x="52" y="188" font-size="10" fill="#fda4af">代价：纯向量 + 抽取在深层时序推理上偏弱</text>
<text x="52" y="202" font-size="9" fill="#fda4af">LongMemEval 上 49.0%</text>

<!-- 卡2 时序图 -->
<rect x="346" y="68" width="310" height="155" rx="8" fill="#1e293b" stroke="#34d399"/>
<text x="362" y="94" font-size="14" font-weight="700" fill="#34d399">时序图</text>
<text x="640" y="94" font-size="10" fill="#64748b" text-anchor="end" class="mono">Zep / Graphiti</text>
<line x1="362" y1="104" x2="640" y2="104" stroke="#334155"/>
<text x="362" y="124" font-size="10" fill="#94a3b8">决策权：</text>
<text x="418" y="124" font-size="10" fill="#e2e8f0">图引擎（双时间戳，关旧边建新边）</text>
<text x="362" y="142" font-size="10" fill="#94a3b8">做法：</text>
<text x="402" y="142" font-size="10" fill="#e2e8f0">embedding + BM25 + 图遍历混合检索</text>
<text x="362" y="160" font-size="10" fill="#94a3b8">优点：</text>
<text x="402" y="160" font-size="10" fill="#e2e8f0">P95 约 300ms，检索不调 LLM</text>
<rect x="362" y="170" width="278" height="38" rx="4" fill="#3f1d29" stroke="#fb7185"/>
<text x="374" y="188" font-size="10" fill="#fda4af">代价：要养图数据库，运维负担最重</text>
<text x="374" y="202" font-size="9" fill="#fda4af">只在「关系和时间承载语义」时才回本</text>

<!-- 卡3 OS 分层 -->
<rect x="24" y="237" width="306" height="155" rx="8" fill="#1e293b" stroke="#a78bfa"/>
<text x="40" y="263" font-size="14" font-weight="700" fill="#a78bfa">OS 分层</text>
<text x="300" y="263" font-size="10" fill="#64748b" text-anchor="end" class="mono">Letta / MemGPT</text>
<line x1="40" y1="273" x2="314" y2="273" stroke="#334155"/>
<text x="40" y="293" font-size="10" fill="#94a3b8">决策权：</text>
<text x="96" y="293" font-size="10" fill="#e2e8f0">agent 自己（工具调用换入换出）</text>
<text x="40" y="311" font-size="10" fill="#94a3b8">做法：</text>
<text x="80" y="311" font-size="10" fill="#e2e8f0">核心块常驻，回忆 / 档案分层外置</text>
<text x="40" y="329" font-size="10" fill="#94a3b8">优点：</text>
<text x="80" y="329" font-size="10" fill="#e2e8f0">自主性与可控性最强</text>
<rect x="40" y="339" width="274" height="38" rx="4" fill="#3f1d29" stroke="#fb7185"/>
<text x="52" y="357" font-size="10" fill="#fda4af">代价：每次换页都是一次工具调用</text>
<text x="52" y="371" font-size="9" fill="#fda4af">延迟和 token 都算钱</text>

<!-- 卡4 文件系统 -->
<rect x="346" y="237" width="310" height="155" rx="8" fill="#1e293b" stroke="#fbbf24"/>
<text x="362" y="263" font-size="14" font-weight="700" fill="#fbbf24">文件系统</text>
<text x="640" y="263" font-size="10" fill="#64748b" text-anchor="end" class="mono">MemPalace / claude-mem</text>
<line x1="362" y1="273" x2="640" y2="273" stroke="#334155"/>
<text x="362" y="293" font-size="10" fill="#94a3b8">决策权：</text>
<text x="418" y="293" font-size="10" fill="#e2e8f0">开发者（层级结构 + 全文检索）</text>
<text x="362" y="311" font-size="10" fill="#94a3b8">做法：</text>
<text x="402" y="311" font-size="10" fill="#e2e8f0">逐字存储不摘要，可 git 追踪</text>
<text x="362" y="329" font-size="10" fill="#94a3b8">优点：</text>
<text x="402" y="329" font-size="10" fill="#e2e8f0">零 API 成本、全本地、隐私友好</text>
<rect x="362" y="339" width="278" height="38" rx="4" fill="#3f1d29" stroke="#fb7185"/>
<text x="374" y="357" font-size="10" fill="#fda4af">代价：规模上去之后检索精度是硬伤</text>
<text x="374" y="371" font-size="9" fill="#fda4af">适合单人单机、隐私敏感场景</text>

<!-- 底部反直觉 -->
<rect x="24" y="404" width="632" height="34" rx="4" fill="#14342a" stroke="#34d399"/>
<text x="40" y="424" font-size="10" fill="#6ee7b7">反直觉：Letta 的简单文件系统 agent + GPT-4o mini 在 LoCoMo 上 74.0%，高于 Mem0 图增强变体的 68.5% —— 架构比工具重要</text>
<text x="40" y="435" font-size="9" fill="#4ade80">（该对比为 Letta 团队公布，非同一论文内统一评测，口径需打折看）</text>
</svg>
