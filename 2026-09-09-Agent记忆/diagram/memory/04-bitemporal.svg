<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 450" width="680" height="450">
<defs>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;family=Noto+Sans+SC:wght@400;500;700&amp;display=swap');
text{font-family:'Noto Sans SC','JetBrains Mono',sans-serif;}
.mono{font-family:'JetBrains Mono','Noto Sans SC',monospace;}
</style>
</defs>

<rect width="680" height="450" fill="#0f172a"/>

<text x="24" y="32" font-size="18" font-weight="700" fill="#e2e8f0">失效的正确做法：关旧边，不删旧边</text>
<text x="24" y="52" font-size="11" fill="#94a3b8">向量库天生对「时间」是瞎的 —— 它只有相似度，没有「当前是否成立」</text>

<!-- 错误做法 -->
<rect x="24" y="68" width="632" height="152" rx="8" fill="#1e293b" stroke="#fb7185"/>
<text x="40" y="92" font-size="12" font-weight="700" fill="#fb7185">✗ 覆盖 / 删除：旧记录消失</text>

<line x1="110" y1="136" x2="650" y2="136" stroke="#475569" stroke-width="1"/>
<text x="120" y="152" font-size="10" fill="#64748b">1 月</text>
<text x="360" y="152" font-size="10" fill="#64748b">6 月</text>
<text x="630" y="152" font-size="10" fill="#64748b">现在</text>

<rect x="120" y="108" width="240" height="26" rx="3" fill="#3f1d29" stroke="#fb7185" stroke-dasharray="4 3"/>
<text x="132" y="126" font-size="10" fill="#fda4af">搬到柏林</text>
<line x1="126" y1="121" x2="200" y2="121" stroke="#fb7185" stroke-width="1.5"/>

<rect x="360" y="108" width="270" height="26" rx="3" fill="#164e63" stroke="#22d3ee"/>
<text x="372" y="126" font-size="10" fill="#a5f3fc">搬到慕尼黑（覆盖了上一条）</text>

<text x="40" y="180" font-size="11" fill="#e2e8f0">问：「去年三月我住哪？」</text>
<text x="220" y="180" font-size="11" font-weight="700" fill="#fb7185">→ 答不上来，记录已经没了</text>
<text x="40" y="200" font-size="10" fill="#64748b">更糟的是，很多「过期」根本没人明确说过 —— 它只是不再成立</text>

<!-- 正确做法 -->
<rect x="24" y="232" width="632" height="152" rx="8" fill="#1e293b" stroke="#34d399"/>
<text x="40" y="256" font-size="12" font-weight="700" fill="#34d399">✓ 双时间戳（bitemporal）：旧边关区间，保留历史</text>

<line x1="110" y1="300" x2="650" y2="300" stroke="#475569" stroke-width="1"/>
<text x="120" y="316" font-size="10" fill="#64748b">1 月</text>
<text x="360" y="316" font-size="10" fill="#64748b">6 月</text>
<text x="630" y="316" font-size="10" fill="#64748b">现在</text>

<rect x="120" y="272" width="240" height="26" rx="3" fill="#1e293b" stroke="#64748b"/>
<text x="132" y="290" font-size="10" fill="#94a3b8">搬到柏林 · valid: 1 月 – 6 月（已关闭）</text>

<rect x="360" y="272" width="270" height="26" rx="3" fill="#164e63" stroke="#34d399"/>
<text x="372" y="290" font-size="10" fill="#a5f3fc">搬到慕尼黑 · valid: 6 月 – now</text>

<text x="40" y="344" font-size="11" fill="#e2e8f0">「去年三月住哪？」→ 柏林</text>
<text x="200" y="344" font-size="11" fill="#e2e8f0">「现在住哪？」→ 慕尼黑</text>
<text x="360" y="344" font-size="11" font-weight="700" fill="#34d399">两个问题都能答</text>
<text x="40" y="364" font-size="10" fill="#64748b">收到更新时不删除旧记录，而是关掉旧边的有效期区间，再建一条新边</text>

<!-- 底部 -->
<rect x="24" y="396" width="632" height="42" rx="4" fill="#1e293b" stroke="#334155"/>
<text x="40" y="416" font-size="11" fill="#e2e8f0">两个时间都要记：event time（现实何时发生） vs ingestion time（系统何时知道）</text>
<text x="40" y="433" font-size="10" fill="#94a3b8">收益可见：LongMemEval 上 Zep/Graphiti 63.8% vs Mem0 49.0%；DMR 上 94.8% vs MemGPT 93.4%；P95 约 300ms 且检索不调 LLM</text>
</svg>
