<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 450">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap');
    text { font-family: 'JetBrains Mono','Noto Sans SC','PingFang SC',sans-serif; }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/></pattern>
  </defs>
  <rect width="100%" height="100%" fill="#0f172a"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>
  <text x="20" y="30" fill="#e2e8f0" font-size="15" font-weight="700">图6 · 9 个坑按「写 → 触发 → 执行 → 治理」四层归类</text>
  <text x="20" y="48" fill="#94a3b8" font-size="9.5">前三层决定 Skill 好不好用，第四层决定它会不会反噬你</text>

  <rect x="24" y="66" width="152" height="212" rx="8" fill="rgba(15,23,42,0.5)" stroke="#475569" stroke-width="1.1"/>
  <text x="40" y="90" fill="#e2e8f0" font-size="11" font-weight="700">写 · 内容层</text>
  <text x="40" y="116" fill="#fca5a5" font-size="9" font-weight="600">坑1 description 太泛</text>
  <text x="40" y="132" fill="#94a3b8" font-size="8">没有触发词，永远不命中</text>
  <text x="40" y="154" fill="#fca5a5" font-size="9" font-weight="600">坑2 正文写成手册</text>
  <text x="40" y="170" fill="#94a3b8" font-size="8">2 千词淹没关键步骤</text>
  <text x="40" y="192" fill="#fca5a5" font-size="9" font-weight="600">坑3 只有原则没动作</text>
  <text x="40" y="208" fill="#94a3b8" font-size="8">「保证安全」不改变行为</text>
  <text x="40" y="230" fill="#fca5a5" font-size="9" font-weight="600">坑4 确定性逻辑靠嘴说</text>
  <text x="40" y="246" fill="#94a3b8" font-size="8">该锁进脚本的别交给模型</text>
  <text x="40" y="264" fill="#64748b" font-size="8">改法：动词开头 + 编号步骤</text>

  <rect x="190" y="66" width="152" height="212" rx="8" fill="rgba(15,23,42,0.5)" stroke="#475569" stroke-width="1.1"/>
  <text x="206" y="90" fill="#e2e8f0" font-size="11" font-weight="700">触发 · 路由层</text>
  <text x="206" y="116" fill="#fca5a5" font-size="9" font-weight="600">坑5 name ≠ 目录名</text>
  <text x="206" y="132" fill="#94a3b8" font-size="8">静默失效，无任何报错</text>
  <text x="206" y="154" fill="#fca5a5" font-size="9" font-weight="600">坑6 frontmatter 不在 byte 0</text>
  <text x="206" y="170" fill="#94a3b8" font-size="8">BOM / 空行 → 解析失败</text>
  <text x="206" y="192" fill="#fca5a5" font-size="9" font-weight="600">坑7 库膨胀到 40+</text>
  <text x="206" y="208" fill="#94a3b8" font-size="8">description 被压，全库退化</text>
  <text x="206" y="230" fill="#fca5a5" font-size="9" font-weight="600">坑8 本会话新建的看不见</text>
  <text x="206" y="246" fill="#94a3b8" font-size="8">加载器在会话启动时缓存</text>
  <text x="206" y="264" fill="#64748b" font-size="8">改法：20 条用例测召回与误触</text>

  <rect x="356" y="66" width="152" height="212" rx="8" fill="rgba(15,23,42,0.5)" stroke="#475569" stroke-width="1.1"/>
  <text x="372" y="90" fill="#e2e8f0" font-size="11" font-weight="700">执行 · 脚本层</text>
  <text x="372" y="116" fill="#fca5a5" font-size="9" font-weight="600">坑9 脚本不可复现</text>
  <text x="372" y="132" fill="#94a3b8" font-size="8">依赖隐藏环境变量，换机就崩</text>
  <text x="372" y="154" fill="#cbd5e1" font-size="9">配套要求（同一类问题）</text>
  <text x="372" y="174" fill="#94a3b8" font-size="8">· 写明依赖与入参，带错误提示</text>
  <text x="372" y="192" fill="#94a3b8" font-size="8">· 每步设检查点，失败即中止</text>
  <text x="372" y="210" fill="#94a3b8" font-size="8">· 高风险动作给预览 / 回滚</text>
  <text x="372" y="228" fill="#94a3b8" font-size="8">· 不硬编码密钥，走环境变量</text>
  <text x="372" y="264" fill="#64748b" font-size="8">改法：脚本即回归测试</text>

  <rect x="522" y="66" width="134" height="212" rx="8" fill="rgba(76,29,41,0.32)" stroke="#fb7185" stroke-width="1.3"/>
  <text x="538" y="90" fill="#fb7185" font-size="11" font-weight="700">治理 · 供应链</text>
  <text x="538" y="116" fill="#fca5a5" font-size="9" font-weight="600">随手装第三方 Skill</text>
  <text x="538" y="132" fill="#94a3b8" font-size="8">Snyk：3,984 个里 534 个</text>
  <text x="538" y="146" fill="#94a3b8" font-size="8">（13.4%）含 critical 问题</text>
  <text x="538" y="168" fill="#fca5a5" font-size="9" font-weight="600">把 Skill 当权限系统</text>
  <text x="538" y="184" fill="#94a3b8" font-size="8">allowed-tools 部分 runtime</text>
  <text x="538" y="198" fill="#94a3b8" font-size="8">直接忽略，不能当护栏</text>
  <text x="538" y="220" fill="#fca5a5" font-size="9" font-weight="600">Skill 腐败</text>
  <text x="538" y="236" fill="#94a3b8" font-size="8">API 变了但 Gotchas 没更新，</text>
  <text x="538" y="248" fill="#94a3b8" font-size="8">比没有 Skill 更糟</text>
  <text x="538" y="266" fill="#64748b" font-size="8">改法：指定 owner + 审计周期</text>

  <rect x="24" y="292" width="632" height="82" rx="8" fill="rgba(8,51,68,0.3)" stroke="#22d3ee" stroke-width="1.3"/>
  <text x="44" y="316" fill="#67e8f9" font-size="11" font-weight="700">一个可量化的判断标准</text>
  <text x="44" y="338" fill="#cbd5e1" font-size="9">SkillsBench（47,150 个 Skill）：精选库把平均任务通过率抬高 16.2 个百分点；但模型自动生成的 Skill 反而 −1.3%</text>
  <text x="44" y="358" fill="#cbd5e1" font-size="9">单个任务挂 2–3 个 Skill 最优，再多导致 +5.9% 下滑；单个 Skill 正文控制在 800–1,500 token</text>

  <text x="20" y="404" fill="#94a3b8" font-size="9">Skill 不是「提示词存档」，是带回归测试的流程产品：写得出来只是入场券，跑得稳才算交付。</text>
</svg>
