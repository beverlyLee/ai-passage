<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 450">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap');
    text { font-family: 'JetBrains Mono','Noto Sans SC','PingFang SC',sans-serif; }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/></pattern>
    <marker id="arrow-cyan" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#22d3ee"/></marker>
    <marker id="arrow-rose" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#fb7185"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#0f172a"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>
  <text x="20" y="30" fill="#e2e8f0" font-size="15" font-weight="700">图3 · description 是「检索键」，不是给人看的摘要</text>
  <text x="20" y="48" fill="#94a3b8" font-size="9.5">Skill 不触发时不会报错 —— 坏掉的 Skill 和你忘用的 Skill 长得一模一样</text>

  <rect x="24" y="68" width="200" height="60" rx="8" fill="rgba(15,23,42,0.5)" stroke="#475569" stroke-width="1.1"/>
  <text x="44" y="92" fill="#e2e8f0" font-size="10.5" font-weight="700">用户请求</text>
  <text x="44" y="112" fill="#94a3b8" font-size="8.5">「帮我写这次发布的 changelog」</text>
  <line x1="228" y1="98" x2="256" y2="98" stroke="#22d3ee" stroke-width="1.4" marker-end="url(#arrow-cyan)"/>

  <rect x="260" y="62" width="180" height="72" rx="8" fill="rgba(8,51,68,0.36)" stroke="#22d3ee" stroke-width="1.3"/>
  <text x="278" y="86" fill="#22d3ee" font-size="10.5" font-weight="700">语义匹配（非正则）</text>
  <text x="278" y="104" fill="#cbd5e1" font-size="8.5">请求意图 ⇄ N 个 description</text>
  <text x="278" y="120" fill="#94a3b8" font-size="8.5">逐 token 比对相关度后择一</text>
  <line x1="444" y1="98" x2="472" y2="98" stroke="#22d3ee" stroke-width="1.4" marker-end="url(#arrow-cyan)"/>

  <rect x="476" y="68" width="180" height="52" rx="8" fill="rgba(15,23,42,0.5)" stroke="#475569" stroke-width="1.1"/>
  <text x="494" y="90" fill="#e2e8f0" font-size="10.5" font-weight="700">加载正文 → 执行</text>
  <text x="494" y="108" fill="#94a3b8" font-size="8.5">命中才付 L2 的 token</text>

  <rect x="24" y="152" width="632" height="94" rx="8" fill="rgba(8,51,68,0.3)" stroke="#22d3ee" stroke-width="1.3"/>
  <text x="44" y="176" fill="#67e8f9" font-size="11" font-weight="700">✓ 命中：description 写成了检索键</text>
  <text x="44" y="198" fill="#cbd5e1" font-size="9">「从已合并 PR 写发布说明。当用户要 release notes、changelog、发版总结，或问『这次上线改了什么』时使用。」</text>
  <text x="44" y="218" fill="#94a3b8" font-size="8.5">首句动词开头写做什么 → 第二句列出用户真会说的说法 → 第三句补边界与「不要用于」</text>
  <text x="44" y="236" fill="#64748b" font-size="8.5">四句式模板：做什么 / 何时用 / 也触发于 / 适用对象</text>

  <rect x="24" y="258" width="308" height="108" rx="8" fill="rgba(76,29,41,0.32)" stroke="#fb7185" stroke-width="1.3"/>
  <text x="44" y="282" fill="#fb7185" font-size="11" font-weight="700">✗ 从不触发（漏召回）</text>
  <text x="44" y="304" fill="#fca5a5" font-size="9">症状：Skill 装了几个月一次没被用过</text>
  <text x="44" y="324" fill="#cbd5e1" font-size="8.5">病因：description 太泛，没有触发词</text>
  <text x="44" y="342" fill="#cbd5e1" font-size="8.5">反例：「帮助处理开发相关任务」</text>
  <text x="44" y="358" fill="#94a3b8" font-size="8.5">→ 没有 trigger 类 token，匹配不到任何请求</text>

  <rect x="348" y="258" width="308" height="108" rx="8" fill="rgba(76,29,41,0.32)" stroke="#fb7185" stroke-width="1.3"/>
  <text x="368" y="282" fill="#fb7185" font-size="11" font-weight="700">✗ 到处误触发（过召回）</text>
  <text x="368" y="304" fill="#fca5a5" font-size="9">症状：无关任务也被塞进一堆指令</text>
  <text x="368" y="324" fill="#cbd5e1" font-size="8.5">病因：description 太宽，缺负向约束</text>
  <text x="368" y="342" fill="#cbd5e1" font-size="8.5">反例：「最佳实践与代码质量」</text>
  <text x="368" y="358" fill="#94a3b8" font-size="8.5">→ 白烧 token，还把真正相关的 Skill 挤掉</text>

  <text x="20" y="398" fill="#94a3b8" font-size="9">验收方法：20 条测试查询（10 条该触发、10 条不该触发），跑三轮看命中与误触是否稳定。</text>
  <text x="20" y="414" fill="#94a3b8" font-size="9">成功率长期低于 70% 的 Skill，按 SkillsBench 的建议直接退休，别再修。</text>
</svg>
