<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 450">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap');
    text { font-family: 'JetBrains Mono','Noto Sans SC','PingFang SC',sans-serif; }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/></pattern>
    <marker id="arrow-cyan" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#22d3ee"/></marker>
    <marker id="arrow-rose" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#fb7185"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#0f172a"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>
  <text x="20" y="30" fill="#e2e8f0" font-size="15" font-weight="700">图1 · Agent Skill = 一个文件夹 + 一个 SKILL.md，40+ 客户端通用</text>
  <text x="20" y="48" fill="#94a3b8" font-size="9.5">不是 SDK，不是常驻服务，是能被 git 版本化的「程序性知识」</text>

  <rect x="24" y="68" width="330" height="286" rx="8" fill="rgba(15,23,42,0.4)" stroke="#334155" stroke-width="1"/>
  <text x="44" y="92" fill="#e2e8f0" font-size="12" font-weight="700">Skill 的目录结构（只有 SKILL.md 是必需的）</text>
  <text x="44" y="122" fill="#67e8f9" font-size="10">release-notes/</text>
  <text x="68" y="142" fill="#e2e8f0" font-size="10">SKILL.md</text>
  <text x="176" y="142" fill="#64748b" font-size="8.5"># 必需：frontmatter + 指令正文</text>
  <text x="68" y="164" fill="#cbd5e1" font-size="10">scripts/</text>
  <text x="176" y="164" fill="#64748b" font-size="8.5"># 可选：确定性逻辑，代码锁死</text>
  <text x="68" y="186" fill="#cbd5e1" font-size="10">references/</text>
  <text x="176" y="186" fill="#64748b" font-size="8.5"># 可选：长文档，按需才读</text>
  <text x="68" y="208" fill="#cbd5e1" font-size="10">assets/</text>
  <text x="176" y="208" fill="#64748b" font-size="8.5"># 可选：模板 / 产出物</text>
  <line x1="44" y1="228" x2="334" y2="228" stroke="#334155" stroke-width="0.8"/>
  <text x="44" y="252" fill="#94a3b8" font-size="9">SKILL.md 内部 = YAML frontmatter + Markdown 正文</text>
  <rect x="44" y="266" width="290" height="72" rx="5" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1"/>
  <text x="58" y="286" fill="#67e8f9" font-size="9">---</text>
  <text x="58" y="302" fill="#cbd5e1" font-size="9">name: release-notes</text>
  <text x="58" y="318" fill="#cbd5e1" font-size="9">description: 从已合并 PR 写发布说明…</text>
  <text x="58" y="334" fill="#67e8f9" font-size="9">---</text>

  <rect x="368" y="68" width="288" height="150" rx="8" fill="rgba(76,29,41,0.32)" stroke="#fb7185" stroke-width="1.3"/>
  <text x="388" y="92" fill="#fb7185" font-size="11.5" font-weight="700">frontmatter 硬约束（违反即静默失效）</text>
  <text x="388" y="118" fill="#cbd5e1" font-size="9">name</text>
  <text x="436" y="118" fill="#fca5a5" font-size="9">≤ 64 字符</text>
  <text x="388" y="136" fill="#94a3b8" font-size="8.5">仅小写字母 / 数字 / 连字符；不得含 anthropic、claude</text>
  <text x="388" y="154" fill="#fca5a5" font-size="9" font-weight="600">必须与父目录名完全一致</text>
  <text x="388" y="172" fill="#94a3b8" font-size="8.5">→ 不一致 = 最常见的「装了却不生效」</text>
  <text x="388" y="192" fill="#cbd5e1" font-size="9">description</text>
  <text x="464" y="192" fill="#fca5a5" font-size="9">≤ 1,024 字符</text>
  <text x="388" y="210" fill="#94a3b8" font-size="8.5">写「做什么 + 什么时候用」，是 agent 的检索键</text>

  <rect x="368" y="230" width="288" height="124" rx="8" fill="rgba(8,51,68,0.32)" stroke="#22d3ee" stroke-width="1.3"/>
  <text x="388" y="254" fill="#22d3ee" font-size="11.5" font-weight="700">一个 md 文件的标准化时间线</text>
  <text x="388" y="278" fill="#cbd5e1" font-size="9">2025-10　Anthropic 在 Claude Code 首发</text>
  <text x="388" y="296" fill="#67e8f9" font-size="9" font-weight="600">2025-12-18　开放标准 agentskills.io 发布</text>
  <text x="388" y="314" fill="#cbd5e1" font-size="9">2025-12-20　48h 内 VS Code / Codex 跟进</text>
  <text x="388" y="332" fill="#cbd5e1" font-size="9">2026-08　约 40 个客户端读同一份 SKILL.md</text>

  <text x="20" y="392" fill="#94a3b8" font-size="9">它赢在「轻」：没有协议要实现、没有服务要跑，任何会读文件的 agent 都能支持。</text>
  <text x="20" y="408" fill="#94a3b8" font-size="9">代价是：它只是文本，规范不提供任何强制力。</text>
</svg>
