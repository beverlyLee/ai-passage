<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 450">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap');
    text { font-family: 'JetBrains Mono','Noto Sans SC','PingFang SC',sans-serif; }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/></pattern>
    <marker id="arrow-rose" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#fb7185"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#0f172a"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>
  <text x="20" y="30" fill="#e2e8f0" font-size="15" font-weight="700">图5 · 语义供应链攻击：1.7M 次安装的 Kill Chain</text>
  <text x="20" y="48" fill="#94a3b8" font-size="9.5">Zenity @ Black Hat 2026：2026-07-11 → 08-02，skills.sh 上的拼错名投毒</text>

  <rect x="24" y="68" width="626" height="40" rx="6" fill="rgba(76,29,41,0.3)" stroke="#fb7185" stroke-width="1.1"/>
  <text x="40" y="86" fill="#fb7185" font-size="10.5" font-weight="700">① 拼错名上传</text>
  <text x="160" y="86" fill="#cbd5e1" font-size="9">typosquatting 仿冒 Paperclip、Browser Use 等真实服务</text>
  <text x="500" y="86" fill="#94a3b8" font-size="8.5">同期还预留了数百个空包名</text>
  <line x1="337" y1="110" x2="337" y2="120" stroke="#fb7185" stroke-width="1.4" marker-end="url(#arrow-rose)"/>

  <rect x="24" y="122" width="626" height="40" rx="6" fill="rgba(76,29,41,0.3)" stroke="#fb7185" stroke-width="1.1"/>
  <text x="40" y="140" fill="#fb7185" font-size="10.5" font-weight="700">② 干净的潜伏期</text>
  <text x="160" y="140" fill="#cbd5e1" font-size="9">先以无害版本攒下载量与信任，不触发任何告警</text>
  <text x="500" y="140" fill="#94a3b8" font-size="8.5">「耐心」是这次攻击的核心</text>
  <line x1="337" y1="164" x2="337" y2="174" stroke="#fb7185" stroke-width="1.4" marker-end="url(#arrow-rose)"/>

  <rect x="24" y="176" width="626" height="40" rx="6" fill="rgba(76,29,41,0.3)" stroke="#fb7185" stroke-width="1.1"/>
  <text x="40" y="194" fill="#fb7185" font-size="10.5" font-weight="700">③ 事后注入指令</text>
  <text x="160" y="194" fill="#cbd5e1" font-size="9">悄悄改几句话，让 agent 收集 SSH key、云凭证、k8s 配置、CI 密钥并外传</text>
  <text x="500" y="194" fill="#94a3b8" font-size="8.5">与良性版只差几个词</text>
  <line x1="337" y1="218" x2="337" y2="228" stroke="#fb7185" stroke-width="1.4" marker-end="url(#arrow-rose)"/>

  <rect x="24" y="230" width="626" height="40" rx="6" fill="rgba(76,29,41,0.34)" stroke="#fb7185" stroke-width="1.3"/>
  <text x="40" y="248" fill="#fb7185" font-size="10.5" font-weight="700">④ agent 变成武器</text>
  <text x="160" y="248" fill="#fca5a5" font-size="9">&gt;30% 危险 Skill 借 Claude Code / OpenClaw 投放恶意软件</text>
  <text x="500" y="248" fill="#94a3b8" font-size="8.5"> obedience 本身就是攻击面</text>
  <line x1="337" y1="272" x2="337" y2="282" stroke="#fb7185" stroke-width="1.4" marker-end="url(#arrow-rose)"/>

  <rect x="24" y="284" width="626" height="40" rx="6" fill="rgba(8,51,68,0.3)" stroke="#22d3ee" stroke-width="1.1"/>
  <text x="40" y="302" fill="#22d3ee" font-size="10.5" font-weight="700">⑤ 12 小时内下架，但副本仍在</text>
  <text x="230" y="302" fill="#cbd5e1" font-size="9">Vercel 与 GitHub 清空listing，已装进机器的只能手工清除</text>
  <text x="500" y="302" fill="#94a3b8" font-size="8.5">凭证必须轮换</text>

  <rect x="24" y="338" width="300" height="86" rx="8" fill="rgba(76,29,41,0.32)" stroke="#fb7185" stroke-width="1.3"/>
  <text x="44" y="362" fill="#fb7185" font-size="11" font-weight="700">为什么静态扫描失效</text>
  <text x="44" y="382" fill="#cbd5e1" font-size="8.5">Skill 是自然语言，不是可执行代码</text>
  <text x="44" y="398" fill="#cbd5e1" font-size="8.5">签名 / 哈希校验拦不住语义改写</text>
  <text x="44" y="414" fill="#cbd5e1" font-size="8.5">人工扫读也会漏掉那几个关键词</text>

  <rect x="350" y="338" width="300" height="86" rx="8" fill="rgba(8,51,68,0.3)" stroke="#22d3ee" stroke-width="1.3"/>
  <text x="370" y="362" fill="#22d3ee" font-size="11" font-weight="700">可操作的防线</text>
  <text x="370" y="382" fill="#67e8f9" font-size="8.5">白名单制：只用审核过的来源，不走随手装</text>
  <text x="370" y="398" fill="#67e8f9" font-size="8.5">沙箱引爆：先跑一遍看它到底做什么</text>
  <text x="370" y="414" fill="#67e8f9" font-size="8.5">凭证隔离：agent 凭据与开发机密钥分区</text>
</svg>
