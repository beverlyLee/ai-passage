<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 600">
  <style>
    text { font-family: 'JetBrains Mono', 'Noto Sans SC', 'PingFang SC', sans-serif; }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/></marker>
    <marker id="arrow-cyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#22d3ee"/></marker>
    <marker id="arrow-violet" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#a78bfa"/></marker>
    <marker id="arrow-emerald" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#34d399"/></marker>
    <marker id="arrow-amber" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#fbbf24"/></marker>
    <marker id="arrow-slate" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#94a3b8"/></marker>
  </defs>

  <rect width="680" height="600" fill="#0f172a"/>
  <rect width="680" height="600" fill="url(#grid)"/>

  <text x="30" y="30" fill="#e2e8f0" font-size="16" font-weight="700">检索与观测</text>
  <text x="30" y="46" fill="#94a3b8" font-size="9">RAG 是 Spring AI Advisor，观测是 Micrometer 之上的自动装配：两个原子能力都站在 Spring AI 之上</text>

  <!-- 左：RAG (cyan) -->
  <rect x="30" y="62" width="315" height="468" rx="12" fill="none" stroke="#22d3ee" stroke-width="1" stroke-dasharray="8,4"/>
  <text x="38" y="80" fill="#22d3ee" font-size="9" font-weight="600">RAG：Spring AI Advisor（cyan）</text>
  <rect x="45" y="90" width="285" height="300" rx="6" fill="#0f172a"/>
  <rect x="45" y="90" width="285" height="300" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="187" y="110" fill="white" font-size="11" font-weight="600" text-anchor="middle">KnowledgeBaseRetrievalAdvisor</text>
  <text x="187" y="128" fill="#94a3b8" font-size="9" text-anchor="middle">39-42 导入 AdvisorUtils/Chain/BaseAdvisor/Stream</text>
  <text x="187" y="146" fill="#94a3b8" font-size="9" text-anchor="middle">74 implements BaseAdvisor</text>
  <line x1="60" y1="158" x2="315" y2="158" stroke="#1e293b" stroke-width="0.5"/>
  <text x="60" y="178" fill="#22d3ee" font-size="9">106 before：build query</text>
  <text x="60" y="196" fill="#22d3ee" font-size="9">　　　→ 知识库召回</text>
  <text x="60" y="214" fill="#22d3ee" font-size="9">　　　→ 注入提示词（模型调用前）</text>
  <text x="60" y="236" fill="#22d3ee" font-size="9">183 after：响应收尾</text>
  <text x="60" y="258" fill="#22d3ee" font-size="9">203 adviseStream：流式串接</text>
  <text x="60" y="280" fill="#22d3ee" font-size="9">239 onFinishReason：是否结束</text>
  <text x="187" y="370" fill="#94a3b8" font-size="9" text-anchor="middle">三段式 = Spring AI Advisor 标准骨架</text>
  <rect x="45" y="404" width="285" height="110" rx="6" fill="#0f172a"/>
  <rect x="45" y="404" width="285" height="110" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="187" y="424" fill="white" font-size="11" font-weight="600" text-anchor="middle">挂在 ChatClient 请求链</text>
  <text x="187" y="444" fill="#94a3b8" font-size="9" text-anchor="middle">模型调用前注入知识 = 检索增强</text>
  <text x="187" y="468" fill="#fcd34d" font-size="9" text-anchor="middle">与 ChatMemory 两套：RAG 补知识</text>
  <text x="187" y="486" fill="#fcd34d" font-size="9" text-anchor="middle">记忆补上下文，别混</text>

  <!-- 右：观测 (amber) -->
  <rect x="355" y="62" width="315" height="468" rx="12" fill="none" stroke="#fbbf24" stroke-width="1" stroke-dasharray="8,4"/>
  <text x="363" y="80" fill="#fbbf24" font-size="9" font-weight="600">观测：Micrometer 之上（amber）</text>
  <rect x="370" y="90" width="285" height="70" rx="6" fill="#0f172a"/>
  <rect x="370" y="90" width="285" height="70" rx="6" fill="rgba(120,53,15,0.4)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="512" y="110" fill="white" font-size="11" font-weight="600" text-anchor="middle">GraphObservationProperties</text>
  <text x="512" y="128" fill="#fcd34d" font-size="9" text-anchor="middle">26 @ConfigProperties</text>
  <text x="512" y="146" fill="#fcd34d" font-size="9" text-anchor="middle">29 前缀 spring.ai.alibaba.graph.observation</text>
  <rect x="370" y="175" width="285" height="110" rx="6" fill="#0f172a"/>
  <rect x="370" y="175" width="285" height="110" rx="6" fill="rgba(120,53,15,0.4)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="512" y="195" fill="white" font-size="11" font-weight="600" text-anchor="middle">GraphObservationAutoConfiguration</text>
  <text x="512" y="213" fill="#fcd34d" font-size="9" text-anchor="middle">53 @AutoConfiguration</text>
  <text x="512" y="231" fill="#fcd34d" font-size="9" text-anchor="middle">55 @EnableConfigurationProperties</text>
  <text x="512" y="249" fill="#fcd34d" font-size="9" text-anchor="middle">56 @ConditionalOnProperty 默认开启</text>
  <text x="512" y="267" fill="#fcd34d" font-size="9" text-anchor="middle">20 接 GraphObservationLifecycleListener</text>
  <rect x="370" y="300" width="285" height="70" rx="6" fill="#0f172a"/>
  <rect x="370" y="300" width="285" height="70" rx="6" fill="rgba(120,53,15,0.4)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="512" y="320" fill="white" font-size="11" font-weight="600" text-anchor="middle">SpringAiAlibabaChatModel</text>
  <text x="512" y="338" fill="white" font-size="11" font-weight="600" text-anchor="middle">ObservationConvention</text>
  <text x="512" y="356" fill="#fcd34d" font-size="9" text-anchor="middle">43 extends Default...</text>
  <rect x="370" y="404" width="285" height="110" rx="6" fill="#0f172a"/>
  <rect x="370" y="404" width="285" height="110" rx="6" fill="rgba(120,53,15,0.4)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="512" y="424" fill="white" font-size="11" font-weight="600" text-anchor="middle">ObservationRegistry（Micrometer）</text>
  <text x="512" y="444" fill="#fcd34d" font-size="9" text-anchor="middle">图执行生命周期 → 每个节点 / 每条边</text>
  <text x="512" y="462" fill="#fcd34d" font-size="9" text-anchor="middle">变成可观测 span，默认开启</text>
  <text x="512" y="486" fill="#fcd34d" font-size="9" text-anchor="middle">异常直接看链路定位</text>

  <text x="30" y="560" fill="#64748b" font-size="9">结论：RAG 与观测都是 Spring AI / Micrometer 约定之上的一层薄封装，不是 SAA 新造的机制</text>
</svg>
