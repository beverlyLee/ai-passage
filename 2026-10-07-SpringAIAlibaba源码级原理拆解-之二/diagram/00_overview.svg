<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 600">
  <style>
    text { font-family: 'JetBrains Mono', 'Noto Sans SC', 'PingFang SC', sans-serif; }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/></marker>
    <marker id="arrow-violet" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#a78bfa"/></marker>
    <marker id="arrow-cyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#22d3ee"/></marker>
  </defs>
  <rect width="680" height="600" fill="#0f172a"/>
  <rect width="680" height="600" fill="url(#grid)"/>

  <text x="30" y="30" fill="#e2e8f0" font-size="16" font-weight="700">SAA 在 Spring AI 之上加了什么</text>
  <text x="30" y="46" fill="#94a3b8" font-size="9">虚线之上 = SAA 两层编排增量；虚线之下 = Spring AI 现成原子抽象。箭头 = 编排关系</text>

  <!-- Top band: SAA 增量 (violet) -->
  <rect x="30" y="62" width="620" height="140" rx="12" fill="none" stroke="#a78bfa" stroke-width="1" stroke-dasharray="8,4"/>
  <text x="38" y="80" fill="#a78bfa" font-size="9" font-weight="600">SAA 增量（只做编排，不造原子能力）</text>
  <rect x="60" y="90" width="270" height="98" rx="6" fill="#0f172a"/>
  <rect x="60" y="90" width="270" height="98" rx="6" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="195" y="112" fill="white" font-size="11" font-weight="600" text-anchor="middle">graph-core 状态图引擎</text>
  <text x="195" y="132" fill="#c4b5fd" font-size="9" text-anchor="middle">LlmNode / ToolNode / StateGraph</text>
  <text x="195" y="150" fill="#c4b5fd" font-size="9" text-anchor="middle">可回放 · 可持久化 · 可中断恢复</text>
  <text x="195" y="172" fill="#94a3b8" font-size="9" text-anchor="middle">把原子节点缝成一张图</text>

  <rect x="350" y="90" width="270" height="98" rx="6" fill="#0f172a"/>
  <rect x="350" y="90" width="270" height="98" rx="6" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="485" y="112" fill="white" font-size="11" font-weight="600" text-anchor="middle">agent-framework</text>
  <text x="485" y="132" fill="#c4b5fd" font-size="9" text-anchor="middle">ReactAgent 单智能体</text>
  <text x="485" y="150" fill="#c4b5fd" font-size="9" text-anchor="middle">A2A 多智能体编排</text>
  <text x="485" y="172" fill="#94a3b8" font-size="9" text-anchor="middle">在图之上做智能体逻辑</text>

  <!-- arrows from top to divider -->
  <line x1="195" y1="200" x2="195" y2="252" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arrow-violet)"/>
  <line x1="485" y1="200" x2="485" y2="252" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arrow-violet)"/>
  <text x="340" y="234" fill="#a78bfa" font-size="9" text-anchor="middle">编排</text>

  <!-- divider -->
  <line x1="30" y1="270" x2="650" y2="270" stroke="#64748b" stroke-width="1" stroke-dasharray="6,4"/>
  <text x="340" y="290" fill="#94a3b8" font-size="9" text-anchor="middle">SAA 增量边界：原子能力全是上游现成，这里不替换，只编排</text>

  <!-- Bottom band: Spring AI atoms (cyan) -->
  <rect x="30" y="300" width="620" height="258" rx="12" fill="none" stroke="#22d3ee" stroke-width="1" stroke-dasharray="8,4"/>
  <text x="38" y="318" fill="#22d3ee" font-size="9" font-weight="600">Spring AI 原子抽象（上游现成，SAA 直接复用）</text>

  <!-- row1 -->
  <rect x="45" y="330" width="190" height="92" rx="6" fill="#0f172a"/>
  <rect x="45" y="330" width="190" height="92" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="140" y="352" fill="white" font-size="11" font-weight="600" text-anchor="middle">ChatClient 门面</text>
  <text x="140" y="374" fill="#94a3b8" font-size="9" text-anchor="middle">LlmNode 68/190</text>
  <text x="140" y="392" fill="#94a3b8" font-size="9" text-anchor="middle">AgentLlmNode 81/485</text>
  <text x="140" y="410" fill="#94a3b8" font-size="9" text-anchor="middle">stream() / call()</text>

  <rect x="250" y="330" width="190" height="92" rx="6" fill="#0f172a"/>
  <rect x="250" y="330" width="190" height="92" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="345" y="352" fill="white" font-size="11" font-weight="600" text-anchor="middle">ChatMemory 记忆</text>
  <text x="345" y="374" fill="#94a3b8" font-size="9" text-anchor="middle">ConversationChatMemory</text>
  <text x="345" y="392" fill="#94a3b8" font-size="9" text-anchor="middle">38 实现 / 59 add / 83 get</text>
  <text x="345" y="410" fill="#94a3b8" font-size="9" text-anchor="middle">Redis 双端队列</text>

  <rect x="455" y="330" width="190" height="92" rx="6" fill="#0f172a"/>
  <rect x="455" y="330" width="190" height="92" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="550" y="352" fill="white" font-size="11" font-weight="600" text-anchor="middle">ToolCallback 工具</text>
  <text x="550" y="374" fill="#94a3b8" font-size="9" text-anchor="middle">ToolNode 30/93</text>
  <text x="550" y="392" fill="#94a3b8" font-size="9" text-anchor="middle">NacosMcp 57/373</text>
  <text x="550" y="410" fill="#94a3b8" font-size="9" text-anchor="middle">本地 + 远程同接口</text>

  <!-- row2 -->
  <rect x="160" y="438" width="190" height="92" rx="6" fill="#0f172a"/>
  <rect x="160" y="438" width="190" height="92" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="255" y="460" fill="white" font-size="11" font-weight="600" text-anchor="middle">RAG 检索增强</text>
  <text x="255" y="482" fill="#94a3b8" font-size="9" text-anchor="middle">KBRetrievalAdvisor</text>
  <text x="255" y="500" fill="#94a3b8" font-size="9" text-anchor="middle">74 BaseAdvisor</text>
  <text x="255" y="518" fill="#94a3b8" font-size="9" text-anchor="middle">106/183/203 三段式</text>

  <rect x="365" y="438" width="190" height="92" rx="6" fill="#0f172a"/>
  <rect x="365" y="438" width="190" height="92" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="460" y="460" fill="white" font-size="11" font-weight="600" text-anchor="middle">Observation 观测</text>
  <text x="460" y="482" fill="#94a3b8" font-size="9" text-anchor="middle">GraphObservation</text>
  <text x="460" y="500" fill="#94a3b8" font-size="9" text-anchor="middle">AutoConfig 53/56</text>
  <text x="460" y="518" fill="#94a3b8" font-size="9" text-anchor="middle">Micrometer 之上</text>

  <text x="30" y="582" fill="#64748b" font-size="9">结论：五个原子抽象全部来自 Spring AI，SAA 只把它们编排进一张可持久化状态图</text>
</svg>
