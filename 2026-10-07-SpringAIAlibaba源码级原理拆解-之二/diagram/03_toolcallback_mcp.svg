<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 600">
  <style>
    text { font-family: 'JetBrains Mono', 'Noto Sans SC', 'PingFang SC', sans-serif; }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/></marker>
    <marker id="arrow-cyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#22d3ee"/></marker>
    <marker id="arrow-violet" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#a78bfa"/></marker>
    <marker id="arrow-emerald" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#34d399"/></marker>
    <marker id="arrow-amber" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#fbbf24"/></marker>
    <marker id="arrow-slate" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#94a3b8"/></marker>
  </defs>

  <rect width="680" height="600" fill="#0f172a"/>
  <rect width="680" height="600" fill="url(#grid)"/>

  <text x="30" y="30" fill="#e2e8f0" font-size="16" font-weight="700">工具与 MCP</text>
  <text x="30" y="46" fill="#94a3b8" font-size="9">SAA 只解析 Spring AI 的 ToolCallback，远程工具由 Nacos 网关包装：两条链路在 ToolNode 汇合</text>

  <!-- 本地工具 (cyan, Spring AI 原生) -->
  <rect x="40" y="86" width="280" height="80" rx="12" fill="none" stroke="#22d3ee" stroke-width="1" stroke-dasharray="8,4"/>
  <text x="48" y="104" fill="#22d3ee" font-size="9" font-weight="600">本地工具（Spring Bean）</text>
  <rect x="52" y="110" width="256" height="48" rx="6" fill="#0f172a"/>
  <rect x="52" y="110" width="256" height="48" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="180" y="130" fill="white" font-size="11" font-weight="600" text-anchor="middle">ToolCallback（Spring Bean）</text>
  <text x="180" y="148" fill="#94a3b8" font-size="9" text-anchor="middle">直接来自 Spring 上下文，无需网关</text>

  <!-- 远程工具 (amber, 网关) -->
  <rect x="360" y="86" width="280" height="80" rx="12" fill="none" stroke="#fbbf24" stroke-width="1" stroke-dasharray="8,4"/>
  <text x="368" y="104" fill="#fbbf24" font-size="9" font-weight="600">远程工具（Nacos MCP 网关）</text>
  <rect x="372" y="110" width="256" height="48" rx="6" fill="#0f172a"/>
  <rect x="372" y="110" width="256" height="48" rx="6" fill="rgba(120,53,15,0.4)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="500" y="130" fill="white" font-size="11" font-weight="600" text-anchor="middle">NacosMcpGatewayToolCallback 57</text>
  <text x="500" y="148" fill="#fcd34d" font-size="9" text-anchor="middle">51 ToolCallback · 52 ToolDefinition · 373 定义</text>

  <!-- 两条链路汇合到 ToolNode -->
  <line x1="180" y1="166" x2="340" y2="222" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="500" y1="166" x2="340" y2="222" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="200" y="200" fill="#94a3b8" font-size="9">本地</text>
  <text x="470" y="200" fill="#fcd34d" font-size="9">远程经网关</text>

  <!-- ToolNode (violet, SAA) -->
  <rect x="130" y="228" width="420" height="96" rx="12" fill="none" stroke="#a78bfa" stroke-width="1" stroke-dasharray="8,4"/>
  <text x="138" y="246" fill="#a78bfa" font-size="9" font-weight="600">ToolNode（SAA 节点壳，两类工具无感接入）</text>
  <rect x="142" y="252" width="396" height="62" rx="6" fill="#0f172a"/>
  <rect x="142" y="252" width="396" height="62" rx="6" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="340" y="272" fill="white" font-size="11" font-weight="600" text-anchor="middle">ToolNode（SAA）</text>
  <text x="340" y="290" fill="#c4b5fd" font-size="9" text-anchor="middle">30 import · 40 List&lt;ToolCallback&gt; · 44 ToolCallbackResolver</text>
  <text x="340" y="306" fill="#c4b5fd" font-size="9" text-anchor="middle">93 resolve(toolName) · 101 查本地 · 105 委派 Resolver 兜底</text>

  <line x1="340" y1="324" x2="340" y2="350" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 模型决策 + ChatClient (cyan) -->
  <rect x="130" y="356" width="420" height="118" rx="12" fill="none" stroke="#22d3ee" stroke-width="1" stroke-dasharray="8,4"/>
  <text x="138" y="374" fill="#22d3ee" font-size="9" font-weight="600">模型决策 + ChatClient（上游现成）</text>
  <rect x="142" y="380" width="396" height="86" rx="6" fill="#0f172a"/>
  <rect x="142" y="380" width="396" height="86" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="340" y="400" fill="white" font-size="11" font-weight="600" text-anchor="middle">谁调哪个工具由模型定（不是 SAA）</text>
  <text x="340" y="418" fill="#94a3b8" font-size="9" text-anchor="middle">ChatClient 把 ToolCallback 描述发给模型，模型返回调用意图</text>
  <text x="340" y="436" fill="#94a3b8" font-size="9" text-anchor="middle">ToolNode 执行后结果写回图状态 → 下一轮循环（ReAct）</text>

  <text x="30" y="540" fill="#64748b" font-size="9">结论：本地与远程对 ToolNode 都是同一个 ToolCallback 接口，SAA 不替模型决策</text>
</svg>
