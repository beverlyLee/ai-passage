<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 600">
  <style>
    text { font-family: 'JetBrains Mono', 'Noto Sans SC', 'PingFang SC', sans-serif; }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/></marker>
    <marker id="arrow-cyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#22d3ee"/></marker>
    <marker id="arrow-violet" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#a78bfa"/></marker>
    <marker id="arrow-emerald" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#34d399"/></marker>
    <marker id="arrow-amber" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#fbbf24"/></marker>
    <marker id="arrow-slate" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#94a3b8"/></marker>
  </defs>

  <rect width="680" height="600" fill="#0f172a"/>
  <rect width="680" height="600" fill="url(#grid)"/>

  <text x="30" y="30" fill="#e2e8f0" font-size="16" font-weight="700">多轮记忆 ChatMemory</text>
  <text x="30" y="46" fill="#94a3b8" font-size="9">SAA 用 Redis 双端队列实现 Spring AI 的 ChatMemory 契约：↓ 实现关系，最底是注入回路</text>

  <!-- Band 1: SAA 实现 (violet) -->
  <rect x="30" y="62" width="620" height="138" rx="12" fill="none" stroke="#a78bfa" stroke-width="1" stroke-dasharray="8,4"/>
  <text x="38" y="80" fill="#a78bfa" font-size="9" font-weight="600">SAA 实现（violet，admin 模块）</text>
  <rect x="120" y="86" width="440" height="100" rx="6" fill="#0f172a"/>
  <rect x="120" y="86" width="440" height="100" rx="6" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="340" y="108" fill="white" font-size="11" font-weight="600" text-anchor="middle">ConversationChatMemory（admin）</text>
  <text x="340" y="126" fill="#c4b5fd" font-size="9" text-anchor="middle">21 import ChatMemory · 38 implements ChatMemory</text>
  <text x="340" y="144" fill="#c4b5fd" font-size="9" text-anchor="middle">59 add() / 83 get() · 25 ArrayDeque · 20 RedisManager</text>
  <text x="340" y="162" fill="#fcd34d" font-size="9" text-anchor="middle">底层 Redis 双端队列 Deque：61 取历史 · 85 取全量</text>

  <line x1="340" y1="186" x2="340" y2="212" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="346" y="203" fill="#94a3b8" font-size="9">implements</text>

  <!-- Band 2: Spring AI 契约 (cyan) -->
  <rect x="30" y="218" width="620" height="118" rx="12" fill="none" stroke="#22d3ee" stroke-width="1" stroke-dasharray="8,4"/>
  <text x="38" y="236" fill="#22d3ee" font-size="9" font-weight="600">Spring AI ChatMemory 契约（cyan，上游现成）</text>
  <rect x="120" y="244" width="440" height="78" rx="6" fill="#0f172a"/>
  <rect x="120" y="244" width="440" height="78" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="340" y="266" fill="white" font-size="11" font-weight="600" text-anchor="middle">ChatMemory（org.springframework.ai.chat.memory）</text>
  <text x="340" y="284" fill="#94a3b8" font-size="9" text-anchor="middle">add(conversationId, List&lt;Message&gt;) / get(conversationId) → List&lt;Message&gt;</text>
  <text x="340" y="302" fill="#94a3b8" font-size="9" text-anchor="middle">存在内存 / 数据库 / Redis 由实现决定，SAA 选 Redis</text>

  <line x1="340" y1="336" x2="340" y2="362" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="346" y="353" fill="#94a3b8" font-size="9">get 注入</text>

  <!-- Band 3: 注入回路 (amber) -->
  <rect x="30" y="368" width="620" height="118" rx="12" fill="none" stroke="#fbbf24" stroke-width="1" stroke-dasharray="8,4"/>
  <text x="38" y="386" fill="#fbbf24" font-size="9" font-weight="600">注入回路（amber，回到 ChatClient）</text>
  <rect x="120" y="394" width="440" height="78" rx="6" fill="#0f172a"/>
  <rect x="120" y="394" width="440" height="78" rx="6" fill="rgba(120,53,15,0.4)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="340" y="416" fill="white" font-size="11" font-weight="600" text-anchor="middle">ChatClient 提示词</text>
  <text x="340" y="434" fill="#fcd34d" font-size="9" text-anchor="middle">get() 返回有序消息列表，整体塞回 prompt()</text>
  <text x="340" y="452" fill="#fcd34d" font-size="9" text-anchor="middle">跨请求 · 跨实例保序，靠 Redis 双端队列窗口裁剪</text>

  <text x="30" y="540" fill="#64748b" font-size="9">结论：多轮记忆不是新机制，是 Spring AI 的 ChatMemory 契约落到了分布式存储</text>
</svg>
