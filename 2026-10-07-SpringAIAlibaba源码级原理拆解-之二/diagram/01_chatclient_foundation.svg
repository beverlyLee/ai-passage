<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 600">
  <style>
    text { font-family: 'JetBrains Mono', 'Noto Sans SC', 'PingFang SC', sans-serif; }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/></marker>
    <marker id="arrow-cyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#22d3ee"/></marker>
    <marker id="arrow-violet" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#a78bfa"/></marker>
    <marker id="arrow-emerald" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#34d399"/></marker>
    <marker id="arrow-amber" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#fbbf24"/></marker>
    <marker id="arrow-slate" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#94a3b8"/></marker>
  </defs>

  <rect width="680" height="600" fill="#0f172a"/>
  <rect width="680" height="600" fill="url(#grid)"/>

  <text x="30" y="30" fill="#e2e8f0" font-size="16" font-weight="700">对话门面 ChatClient</text>
  <text x="30" y="46" fill="#94a3b8" font-size="9">SAA 节点只包壳，真正出网的是 Spring AI：↓ 上层调用下层，最底才是 HTTP</text>

  <!-- Band 1: SAA 节点壳 (violet) -->
  <rect x="30" y="64" width="620" height="92" rx="12" fill="none" stroke="#a78bfa" stroke-width="1" stroke-dasharray="8,4"/>
  <text x="38" y="82" fill="#a78bfa" font-size="9" font-weight="600">SAA 节点壳（薄包装，SAA 增量）</text>
  <rect x="60" y="92" width="270" height="54" rx="6" fill="#0f172a"/>
  <rect x="60" y="92" width="270" height="54" rx="6" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="195" y="113" fill="white" font-size="11" font-weight="600" text-anchor="middle">LlmNode (graph-core)</text>
  <text x="195" y="130" fill="#c4b5fd" font-size="9" text-anchor="middle">字段 68 / prompt() 190 / 167·171 取响应</text>
  <rect x="350" y="92" width="270" height="54" rx="6" fill="#0f172a"/>
  <rect x="350" y="92" width="270" height="54" rx="6" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="485" y="113" fill="white" font-size="11" font-weight="600" text-anchor="middle">AgentLlmNode (agent-framework)</text>
  <text x="485" y="130" fill="#c4b5fd" font-size="9" text-anchor="middle">字段 81 / prompt() 485 / 213·252 取响应</text>

  <line x1="340" y1="157" x2="340" y2="183" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Band 2: Spring AI ChatClient (cyan) -->
  <rect x="30" y="190" width="620" height="92" rx="12" fill="none" stroke="#22d3ee" stroke-width="1" stroke-dasharray="8,4"/>
  <text x="38" y="208" fill="#22d3ee" font-size="9" font-weight="600">Spring AI ChatClient 门面（上游现成，SAA 复用）</text>
  <rect x="150" y="218" width="380" height="54" rx="6" fill="#0f172a"/>
  <rect x="150" y="218" width="380" height="54" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="340" y="239" fill="white" font-size="11" font-weight="600" text-anchor="middle">ChatClient（org.springframework.ai.chat.client）</text>
  <text x="340" y="256" fill="#94a3b8" font-size="9" text-anchor="middle">prompt()→system/user/advisors/tools→stream() / call()</text>

  <line x1="340" y1="284" x2="340" y2="310" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Band 3: 模型与 HTTP (amber) -->
  <rect x="30" y="317" width="620" height="92" rx="12" fill="none" stroke="#fbbf24" stroke-width="1" stroke-dasharray="8,4"/>
  <text x="38" y="335" fill="#fbbf24" font-size="9" font-weight="600">模型与 HTTP（出网点，真正发请求的是这一层）</text>
  <rect x="150" y="345" width="380" height="54" rx="6" fill="#0f172a"/>
  <rect x="150" y="345" width="380" height="54" rx="6" fill="rgba(120,53,15,0.4)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="340" y="366" fill="white" font-size="11" font-weight="600" text-anchor="middle">DashScopeChatModel（spring-ai-extensions）</text>
  <text x="340" y="383" fill="#fcd34d" font-size="9" text-anchor="middle">HTTP → 通义千问 API ← SAA 仓库里没有它的源码</text>

  <!-- annotation -->
  <text x="500" y="540" fill="#64748b" font-size="9">箭头方向 = 调用方向；最底出网，顶层只是壳</text>
  <text x="30" y="540" fill="#64748b" font-size="9">结论：SAA 没造对话能力，只把 Spring AI 的 ChatClient 包进图节点</text>
</svg>
