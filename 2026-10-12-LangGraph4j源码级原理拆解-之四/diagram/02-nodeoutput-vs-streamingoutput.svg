<svg xmlns="http://www.w3.org/2000/svg" width="680" height="450" viewBox="0 0 680 450">
  <defs>
    <style>
      text{font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;fill:#e2e8f0;}
      .mono{font-family:"JetBrains Mono","SF Mono",Menlo,monospace;}
      .dim{fill:#94a3b8;}
      .amber{fill:#fbbf24;}
      .cyan{fill:#22d3ee;}
      .emerald{fill:#34d399;}
      .rose{fill:#fb7185;}
      .small{font-size:12px;}
      .mid{font-size:14px;}
      .big{font-size:18px;}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#64748b"/></marker>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 H0 V40" fill="none" stroke="#162236" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="680" height="450" fill="#0f172a"/>
  <rect width="680" height="450" fill="url(#grid)"/>

  <text x="34" y="40" class="big">事件类型：NodeOutput 是基类，StreamingOutput 多一个 chunk</text>
  <text x="34" y="62" class="small dim">graph.stream(...) 默认吐 NodeOutput；打开 token 级流式后才会出现 StreamingOutput</text>

  <!-- NodeOutput card -->
  <rect x="34" y="100" width="300" height="250" rx="10" fill="#111c2e" stroke="#22d3ee"/>
  <rect x="34" y="100" width="300" height="34" rx="10" fill="#0e2a38"/>
  <text x="50" y="123" class="mid cyan mono">NodeOutput&lt;State&gt;</text>
  <g>
    <rect x="50" y="150" width="268" height="26" rx="5" fill="#1e293b"/>
    <text x="60" y="167" class="mono small">String node        <tspan class="dim">node()</tspan></text>
    <rect x="50" y="182" width="268" height="26" rx="5" fill="#1e293b"/>
    <text x="60" y="199" class="mono small">State  state       <tspan class="dim">state()/getState()</tspan></text>
    <rect x="50" y="214" width="268" height="26" rx="5" fill="#1e293b"/>
    <text x="60" y="231" class="mono small">boolean isEND       <tspan class="dim">isEND()</tspan></text>
    <rect x="50" y="246" width="268" height="26" rx="5" fill="#1e293b"/>
    <text x="60" y="263" class="mono small">boolean subGraph    <tspan class="dim">isSubGraph()</tspan></text>
    <rect x="50" y="288" width="268" height="26" rx="5" fill="#243244"/>
    <text x="60" y="305" class="mono small dim">+ of(node, state) 工厂方法</text>
  </g>
  <text x="50" y="338" class="small dim">包：org.bsc.langgraph4j</text>

  <!-- StreamingOutput card -->
  <rect x="370" y="80" width="276" height="290" rx="10" fill="#111c2e" stroke="#34d399"/>
  <rect x="370" y="80" width="276" height="34" rx="10" fill="#0e3326"/>
  <text x="386" y="103" class="mid emerald mono">StreamingOutput&lt;State&gt;</text>
  <text x="386" y="128" class="small dim">extends NodeOutput&lt;State&gt;</text>
  <g>
    <rect x="386" y="140" width="244" height="24" rx="5" fill="#1a2b22"/>
    <text x="396" y="156" class="mono small dim">（继承）node / state / isEND</text>
    <rect x="386" y="170" width="244" height="26" rx="5" fill="#1e293b"/>
    <text x="396" y="187" class="mono small"><tspan class="emerald">+ String chunk</tspan>  <tspan class="dim">chunk()</tspan></text>
    <rect x="386" y="202" width="244" height="26" rx="5" fill="#243244"/>
    <text x="396" y="219" class="mono small dim">构造器(node, chunk, state)</text>
  </g>
  <text x="386" y="256" class="small dim">包：org.bsc.langgraph4j.streaming</text>
  <rect x="386" y="270" width="244" height="80" rx="8" fill="#2a1620" stroke="#fb7185"/>
  <text x="398" y="292" class="small rose">chunk 是什么</text>
  <text x="398" y="312" class="small">它是 token 片段，用于 LLM 逐字</text>
  <text x="398" y="330" class="small">流式输出（边生成边吐字）。平时跑</text>
  <text x="398" y="348" class="small">普通节点根本碰不到它。</text>

  <!-- inheritance arrow -->
  <path d="M370 150 C 340 150, 340 175, 334 175" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="346" y="138" class="small dim" text-anchor="middle">继承</text>
</svg>
