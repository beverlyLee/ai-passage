<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 450" font-family="Noto Sans SC, sans-serif">
  <rect width="680" height="450" fill="#0f172a"/>
  <text x="24" y="34" fill="#e2e8f0" font-size="18" font-weight="700">上下文污染：对话越长，Agent 的记性越差</text>
  <text x="24" y="54" fill="#94a3b8" font-size="12">上下文窗口是固定长度的「滚动缓冲区」：新消息进来，最旧的消息被挤出 → turn 6+ 开始错乱</text>

  <!-- 窗口容量标注 -->
  <text x="24" y="84" fill="#22d3ee" font-size="13" font-weight="700">上下文窗口容量 = 最近 6 轮</text>

  <!-- turn 芯片行 -->
  <g font-size="12" text-anchor="middle">
    <!-- turn1 被挤出（灰） -->
    <rect x="24"  y="98" width="78" height="40" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1" stroke-dasharray="4 3"/>
    <text x="63"  y="118" fill="#64748b">turn 1</text>
    <text x="63"  y="132" fill="#475569" font-size="10">退款诉求</text>

    <rect x="110" y="98" width="78" height="40" rx="6" fill="#1e293b" stroke="#22d3ee" stroke-width="1.5"/>
    <text x="149" y="118" fill="#e2e8f0">turn 2</text>
    <text x="149" y="132" fill="#94a3b8" font-size="10">订单号</text>

    <rect x="196" y="98" width="78" height="40" rx="6" fill="#1e293b" stroke="#22d3ee" stroke-width="1.5"/>
    <text x="235" y="118" fill="#e2e8f0">turn 3</text>
    <text x="235" y="132" fill="#94a3b8" font-size="10">物流</text>

    <rect x="282" y="98" width="78" height="40" rx="6" fill="#1e293b" stroke="#22d3ee" stroke-width="1.5"/>
    <text x="321" y="118" fill="#e2e8f0">turn 4</text>
    <text x="321" y="132" fill="#94a3b8" font-size="10">催发货</text>

    <rect x="368" y="98" width="78" height="40" rx="6" fill="#1e293b" stroke="#22d3ee" stroke-width="1.5"/>
    <text x="407" y="118" fill="#e2e8f0">turn 5</text>
    <text x="407" y="132" fill="#94a3b8" font-size="10">发票</text>

    <rect x="454" y="98" width="78" height="40" rx="6" fill="#1e293b" stroke="#22d3ee" stroke-width="1.5"/>
    <text x="493" y="118" fill="#e2e8f0">turn 6</text>
    <text x="493" y="132" fill="#94a3b8" font-size="10">优惠券</text>

    <rect x="540" y="98" width="78" height="40" rx="6" fill="#3b1d24" stroke="#fb7185" stroke-width="1.5"/>
    <text x="579" y="118" fill="#fb7185" font-weight="700">turn 7</text>
    <text x="579" y="132" fill="#94a3b8" font-size="10">到账了吗</text>

    <!-- 窗口框 -->
    <rect x="106" y="92" width="432" height="52" rx="8" fill="none" stroke="#22d3ee" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="106" y="90" fill="#22d3ee" font-size="10">← 窗口内（保留） →</text>

    <!-- 挤出箭头 -->
    <line x1="63" y1="138" x2="63" y2="160" stroke="#fb7185" stroke-width="1.5" marker-end="url(#down)"/>
    <text x="63" y="178" fill="#fb7185" font-size="10" text-anchor="middle">被挤出</text>
  </g>

  <defs>
    <marker id="down" markerWidth="10" markerHeight="10" refX="5" refY="8" orient="auto">
      <path d="M0,0 L5,8 L10,0 Z" fill="#fb7185"/>
    </marker>
  </defs>

  <!-- 后果红卡 -->
  <rect x="24" y="200" width="632" height="78" rx="8" fill="#3b1d24" stroke="#fb7185" stroke-width="1"/>
  <text x="40" y="226" fill="#fbbf24" font-weight="700">后果：turn 7 用户问「我的退款到账了吗」</text>
  <text x="40" y="250" fill="#94a3b8" font-size="12">Agent 早已不记得 turn 1 的退款诉求 → 回「您好，请问有什么可以帮您？」</text>
  <text x="40" y="270" fill="#fb7185" font-size="12">→ 用户：我前面说了三遍退款！（愤怒转人工，且把前 6 轮白聊的火气带进人工）</text>

  <!-- 三种根因 -->
  <g font-size="12">
    <rect x="24"  y="296" width="200" height="58" rx="6" fill="#1e293b" stroke="#fb7185" stroke-width="1"/>
    <text x="38" y="318" fill="#fb7185" font-weight="700">① 窗口硬性截断</text>
    <text x="38" y="338" fill="#94a3b8" font-size="11">超长对话直接丢最早内容</text>

    <rect x="240" y="296" width="200" height="58" rx="6" fill="#1e293b" stroke="#fb7185" stroke-width="1"/>
    <text x="254" y="318" fill="#fb7185" font-weight="700">② 摘要丢信息</text>
    <text x="254" y="338" fill="#94a3b8" font-size="11">压缩旧轮次时漏掉退款等关键点</text>

    <rect x="456" y="296" width="200" height="58" rx="6" fill="#1e293b" stroke="#fb7185" stroke-width="1"/>
    <text x="470" y="318" fill="#fb7185" font-weight="700">③ 近因偏差</text>
    <text x="470" y="338" fill="#94a3b8" font-size="11">模型更看重最近几轮，旧的被淹没</text>
  </g>

  <text x="24" y="402" fill="#94a3b8" font-size="12">修复方向：关键信息（订单/退款单号）落外部状态库而非靠上下文传话 + 触发式摘要 + 超阈值主动转人工并附「已了解的背景」。</text>
  <text x="24" y="424" fill="#475569" font-size="11">注：turn≥6 触发污染是本篇机制模拟器的可复现设定，真实产品阈值因窗口长度而异。</text>
</svg>
