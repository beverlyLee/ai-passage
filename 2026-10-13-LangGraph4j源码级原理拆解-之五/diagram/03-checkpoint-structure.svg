<svg xmlns="http://www.w3.org/2000/svg" width="680" height="450" viewBox="0 0 680 450">
  <defs>
    <style>
      text{font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;fill:#e2e8f0;}
      .mono{font-family:"JetBrains Mono","SF Mono",Menlo,monospace;}
      .dim{fill:#94a3b8;}
      .amber{fill:#fbbf24;}
      .cyan{fill:#22d3ee;}
      .emerald{fill:#34d399;}
      .violet{fill:#a78bfa;}
      .rose{fill:#fb7185;}
      .small{font-size:12px;}
      .mid{font-size:14px;}
      .big{font-size:18px;}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#64748b"/></marker>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 H0 V40" fill="none" stroke="#162236" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="680" height="450" fill="#0f172a"/>
  <rect width="680" height="450" fill="url(#grid)"/>

  <text x="34" y="40" class="big">一个 Checkpoint 里到底存了什么</text>
  <text x="34" y="62" class="small dim">从节点返回到落盘，状态要经过三步；Checkpoint 是第三步的产物</text>

  <!-- 三层 -->
  <!-- 第一层：节点返回局部更新 -->
  <rect x="34" y="88" width="180" height="120" rx="10" fill="#111c2e" stroke="#22d3ee"/>
  <rect x="34" y="88" width="180" height="30" rx="10" fill="#0e2a38"/>
  <text x="46" y="108" class="mid cyan mono">① 节点返回</text>
  <text x="46" y="136" class="small dim">只返回要改的键</text>
  <rect x="46" y="148" width="156" height="46" rx="6" fill="#0b1220"/>
  <text x="56" y="166" class="mono small cyan">Map.of(</text>
  <text x="56" y="182" class="mono small cyan"> "steps",["B"],</text>
  <text x="56" y="198" class="mono small cyan"> "count",2)</text>

  <!-- 第二层：通道合并 -->
  <path d="M214 148 L 252 148" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="256" y="88" width="180" height="120" rx="10" fill="#111c2e" stroke="#a78bfa"/>
  <rect x="256" y="88" width="180" height="30" rx="10" fill="#241a3a"/>
  <text x="268" y="108" class="mid violet mono">② 通道合并</text>
  <text x="268" y="136" class="small dim">按通道规则并进全局</text>
  <rect x="268" y="148" width="156" height="46" rx="6" fill="#0b1220"/>
  <text x="278" y="166" class="mono small violet">steps: appender 追加</text>
  <text x="278" y="182" class="mono small violet">count: base 覆盖</text>
  <text x="268" y="200" class="small dim">得到完整 State</text>

  <!-- 第三层：Checkpoint -->
  <path d="M436 148 L 474 148" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="478" y="88" width="168" height="120" rx="10" fill="#111c2e" stroke="#34d399"/>
  <rect x="478" y="88" width="168" height="30" rx="10" fill="#0e3326"/>
  <text x="490" y="108" class="mid emerald mono">③ 落 Checkpoint</text>
  <text x="490" y="136" class="small dim">saver 存一个快照</text>
  <rect x="490" y="148" width="144" height="46" rx="6" fill="#0b1220"/>
  <text x="500" y="166" class="mono small emerald">Checkpoint</text>
  <text x="500" y="182" class="mono small emerald">(id/state/...)</text>

  <!-- Checkpoint 字段明细 -->
  <rect x="34" y="232" width="612" height="150" rx="10" fill="#111c2e" stroke="#fbbf24"/>
  <rect x="34" y="232" width="612" height="32" rx="10" fill="#3a2f0a"/>
  <text x="48" y="253" class="mid amber mono">org.bsc.langgraph4j.checkpoint.Checkpoint 字段（javap 核实）</text>
  <g>
    <rect x="48" y="278" width="288" height="26" rx="5" fill="#1e293b"/>
    <text x="58" y="295" class="mono small">String id           <tspan class="dim">getId()</tspan></text>
    <rect x="48" y="310" width="288" height="26" rx="5" fill="#1e293b"/>
    <text x="58" y="327" class="mono small">Map state           <tspan class="dim">getState()</tspan></text>
    <rect x="352" y="278" width="288" height="26" rx="5" fill="#1e293b"/>
    <text x="362" y="295" class="mono small">String nodeId        <tspan class="dim">getNodeId()</tspan></text>
    <rect x="352" y="310" width="288" height="26" rx="5" fill="#1e293b"/>
    <text x="362" y="327" class="mono small">String nextNodeId    <tspan class="dim">getNextNodeId()</tspan></text>
    <text x="48" y="356" class="small dim">nodeId：这个快照是哪个节点跑完留下的；nextNodeId：下一个要跑的节点</text>
    <text x="48" y="374" class="small dim">落盘时 CheckPointSerializer 用 ObjectStreamStateSerializer 序列化 state，走 Java 原生流，不依赖 gson</text>
  </g>

  <text x="34" y="416" class="small dim">续跑读回的就是这个快照：state 还原现场，nextNodeId 告诉引擎从哪继续</text>
</svg>
