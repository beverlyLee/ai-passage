<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <marker id="arrow-cyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#22d3ee"/>
    </marker>
    <marker id="arrow-rose" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#fb7185"/>
    </marker>
  </defs>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap');
    text { font-family: 'JetBrains Mono', 'Noto Sans SC', 'PingFang SC', sans-serif; }
  </style>

  <rect width="100%" height="100%" fill="#0f172a"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <!-- Title -->
  <text x="20" y="30" fill="#e2e8f0" font-size="15" font-weight="700">A2A 远程调用时序：/send 与 /stream 两路由</text>
  <text x="20" y="48" fill="#94a3b8" font-size="9">A2aRemoteAgent 当子图节点，请求打到对端 Agent 服务器</text>

  <!-- Lifelines (drawn before boxes) -->
  <line x1="140" y1="108" x2="140" y2="470" stroke="#334155" stroke-width="1" stroke-dasharray="6,4"/>
  <line x1="500" y1="108" x2="500" y2="470" stroke="#334155" stroke-width="1" stroke-dasharray="6,4"/>

  <!-- Messages: self + frame arrows (drawn before boxes) -->
  <!-- self message 1: buildSendMessageRequest -->
  <path d="M 140,150 L 178,150 L 178,173 L 140,173" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- alt frame content arrows -->
  <line x1="140" y1="252" x2="500" y2="252" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="500" y1="292" x2="140" y2="292" stroke="#64748b" stroke-width="1" stroke-dasharray="6,3" marker-end="url(#arrow)"/>
  <line x1="140" y1="360" x2="500" y2="360" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="500" y1="400" x2="140" y2="400" stroke="#64748b" stroke-width="1" stroke-dasharray="6,3" marker-end="url(#arrow)"/>
  <!-- self message 2: extractResponseText -->
  <path d="M 140,448 L 178,448 L 178,471 L 140,471" fill="none" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- alt frame boundary -->
  <rect x="60" y="200" width="520" height="212" rx="4" fill="none" stroke="#64748b" stroke-width="1" stroke-dasharray="4,3"/>
  <rect x="60" y="200" width="48" height="18" rx="4" fill="rgba(30,41,59,0.8)" stroke="#64748b" stroke-width="1"/>
  <text x="84" y="213" fill="#94a3b8" font-size="8" font-weight="600" text-anchor="middle">alt</text>
  <text x="118" y="213" fill="#94a3b8" font-size="8" font-style="italic">[ 走哪条由 agentCard.capabilities().streaming() 决定 :228 ]</text>
  <line x1="60" y1="320" x2="580" y2="320" stroke="#64748b" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="70" y="335" fill="#94a3b8" font-size="8" font-style="italic">[ streaming=true ]</text>

  <!-- Actor boxes (mask + visual) -->
  <rect x="60" y="60" width="160" height="48" rx="6" fill="#0f172a"/>
  <rect x="60" y="60" width="160" height="48" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="140" y="82" fill="white" font-size="11" font-weight="600" text-anchor="middle">本地图 A2aNode</text>
  <text x="140" y="98" fill="#94a3b8" font-size="8" text-anchor="middle">A2aNodeActionWithConfig :60</text>

  <rect x="420" y="60" width="160" height="48" rx="6" fill="#0f172a"/>
  <rect x="420" y="60" width="160" height="48" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="500" y="82" fill="white" font-size="11" font-weight="600" text-anchor="middle">远程 Agent 服务器</text>
  <text x="500" y="98" fill="#94a3b8" font-size="8" text-anchor="middle">A2A JSON-RPC 端点</text>

  <!-- Message labels -->
  <text x="184" y="168" fill="#e2e8f0" font-size="8">buildSendMessageRequest 组装 (:644)</text>
  <text x="320" y="244" fill="#e2e8f0" font-size="8" text-anchor="middle">message/send  (jsonrpc:2.0, method:message/send) :671</text>
  <text x="320" y="284" fill="#94a3b8" font-size="8" text-anchor="middle">autoDetectAndParseResponse 解析</text>
  <text x="320" y="352" fill="#22d3ee" font-size="8" text-anchor="middle">message/stream  (SSE 长连接) :714</text>
  <text x="320" y="392" fill="#94a3b8" font-size="8" text-anchor="middle">逐块 Flux 吐出</text>
  <text x="184" y="466" fill="#34d399" font-size="8">extractResponseText → return Map (:98)</text>

  <!-- Legend -->
  <rect x="60" y="482" width="14" height="10" rx="2" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1"/>
  <text x="80" y="491" fill="#94a3b8" font-size="8">本地</text>
  <rect x="140" y="482" width="14" height="10" rx="2" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1"/>
  <text x="160" y="491" fill="#94a3b8" font-size="8">远程</text>
  <text x="220" y="491" fill="#94a3b8" font-size="8">实线=请求  虚线=返回</text>
</svg>
