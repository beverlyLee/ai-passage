<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 440">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <marker id="arrow-emerald" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34d399"/>
    </marker>
    <marker id="arrow-rose" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#fb7185"/>
    </marker>
  </defs>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap');
    text { font-family: 'JetBrains Mono', 'Noto Sans SC', 'PingFang SC', sans-serif; }
  </style>

  <rect width="100%" height="100%" fill="#0f172a"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <text x="20" y="30" fill="#e2e8f0" font-size="15" font-weight="700">FlowGraphBuilder 建图与注册表：只认五种策略</text>
  <text x="20" y="48" fill="#94a3b8" font-size="9">FlowAgentEnum 有六个枚举，但 SUPERVISOR 没有对应策略类，运行期必炸</text>

  <!-- Arrows first -->
  <line x1="230" y1="160" x2="310" y2="160" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="410" y1="145" x2="560" y2="65" stroke="#34d399" stroke-width="1.2" marker-end="url(#arrow-emerald)"/>
  <line x1="410" y1="155" x2="560" y2="125" stroke="#34d399" stroke-width="1.2" marker-end="url(#arrow-emerald)"/>
  <line x1="410" y1="165" x2="560" y2="185" stroke="#34d399" stroke-width="1.2" marker-end="url(#arrow-emerald)"/>
  <line x1="410" y1="175" x2="560" y2="245" stroke="#34d399" stroke-width="1.2" marker-end="url(#arrow-emerald)"/>
  <line x1="410" y1="185" x2="560" y2="305" stroke="#34d399" stroke-width="1.2" marker-end="url(#arrow-emerald)"/>
  <line x1="410" y1="200" x2="410" y2="300" stroke="#fb7185" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrow-rose)"/>

  <!-- Box A: FlowGraphBuilder -->
  <rect x="40" y="120" width="190" height="80" rx="8" fill="#0f172a"/>
  <rect x="40" y="120" width="190" height="80" rx="8" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="135" y="146" fill="white" font-size="11" font-weight="600" text-anchor="middle">FlowGraphBuilder</text>
  <text x="135" y="164" fill="#94a3b8" font-size="8" text-anchor="middle">buildGraph(type, config) :46</text>
  <text x="135" y="180" fill="#94a3b8" font-size="8" text-anchor="middle">createStrategy→validate→buildGraph</text>

  <!-- Box B: Registry -->
  <rect x="310" y="120" width="200" height="80" rx="8" fill="#0f172a"/>
  <rect x="310" y="120" width="200" height="80" rx="8" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="410" y="146" fill="white" font-size="11" font-weight="600" text-anchor="middle">StrategyRegistry</text>
  <text x="410" y="164" fill="#94a3b8" font-size="8" text-anchor="middle">单例 :34，createStrategy :103</text>
  <text x="410" y="180" fill="#94a3b8" font-size="8" text-anchor="middle">registerDefaultStrategies 只注册 5 种 :163</text>

  <!-- 5 strategy boxes -->
  <rect x="560" y="40" width="170" height="50" rx="6" fill="#0f172a"/>
  <rect x="560" y="40" width="170" height="50" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="645" y="62" fill="white" font-size="11" font-weight="600" text-anchor="middle">SEQUENTIAL</text>
  <text x="645" y="80" fill="#94a3b8" font-size="8" text-anchor="middle">顺序编排 :164</text>

  <rect x="560" y="100" width="170" height="50" rx="6" fill="#0f172a"/>
  <rect x="560" y="100" width="170" height="50" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="645" y="122" fill="white" font-size="11" font-weight="600" text-anchor="middle">ROUTING</text>
  <text x="645" y="140" fill="#94a3b8" font-size="8" text-anchor="middle">路由编排 :165</text>

  <rect x="560" y="160" width="170" height="50" rx="6" fill="#0f172a"/>
  <rect x="560" y="160" width="170" height="50" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="645" y="182" fill="white" font-size="11" font-weight="600" text-anchor="middle">PARALLEL</text>
  <text x="645" y="200" fill="#94a3b8" font-size="8" text-anchor="middle">并行编排 :166</text>

  <rect x="560" y="220" width="170" height="50" rx="6" fill="#0f172a"/>
  <rect x="560" y="220" width="170" height="50" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="645" y="242" fill="white" font-size="11" font-weight="600" text-anchor="middle">CONDITIONAL</text>
  <text x="645" y="260" fill="#94a3b8" font-size="8" text-anchor="middle">条件编排 :167</text>

  <rect x="560" y="280" width="170" height="50" rx="6" fill="#0f172a"/>
  <rect x="560" y="280" width="170" height="50" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="645" y="302" fill="white" font-size="11" font-weight="600" text-anchor="middle">LOOP</text>
  <text x="645" y="320" fill="#94a3b8" font-size="8" text-anchor="middle">循环编排 :168</text>

  <!-- SUPERVISOR box -->
  <rect x="310" y="300" width="200" height="90" rx="8" fill="#0f172a"/>
  <rect x="310" y="300" width="200" height="90" rx="8" fill="rgba(136,19,55,0.4)" stroke="#fb7185" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="410" y="326" fill="white" font-size="11" font-weight="600" text-anchor="middle">SUPERVISOR 枚举存在 :20</text>
  <text x="410" y="344" fill="#94a3b8" font-size="8" text-anchor="middle">但无对应策略类</text>
  <text x="410" y="362" fill="#94a3b8" font-size="8" text-anchor="middle">注册表查不到 / 未注册</text>
  <text x="410" y="380" fill="#fb7185" font-size="8" text-anchor="middle">createStrategy 抛 IllegalArgumentException :110</text>

  <!-- Edge labels -->
  <text x="270" y="153" fill="#94a3b8" font-size="8" text-anchor="middle">buildGraph 调 createStrategy(type)</text>
  <text x="455" y="256" fill="#fb7185" font-size="8">type=SUPERVISOR 未注册</text>
</svg>
