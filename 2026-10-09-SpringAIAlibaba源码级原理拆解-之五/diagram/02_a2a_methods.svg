<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 580">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <marker id="arrow-cyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#22d3ee"/>
    </marker>
  </defs>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap');
    text { font-family: 'JetBrains Mono', 'Noto Sans SC', 'PingFang SC', sans-serif; }
  </style>

  <rect width="100%" height="100%" fill="#0f172a"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <text x="20" y="30" fill="#e2e8f0" font-size="15" font-weight="700">apply 的两路：streaming 决定 /send 还是 /stream</text>
  <text x="20" y="48" fill="#94a3b8" font-size="9">A2aNodeActionWithConfig.apply (:98) 分非流与流两条返回路径</text>

  <!-- Arrows first -->
  <line x1="350" y1="96" x2="350" y2="122" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="350" y1="198" x2="350" y2="230" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="350" y1="280" x2="350" y2="310" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="350" y1="360" x2="350" y2="390" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="350" y1="440" x2="350" y2="470" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- diamond right branch -->
  <line x1="405" y1="160" x2="470" y2="160" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="565" y1="210" x2="565" y2="470" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Start node -->
  <rect x="250" y="50" width="200" height="46" rx="23" fill="#0f172a"/>
  <rect x="250" y="50" width="200" height="46" rx="23" fill="rgba(59,130,246,0.3)" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="350" y="78" fill="white" font-size="11" font-weight="600" text-anchor="middle">apply 被调用 (:98)</text>

  <!-- Decision diamond -->
  <polygon points="350,122 405,160 350,198 295,160" fill="#0f172a"/>
  <polygon points="350,122 405,160 350,198 295,160" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="350" y="164" fill="white" font-size="10" font-weight="600" text-anchor="middle">是否走流式?</text>
  <text x="412" y="153" fill="#fb7185" font-size="8">是</text>
  <text x="338" y="216" fill="#34d399" font-size="8" text-anchor="end">否(主流)</text>

  <!-- No branch boxes (main path) -->
  <rect x="250" y="230" width="200" height="50" rx="6" fill="#0f172a"/>
  <rect x="250" y="230" width="200" height="50" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="350" y="252" fill="white" font-size="10" font-weight="600" text-anchor="middle">buildSendMessageRequest (:644)</text>
  <text x="350" y="268" fill="#94a3b8" font-size="8" text-anchor="middle">组装 JSON-RPC 请求体</text>

  <rect x="250" y="310" width="200" height="50" rx="6" fill="#0f172a"/>
  <rect x="250" y="310" width="200" height="50" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="350" y="332" fill="white" font-size="10" font-weight="600" text-anchor="middle">sendMessageToServer</text>
  <text x="350" y="348" fill="#94a3b8" font-size="8" text-anchor="middle">打到远程 :671 message/send</text>

  <rect x="250" y="390" width="200" height="50" rx="6" fill="#0f172a"/>
  <rect x="250" y="390" width="200" height="50" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="350" y="412" fill="white" font-size="10" font-weight="600" text-anchor="middle">autoDetectAndParseResponse</text>
  <text x="350" y="428" fill="#94a3b8" font-size="8" text-anchor="middle">解析 + extractResponseText 抽文本</text>

  <rect x="250" y="470" width="200" height="50" rx="23" fill="#0f172a"/>
  <rect x="250" y="470" width="200" height="50" rx="23" fill="rgba(59,130,246,0.3)" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="350" y="499" fill="white" font-size="10" font-weight="600" text-anchor="middle">return Map.of(outputKeyToParent, text) (:112)</text>

  <!-- Yes branch box -->
  <rect x="470" y="140" width="190" height="70" rx="6" fill="#0f172a"/>
  <rect x="470" y="140" width="190" height="70" rx="6" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="565" y="166" fill="white" font-size="10" font-weight="600" text-anchor="middle">buildSendStreamingMessageRequest (:687)</text>
  <text x="565" y="184" fill="#94a3b8" font-size="8" text-anchor="middle">+ createStreamingGenerator</text>
  <text x="565" y="200" fill="#94a3b8" font-size="8" text-anchor="middle">→ Flux 逐块吐 (SSE) :714</text>

  <rect x="470" y="470" width="190" height="70" rx="23" fill="#0f172a"/>
  <rect x="470" y="470" width="190" height="70" rx="23" fill="rgba(59,130,246,0.3)" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="565" y="499" fill="white" font-size="10" font-weight="600" text-anchor="middle">return Map.of(..., flux) (:104)</text>
  <text x="565" y="517" fill="#94a3b8" font-size="8" text-anchor="middle">流式返回，不取 outputKeyToParent</text>

  <text x="585" y="345" fill="#22d3ee" font-size="8" text-anchor="middle">SSE 逐块</text>
</svg>
