<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 450" width="680" height="450">
<defs>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;family=Noto+Sans+SC:wght@400;500;700&amp;display=swap');
text{font-family:'Noto Sans SC','JetBrains Mono',sans-serif;}
.mono{font-family:'JetBrains Mono','Noto Sans SC',monospace;}
</style>
</defs>
<rect width="680" height="450" fill="#0f172a"/>
<text x="24" y="32" font-size="18" font-weight="700" fill="#e2e8f0">主流视频生成单价（元 / 秒）</text>
<text x="24" y="52" font-size="11" fill="#94a3b8">按倍数等比（基准 35px = 1 元），2026-03~09 公开口径，落地以厂商最新报价为准</text>

<!-- 坐标轴 -->
<text x="150" y="84" font-size="10" fill="#64748b">0</text>
<line x1="160" y1="80" x2="160" y2="360" stroke="#334155" stroke-width="1.5"/>
<line x1="160" y1="360" x2="640" y2="360" stroke="#334155" stroke-width="1.5"/>
<text x="160" y="378" font-size="9" fill="#64748b">1元</text>
<line x1="195" y1="355" x2="195" y2="365" stroke="#475569"/>
<text x="195" y="378" font-size="9" fill="#64748b">2元</text>
<line x1="230" y1="355" x2="230" y2="365" stroke="#475569"/>
<text x="230" y="378" font-size="9" fill="#64748b">3元</text>
<line x1="265" y1="355" x2="265" y2="365" stroke="#475569"/>

<!-- Seedance ~1元 35px -->
<rect x="160" y="300" width="35" height="60" rx="3" fill="#22d3ee"/>
<text x="177" y="292" font-size="10" font-weight="700" fill="#a5f3fc" text-anchor="middle">~1.0</text>
<text x="177" y="384" font-size="10" fill="#e2e8f0" text-anchor="middle">Seedance 2.0</text>

<!-- Sora2 中值~1.5元 53px -->
<rect x="230" y="282" width="53" height="78" rx="3" fill="#fb7185"/>
<text x="256" y="274" font-size="10" font-weight="700" fill="#fda4af" text-anchor="middle">~1.5</text>
<text x="256" y="384" font-size="10" fill="#e2e8f0" text-anchor="middle">Sora 2</text>
<text x="256" y="402" font-size="8" fill="#94a3b8" text-anchor="middle">0.1–0.5 $/s</text>

<!-- Veo3 ~2.8元 98px -->
<rect x="320" y="232" width="98" height="128" rx="3" fill="#fbbf24"/>
<text x="369" y="224" font-size="10" font-weight="700" fill="#fde68a" text-anchor="middle">~2.8</text>
<text x="369" y="384" font-size="10" fill="#e2e8f0" text-anchor="middle">Veo 3</text>
<text x="369" y="402" font-size="8" fill="#94a3b8" text-anchor="middle">0.4 $/s</text>

<rect x="440" y="232" width="200" height="128" rx="6" fill="#1e293b" stroke="#334155"/>
<text x="454" y="254" font-size="11" font-weight="700" fill="#fbbf24" class="mono">成本公式</text>
<text x="454" y="276" font-size="10" fill="#e2e8f0" class="mono">单集 = 抽卡 × 单价 ×</text>
<text x="454" y="294" font-size="10" fill="#e2e8f0" class="mono">   (1 + 重抽率)</text>
<text x="454" y="318" font-size="10" fill="#fda4af">抽卡 ×10 不合格 → 成本翻 10 倍</text>
<text x="454" y="338" font-size="10" fill="#94a3b8">坑 3：无抽卡门禁，</text>
<text x="454" y="354" font-size="10" fill="#94a3b8">一部剧亏数万</text>

<rect x="24" y="412" width="632" height="26" rx="4" fill="#1e293b" stroke="#334155"/>
<text x="40" y="430" font-size="10" fill="#e2e8f0">Seedance 1.0 Pro ~3 元/15s，2.0 涨幅约 4.6 倍；价格随档位/分辨率浮动，条形取中值</text>
</svg>
