<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 450" width="680" height="450">
<defs>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;family=Noto+Sans+SC:wght@400;500;700&amp;display=swap');
text{font-family:'Noto Sans SC','JetBrains Mono',sans-serif;}
.mono{font-family:'JetBrains Mono','Noto Sans SC',monospace;}
</style>
</defs>
<rect width="680" height="450" fill="#0f172a"/>
<text x="24" y="32" font-size="18" font-weight="700" fill="#e2e8f0">身份锚定的四条路线</text>
<text x="24" y="52" font-size="11" fill="#94a3b8">从「碰运气」到「可复现」：seed 最弱，潜空间锁定 + 参考图版本管理最强</text>

<!-- 强度条 -->
<text x="24" y="78" font-size="10" fill="#64748b">强度 →</text>

<!-- 路线1 seed -->
<rect x="24" y="90" width="632" height="68" rx="8" fill="#1e293b" stroke="#334155"/>
<rect x="40" y="104" width="120" height="40" rx="4" fill="#3f1d29" stroke="#fb7185"/>
<text x="100" y="129" font-size="11" font-weight="700" fill="#fda4af" text-anchor="middle">seed 轨迹</text>
<text x="176" y="116" font-size="11" fill="#e2e8f0"><tspan font-weight="700" fill="#fb7185">弱</tspan> · 固定随机种子 + 同 prompt，期望复现同一主体</text>
<text x="176" y="136" font-size="10" fill="#94a3b8">镜头一变、prompt 一改，锚就断 —— 早期玩具做法</text>
<text x="624" y="129" font-size="9" fill="#64748b" text-anchor="end">代表：原生文生视频</text>

<!-- 路线2 embedding -->
<rect x="24" y="166" width="632" height="68" rx="8" fill="#1e293b" stroke="#334155"/>
<rect x="40" y="180" width="120" height="40" rx="4" fill="#3a2f12" stroke="#fbbf24"/>
<text x="100" y="205" font-size="11" font-weight="700" fill="#fde68a" text-anchor="middle">身份嵌入</text>
<text x="176" y="192" font-size="11" fill="#e2e8f0"><tspan font-weight="700" fill="#fbbf24">中</tspan> · CLIP / ArcFace 编码脸 → 注入交叉注意力</text>
<text x="176" y="212" font-size="10" fill="#94a3b8">单主体稳，多视角 / 复杂动作易散</text>
<text x="624" y="205" font-size="9" fill="#64748b" text-anchor="end">IP-Adapter · InstantID</text>

<!-- 路线3 频域分解 -->
<rect x="24" y="242" width="632" height="68" rx="8" fill="#1e293b" stroke="#334155"/>
<rect x="40" y="256" width="120" height="40" rx="4" fill="#14342a" stroke="#34d399"/>
<text x="100" y="281" font-size="11" font-weight="700" fill="#6ee7b7" text-anchor="middle">结构分解</text>
<text x="176" y="268" font-size="11" fill="#e2e8f0"><tspan font-weight="700" fill="#34d399">强</tspan> · 把身份从动作 / 背景解耦单独锁</text>
<text x="176" y="288" font-size="10" fill="#94a3b8">多视角、复杂动作也稳</text>
<text x="624" y="281" font-size="9" fill="#64748b" text-anchor="end">ConsisID · FantasyID</text>

<!-- 路线4 latent locking -->
<rect x="24" y="318" width="632" height="68" rx="8" fill="#1e293b" stroke="#334155"/>
<rect x="40" y="332" width="120" height="40" rx="4" fill="#0e3a3a" stroke="#22d3ee"/>
<text x="100" y="357" font-size="11" font-weight="700" fill="#a5f3fc" text-anchor="middle">潜空间锁定</text>
<text x="176" y="344" font-size="11" fill="#e2e8f0"><tspan font-weight="700" fill="#22d3ee">强</tspan> · 在 DiT / MMDiT 潜空间固定主体表示</text>
<text x="176" y="364" font-size="10" fill="#94a3b8">配合参考图版本管理，平台级方案（Seedance ~90% 可用率）</text>
<text x="624" y="357" font-size="9" fill="#64748b" text-anchor="end">平台级</text>

<rect x="24" y="398" width="632" height="34" rx="4" fill="#1e293b" stroke="#334155"/>
<text x="40" y="420" font-size="11" fill="#e2e8f0">坑 1：seed 不是身份锁，只做辅助复现；主锚必须显式编码身份</text>
</svg>
