<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 450" width="680" height="450">
<defs>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;family=Noto+Sans+SC:wght@400;500;700&amp;display=swap');
text{font-family:'Noto Sans SC','JetBrains Mono',sans-serif;}
.mono{font-family:'JetBrains Mono','Noto Sans SC',monospace;}
</style>
<marker id="ac" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#22d3ee"/></marker>
</defs>
<rect width="680" height="450" fill="#0f172a"/>
<text x="24" y="32" font-size="18" font-weight="700" fill="#e2e8f0">能出片 ≠ 能出连续剧</text>
<text x="24" y="52" font-size="11" fill="#94a3b8">模型只覆盖「单条出片」一小段，连续剧还需要一致性 / 成本 / 编排三条工业化能力</text>

<!-- 左：生成能力 -->
<rect x="24" y="68" width="300" height="310" rx="8" fill="#1e293b" stroke="#334155"/>
<text x="40" y="92" font-size="13" font-weight="700" fill="#fb7185">生成能力（单条出片）</text>
<text x="40" y="110" font-size="10" fill="#94a3b8">模型的训练目标止于此</text>

<rect x="40" y="124" width="268" height="40" rx="4" fill="#0f172a" stroke="#475569"/>
<text x="54" y="143" font-size="10" fill="#e2e8f0">prompt / 参考图</text>
<text x="296" y="148" font-size="9" fill="#64748b" text-anchor="end">输入</text>
<rect x="40" y="172" width="268" height="40" rx="4" fill="#0f172a" stroke="#fb7185"/>
<text x="54" y="191" font-size="10" fill="#fda4af">扩散采样 → 一条几秒~60s 视频</text>
<text x="296" y="196" font-size="9" fill="#64748b" text-anchor="end">模型全责</text>
<rect x="40" y="220" width="268" height="40" rx="4" fill="#0f172a" stroke="#475569"/>
<text x="54" y="239" font-size="10" fill="#e2e8f0">衡量：这一条好不好看</text>
<text x="296" y="244" font-size="9" fill="#64748b" text-anchor="end">单点指标</text>

<rect x="40" y="276" width="268" height="60" rx="4" fill="#3f1d29" stroke="#fb7185"/>
<text x="54" y="298" font-size="11" font-weight="700" fill="#fda4af">覆盖生产链 ≈ 10%</text>
<text x="54" y="318" font-size="10" fill="#fda4af">每次生成都是一次独立采样</text>
<text x="54" y="332" font-size="10" fill="#fda4af">无跨帧 / 跨集的状态</text>

<!-- 右：生产能力 -->
<rect x="344" y="68" width="312" height="310" rx="8" fill="#1e293b" stroke="#334155"/>
<text x="360" y="92" font-size="13" font-weight="700" fill="#34d399">生产能力（连续剧）</text>
<text x="360" y="110" font-size="10" fill="#94a3b8">ShortsCrew 全链路：213 部上线 / 日素材 28 万</text>

<rect x="360" y="124" width="280" height="48" rx="4" fill="#0f172a" stroke="#22d3ee"/>
<text x="374" y="143" font-size="10" fill="#a5f3fc">① 一致性约束：身份锚定 + 版本管理</text>
<text x="374" y="160" font-size="9" fill="#94a3b8">角色跨帧不塌，可用率 ~90%</text>
<rect x="360" y="180" width="280" height="48" rx="4" fill="#0f172a" stroke="#fbbf24"/>
<text x="374" y="199" font-size="10" fill="#fde68a">② 成本治理：抽卡门禁 + 多供应商</text>
<text x="374" y="216" font-size="9" fill="#94a3b8">一部剧不再因 300+ 抽卡亏数万</text>
<rect x="360" y="236" width="280" height="48" rx="4" fill="#0f172a" stroke="#34d399"/>
<text x="374" y="255" font-size="10" fill="#6ee7b7">③ 长程编排：剧本资产外置</text>
<text x="374" y="272" font-size="9" fill="#94a3b8">第 80 集查回第 3 集伏笔</text>

<rect x="360" y="294" width="280" height="56" rx="4" fill="#14342a" stroke="#34d399"/>
<text x="374" y="316" font-size="11" font-weight="700" fill="#6ee7b7">覆盖生产链 ≈ 90%</text>
<text x="374" y="334" font-size="10" fill="#6ee7b7">交付周期 -30% / 隐性成本 -25%</text>

<text x="360" y="372" font-size="10" fill="#64748b">破亿是这条产线的结果，不是某个模型的功劳</text>
<rect x="24" y="398" width="632" height="34" rx="4" fill="#1e293b" stroke="#334155"/>
<text x="40" y="420" font-size="11" fill="#e2e8f0">把「生成能力」误当「生产能力」= 用玩具级方式堆生产级需求，堆得越勤亏得越多</text>
</svg>
