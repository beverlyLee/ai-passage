<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 470">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <marker id="arrow-cyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#22d3ee"/>
    </marker>
    <marker id="arrow-emerald" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34d399"/>
    </marker>
    <style>
      text { font-family: 'JetBrains Mono', 'Noto Sans SC', 'PingFang SC', sans-serif; }
      .title { font-size:16px; font-weight:700; fill:#e2e8f0; }
      .box-title { font-size:11px; font-weight:600; fill:#ffffff; text-anchor:middle; }
      .box-sub { font-size:9px; fill:#94a3b8; text-anchor:middle; }
      .label { font-size:8px; fill:#94a3b8; }
      .note { font-size:8px; fill:#fb7185; }
      .end { font-size:11px; font-weight:600; fill:#e2e8f0; text-anchor:middle; }
      .region { font-size:9px; font-weight:600; fill:#fbbf24; }
      .hk { font-size:9px; fill:#94a3b8; text-anchor:middle; }
    </style>
  </defs>

  <rect width="100%" height="100%" fill="#0f172a"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <text x="30" y="34" class="title">ReactAgent 的图结构与节点组装</text>

  <!-- START -->
  <rect x="280" y="44" width="80" height="34" rx="17" fill="#0f172a"/>
  <rect x="280" y="44" width="80" height="34" rx="17" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="320" y="66" class="end">START</text>

  <!-- AgentLlmNode -->
  <rect x="210" y="120" width="220" height="64" rx="6" fill="#0f172a"/>
  <rect x="210" y="120" width="220" height="64" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="320" y="146" class="box-title">AgentLlmNode</text>
  <text x="320" y="162" class="box-sub">AGENT_MODEL_NAME :330</text>
  <text x="320" y="176" class="box-sub">生成含工具调用的消息 :64</text>

  <!-- AgentToolNode -->
  <rect x="210" y="250" width="220" height="64" rx="6" fill="#0f172a"/>
  <rect x="210" y="250" width="220" height="64" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="320" y="276" class="box-title">AgentToolNode</text>
  <text x="320" y="292" class="box-sub">AGENT_TOOL_NAME :332</text>
  <text x="320" y="306" class="box-sub">执行工具回写结果 :98</text>

  <!-- END -->
  <rect x="280" y="392" width="80" height="34" rx="17" fill="#0f172a"/>
  <rect x="280" y="392" width="80" height="34" rx="17" fill="rgba(136,19,55,0.4)" stroke="#fb7185" stroke-width="1.5"/>
  <text x="320" y="414" class="end">END</text>

  <!-- Hook region -->
  <rect x="450" y="40" width="170" height="92" rx="10" fill="none" stroke="#fbbf24" stroke-width="1" stroke-dasharray="8,4"/>
  <text x="462" y="58" class="region">Hook 插桩 (jump_to)</text>
  <rect x="466" y="66" width="138" height="26" rx="5" fill="#0f172a"/>
  <rect x="466" y="66" width="138" height="26" rx="5" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1"/>
  <text x="535" y="83" class="hk">beforeModel 钩子</text>
  <rect x="466" y="98" width="138" height="26" rx="5" fill="#0f172a"/>
  <rect x="466" y="98" width="138" height="26" rx="5" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1"/>
  <text x="535" y="115" class="hk">afterModel 钩子</text>

  <!-- arrows -->
  <line x1="320" y1="78" x2="320" y2="118" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrow-cyan)"/>
  <text x="330" y="102" class="label">addEdge(START,entryNode) :389/:395</text>

  <line x1="320" y1="184" x2="320" y2="248" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrow-cyan)"/>
  <text x="330" y="220" class="label">makeModelToTools :755/:715</text>
  <text x="150" y="222" class="note">hasToolCalls? → 工具 :789/:790</text>

  <path d="M 210 282 L 170 282 L 170 152 L 210 152" fill="none" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrow-emerald)"/>
  <text x="92" y="220" class="label">makeToolsToModelEdge :828/:718</text>
  <text x="86" y="236" class="label">回模型 :846</text>

  <path d="M 430 140 L 605 140 L 605 409 L 360 409" fill="none" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrow-cyan)"/>
  <text x="470" y="170" class="label">无工具调用 → endDestination :792</text>

  <!-- hook dashed connector -->
  <path d="M 450 150 C 430 150 430 152 430 152" fill="none" stroke="#fbbf24" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="455" y="205" class="note">before/afterModel 借 jump_to 在模型前后改道 :759/:676</text>
</svg>
