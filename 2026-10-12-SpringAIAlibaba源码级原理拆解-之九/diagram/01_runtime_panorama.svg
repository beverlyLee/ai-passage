<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 450" font-family="'JetBrains Mono','Noto Sans SC','PingFang SC',sans-serif">
  <defs>
    <pattern id="grid1" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0 L0 0 0 28" fill="none" stroke="#1e293b" stroke-width="1"/>
    </pattern>
    <marker id="arr1" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="680" height="450" fill="#0f172a"/>
  <rect width="680" height="450" fill="url(#grid1)"/>

  <text x="40" y="28" fill="#e2e8f0" font-size="15">运行时全景：从一次调用到多轮记忆，SAA 自写的就是这一层</text>

  <!-- Row 1: caller entry -->
  <rect x="80" y="48" width="520" height="58" rx="8" fill="rgba(34,211,238,0.12)" stroke="#22d3ee"/>
  <text x="100" y="72" fill="#e2e8f0" font-size="13">调用方入口</text>
  <text x="100" y="92" fill="#94a3b8" font-size="12">Agent.stream() / ReactAgent.call()  — 一条 API 进来</text>

  <!-- Row 2: builder -->
  <rect x="80" y="124" width="520" height="58" rx="8" fill="rgba(251,191,36,0.12)" stroke="#fbbf24"/>
  <text x="100" y="148" fill="#e2e8f0" font-size="13">DefaultBuilder.build()</text>
  <text x="100" y="168" fill="#94a3b8" font-size="12">装配 ChatClient + 模型节点 + 工具节点 + 钩子链（观察注册表默认 NOOP）</text>

  <!-- Row 3: compile once -->
  <rect x="80" y="200" width="520" height="58" rx="8" fill="rgba(167,139,250,0.12)" stroke="#a78bfa"/>
  <text x="100" y="224" fill="#e2e8f0" font-size="13">getAndCompileGraph()</text>
  <text x="100" y="244" fill="#94a3b8" font-size="12">编译一次并缓存 CompiledGraph（synchronized，graph.compile()）</text>

  <!-- Row 4: two nodes -->
  <rect x="80" y="284" width="250" height="78" rx="8" fill="rgba(52,211,153,0.12)" stroke="#34d399"/>
  <text x="100" y="308" fill="#e2e8f0" font-size="13">AgentLlmNode</text>
  <text x="100" y="328" fill="#94a3b8" font-size="12">模型节点：流式产出</text>
  <text x="100" y="346" fill="#94a3b8" font-size="12">Flux&lt;ChatResponse&gt; → messages</text>

  <rect x="350" y="284" width="250" height="78" rx="8" fill="rgba(52,211,153,0.12)" stroke="#34d399"/>
  <text x="370" y="308" fill="#e2e8f0" font-size="13">AgentToolNode</text>
  <text x="370" y="328" fill="#94a3b8" font-size="12">工具节点：结果回流</text>
  <text x="370" y="346" fill="#94a3b8" font-size="12">ToolResponseMessage → messages</text>

  <!-- Row 5: handoff -->
  <rect x="80" y="384" width="520" height="50" rx="8" fill="rgba(34,211,238,0.12)" stroke="#22d3ee"/>
  <text x="100" y="408" fill="#e2e8f0" font-size="13">Flux&lt;Message&gt; 逐字流出 ＋ getCurrentState 交还 OverAllState（多轮记忆）</text>
  <text x="100" y="424" fill="#94a3b8" font-size="11">memory = 按 threadId 取回的 messages 整表，不是摘要</text>

  <!-- arrows -->
  <line x1="340" y1="106" x2="340" y2="122" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr1)"/>
  <line x1="340" y1="182" x2="340" y2="198" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr1)"/>
  <line x1="205" y1="258" x2="205" y2="282" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr1)"/>
  <line x1="330" y1="323" x2="349" y2="323" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr1)"/>
  <path d="M475 362 C 475 380, 205 380, 205 362" fill="none" stroke="#fb7185" stroke-width="1.5" marker-end="url(#arr1)"/>
  <text x="300" y="376" fill="#fb7185" font-size="11">ReAct 循环</text>
  <line x1="475" y1="362" x2="475" y2="383" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr1)"/>
</svg>
