<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 450" width="680" height="450">
  <rect x="0" y="0" width="680" height="450" fill="#0f172a"/>
  <line x1="0" y1="60" x2="680" y2="60" stroke="#1e293b" stroke-width="1"/>

  <text x="28" y="38" fill="#e2e8f0" font-family="'JetBrains Mono','Noto Sans SC',monospace" font-size="18">条件边：路由结果不是写状态，而是选下一步</text>

  <!-- START -->
  <rect x="30" y="86" width="84" height="38" rx="8" fill="#0b1f33" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="72" y="110" fill="#fbbf24" font-family="'JetBrains Mono',monospace" font-size="14" text-anchor="middle">START</text>

  <line x1="72" y1="124" x2="72" y2="146" stroke="#34d399" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <!-- classify -->
  <rect x="28" y="146" width="220" height="66" rx="10" fill="#13251c" stroke="#34d399" stroke-width="1.5"/>
  <text x="44" y="172" fill="#6ee7b7" font-family="'JetBrains Mono',monospace" font-size="14">classify 节点</text>
  <text x="44" y="192" fill="#94a3b8" font-family="'Noto Sans SC',sans-serif" font-size="12">写 category = "billing" / "tech"</text>
  <text x="44" y="208" fill="#64748b" font-family="'Noto Sans SC',sans-serif" font-size="11">节点只写状态，不做路由判断</text>

  <line x1="138" y1="212" x2="138" y2="236" stroke="#34d399" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <!-- router -->
  <rect x="28" y="236" width="320" height="78" rx="10" fill="#13251c" stroke="#34d399" stroke-width="1.5"/>
  <text x="44" y="262" fill="#6ee7b7" font-family="'JetBrains Mono',monospace" font-size="14">AsyncEdgeAction&lt;MyState&gt;</text>
  <text x="44" y="282" fill="#cbd5e1" font-family="'JetBrains Mono',monospace" font-size="12">s -&gt; s.value("category")  // 返回 String</text>
  <text x="44" y="302" fill="#64748b" font-family="'Noto Sans SC',sans-serif" font-size="11">返回值就是「下一步节点 id」，不是状态更新</text>

  <line x1="188" y1="314" x2="188" y2="338" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrowPurple)"/>

  <!-- mapping -->
  <rect x="28" y="338" width="380" height="62" rx="10" fill="#241c33" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="44" y="364" fill="#c4b5fd" font-family="'JetBrains Mono',monospace" font-size="13">Map.of("billing" -&gt; "billingHandler",</text>
  <text x="44" y="386" fill="#c4b5fd" font-family="'JetBrains Mono',monospace" font-size="13">       "tech"    -&gt; "techSubgraph")</text>

  <!-- 两个目标节点 -->
  <rect x="452" y="330" width="200" height="44" rx="8" fill="#13251c" stroke="#34d399" stroke-width="1.5"/>
  <text x="552" y="357" fill="#6ee7b7" font-family="'JetBrains Mono',monospace" font-size="13" text-anchor="middle">billingHandler</text>

  <rect x="452" y="386" width="200" height="44" rx="8" fill="#13251c" stroke="#34d399" stroke-width="1.5"/>
  <text x="552" y="413" fill="#6ee7b7" font-family="'JetBrains Mono',monospace" font-size="13" text-anchor="middle">techSubgraph</text>

  <line x1="408" y1="358" x2="448" y2="352" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrowPurple)"/>
  <line x1="408" y1="386" x2="448" y2="408" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrowPurple)"/>

  <text x="28" y="430" fill="#fbbf24" font-family="'Noto Sans SC',sans-serif" font-size="11">router 只决定「去哪个节点」，mapping 把它的返回值翻译成真实节点 id；两端任一缺失都会编译或运行期报错。</text>

  <defs>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#34d399"/>
    </marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#a78bfa"/>
    </marker>
  </defs>
</svg>
