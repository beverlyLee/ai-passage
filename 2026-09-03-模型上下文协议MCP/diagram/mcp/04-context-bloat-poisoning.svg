<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 450">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;family=Noto+Sans+SC:wght@400;500;700&amp;display=swap');
    text { font-family: 'JetBrains Mono','Noto Sans SC','PingFang SC',sans-serif; }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#64748b"/></marker>
    <marker id="arrow-rose" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#fb7185"/></marker>
    <marker id="arrow-amber" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#fbbf24"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#0f172a"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <text x="20" y="30" fill="#e2e8f0" font-size="15" font-weight="700">图4 · 两个最隐蔽的坑：上下文膨胀 + 工具投毒</text>
  <text x="20" y="48" fill="#94a3b8" font-size="9.5">一个拖慢模型，一个偷走数据 —— 两者都"看起来能用"，上线后才爆发</text>

  <!-- LEFT: context bloat -->
  <rect x="20" y="66" width="320" height="340" rx="10" fill="rgba(120,53,15,0.12)" stroke="#fbbf24" stroke-width="1.4"/>
  <text x="36" y="90" fill="#fbbf24" font-size="12" font-weight="700">① 上下文膨胀（Context Bloat）</text>

  <!-- window budget bar -->
  <text x="36" y="116" fill="#94a3b8" font-size="9">context window 预算：</text>
  <rect x="36" y="124" width="288" height="20" rx="4" fill="rgba(30,41,59,0.6)" stroke="#475569" stroke-width="1"/>
  <rect x="36" y="124" width="220" height="20" rx="4" fill="rgba(251,191,36,0.35)" stroke="#fbbf24" stroke-width="1"/>
  <text x="44" y="139" fill="#fde68a" font-size="8">tool 描述占掉大半 → 真正对话空间被挤</text>

  <rect x="36" y="160" width="288" height="232" rx="6" fill="rgba(30,41,59,0.4)" stroke="#475569" stroke-width="1"/>
  <text x="50" y="182" fill="#fde68a" font-size="10" font-weight="600">机制：每个 tool 描述都注入 context</text>
  <text x="50" y="202" fill="#94a3b8" font-size="9">· 多数 client 上限 ≈ 40 tools</text>
  <text x="50" y="220" fill="#94a3b8" font-size="9">· 装到第 6 个 server 后明显变慢</text>
  <text x="50" y="240" fill="#94a3b8" font-size="9">· 反模式：API mirror</text>
  <text x="50" y="252" fill="#fb7185" font-size="8.5">  47 个 endpoint → 映射 47 个 tool</text>
  <text x="50" y="274" fill="#34d399" font-size="9" font-weight="600">正解：workflow-based tools</text>
  <text x="50" y="286" fill="#94a3b8" font-size="8.5">  合并成 investigate_customer_issue</text>
  <text x="50" y="308" fill="#94a3b8" font-size="8.5">· 惰性发现 lazy discovery 降本 92%</text>
  <text x="50" y="330" fill="#94a3b8" font-size="8.5">· 返回 bounded data，别把整张表</text>
  <text x="50" y="342" fill="#94a3b8" font-size="8.5">  塞进结果</text>
  <text x="50" y="366" fill="#fbbf24" font-size="8.5" font-weight="600">Vercel：去工具后准确率 80%→100%</text>

  <!-- RIGHT: tool poisoning -->
  <rect x="348" y="66" width="312" height="340" rx="10" fill="rgba(136,19,55,0.12)" stroke="#fb7185" stroke-width="1.4"/>
  <text x="364" y="90" fill="#fb7185" font-size="12" font-weight="700">② 工具投毒（Tool Poisoning）</text>

  <rect x="364" y="104" width="280" height="40" rx="6" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.3"/>
  <text x="504" y="124" fill="#fff" font-size="10" text-anchor="middle" font-weight="600">tool description 字段</text>
  <text x="504" y="140" fill="#c4b5fd" font-size="8" text-anchor="middle">（模型读取，当指令执行）</text>

  <line x1="504" y1="144" x2="504" y2="178" stroke="#fb7185" stroke-width="1.4" marker-end="url(#arrow-rose)"/>
  <text x="588" y="165" fill="#fb7185" font-size="8.5" text-anchor="end">藏恶意指令</text>

  <rect x="364" y="182" width="280" height="216" rx="6" fill="rgba(30,41,59,0.4)" stroke="#475569" stroke-width="1"/>
  <text x="378" y="204" fill="#fecdd3" font-size="10" font-weight="600">攻击面（已实测）：</text>
  <text x="378" y="224" fill="#94a3b8" font-size="9">· Cornell：1899 个开源 server</text>
  <text x="378" y="236" fill="#94a3b8" font-size="9">  中 5.5% 存在投毒漏洞</text>
  <text x="378" y="256" fill="#94a3b8" font-size="9">· Knostic：1862 个暴露 server</text>
  <text x="378" y="268" fill="#fb7185" font-size="9" font-weight="600">  100% 无认证</text>
  <text x="378" y="288" fill="#94a3b8" font-size="9">· GitHub MCP 经 public issue</text>
  <text x="378" y="300" fill="#94a3b8" font-size="9">  泄露 private repo</text>
  <text x="378" y="320" fill="#fbbf24" font-size="9" font-weight="600">lethal trifecta：</text>
  <text x="378" y="332" fill="#94a3b8" font-size="8.5">私有数据 + 不可信内容</text>
  <text x="378" y="344" fill="#94a3b8" font-size="8.5">+ 对外通道 = 灾难</text>
  <text x="378" y="368" fill="#94a3b8" font-size="8.5">防御：不可信输入视为</text>
  <text x="378" y="380" fill="#94a3b8" font-size="8.5">ToolDef/Args/Result 全不可信</text>
</svg>
