<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 450">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;family=Noto+Sans+SC:wght@400;500;700&amp;display=swap');
    text { font-family: 'JetBrains Mono','Noto Sans SC','PingFang SC',sans-serif; }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#64748b"/></marker>
    <marker id="arrow-cyan" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#22d3ee"/></marker>
    <marker id="arrow-rose" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#fb7185"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#0f172a"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <text x="20" y="30" fill="#e2e8f0" font-size="15" font-weight="700">图3 · Streamable HTTP：单 POST 端点，JSON 或 SSE 二选一</text>
  <text x="20" y="48" fill="#94a3b8" font-size="9.5">2025-03-26 引入、2026-07-28 旧 HTTP+SSE 正式弃用；生产远程部署的默认 transport</text>

  <!-- Client -->
  <rect x="30" y="80" width="150" height="48" rx="8" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="105" y="110" fill="#fff" font-size="12" font-weight="600" text-anchor="middle">MCP Client</text>

  <!-- Server -->
  <rect x="500" y="80" width="150" height="48" rx="8" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="575" y="110" fill="#fff" font-size="12" font-weight="600" text-anchor="middle">MCP Server</text>

  <!-- request arrow -->
  <line x1="180" y1="104" x2="500" y2="104" stroke="#22d3ee" stroke-width="1.6" marker-end="url(#arrow-cyan)"/>
  <text x="340" y="98" fill="#e2e8f0" font-size="9.5" text-anchor="middle">POST /mcp  (Accept: application/json, text/event-stream)</text>

  <!-- request headers box -->
  <rect x="190" y="128" width="300" height="92" rx="6" fill="rgba(30,41,59,0.4)" stroke="#475569" stroke-width="1"/>
  <text x="204" y="148" fill="#7dd3fc" font-size="9" font-weight="600">请求头（必带 / 易错点）：</text>
  <text x="204" y="166" fill="#94a3b8" font-size="8.5">Origin: https://app.example.com   ← 校验失败回 403（防 DNS rebinding）</text>
  <text x="204" y="182" fill="#94a3b8" font-size="8.5">Mcp-Method: tools/call            ← 网关按它路由</text>
  <text x="204" y="198" fill="#94a3b8" font-size="8.5">Mcp-Name: github                  ← 网关按它路由</text>
  <text x="204" y="212" fill="#94a3b8" font-size="8.5">X-Accel-Buffering: no            ← 防代理缓冲 SSE</text>

  <!-- response arrow -->
  <line x1="500" y1="240" x2="180" y2="240" stroke="#22d3ee" stroke-width="1.6" marker-end="url(#arrow-cyan)"/>
  <text x="340" y="234" fill="#e2e8f0" font-size="9.5" text-anchor="middle">响应：Content-Type: application/json  或  text/event-stream</text>

  <!-- response detail -->
  <rect x="190" y="258" width="300" height="56" rx="6" fill="rgba(6,78,59,0.16)" stroke="#34d399" stroke-width="1"/>
  <text x="204" y="278" fill="#a7f3d0" font-size="9" font-weight="600">两种返回：</text>
  <text x="204" y="296" fill="#94a3b8" font-size="8.5">① JSON：一次性结果  ② SSE 流：多事件 + 进度</text>
  <text x="204" y="310" fill="#94a3b8" font-size="8.5">关闭流 = 取消请求（无需额外 cancel 帧）</text>

  <!-- removed box -->
  <rect x="20" y="338" width="640" height="92" rx="8" fill="rgba(136,19,55,0.14)" stroke="#fb7185" stroke-width="1.3"/>
  <text x="36" y="360" fill="#fb7185" font-size="11" font-weight="700">已移除（别再依赖）：</text>
  <text x="36" y="382" fill="#fecdd3" font-size="9">✗ GET 长连 stream   ✗ 可恢复 SSE（resumable）   ✗ Last-Event-ID 重连</text>
  <text x="36" y="400" fill="#94a3b8" font-size="9">断流后用"新 request id"重新发起；旧 HTTP+SSE transport 已 Deprecated。</text>
  <text x="36" y="420" fill="#fbbf24" font-size="9" font-weight="600">工程含义：网关 / LB / 容器要按 Mcp-Method+Mcp-Name 路由，且对 Origin 做白名单校验。</text>
</svg>
