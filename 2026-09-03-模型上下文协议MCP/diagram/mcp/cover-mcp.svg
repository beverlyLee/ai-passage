<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40" fill="none" stroke="#1e293b" stroke-width="1"/>
    </pattern>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="#0f172a"/>
  <rect width="1600" height="900" fill="url(#grid)"/>

  <!-- Title -->
  <text x="120" y="155" font-size="62" font-weight="700" fill="#f8fafc">你的 Agent 为什么</text>
  <text x="120" y="232" font-size="62" font-weight="700" fill="#f8fafc">接不进一个日历？</text>
  <text x="122" y="292" font-size="30" font-weight="600" fill="#22d3ee">一篇讲透 MCP —— AI 世界的「USB-C」</text>

  <!-- Agent node (left) -->
  <rect x="120" y="430" width="210" height="120" rx="16" fill="#1e293b" stroke="#22d3ee" stroke-width="3"/>
  <text x="225" y="478" font-size="26" font-weight="700" fill="#f8fafc" text-anchor="middle">你的 Agent</text>
  <text x="225" y="514" font-size="20" fill="#94a3b8" text-anchor="middle">AI 应用 / Host</text>

  <!-- cable -->
  <line x1="330" y1="490" x2="618" y2="490" stroke="#22d3ee" stroke-width="6"/>

  <!-- USB-C shell (hero) -->
  <rect x="618" y="430" width="364" height="120" rx="60" fill="#1e293b" stroke="url(#accent)" stroke-width="5"/>
  <ellipse cx="800" cy="490" rx="150" ry="34" fill="#0f172a" stroke="#22d3ee" stroke-width="3"/>
  <rect x="728" y="480" width="144" height="20" rx="10" fill="#334155"/>
  <text x="800" y="600" font-size="24" font-weight="600" fill="#a78bfa" text-anchor="middle">即插即用 · 标准化接口</text>
  <text x="800" y="412" font-size="22" font-weight="700" fill="#f8fafc" text-anchor="middle">MCP</text>

  <!-- device chips (right) -->
  <g font-size="22" font-weight="600" fill="#f8fafc" text-anchor="middle">
    <line x1="982" y1="490" x2="1080" y2="372" stroke="#475569" stroke-width="3"/>
    <line x1="982" y1="490" x2="1080" y2="452" stroke="#475569" stroke-width="3"/>
    <line x1="982" y1="490" x2="1080" y2="532" stroke="#475569" stroke-width="3"/>
    <line x1="982" y1="490" x2="1080" y2="612" stroke="#475569" stroke-width="3"/>

    <rect x="1080" y="342" width="190" height="60" rx="12" fill="#1e293b" stroke="#34d399" stroke-width="2.5"/>
    <text x="1175" y="378">数据库</text>

    <rect x="1080" y="422" width="190" height="60" rx="12" fill="#1e293b" stroke="#34d399" stroke-width="2.5"/>
    <text x="1175" y="458">日历</text>

    <rect x="1080" y="502" width="190" height="60" rx="12" fill="#1e293b" stroke="#34d399" stroke-width="2.5"/>
    <text x="1175" y="538">Slack</text>

    <rect x="1080" y="582" width="190" height="60" rx="12" fill="#1e293b" stroke="#34d399" stroke-width="2.5"/>
    <text x="1175" y="618">内部 API</text>
  </g>

  <!-- badge -->
  <text x="122" y="828" font-size="24" fill="#94a3b8">问题开场 · 原理拆解 · 5 张手绘原理图</text>
</svg>
