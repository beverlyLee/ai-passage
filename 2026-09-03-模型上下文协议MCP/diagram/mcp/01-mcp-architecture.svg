<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 450">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;family=Noto+Sans+SC:wght@400;500;700&amp;display=swap');
    text { font-family: 'JetBrains Mono','Noto Sans SC','PingFang SC',sans-serif; }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#64748b"/></marker>
    <marker id="arrow-cyan" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#22d3ee"/></marker>
    <marker id="arrow-rose" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#fb7185"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#0f172a"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <text x="20" y="30" fill="#e2e8f0" font-size="15" font-weight="700">图1 · MCP 三角色架构：把 N×M 接成 N+M</text>
  <text x="20" y="48" fill="#94a3b8" font-size="9.5">"AI 的 USB-C"：Host 管 Client，Client 与 Server 1:1；2026-07-28 起会话无状态化</text>

  <!-- faded legacy N×M mesh -->
  <g stroke="#fb7185" stroke-width="0.8" stroke-opacity="0.35">
    <line x1="150" y1="95" x2="430" y2="120"/>
    <line x1="150" y1="200" x2="430" y2="120"/>
    <line x1="150" y1="305" x2="430" y2="120"/>
    <line x1="150" y1="95" x2="430" y2="300"/>
    <line x1="150" y1="200" x2="430" y2="300"/>
    <line x1="150" y1="305" x2="430" y2="300"/>
  </g>

  <!-- Agents (left) -->
  <g>
    <rect x="30" y="74" width="120" height="42" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.4"/>
    <text x="90" y="100" fill="#fff" font-size="12" font-weight="600" text-anchor="middle">Claude</text>
    <rect x="30" y="184" width="120" height="42" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.4"/>
    <text x="90" y="210" fill="#fff" font-size="12" font-weight="600" text-anchor="middle">Cursor</text>
    <rect x="30" y="294" width="120" height="42" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.4"/>
    <text x="90" y="320" fill="#fff" font-size="12" font-weight="600" text-anchor="middle">自研 Agent</text>
  </g>

  <!-- MCP hub -->
  <rect x="300" y="108" width="84" height="120" rx="10" fill="rgba(59,130,246,0.25)" stroke="#60a5fa" stroke-width="1.8"/>
  <text x="342" y="150" fill="#fff" font-size="13" font-weight="700" text-anchor="middle">MCP</text>
  <text x="342" y="170" fill="#bfdbfe" font-size="9" text-anchor="middle">标准协议</text>
  <text x="342" y="184" fill="#bfdbfe" font-size="8" text-anchor="middle">JSON-RPC 2.0</text>
  <text x="342" y="200" fill="#bfdbfe" font-size="8" text-anchor="middle">Tools/Res/Prompts</text>
  <text x="342" y="216" fill="#60a5fa" font-size="7.5" text-anchor="middle">USB-C for AI</text>

  <!-- Systems (right) -->
  <g>
    <rect x="530" y="74" width="120" height="42" rx="6" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.4"/>
    <text x="590" y="100" fill="#fff" font-size="11" font-weight="600" text-anchor="middle">PostgreSQL</text>
    <rect x="530" y="140" width="120" height="42" rx="6" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.4"/>
    <text x="590" y="166" fill="#fff" font-size="11" font-weight="600" text-anchor="middle">GitHub</text>
    <rect x="530" y="206" width="120" height="42" rx="6" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.4"/>
    <text x="590" y="232" fill="#fff" font-size="11" font-weight="600" text-anchor="middle">Slack</text>
    <rect x="530" y="272" width="120" height="42" rx="6" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.4"/>
    <text x="590" y="298" fill="#fff" font-size="11" font-weight="600" text-anchor="middle">内部 API</text>
  </g>

  <!-- clean edges agent->hub -->
  <line x1="150" y1="95" x2="300" y2="150" stroke="#22d3ee" stroke-width="1.6" marker-end="url(#arrow-cyan)"/>
  <line x1="150" y1="205" x2="300" y2="168" stroke="#22d3ee" stroke-width="1.6" marker-end="url(#arrow-cyan)"/>
  <line x1="150" y1="315" x2="300" y2="186" stroke="#22d3ee" stroke-width="1.6" marker-end="url(#arrow-cyan)"/>
  <!-- hub->systems -->
  <line x1="384" y1="150" x2="530" y2="95" stroke="#22d3ee" stroke-width="1.6" marker-end="url(#arrow-cyan)"/>
  <line x1="384" y1="168" x2="530" y2="161" stroke="#22d3ee" stroke-width="1.6" marker-end="url(#arrow-cyan)"/>
  <line x1="384" y1="186" x2="530" y2="227" stroke="#22d3ee" stroke-width="1.6" marker-end="url(#arrow-cyan)"/>
  <line x1="384" y1="200" x2="530" y2="293" stroke="#22d3ee" stroke-width="1.6" marker-end="url(#arrow-cyan)"/>

  <!-- legacy label -->
  <text x="290" y="135" fill="#fb7185" font-size="9" font-weight="600" text-anchor="middle" transform="rotate(-32 290 135)">旧 N×M 套 glue</text>

  <!-- bottom annotation -->
  <rect x="20" y="350" width="640" height="80" rx="8" fill="rgba(30,41,59,0.4)" stroke="#475569" stroke-width="1"/>
  <text x="36" y="372" fill="#e2e8f0" font-size="11" font-weight="600">关键：MCP 只标准化"连得上 / 被发现 / 能隔离"，不规定上层怎么用 LLM。</text>
  <text x="36" y="392" fill="#94a3b8" font-size="9.5">· Host 承载模型 + 权限/生命周期；每个 Client 与 1 个 Server 1:1 连接（可本地 stdio，也可远程 HTTP）。</text>
  <text x="36" y="412" fill="#94a3b8" font-size="9.5">· 2026-07-28 修订：移除 initialize 握手与 Mcp-Session-Id，改为无状态——每请求自带 version/info/capabilities。</text>
</svg>
