<svg viewBox="0 0 680 450" font-family="Noto Sans SC, sans-serif" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="680" height="450" fill="#0f172a"/>
  <g stroke="#1e293b" stroke-width="1">
    <line x1="90" y1="150" x2="450" y2="150"/>
    <line x1="90" y1="280" x2="450" y2="280"/>
    <line x1="90" y1="410" x2="450" y2="410"/>
  </g>

  <text x="24" y="30" fill="#e2e8f0" font-size="16" font-weight="700">图3 同一道题：effort 越高，隐藏思考越多，账单越贵（示意推演）</text>

  <!-- Y 轴 -->
  <line x1="90" y1="150" x2="90" y2="410" stroke="#475569" stroke-width="1.5"/>
  <text x="34" y="285" fill="#94a3b8" font-size="12" text-anchor="middle" transform="rotate(-90 34 285)">计费输出 token（越长越贵）</text>

  <!-- low effort 组 -->
  <rect x="110" y="400" width="70" height="10" fill="#fb7185"/>
  <rect x="110" y="395" width="70" height="5" fill="#22d3ee"/>
  <text x="145" y="388" fill="#cbd5e1" font-size="12" text-anchor="middle">计费 532</text>
  <text x="145" y="430" fill="#cbd5e1" font-size="12" text-anchor="middle">low effort</text>

  <!-- high effort 组 -->
  <rect x="330" y="159" width="70" height="251" fill="#fb7185"/>
  <rect x="330" y="150" width="70" height="9" fill="#22d3ee"/>
  <text x="365" y="142" fill="#cbd5e1" font-size="12" text-anchor="middle">计费 9389</text>
  <text x="365" y="430" fill="#cbd5e1" font-size="12" text-anchor="middle">high effort</text>

  <!-- 倍数标注 -->
  <text x="290" y="300" fill="#fb7185" font-size="22" font-weight="700" text-anchor="middle">≈ 11.6× (示意)</text>
  <line x1="270" y1="306" x2="328" y2="306" stroke="#fb7185" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- 右侧说明 -->
  <rect x="470" y="150" width="186" height="200" rx="8" fill="#0b1220" stroke="#334155" stroke-width="1.5"/>
  <text x="486" y="178" fill="#e2e8f0" font-size="12" font-weight="700">o3 · 单题输入~1200 token</text>
  <text x="486" y="206" fill="#cbd5e1" font-size="12">low 账单  $0.0067</text>
  <text x="486" y="230" fill="#fecdd3" font-size="12">high 账单 $0.0775</text>
  <text x="486" y="256" fill="#fb7185" font-size="13" font-weight="700">≈ 11.6× 更贵</text>
  <line x1="486" y1="270" x2="640" y2="270" stroke="#334155"/>
  <text x="486" y="294" fill="#94a3b8" font-size="11">你看到的回答长度：</text>
  <text x="486" y="314" fill="#cbd5e1" font-size="12">183 → 339 token</text>
  <text x="486" y="336" fill="#94a3b8" font-size="11">几乎没变，钱却翻 11 倍</text>
</svg>
