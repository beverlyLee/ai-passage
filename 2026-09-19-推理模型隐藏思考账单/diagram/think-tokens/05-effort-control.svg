<svg viewBox="0 0 680 450" font-family="Noto Sans SC, sans-serif" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="680" height="450" fill="#0f172a"/>
  <g stroke="#1e293b" stroke-width="1">
    <line x1="0" y1="44" x2="680" y2="44"/>
    <line x1="0" y1="216" x2="680" y2="216"/>
  </g>

  <text x="24" y="30" fill="#e2e8f0" font-size="16" font-weight="700">图5 你能控制的只是「旋钮」：effort/budget，而非思考内容</text>

  <!-- OpenAI 三档 -->
  <rect x="24" y="56" width="300" height="142" rx="8" fill="#1e293b" stroke="#22d3ee" stroke-width="2"/>
  <text x="40" y="80" fill="#22d3ee" font-size="14" font-weight="700">OpenAI o-series：reasoning_effort</text>
  <rect x="40" y="92" width="268" height="28" rx="5" fill="#0b1220" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="52" y="111" fill="#cbd5e1" font-size="12">low：思考最短（~400 隐藏 token）</text>
  <rect x="40" y="124" width="268" height="28" rx="5" fill="#0b1220" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="52" y="143" fill="#cbd5e1" font-size="12">medium：思考中等（~2000）</text>
  <rect x="40" y="156" width="268" height="28" rx="5" fill="#3b2a10" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="52" y="175" fill="#fde68a" font-size="12">high：思考最长（~8000）</text>

  <line x1="324" y1="127" x2="354" y2="127" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/>

  <!-- Anthropic budget -->
  <rect x="358" y="56" width="298" height="142" rx="8" fill="#1e293b" stroke="#22d3ee" stroke-width="2"/>
  <text x="374" y="80" fill="#22d3ee" font-size="14" font-weight="700">Anthropic：budget_tokens</text>
  <text x="374" y="100" fill="#cbd5e1" font-size="12">只能设定「思考上限」，不能写步骤</text>
  <rect x="374" y="116" width="262" height="10" rx="5" fill="#334155"/>
  <rect x="374" y="116" width="96" height="10" rx="5" fill="#22d3ee"/>
  <text x="374" y="148" fill="#cbd5e1" font-size="12">budget_tokens = 1024（示意）</text>
  <text x="374" y="170" fill="#94a3b8" font-size="11">超上限被截断；设太低则想不透</text>

  <!-- 误用场景 -->
  <rect x="24" y="226" width="632" height="194" rx="8" fill="#0b1220" stroke="#334155" stroke-width="1.5"/>
  <text x="40" y="252" fill="#fb7185" font-size="15" font-weight="700">简单题误用推理模型 = 把旋钮开到 high 还白耗</text>

  <rect x="40" y="268" width="596" height="46" rx="6" fill="#1e293b" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="56" y="290" fill="#cbd5e1" font-size="13" font-weight="700">① 场景：拿 o3-high 去算「1+1」/ 格式化 JSON / 一句话解释</text>
  <text x="56" y="308" fill="#94a3b8" font-size="11">这些事普通模型零思考就能对，推理模型却先绕一大圈</text>

  <rect x="40" y="320" width="596" height="38" rx="6" fill="#3b1d24" stroke="#fb7185" stroke-width="1.5"/>
  <text x="56" y="344" fill="#fecdd3" font-size="13">② 结果：隐藏思考 8000+ token · 账单翻 ~11× · 准确率没更好（见脚本 02）</text>

  <rect x="40" y="364" width="596" height="38" rx="6" fill="#1e293b" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="56" y="388" fill="#cbd5e1" font-size="13">③ 正确做法：按复杂度选 effort，低复杂度直接走普通对话模型</text>
</svg>
