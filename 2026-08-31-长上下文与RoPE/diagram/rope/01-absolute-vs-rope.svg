<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 450">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;family=Noto+Sans+SC:wght@400;500;700&amp;display=swap');
    text { font-family: 'JetBrains Mono','Noto Sans SC','PingFang SC',sans-serif; }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/></marker>
    <marker id="arrow-rose" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#fb7185"/></marker>
    <marker id="arrow-amber" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#fbbf24"/></marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#34d399"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#0f172a"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <text x="20" y="30" fill="#e2e8f0" font-size="16" font-weight="700">图1 · 绝对位置编码 vs 旋转位置编码（RoPE）</text>
  <text x="20" y="46" fill="#64748b" font-size="9">现象钩子 — 为什么学出来的位置向量"出不了训练长度"？</text>

  <!-- LEFT: Absolute PE -->
  <rect x="24" y="66" width="312" height="232" rx="6" fill="rgba(30,41,59,0.5)" stroke="#fb7185" stroke-width="1.4"/>
  <text x="40" y="92" fill="#fb7185" font-size="13" font-weight="700">绝对位置编码 Absolute PE</text>
  <text x="40" y="112" fill="#94a3b8" font-size="9">每个位置 = 一个独立可学习的嵌入向量</text>
  <g font-size="9" fill="#cbd5e1" text-anchor="middle">
    <rect x="40" y="124" width="34" height="26" rx="3" fill="rgba(251,113,133,0.25)" stroke="#fb7185" stroke-width="1"/>
    <text x="57" y="141">p₁</text>
    <rect x="80" y="124" width="34" height="26" rx="3" fill="rgba(251,113,133,0.25)" stroke="#fb7185" stroke-width="1"/>
    <text x="97" y="141">p₂</text>
    <rect x="120" y="124" width="34" height="26" rx="3" fill="rgba(251,113,133,0.25)" stroke="#fb7185" stroke-width="1"/>
    <text x="137" y="141">p₃</text>
    <rect x="160" y="124" width="34" height="26" rx="3" fill="rgba(251,113,133,0.25)" stroke="#fb7185" stroke-width="1"/>
    <text x="177" y="141">p₄</text>
    <rect x="200" y="124" width="34" height="26" rx="3" fill="rgba(251,113,133,0.25)" stroke="#fb7185" stroke-width="1"/>
    <text x="217" y="141">p₅</text>
    <rect x="240" y="124" width="34" height="26" rx="3" fill="rgba(251,113,133,0.25)" stroke="#fb7185" stroke-width="1"/>
    <text x="257" y="141">p₆</text>
    <rect x="280" y="124" width="34" height="26" rx="3" fill="#0f172a" stroke="#475569" stroke-width="1"/>
    <text x="297" y="141" fill="#64748b">p₇</text>
  </g>
  <text x="40" y="178" fill="#e2e8f0" font-size="10">位置 1…L 在训练里"见过"</text>
  <text x="40" y="196" fill="#94a3b8" font-size="9">位置 L+1、L+2 … 模型从没学过</text>
  <rect x="40" y="210" width="280" height="62" rx="5" fill="rgba(136,19,55,0.3)" stroke="#fb7185" stroke-width="1"/>
  <text x="54" y="232" fill="#fecdd3" font-size="10" font-weight="600">推理到位置 L+1 → 拿不出对应向量</text>
  <text x="54" y="250" fill="#fecdd3" font-size="9">外推能力脆：长度一超训练上限就崩</text>
  <text x="54" y="266" fill="#fecdd3" font-size="9">例：训练 8K，直接喂 32K 多半翻车</text>

  <!-- arrow between -->
  <text x="350" y="190" fill="#64748b" font-size="20" font-weight="700" text-anchor="middle">→</text>

  <!-- RIGHT: RoPE -->
  <rect x="360" y="66" width="296" height="232" rx="6" fill="rgba(30,41,59,0.5)" stroke="#34d399" stroke-width="1.4"/>
  <text x="376" y="92" fill="#34d399" font-size="13" font-weight="700">旋转位置编码 RoPE</text>
  <text x="376" y="112" fill="#94a3b8" font-size="9">每个位置 = 把向量"旋转 m·θ" 角度</text>
  <circle cx="420" cy="172" r="40" fill="none" stroke="#334155" stroke-width="1"/>
  <line x1="420" y1="172" x2="452" y2="144" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="456" y="140" fill="#60a5fa" font-size="9">位置 m</text>
  <line x1="420" y1="172" x2="392" y2="202" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrow-amber)"/>
  <text x="350" y="214" fill="#fbbf24" font-size="9">位置 n</text>
  <text x="476" y="162" fill="#cbd5e1" font-size="9">θᵢ = 10000^(−2i/d)</text>
  <text x="476" y="180" fill="#cbd5e1" font-size="9">越往后维度转得越慢</text>
  <rect x="376" y="228" width="264" height="60" rx="5" fill="rgba(6,78,59,0.3)" stroke="#34d399" stroke-width="1"/>
  <text x="390" y="250" fill="#a7f3d0" font-size="10" font-weight="600">自注意力点积 q_m · k_n</text>
  <text x="390" y="268" fill="#a7f3d0" font-size="9">只依赖相对距离 (m − n)</text>
  <text x="390" y="282" fill="#a7f3d0" font-size="9">没见过的长序列，照样能算相对位置</text>

  <!-- bottom key box -->
  <rect x="20" y="316" width="640" height="100" rx="6" fill="rgba(30,41,59,0.4)" stroke="#475569" stroke-width="1"/>
  <text x="36" y="340" fill="#e2e8f0" font-size="11" font-weight="600">关键解耦：RoPE 不记"你在第几个位置"，而是把位置"压"成向量间的旋转夹角。</text>
  <text x="36" y="360" fill="#94a3b8" font-size="9">于是"绝对位置"信息被折叠进"相对距离"——模型因此天然擅长长度外推，这正是 8 月百万级上下文模型默认选它的根因。</text>
  <text x="36" y="380" fill="#94a3b8" font-size="9">代价：训练长度之外仍会"转过头"（高频维度被压扁），需要下文 NTK / YaRN 修补——但地基是 RoPE 给的。</text>
  <text x="36" y="400" fill="#94a3b8" font-size="9">被 LLaMA / Mistral / Qwen / Gemma / Yi 等全部采用为默认位置编码（RoFormer, Su et al. 2021, arXiv:2104.09864）。</text>
</svg>
