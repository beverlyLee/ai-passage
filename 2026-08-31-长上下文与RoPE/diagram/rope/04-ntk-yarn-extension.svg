<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 450">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;family=Noto+Sans+SC:wght@400;500;700&amp;display=swap');
    text { font-family: 'JetBrains Mono','Noto Sans SC','PingFang SC',sans-serif; }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/></marker>
    <marker id="arrow-rose" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#fb7185"/></marker>
    <marker id="arrow-amber" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#fbbf24"/></marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#34d399"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#0f172a"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <text x="20" y="30" fill="#e2e8f0" font-size="16" font-weight="700">图4 · NTK / YaRN：把"频率维度"分三带修补</text>
  <text x="20" y="46" fill="#64748b" font-size="9">解法 — 不再均匀缩放，而是按波长分别对待</text>

  <text x="30" y="78" fill="#cbd5e1" font-size="11">序列长度放大 s 倍：L → L′ = s·L（如 4K → 128K）</text>

  <!-- low freq band -->
  <rect x="30" y="92" width="620" height="70" rx="5" fill="rgba(120,53,15,0.22)" stroke="#fbbf24" stroke-width="1.2"/>
  <text x="46" y="116" fill="#fde68a" font-size="11" font-weight="600">① 低频（长波长 λ 大）：线性插值 → 把旋转角度"拉伸"</text>
  <text x="46" y="136" fill="#fde68a" font-size="9">原只能覆盖 4K 的低频，被拉到 128K 还能表示长距离相对位置</text>
  <text x="46" y="152" fill="#fde68a" font-size="9">让模型"看得到"更远之前的 token</text>

  <!-- mid freq band -->
  <rect x="30" y="170" width="620" height="70" rx="5" fill="rgba(30,41,59,0.5)" stroke="#60a5fa" stroke-width="1.2"/>
  <text x="46" y="194" fill="#93c5fd" font-size="11" font-weight="600">② 中频：NTK 斜坡混合 γ(r) → "动"与"不动"之间平滑过渡</text>
  <text x="46" y="214" fill="#93c5fd" font-size="9">既不压扁高频、也不拉爆低频，按维度比例逐渐切换缩放强度</text>
  <text x="46" y="230" fill="#93c5fd" font-size="9">bloc97 的 NTK-aware 思路：改基 b′=b·s^(|D|/(|D|−2)) 分散缩放压力</text>

  <!-- high freq band -->
  <rect x="30" y="248" width="620" height="70" rx="5" fill="rgba(6,78,59,0.25)" stroke="#34d399" stroke-width="1.2"/>
  <text x="46" y="272" fill="#a7f3d0" font-size="11" font-weight="600">③ 高频（短波长 λ 小）：原样不动 → 保护局部相对距离</text>
  <text x="46" y="292" fill="#a7f3d0" font-size="9">相邻 token 夹角不变，最近邻语义不被破坏</text>
  <text x="46" y="308" fill="#a7f3d0" font-size="9">这正是 PI 均匀缩放会误伤、而分频带能保住的地方</text>

  <!-- YaRN temp box -->
  <rect x="30" y="330" width="620" height="92" rx="6" fill="rgba(30,41,59,0.4)" stroke="#475569" stroke-width="1"/>
  <text x="46" y="354" fill="#e2e8f0" font-size="11" font-weight="600">YaRN 额外加一道"注意力温度"：t = 0.1·ln(s) + 1</text>
  <text x="46" y="374" fill="#94a3b8" font-size="9">缩放后 logits 方差变了，用温度 t 把注意力分布重新拉回合理尺度</text>
  <text x="46" y="394" fill="#94a3b8" font-size="9">效果：4K 模型扩到 128K 只需 ~400 步微调（比 PI 少 2.5× 步数、少 10× token）</text>
  <text x="46" y="414" fill="#94a3b8" font-size="9">采用：Mistral 7B v0.2（8k→32k）、Qwen2 系列（YaRN, arXiv:2309.00071, 2023）</text>
</svg>
