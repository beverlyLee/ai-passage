  <rect width="100%" height="100%" fill="#0f172a"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <text x="20" y="30" fill="#e2e8f0" font-size="16" font-weight="700">图1 · 稠密 vs 混合专家：同样大模型，每 token 只算一小块</text>
  <text x="20" y="46" fill="#64748b" font-size="9">现象钩子 — MoE 用稀疏激活“省”出大模型</text>

  <!-- LEFT: Dense -->
  <text x="30" y="78" fill="#e2e8f0" font-size="12" font-weight="700">稠密模型 Dense</text>
  <text x="30" y="96" fill="#94a3b8" font-size="9">每个 token → 全部参数都参与计算</text>
