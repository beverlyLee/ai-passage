  </g>
  <text x="380" y="306" fill="#fbbf24" font-size="10" font-weight="600">仅 2 / 8 专家激活 ≈ 25%</text>
  <text x="380" y="324" fill="#94a3b8" font-size="9">DeepSeek-V3：671B 总 / 37B 激活</text>
  <text x="380" y="340" fill="#94a3b8" font-size="9">Mixtral 8x7B：46.7B 总 / 12.9B 激活</text>

  <!-- arrow between -->
  <text x="320" y="200" fill="#64748b" font-size="20" font-weight="700" text-anchor="middle">→</text>

  <rect x="20" y="362" width="640" height="64" rx="6" fill="rgba(30,41,59,0.4)" stroke="#475569" stroke-width="1"/>
  <text x="36" y="384" fill="#e2e8f0" font-size="11" font-weight="600">关键解耦：总参数 = “知识容量”，激活参数 = “每次推理成本”。</text>
  <text x="36" y="404" fill="#94a3b8" font-size="9">MoE 把两者拆开——用巨大总参数撑住能力，却只让每 token 算极小一部分，于是“大模型”也能跑得既快又便宜。</text>
  <text x="36" y="420" fill="#94a3b8" font-size="9">这就是为什么 2026 年 8 月 Qwen / DeepSeek 的旗舰全是 MoE：要容量，也要成本可控。</text>
</svg>
