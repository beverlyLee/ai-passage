  <text x="30" y="306" fill="#60a5fa" font-size="10" font-weight="600">激活 = 100% 参数</text>
  <text x="30" y="324" fill="#94a3b8" font-size="9">例：Llama 2 70B → 每 token 算满 70B</text>

  <!-- RIGHT: MoE -->
  <text x="380" y="78" fill="#e2e8f0" font-size="12" font-weight="700">混合专家 MoE</text>
  <text x="380" y="96" fill="#94a3b8" font-size="9">每个 token → 只激活少数专家（Top-k）</text>
  <g>
    <!-- 8 expert columns, only 2 lit (Top-2) -->
    <rect x="380" y="108" width="28" height="174" rx="3" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <rect x="412" y="108" width="28" height="174" rx="3" fill="rgba(59,130,246,0.35)" stroke="#60a5fa" stroke-width="1.4"/>
    <rect x="444" y="108" width="28" height="174" rx="3" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <rect x="476" y="108" width="28" height="174" rx="3" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <rect x="508" y="108" width="28" height="174" rx="3" fill="rgba(59,130,246,0.35)" stroke="#60a5fa" stroke-width="1.4"/>
    <rect x="540" y="108" width="28" height="174" rx="3" fill="#0f172a" stroke="#334155" stroke-width="1"/>
