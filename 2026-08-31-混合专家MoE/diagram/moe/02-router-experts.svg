<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 450">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;family=Noto+Sans+SC:wght@400;500;700&amp;display=swap');
    text { font-family: 'JetBrains Mono','Noto Sans SC','PingFang SC',sans-serif; }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/></marker>
    <marker id="arrow-rose" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#fb7185"/></marker>
    <marker id="arrow-amber" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#fbbf24"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#0f172a"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <text x="20" y="30" fill="#e2e8f0" font-size="16" font-weight="700">图2 · 路由 + 专家：一个 token 怎么只激活少数人</text>
  <text x="20" y="46" fill="#64748b" font-size="9">问题1 — gating network（路由）决定谁上岗</text>

  <!-- token -->
  <rect x="24" y="200" width="92" height="46" rx="6" fill="#0f172a" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="70" y="222" fill="#e2e8f0" font-size="11" font-weight="600" text-anchor="middle">输入 token</text>
  <text x="70" y="238" fill="#94a3b8" font-size="9" text-anchor="middle">（高维向量）</text>

  <!-- router -->
  <rect x="150" y="184" width="118" height="78" rx="6" fill="rgba(120,53,15,0.35)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="209" y="210" fill="#fbbf24" font-size="11" font-weight="700" text-anchor="middle">Router</text>
  <text x="209" y="226" fill="#fde68a" font-size="9" text-anchor="middle">Gating Network</text>
  <text x="209" y="242" fill="#94a3b8" font-size="8" text-anchor="middle">给每个专家打</text>
  <text x="209" y="254" fill="#94a3b8" font-size="8" text-anchor="middle">路由分 softmax</text>

  <!-- experts 8 cols -->
  <g>
    <rect x="300" y="180" width="42" height="86" rx="5" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="321" y="228" fill="#64748b" font-size="10" text-anchor="middle">E1</text>
    <rect x="348" y="180" width="42" height="86" rx="5" fill="rgba(59,130,246,0.35)" stroke="#60a5fa" stroke-width="1.5"/>
    <text x="369" y="222" fill="#60a5fa" font-size="10" font-weight="700" text-anchor="middle">E2 ✓</text>
    <text x="369" y="238" fill="#93c5fd" font-size="8" text-anchor="middle">0.41</text>
    <rect x="396" y="180" width="42" height="86" rx="5" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="417" y="228" fill="#64748b" font-size="10" text-anchor="middle">E3</text>
    <rect x="444" y="180" width="42" height="86" rx="5" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="465" y="228" fill="#64748b" font-size="10" text-anchor="middle">E4</text>
    <rect x="492" y="180" width="42" height="86" rx="5" fill="rgba(59,130,246,0.35)" stroke="#60a5fa" stroke-width="1.5"/>
    <text x="513" y="222" fill="#60a5fa" font-size="10" font-weight="700" text-anchor="middle">E5 ✓</text>
    <text x="513" y="238" fill="#93c5fd" font-size="8" text-anchor="middle">0.37</text>
    <rect x="540" y="180" width="42" height="86" rx="5" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="561" y="228" fill="#64748b" font-size="10" text-anchor="middle">E6</text>
    <rect x="588" y="180" width="42" height="86" rx="5" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="609" y="228" fill="#64748b" font-size="10" text-anchor="middle">E7</text>
    <rect x="636" y="180" width="42" height="86" rx="5" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="657" y="228" fill="#64748b" font-size="10" text-anchor="middle">E8</text>
  </g>

  <!-- arrows token -> router -->
  <line x1="116" y1="223" x2="148" y2="223" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#arrow-amber)"/>
  <!-- arrows router -> experts -->
  <line x1="268" y1="208" x2="300" y2="205" stroke="#64748b" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="268" y1="212" x2="348" y2="212" stroke="#60a5fa" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="268" y1="216" x2="396" y2="215" stroke="#64748b" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="268" y1="220" x2="444" y2="218" stroke="#64748b" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="268" y1="224" x2="492" y2="222" stroke="#60a5fa" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="268" y1="228" x2="540" y2="225" stroke="#64748b" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="268" y1="232" x2="588" y2="230" stroke="#64748b" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="268" y1="236" x2="636" y2="233" stroke="#64748b" stroke-width="1" marker-end="url(#arrow)"/>

  <text x="369" y="290" fill="#60a5fa" font-size="10" font-weight="600" text-anchor="middle">Top-2 胜出</text>
  <text x="513" y="290" fill="#60a5fa" font-size="10" font-weight="600" text-anchor="middle">Top-2 胜出</text>

  <rect x="20" y="316" width="640" height="110" rx="6" fill="rgba(30,41,59,0.4)" stroke="#475569" stroke-width="1"/>
  <text x="36" y="340" fill="#e2e8f0" font-size="11" font-weight="600">路由机制：router 对 8 个专家各算一个分数，只让 Top-2（分数最高）参与计算。</text>
  <text x="36" y="360" fill="#94a3b8" font-size="9">其余 6 个专家这一刻“休眠”——参数不更新、也不参与本次前向；token 的最终表示 = 选中的两个专家输出加权求和。</text>
  <text x="36" y="380" fill="#94a3b8" font-size="9">轮换上岗的好处：不同 token 走不同专家，模型用同一份总参数覆盖更多“专长”，而单次成本只约等于 2 个专家。</text>
  <text x="36" y="400" fill="#94a3b8" font-size="9">Mixtral 8x7B 用 Top-2（激活 12.9B / 46.7B）；DeepSeek-V3 256 个路由专家 + 共享专家（激活 37B / 671B）。</text>
  <text x="36" y="418" fill="#fbbf24" font-size="9">一句话：MoE = 把“一个大模型”切成“一队专家 + 一个调度员”，每次只叫两个人干活。</text>
</svg>
