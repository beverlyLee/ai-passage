<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 450" font-family="'JetBrains Mono','Noto Sans SC','PingFang SC',sans-serif">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1e293b" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="680" height="450" fill="#0f172a"/>
  <rect width="680" height="450" fill="url(#grid)"/>

  <text x="24" y="32" fill="#e2e8f0" font-size="15">文件隔离：一个恶意路径会卡在哪一关（LocalFilesystemBackend）</text>

  <!-- 输入路径 -->
  <rect x="20" y="58" width="190" height="50" rx="8" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="34" y="82" fill="#e2e8f0" font-size="13">输入路径 key</text>
  <text x="34" y="100" fill="#94a3b8" font-size="11">resolvePath(87)</text>

  <!-- diamond -->
  <polygon points="340,52 412,86 340,120 268,86" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="324" y="90" fill="#fbbf24" font-size="13">virtualMode?</text>

  <line x1="210" y1="83" x2="266" y2="86" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="214" y="76" fill="#94a3b8" font-size="11">进入</text>

  <!-- 否分支 -->
  <line x1="268" y1="86" x2="266" y2="86" stroke="#64748b" stroke-width="0"/>
  <path d="M 300 120 L 120 120 L 120 160" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="150" y="112" fill="#94a3b8" font-size="11">否(默认)</text>
  <rect x="20" y="160" width="200" height="70" rx="8" fill="rgba(136,19,55,0.22)" stroke="#fb7185" stroke-width="1.5"/>
  <text x="34" y="186" fill="#fb7185" font-size="13">绝对路径按原样放行</text>
  <text x="34" y="206" fill="#94a3b8" font-size="11">Paths.get(key) isAbsolute(100)</text>
  <text x="34" y="224" fill="#94a3b8" font-size="11">默认不隔离，口子敞开</text>

  <!-- 是分支：三关 -->
  <path d="M 340 120 L 340 138 L 400 138 L 400 160" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="350" y="134" fill="#94a3b8" font-size="11">是</text>

  <rect x="400" y="160" width="240" height="52" rx="8" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="414" y="184" fill="#e2e8f0" font-size="13">① 拦 .. 和 ~ 越界</text>
  <text x="414" y="202" fill="#94a3b8" font-size="11">contains .. / startsWith ~(90)</text>

  <line x1="520" y1="212" x2="520" y2="222" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="400" y="224" width="240" height="52" rx="8" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="414" y="248" fill="#e2e8f0" font-size="13">② resolve 后校验根目录</text>
  <text x="414" y="266" fill="#94a3b8" font-size="11">full.startsWith(cwd) 否则抛异常(94)</text>

  <line x1="520" y1="276" x2="520" y2="286" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="400" y="288" width="240" height="52" rx="8" fill="rgba(76,29,149,0.3)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="414" y="312" fill="#c4b5fd" font-size="13">③ NOFOLLOW_LINKS</text>
  <text x="414" y="330" fill="#94a3b8" font-size="11">不跟随符号链接(124)</text>

  <!-- 真正读写 -->
  <path d="M 520 340 L 520 372 L 320 372 L 320 392" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="180" y="392" width="280" height="42" rx="8" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="194" y="418" fill="#e2e8f0" font-size="13">真正读 / 写 / edit 文件</text>

  <text x="20" y="438" fill="#94a3b8" font-size="11">virtualMode 默认 false(76)：隔离能力需显式构造 LocalFilesystemBackend(root, true, mb) 才生效</text>
</svg>
