<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 450" font-family="'JetBrains Mono','Noto Sans SC','PingFang SC',sans-serif">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1e293b" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="680" height="450" fill="#0f172a"/>
  <rect width="680" height="450" fill="url(#grid)"/>

  <text x="24" y="32" fill="#e2e8f0" font-size="16">SAA 的沙箱 = 四层纯 Java 筛子（不是容器）</text>

  <!-- Layer 1 会话隔离 -->
  <rect x="20" y="50" width="640" height="84" rx="10" fill="rgba(8,51,68,0.35)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="34" y="74" fill="#22d3ee" font-size="14">① 会话隔离层：进程 + 临时工作区</text>
  <text x="34" y="98" fill="#94a3b8" font-size="12">ShellSessionManager 常驻进程 · workspaceRoot==null 开临时目录(56) · ShellToolAgentHook 生命周期(45)</text>
  <text x="34" y="120" fill="#94a3b8" font-size="12">隔离范围：shell 进程的 cwd 被钉死，Agent 跨命令保持 cd/export 有状态</text>

  <!-- Layer 2 输出治理 -->
  <rect x="20" y="144" width="640" height="84" rx="10" fill="rgba(6,78,59,0.35)" stroke="#34d399" stroke-width="1.5"/>
  <text x="34" y="168" fill="#34d399" font-size="14">② 输出治理层：超时 + 截断 + 脱敏</text>
  <text x="34" y="192" fill="#94a3b8" font-size="12">deadline 超时即 restart(368) · 行截断>maxOutputLines(420) · 字节截断>maxOutputBytes(417)</text>
  <text x="34" y="214" fill="#94a3b8" font-size="12">redaction 脱敏默认空规则(71)：REDACT/MASK/HASH 由 PIIDetectionHook 另外提供</text>

  <!-- Layer 3 文件隔离 -->
  <rect x="20" y="238" width="640" height="84" rx="10" fill="rgba(76,29,149,0.3)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="34" y="262" fill="#a78bfa" font-size="14">③ 文件隔离层：路径约束 + 防符号链接</text>
  <text x="34" y="286" fill="#94a3b8" font-size="12">virtualMode 拦 .. ~ 越界(90) · 校验 full.startsWith(cwd)(94) · NOFOLLOW_LINKS 防跟随(124)</text>
  <text x="34" y="308" fill="#94a3b8" font-size="12">MAX_LINE_LENGTH=10000 防超长行撑爆上下文(588) · virtualMode 默认 false 需显式开</text>

  <!-- Layer 4 钩子护栏 -->
  <rect x="20" y="332" width="640" height="100" rx="10" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="34" y="356" fill="#fbbf24" font-size="14">④ 钩子护栏层：挂 Agent 生命周期的通用闸</text>
  <text x="34" y="380" fill="#94a3b8" font-size="12">PIIDetectionHook 五类 PII(294) · ModelCallLimitHook / ToolCallLimitHook 计数超限抛异常(74)</text>
  <text x="34" y="402" fill="#94a3b8" font-size="12">ReturnDirectModelHook 最高优先级跳 END(51) · 三者默认都不接，要显式注册到 graph</text>
  <text x="34" y="424" fill="#94a3b8" font-size="11">默认关闭是 SAA 的基调：能力不默认开，风险面留口子，隔离由你装配</text>
</svg>
