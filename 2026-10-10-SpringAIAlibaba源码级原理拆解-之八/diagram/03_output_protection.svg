<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 450" font-family="'JetBrains Mono','Noto Sans SC','PingFang SC',sans-serif">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1e293b" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="680" height="450" fill="#0f172a"/>
  <rect width="680" height="450" fill="url(#grid)"/>

  <text x="24" y="34" fill="#e2e8f0" font-size="15">输出治理：一条命令的输出在被模型看到前经过什么</text>

  <!-- 起点 -->
  <rect x="20" y="70" width="150" height="56" rx="8" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="34" y="94" fill="#e2e8f0" font-size="13">命令执行</text>
  <text x="34" y="113" fill="#94a3b8" font-size="11">session.execute(59)</text>

  <line x1="170" y1="98" x2="208" y2="98" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- collectOutput -->
  <rect x="210" y="70" width="170" height="56" rx="8" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="224" y="94" fill="#e2e8f0" font-size="13">collectOutput 循环</text>
  <text x="224" y="113" fill="#94a3b8" font-size="11">poll 队列(98)</text>

  <line x1="380" y1="98" x2="418" y2="98" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 判断 deadline -->
  <rect x="420" y="70" width="190" height="56" rx="8" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="434" y="94" fill="#fbbf24" font-size="13">剩余时间耗尽?</text>
  <text x="434" y="113" fill="#94a3b8" font-size="11">remaining&lt;=0(367)</text>

  <!-- 超时分支 向上 -->
  <path d="M 515 70 L 515 40 L 615 40 L 615 70" fill="none" stroke="#fb7185" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="540" y="18" width="150" height="20" rx="6" fill="rgba(136,19,55,0.3)" stroke="#fb7185" stroke-width="1.3"/>
  <text x="552" y="32" fill="#fb7185" font-size="11">timeout → restart()(368)</text>

  <!-- 截断判定 -->
  <rect x="20" y="170" width="200" height="64" rx="8" fill="rgba(76,29,149,0.3)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="34" y="194" fill="#c4b5fd" font-size="13">行数截断判定</text>
  <text x="34" y="213" fill="#94a3b8" font-size="11">totalLines>maxOutputLines</text>
  <text x="34" y="228" fill="#94a3b8" font-size="11">→ truncatedByLines(420)</text>

  <!-- 字节截断 -->
  <rect x="240" y="170" width="200" height="64" rx="8" fill="rgba(76,29,149,0.3)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="254" y="194" fill="#c4b5fd" font-size="13">字节截断判定</text>
  <text x="254" y="213" fill="#94a3b8" font-size="11">totalBytes>maxOutputBytes</text>
  <text x="254" y="228" fill="#94a3b8" font-size="11">→ truncatedByBytes(417)</text>

  <!-- 脱敏 -->
  <rect x="460" y="170" width="200" height="64" rx="8" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="474" y="194" fill="#e2e8f0" font-size="13">redaction 脱敏</text>
  <text x="474" y="213" fill="#94a3b8" font-size="11">逐规则 applyWithMatches</text>
  <text x="474" y="228" fill="#94a3b8" font-size="11">默认空列表(71) 不脱敏</text>

  <!-- 箭头连到截断/脱敏：从判断向下 -->
  <path d="M 420 126 L 420 150 L 120 150 L 120 170" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 420 126 L 420 150 L 340 150 L 340 170" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 420 126 L 420 150 L 560 150 L 560 170" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 汇总 CommandResult -->
  <rect x="180" y="300" width="320" height="70" rx="10" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="200" y="326" fill="#e2e8f0" font-size="14">CommandResult 返回模型上下文</text>
  <text x="200" y="348" fill="#94a3b8" font-size="11">output / exitCode / timedOut</text>
  <text x="200" y="364" fill="#94a3b8" font-size="11">truncatedByLines / truncatedByBytes / redactionMatches</text>

  <path d="M 120 234 L 120 290 L 180 290" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 340 234 L 340 290 L 340 300" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 560 234 L 560 290 L 500 290" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
</svg>
