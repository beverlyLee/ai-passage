<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 450" font-family="'JetBrains Mono','Noto Sans SC','PingFang SC',sans-serif">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1e293b" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="680" height="450" fill="#0f172a"/>
  <rect width="680" height="450" fill="url(#grid)"/>

  <text x="24" y="34" fill="#e2e8f0" font-size="15">shell 调用链：从 @Tool 入口到常驻 shell 进程</text>

  <!-- Box1 ShellTool2 -->
  <rect x="20" y="70" width="180" height="92" rx="8" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="34" y="94" fill="#e2e8f0" font-size="14">ShellTool2</text>
  <text x="34" y="116" fill="#94a3b8" font-size="11">@Tool executeShellCommand</text>
  <text x="34" y="135" fill="#94a3b8" font-size="11">Agent 调工具入口(37)</text>
  <text x="34" y="153" fill="#94a3b8" font-size="11">restart 可选(48)</text>

  <line x1="200" y1="116" x2="248" y2="116" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Box2 ShellSessionManager -->
  <rect x="250" y="64" width="200" height="116" rx="8" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="264" y="88" fill="#e2e8f0" font-size="14">ShellSessionManager</text>
  <text x="264" y="110" fill="#94a3b8" font-size="11">executeCommand(80)</text>
  <text x="264" y="129" fill="#94a3b8" font-size="11">脱敏 redaction(93)</text>
  <text x="264" y="148" fill="#94a3b8" font-size="11">包 CommandResult(102)</text>
  <text x="264" y="167" fill="#94a3b8" font-size="11">传 timeout/截断参数(87)</text>

  <line x1="450" y1="122" x2="488" y2="122" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Box3 ShellSession 常驻进程 -->
  <rect x="490" y="58" width="170" height="146" rx="8" fill="rgba(76,29,149,0.3)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="504" y="82" fill="#e2e8f0" font-size="13">ShellSession</text>
  <text x="504" y="102" fill="#c4b5fd" font-size="11">常驻进程(151)</text>
  <text x="504" y="121" fill="#94a3b8" font-size="11">stdin 写命令</text>
  <text x="504" y="140" fill="#94a3b8" font-size="11">reader 线程→队列</text>
  <text x="504" y="159" fill="#94a3b8" font-size="11">DONE_MARKER(323)</text>
  <text x="504" y="178" fill="#94a3b8" font-size="11">超时 restart(368)</text>
  <text x="504" y="197" fill="#94a3b8" font-size="11">行/字节截断(417)</text>

  <!-- 返回箭头：输出回到工具 -->
  <path d="M 490 205 L 490 250 L 110 250 L 110 162" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="250" y="268" fill="#94a3b8" font-size="12">CommandResult 含 output / exitCode / timedOut / truncated / redactionMatches</text>

  <!-- 隔离说明 -->
  <rect x="20" y="300" width="640" height="120" rx="10" fill="rgba(136,19,55,0.18)" stroke="#fb7185" stroke-width="1.5"/>
  <text x="36" y="326" fill="#fb7185" font-size="14">隔离真相：是工作目录隔离 + 进程级会话，不是容器</text>
  <text x="36" y="352" fill="#94a3b8" font-size="12">workspaceRoot==null 时开系统临时目录(56)，Agent 进程钉死在内部</text>
  <text x="36" y="374" fill="#94a3b8" font-size="12">ShellToolAgentHook 挂 BEFORE_AGENT/AFTER_AGENT(45) 才 initialize/cleanup</text>
  <text x="36" y="396" fill="#94a3b8" font-size="12">没挂钩子直接 executeCommand 会抛 IllegalStateException(82) 要求先 initialize</text>
</svg>
