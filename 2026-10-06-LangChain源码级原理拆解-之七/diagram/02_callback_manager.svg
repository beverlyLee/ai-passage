<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 450" font-family="'PingFang SC','Noto Sans SC',sans-serif">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="680" height="450" fill="#0f172a"/>
  <rect width="680" height="450" fill="url(#grid)"/>

  <text x="340" y="30" fill="#e2e8f0" font-size="18" text-anchor="middle" font-weight="600">BaseCallbackManager：把事件分发给所有 handler</text>
  <text x="340" y="49" fill="#64748b" font-size="11" text-anchor="middle">langchain-core 1.3.2</text>

  <!-- trigger -->
  <rect x="210" y="78" width="260" height="58" rx="10" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="340" y="102" fill="#e2e8f0" font-size="11" font-weight="600" text-anchor="middle">run_manager.on_chain_start(...)</text>
  <text x="340" y="120" fill="#fbbf24" font-size="9" text-anchor="middle">框架在组件关键节点自动调用</text>

  <!-- manager -->
  <rect x="210" y="164" width="260" height="64" rx="10" fill="#0f172a" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="340" y="188" fill="#e2e8f0" font-size="12" font-weight="600" text-anchor="middle">BaseCallbackManager</text>
  <text x="340" y="206" fill="#22d3ee" font-size="9" text-anchor="middle">manager.py:1001  持有 handlers</text>
  <text x="340" y="222" fill="#64748b" font-size="8.5" text-anchor="middle">Callbacks 别名 base.py:1220</text>

  <!-- handlers -->
  <rect x="24" y="290" width="190" height="86" rx="10" fill="#0f172a" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="44" y="314" fill="#e2e8f0" font-size="11" font-weight="600">自定义 Handler</text>
  <text x="44" y="331" fill="#a78bfa" font-size="9">例 TallyHandler</text>
  <text x="44" y="352" fill="#94a3b8" font-size="9">你的计数 / 日志逻辑</text>

  <rect x="245" y="290" width="190" height="86" rx="10" fill="#0f172a" stroke="#34d399" stroke-width="1.5"/>
  <text x="265" y="314" fill="#e2e8f0" font-size="11" font-weight="600">StdOutCallbackHandler</text>
  <text x="265" y="331" fill="#34d399" font-size="9">stdout.py:16</text>
  <text x="265" y="352" fill="#94a3b8" font-size="9">内置，直接打印事件</text>

  <rect x="466" y="290" width="190" height="86" rx="10" fill="#0f172a" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="486" y="314" fill="#e2e8f0" font-size="11" font-weight="600">自定义 Handler 2</text>
  <text x="486" y="331" fill="#94a3b8" font-size="9">例 AsyncHandler</text>
  <text x="486" y="352" fill="#94a3b8" font-size="9">异步钩子 / 上报远端</text>

  <!-- arrows -->
  <line x1="340" y1="136" x2="340" y2="162" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="280" y1="228" x2="119" y2="288" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="340" y1="228" x2="340" y2="288" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="400" y1="228" x2="561" y2="288" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="150" y="262" fill="#94a3b8" font-size="9">逐一分发</text>

  <!-- footer -->
  <text x="24" y="408" fill="#94a3b8" font-size="10">关键事实：</text>
  <text x="24" y="426" fill="#cbd5e1" font-size="10">1) 事件先经 run_manager 触发，BaseCallbackManager（:1001）持有全部 handler 并逐一分发。</text>
</svg>
