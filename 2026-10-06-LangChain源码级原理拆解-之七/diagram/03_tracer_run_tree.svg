<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 450" font-family="'PingFang SC','Noto Sans SC',sans-serif">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="680" height="450" fill="#0f172a"/>
  <rect width="680" height="450" fill="url(#grid)"/>

  <text x="340" y="30" fill="#e2e8f0" font-size="18" text-anchor="middle" font-weight="600">tracers：把回调收敛成可回放的 Run 树</text>
  <text x="340" y="49" fill="#64748b" font-size="11" text-anchor="middle">langchain-core 1.3.2</text>

  <!-- RunTree head -->
  <rect x="210" y="78" width="260" height="58" rx="10" fill="#0f172a" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="340" y="102" fill="#e2e8f0" font-size="12" font-weight="600" text-anchor="middle">Run = RunTree</text>
  <text x="340" y="120" fill="#a78bfa" font-size="9" text-anchor="middle">tracers/schemas.py:10</text>

  <!-- root run -->
  <rect x="210" y="164" width="260" height="66" rx="10" fill="#0f172a" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="340" y="186" fill="#e2e8f0" font-size="12" font-weight="600" text-anchor="middle">Root：chain run</text>
  <text x="340" y="204" fill="#22d3ee" font-size="9" text-anchor="middle">run_id / parent_run_id=None</text>
  <text x="340" y="222" fill="#64748b" font-size="8.5" text-anchor="middle">start_time / end_time / error</text>

  <!-- child llm -->
  <rect x="40" y="300" width="200" height="96" rx="10" fill="#0f172a" stroke="#34d399" stroke-width="1.5"/>
  <text x="60" y="324" fill="#e2e8f0" font-size="11" font-weight="600">Child：llm run</text>
  <text x="60" y="342" fill="#34d399" font-size="9">parent = Root.run_id</text>
  <text x="60" y="362" fill="#94a3b8" font-size="9">token 流 / usage</text>
  <text x="60" y="382" fill="#64748b" font-size="8.5">end_time - start_time = 延迟</text>

  <!-- child tool -->
  <rect x="440" y="300" width="200" height="96" rx="10" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="460" y="324" fill="#e2e8f0" font-size="11" font-weight="600">Child：tool run</text>
  <text x="460" y="342" fill="#fbbf24" font-size="9">parent = Root.run_id</text>
  <text x="460" y="362" fill="#94a3b8" font-size="9">input / output</text>
  <text x="460" y="382" fill="#64748b" font-size="8.5">error 非空即失败</text>

  <!-- arrows -->
  <line x1="340" y1="136" x2="340" y2="162" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="290" y1="230" x2="140" y2="298" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="390" y1="230" x2="540" y2="298" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="150" y="266" fill="#94a3b8" font-size="9">父子指针串成树</text>

  <!-- footer -->
  <text x="24" y="408" fill="#94a3b8" font-size="10">关键事实：</text>
  <text x="24" y="426" fill="#cbd5e1" font-size="10">1) tracers 复用同一套回调，把每次运行收敛成 Run（RunTree，schemas.py:10），可回放可追踪。</text>
</svg>
