<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 450" font-family="'PingFang SC','Noto Sans SC',sans-serif">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="680" height="450" fill="#0f172a"/>
  <rect width="680" height="450" fill="url(#grid)"/>

  <text x="340" y="30" fill="#e2e8f0" font-size="18" text-anchor="middle" font-weight="600">BaseCallbackHandler：一组钩子接口</text>
  <text x="340" y="49" fill="#64748b" font-size="11" text-anchor="middle">langchain-core 1.3.2</text>

  <!-- base handler -->
  <rect x="24" y="84" width="380" height="178" rx="10" fill="#0f172a" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="44" y="108" fill="#e2e8f0" font-size="13" font-weight="600">BaseCallbackHandler</text>
  <text x="44" y="125" fill="#22d3ee" font-size="9.5">callbacks/base.py:493  一组 Mixin 合集</text>
  <text x="44" y="150" fill="#34d3ee" font-size="10" opacity="0"> </text>
  <text x="44" y="152" fill="#e2e8f0" font-size="10">链：on_chain_start :383 / on_chain_end :169</text>
  <text x="44" y="174" fill="#e2e8f0" font-size="10">工具：on_tool_start :406 / on_tool_end :241</text>
  <text x="44" y="196" fill="#e2e8f0" font-size="10">模型：on_llm_new_token :65 / on_chat_model_start</text>
  <text x="44" y="218" fill="#e2e8f0" font-size="10">检索：on_retriever_start / on_retriever_end</text>
  <text x="44" y="246" fill="#94a3b8" font-size="9">每个组件在关键节点自动调用对应钩子</text>

  <!-- async handler -->
  <rect x="420" y="100" width="236" height="120" rx="10" fill="#0f172a" stroke="#34d399" stroke-width="1.5"/>
  <text x="440" y="124" fill="#e2e8f0" font-size="12" font-weight="600">AsyncCallbackHandler</text>
  <text x="440" y="141" fill="#34d399" font-size="9.5">callbacks/base.py:545</text>
  <text x="440" y="164" fill="#e2e8f0" font-size="10">同名钩子的 async 版</text>
  <text x="440" y="184" fill="#e2e8f0" font-size="10">async def on_chain_start(...)</text>
  <text x="440" y="206" fill="#94a3b8" font-size="9">框架在 async 链里自动分发</text>

  <!-- arrow -->
  <line x1="404" y1="150" x2="418" y2="150" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="411" y="143" fill="#94a3b8" font-size="9" text-anchor="middle">子类</text>

  <!-- footer -->
  <text x="24" y="372" fill="#94a3b8" font-size="10">关键事实：</text>
  <text x="24" y="392" fill="#cbd5e1" font-size="10">1) BaseCallbackHandler 是 Mixin 合集（base.py:493），链/工具/模型/检索各有一对 start/end 钩子。</text>
  <text x="24" y="412" fill="#cbd5e1" font-size="10">2) 流式 token 走 on_llm_new_token（base.py:65），模型每吐一片调一次，是实时观测核心。</text>
  <text x="24" y="432" fill="#cbd5e1" font-size="10">3) AsyncCallbackHandler（base.py:545）是同一套钩子的异步版，框架在 async 链里自动分发。</text>
</svg>
