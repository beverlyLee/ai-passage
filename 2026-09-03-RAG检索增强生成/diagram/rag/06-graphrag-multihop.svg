<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 450">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap');
    text { font-family: 'JetBrains Mono','Noto Sans SC','PingFang SC',sans-serif; }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/></pattern>
    <marker id="arrow-cyan" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#22d3ee"/></marker>
    <marker id="arrow-rose" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#fb7185"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#0f172a"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>
  <text x="20" y="30" fill="#e2e8f0" font-size="15" font-weight="700">图6 · GraphRAG：实体关系建图，跨多跳</text>
  <text x="20" y="48" fill="#94a3b8" font-size="9.5">LLM 抽取实体/关系建知识图谱 + 社区摘要；朴素向量检索答不了多跳</text>

  <!-- 节点 -->
  <rect x="60" y="128" width="92" height="44" rx="8" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.2"/>
  <text x="106" y="155" fill="#67e8f9" font-size="11" font-weight="600" text-anchor="middle">员工A</text>
  <rect x="230" y="78" width="92" height="44" rx="8" fill="rgba(49,46,129,0.4)" stroke="#a78bfa" stroke-width="1.2"/>
  <text x="276" y="105" fill="#c4b5fd" font-size="11" font-weight="600" text-anchor="middle">项目X</text>
  <rect x="230" y="200" width="92" height="44" rx="8" fill="rgba(49,46,129,0.4)" stroke="#a78bfa" stroke-width="1.2"/>
  <text x="276" y="227" fill="#c4b5fd" font-size="11" font-weight="600" text-anchor="middle">预算Y</text>
  <rect x="420" y="150" width="92" height="44" rx="8" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.2"/>
  <text x="466" y="177" fill="#6ee7b7" font-size="11" font-weight="600" text-anchor="middle">政策Z</text>

  <!-- edges -->
  <line x1="152" y1="142" x2="228" y2="100" stroke="#64748b" stroke-width="1.1" marker-end="url(#arrow-cyan)"/>
  <line x1="276" y1="122" x2="276" y2="200" stroke="#64748b" stroke-width="1.1" marker-end="url(#arrow-cyan)"/>
  <line x1="322" y1="214" x2="418" y2="180" stroke="#64748b" stroke-width="1.1" marker-end="url(#arrow-cyan)"/>
  <text x="178" y="118" fill="#94a3b8" font-size="8">参与</text>
  <text x="284" y="166" fill="#94a3b8" font-size="8">用</text>
  <text x="356" y="212" fill="#94a3b8" font-size="8">依据</text>

  <!-- 问题框 -->
  <rect x="520" y="86" width="140" height="78" rx="8" fill="rgba(76,29,41,0.35)" stroke="#fb7185" stroke-width="1.3"/>
  <text x="540" y="110" fill="#fca5a5" font-size="9.5" font-weight="700">多跳问题</text>
  <text x="540" y="128" fill="#fca5a5" font-size="9">谁参与项目X、</text>
  <text x="540" y="144" fill="#fca5a5" font-size="9">用了哪笔预算？</text>

  <rect x="520" y="200" width="140" height="44" rx="8" fill="rgba(76,29,41,0.25)" stroke="#fb7185" stroke-width="0.9"/>
  <text x="590" y="227" fill="#fca5a5" font-size="9" text-anchor="middle">朴素向量：答不了</text>

  <rect x="24" y="300" width="632" height="60" rx="8" fill="rgba(6,78,59,0.3)" stroke="#34d399" stroke-width="1.2"/>
  <text x="44" y="326" fill="#6ee7b7" font-size="10.5" font-weight="700">多跳 Recall@5：73.4% → 87.8%（+19.6%）｜ 复杂问题回答率 89% vs 传统 47%</text>
  <text x="44" y="348" fill="#94a3b8" font-size="9">LazyGraphRAG(2025-11) 把索引成本压到约 0.1%，预算紧也能上</text>
</svg>
