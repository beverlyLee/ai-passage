<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 450">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap');
    text { font-family: 'JetBrains Mono','Noto Sans SC','PingFang SC',sans-serif; }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#64748b"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#0f172a"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <text x="20" y="30" fill="#e2e8f0" font-size="15" font-weight="700">图1 · 为什么 RAG 能治幻觉：编 vs 复述</text>
  <text x="20" y="48" fill="#94a3b8" font-size="9.5">模型算的是“下一个词概率”，分布里没有“真/假”维度——不知道也得编</text>

  <!-- 左：纯生成 -->
  <rect x="24" y="72" width="300" height="160" rx="8" fill="rgba(76,29,41,0.35)" stroke="#fb7185" stroke-width="1.4"/>
  <text x="44" y="96" fill="#fb7185" font-size="12" font-weight="700">① 纯生成：按概率编</text>
  <rect x="44" y="108" width="130" height="40" rx="5" fill="rgba(15,23,42,0.6)" stroke="#475569" stroke-width="1"/>
  <text x="109" y="133" fill="#e2e8f0" font-size="11" text-anchor="middle" font-weight="600">LLM Decoder</text>
  <text x="44" y="172" fill="#94a3b8" font-size="9.5">input: “Q3 报销上限?”</text>
  <text x="44" y="190" fill="#fca5a5" font-size="9.5">→ 不知道 → 编一个 (幻觉)</text>
  <text x="44" y="212" fill="#94a3b8" font-size="9">训练目标永远是“像”，不是“对”</text>

  <!-- 右：RAG -->
  <rect x="356" y="72" width="300" height="160" rx="8" fill="rgba(8,51,68,0.35)" stroke="#22d3ee" stroke-width="1.4"/>
  <text x="376" y="96" fill="#22d3ee" font-size="12" font-weight="700">② RAG：按证据复述</text>
  <rect x="376" y="108" width="130" height="40" rx="5" fill="rgba(15,23,42,0.6)" stroke="#22d3ee" stroke-width="1"/>
  <text x="441" y="133" fill="#e2e8f0" font-size="11" text-anchor="middle" font-weight="600">LLM + Context</text>
  <rect x="520" y="108" width="116" height="40" rx="5" fill="rgba(8,51,68,0.5)" stroke="#22d3ee" stroke-width="0.8"/>
  <text x="578" y="124" fill="#e2e8f0" font-size="8.5" text-anchor="middle">[1] 资料片段</text>
  <text x="578" y="138" fill="#e2e8f0" font-size="8.5" text-anchor="middle">[2] 资料片段</text>
  <text x="376" y="172" fill="#94a3b8" font-size="9.5">input: “Q3 上限?” + 检索到的证据</text>
  <text x="376" y="190" fill="#67e8f9" font-size="9.5">→ 复述证据 (有据可依)</text>
  <text x="376" y="212" fill="#94a3b8" font-size="9">证据在推理时动态注入 prompt</text>

  <!-- 中间箭头 -->
  <line x1="324" y1="152" x2="356" y2="152" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="340" y="146" fill="#94a3b8" font-size="8" text-anchor="middle">+检索</text>

  <!-- 底部数据条 -->
  <rect x="24" y="252" width="632" height="120" rx="8" fill="rgba(30,41,59,0.4)" stroke="#334155" stroke-width="1"/>
  <text x="44" y="278" fill="#e2e8f0" font-size="11" font-weight="700">实测：RAG 把幻觉按量级压下去</text>
  <text x="44" y="300" fill="#a5b4fc" font-size="10">· 减幻觉 40–71%（腾讯云）｜ 47–63%（MIT）</text>
  <text x="44" y="318" fill="#a5b4fc" font-size="10">· 事实错误率可降 92%（McKinsey）</text>
  <text x="44" y="336" fill="#a5b4fc" font-size="10">· Mayo Clinic：RAG 92.7% vs 微调 78.4%，成本仅 5–8%</text>
  <text x="44" y="358" fill="#94a3b8" font-size="9">结论：新知识 / 私域 / 高频变更场景，RAG 比微调便宜且更准</text>
</svg>
