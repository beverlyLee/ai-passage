<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 450">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap');
    text { font-family: 'JetBrains Mono','Noto Sans SC','PingFang SC',sans-serif; }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/></pattern>
  </defs>
  <rect width="100%" height="100%" fill="#0f172a"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>
  <text x="20" y="30" fill="#e2e8f0" font-size="15" font-weight="700">图6 · 三个必须挂到看板上的数</text>
  <text x="20" y="48" fill="#94a3b8" font-size="9.5">全部按 p99 而非 p50 读；中位数会让你在某个月爆掉</text>

  <rect x="30" y="70" width="196" height="180" rx="8" fill="rgba(34,211,238,0.08)" stroke="#22d3ee" stroke-width="1.2"/>
  <text x="128" y="94" fill="#67e8f9" font-size="11" font-weight="700" text-anchor="middle">① 单任务成本</text>
  <text x="46" y="118" fill="#cbd5e1" font-size="8">按任务类型分组</text>
  <text x="46" y="136" fill="#cbd5e1" font-size="8">记录 p50 / p90 / p99</text>
  <text x="46" y="160" fill="#64748b" font-size="7.5">不要拿月总额除以任务数，</text>
  <text x="46" y="174" fill="#64748b" font-size="7.5">那个平均数没有意义</text>
  <text x="46" y="198" fill="#67e8f9" font-size="8" font-weight="700">吃掉预算的是长尾，</text>
  <text x="46" y="212" fill="#67e8f9" font-size="8" font-weight="700">不是中位数</text>
  <text x="46" y="238" fill="#94a3b8" font-size="7.5">thinking token 的 p99 常是</text>
  <text x="46" y="250" fill="#94a3b8" font-size="7.5">p50 的 3 到 5 倍</text>

  <rect x="242" y="70" width="196" height="180" rx="8" fill="rgba(251,191,36,0.08)" stroke="#fbbf24" stroke-width="1.2"/>
  <text x="340" y="94" fill="#fbbf24" font-size="11" font-weight="700" text-anchor="middle">② 缓存命中率</text>
  <text x="258" y="118" fill="#cbd5e1" font-size="8">cached_input / total_input</text>
  <text x="258" y="142" fill="#64748b" font-size="7.5">低于 30%：前缀结构有问题</text>
  <text x="258" y="158" fill="#64748b" font-size="7.5">优先查有没有动态内容</text>
  <text x="258" y="172" fill="#64748b" font-size="7.5">混进了前面</text>
  <text x="258" y="196" fill="#fbbf24" font-size="8" font-weight="700">投入产出比最高的一项</text>
  <text x="258" y="222" fill="#94a3b8" font-size="7.5">实测：改一行时间戳的位置，</text>
  <text x="258" y="236" fill="#94a3b8" font-size="7.5">30 轮会话账单降 57%</text>

  <rect x="454" y="70" width="196" height="180" rx="8" fill="rgba(251,113,133,0.08)" stroke="#fb7185" stroke-width="1.2"/>
  <text x="552" y="94" fill="#fda4af" font-size="11" font-weight="700" text-anchor="middle">③ 人工介入率</text>
  <text x="470" y="118" fill="#cbd5e1" font-size="8">按任务时长分桶统计</text>
  <text x="470" y="142" fill="#cbd5e1" font-size="8">需要人插手的比例</text>
  <text x="470" y="166" fill="#64748b" font-size="7.5">这不只是钱的问题，</text>
  <text x="470" y="180" fill="#64748b" font-size="7.5">同时也是质量信号</text>
  <text x="470" y="204" fill="#fda4af" font-size="8" font-weight="700">需要你救四次的 agent，</text>
  <text x="470" y="218" fill="#fda4af" font-size="8" font-weight="700">产出你敢直接合吗</text>
  <text x="470" y="240" fill="#94a3b8" font-size="7.5">基线参考：&lt;15 分钟 86% 零干预，</text>
  <text x="470" y="252" fill="#94a3b8" font-size="7.5">4–8 小时过半需介入</text>

  <rect x="30" y="272" width="620" height="80" rx="8" fill="rgba(148,163,184,0.08)" stroke="#475569" stroke-width="1"/>
  <text x="46" y="294" fill="#e2e8f0" font-size="9.5" font-weight="700">关于 600 美元/天这个数，我的读法</text>
  <text x="46" y="316" fill="#cbd5e1" font-size="8">它验证的不是「AI 很贵」，而是当上下文、并发、轮次三个乘数同时拉满时账单会长成什么样</text>
  <text x="46" y="336" fill="#64748b" font-size="7.5">我们的量级小得多，但乘数是一样的：并发会话数 × 单会话上下文 × 轮次</text>
  <text x="46" y="352" fill="#64748b" font-size="7.5">每多开一个会话，就多一份独立上下文和独立缓存（OpenAI 提到研究员常同时跑 4 个以上会话）</text>

  <text x="20" y="440" fill="#64748b" font-size="7.5">图6 · 三个数挂上去，账单就从玄学变成仪表盘</text>
</svg>
