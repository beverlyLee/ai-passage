<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 450">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap');
    text { font-family: 'JetBrains Mono','Noto Sans SC','PingFang SC',sans-serif; }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/></pattern>
  </defs>
  <rect width="100%" height="100%" fill="#0f172a"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>
  <text x="20" y="30" fill="#e2e8f0" font-size="15" font-weight="700">图2 · output/input 倍数决定谁便宜</text>
  <text x="20" y="48" fill="#94a3b8" font-size="9.5">条形按「output 相对 input 的倍数」等比绘制（input 基准宽 30px），绝对价格为 2026-03 公开价目，每百万 token</text>

  <text x="165" y="78" fill="#67e8f9" font-size="8" text-anchor="middle">input</text>
  <text x="330" y="78" fill="#fda4af" font-size="8" text-anchor="middle">output（等比放大）</text>
  <text x="622" y="78" fill="#94a3b8" font-size="8" text-anchor="middle">倍数</text>

  <text x="30" y="106" fill="#cbd5e1" font-size="9">DeepSeek V3</text>
  <rect x="150" y="96" width="30" height="14" rx="2" fill="#22d3ee"/>
  <text x="186" y="108" fill="#64748b" font-size="8">$0.28</text>
  <rect x="240" y="96" width="45" height="14" rx="2" fill="#fb7185"/>
  <text x="291" y="108" fill="#94a3b8" font-size="8">$0.42</text>
  <text x="622" y="108" fill="#22d3ee" font-size="11" font-weight="700" text-anchor="middle">1.5x</text>

  <text x="30" y="142" fill="#cbd5e1" font-size="9">GPT-4o</text>
  <rect x="150" y="132" width="30" height="14" rx="2" fill="#22d3ee"/>
  <text x="186" y="144" fill="#64748b" font-size="8">$2.50</text>
  <rect x="240" y="132" width="120" height="14" rx="2" fill="#fb7185"/>
  <text x="366" y="144" fill="#94a3b8" font-size="8">$10.00</text>
  <text x="622" y="144" fill="#fbbf24" font-size="11" font-weight="700" text-anchor="middle">4x</text>

  <text x="30" y="178" fill="#cbd5e1" font-size="9">Claude Sonnet 4.6</text>
  <rect x="150" y="168" width="30" height="14" rx="2" fill="#22d3ee"/>
  <text x="186" y="180" fill="#64748b" font-size="8">$3.00</text>
  <rect x="240" y="168" width="150" height="14" rx="2" fill="#fb7185"/>
  <text x="396" y="180" fill="#94a3b8" font-size="8">$15.00</text>
  <text x="622" y="180" fill="#fb7185" font-size="11" font-weight="700" text-anchor="middle">5x</text>

  <text x="30" y="214" fill="#cbd5e1" font-size="9">Gemini 2.5 Pro</text>
  <rect x="150" y="204" width="30" height="14" rx="2" fill="#22d3ee"/>
  <text x="186" y="216" fill="#64748b" font-size="8">$1.25</text>
  <rect x="240" y="204" width="240" height="14" rx="2" fill="#fb7185"/>
  <text x="486" y="216" fill="#94a3b8" font-size="8">$10.00</text>
  <text x="622" y="216" fill="#fda4af" font-size="11" font-weight="700" text-anchor="middle">8x</text>

  <line x1="30" y1="240" x2="650" y2="240" stroke="#334155" stroke-width="1"/>

  <rect x="30" y="258" width="300" height="158" rx="8" fill="rgba(34,211,238,0.08)" stroke="#22d3ee" stroke-width="1"/>
  <text x="180" y="280" fill="#67e8f9" font-size="10.5" font-weight="700" text-anchor="middle">长输入 · 短输出</text>
  <text x="46" y="302" fill="#cbd5e1" font-size="8.5">总结 / 抽取 / 分类 / RAG 回答</text>
  <text x="46" y="326" fill="#64748b" font-size="8">成本被 input 主导，output 只占小头</text>
  <text x="46" y="344" fill="#67e8f9" font-size="8.5" font-weight="700">→ 选 input 单价低的</text>
  <text x="46" y="368" fill="#94a3b8" font-size="7.5">倍数高的模型也可能更便宜：</text>
  <text x="46" y="382" fill="#94a3b8" font-size="7.5">8x 但 input $1.25 的，在这个形状下</text>
  <text x="46" y="396" fill="#94a3b8" font-size="7.5">可能赢过 4x 但 input $2.50 的</text>

  <rect x="350" y="258" width="300" height="158" rx="8" fill="rgba(251,113,133,0.08)" stroke="#fb7185" stroke-width="1"/>
  <text x="500" y="280" fill="#fda4af" font-size="10.5" font-weight="700" text-anchor="middle">短输入 · 长输出（多轮）</text>
  <text x="366" y="302" fill="#cbd5e1" font-size="8.5">agent 循环 / 反复改代码 / 长文生成</text>
  <text x="366" y="326" fill="#64748b" font-size="8">成本被 output 主导，且复合收费</text>
  <text x="366" y="344" fill="#fda4af" font-size="8.5" font-weight="700">→ 选 output 单价低的</text>
  <text x="366" y="368" fill="#94a3b8" font-size="7.5">模型自己生成的 token，下一轮会</text>
  <text x="366" y="382" fill="#94a3b8" font-size="7.5">作为 input 被重新收一次钱</text>
  <text x="366" y="396" fill="#94a3b8" font-size="7.5">这是 agent 场景真正的吞钱口</text>

  <text x="20" y="440" fill="#64748b" font-size="7.5">图2 · 选型前先量自己的输入输出比；多数团队答不上来，是因为没人量过</text>
</svg>
