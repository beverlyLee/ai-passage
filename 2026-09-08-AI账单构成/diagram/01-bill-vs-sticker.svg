<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 450">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap');
    text { font-family: 'JetBrains Mono','Noto Sans SC','PingFang SC',sans-serif; }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/></pattern>
  </defs>
  <rect width="100%" height="100%" fill="#0f172a"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>
  <text x="20" y="30" fill="#e2e8f0" font-size="15" font-weight="700">图1 · 定价页上的单价，不是你付的单价</text>
  <text x="20" y="48" fill="#94a3b8" font-size="9.5">账单里至少有三项，是「输入 + 输出」这个公式算不出来的</text>

  <rect x="30" y="74" width="290" height="150" rx="8" fill="rgba(34,211,238,0.08)" stroke="#22d3ee" stroke-width="1.2"/>
  <text x="175" y="96" fill="#67e8f9" font-size="11" font-weight="700" text-anchor="middle">你以为的账单</text>
  <text x="46" y="122" fill="#cbd5e1" font-size="8.5">input tokens × input 单价</text>
  <text x="46" y="142" fill="#cbd5e1" font-size="8.5">+ output tokens × output 单价</text>
  <text x="46" y="170" fill="#64748b" font-size="7.5">定价页引用的往往是 input 价，</text>
  <text x="46" y="184" fill="#64748b" font-size="7.5">因为它是三家厂商里最小的数字</text>
  <text x="46" y="208" fill="#67e8f9" font-size="9" font-weight="700">估算结果：系统性低估</text>

  <rect x="360" y="74" width="290" height="150" rx="8" fill="rgba(251,113,133,0.08)" stroke="#fb7185" stroke-width="1.2"/>
  <text x="505" y="96" fill="#fda4af" font-size="11" font-weight="700" text-anchor="middle">实际账单</text>
  <text x="376" y="122" fill="#cbd5e1" font-size="8.5">① reasoning token（按 output 计费，不可见）</text>
  <text x="376" y="142" fill="#cbd5e1" font-size="8.5">② 缓存写入溢价（1.25x / 2x input）</text>
  <text x="376" y="162" fill="#cbd5e1" font-size="8.5">③ 非生产流量（CI / staging / 压测）</text>
  <text x="376" y="190" fill="#64748b" font-size="7.5">首次按环境拆分时常发现</text>
  <text x="376" y="204" fill="#64748b" font-size="7.5">非生产占总量 30%–50%</text>
  <text x="376" y="222" fill="#fda4af" font-size="9" font-weight="700">低估倍数：不确定</text>

  <text x="340" y="150" fill="#64748b" font-size="20" text-anchor="middle">≠</text>

  <rect x="30" y="248" width="620" height="46" rx="8" fill="rgba(148,163,184,0.08)" stroke="#475569" stroke-width="1"/>
  <text x="46" y="268" fill="#e2e8f0" font-size="9.5" font-weight="700">共同点：这三项都不在「输入 + 输出」的心智模型里</text>
  <text x="46" y="285" fill="#94a3b8" font-size="8">所以用这个模型估算，一定会低估，而且低估多少说不准</text>

  <rect x="30" y="312" width="620" height="106" rx="8" fill="rgba(251,191,36,0.07)" stroke="#fbbf24" stroke-width="1"/>
  <text x="46" y="332" fill="#fbbf24" font-size="10" font-weight="700">一个公开的对照样本</text>
  <text x="46" y="354" fill="#cbd5e1" font-size="8.5">GPT-5 reasoning 单次调用：可见回答 400 token，内部思考 3000 token</text>
  <text x="46" y="374" fill="#cbd5e1" font-size="8.5">思考占该次成本的 79%；只算输入 + 可见输出的 naive 估算低估 381%</text>
  <text x="46" y="398" fill="#64748b" font-size="7.5">同一 prompt 在不同难度下思考量差 3–5 倍，所以按 p50 做预算会在某个月爆掉</text>
  <text x="46" y="412" fill="#64748b" font-size="7.5">来源：OpenAI / Anthropic 计费文档与公开推理成本测算口径</text>

  <text x="20" y="440" fill="#64748b" font-size="7.5">图1 · 账单构成的第一层：先承认账本本身就不完整</text>
</svg>
