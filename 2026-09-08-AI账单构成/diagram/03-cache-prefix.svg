<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 450">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap');
    text { font-family: 'JetBrains Mono','Noto Sans SC','PingFang SC',sans-serif; }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/></pattern>
  </defs>
  <rect width="100%" height="100%" fill="#0f172a"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>
  <text x="20" y="30" fill="#e2e8f0" font-size="15" font-weight="700">图3 · 一个时间戳如何作废 60K 上下文</text>
  <text x="20" y="48" fill="#94a3b8" font-size="9.5">缓存是「精确前缀匹配」：前缀里动一个 token，从那往后的内容全部失效</text>

  <text x="30" y="76" fill="#67e8f9" font-size="9" font-weight="700">第 1 轮请求</text>
  <rect x="30" y="86" width="88" height="26" rx="4" fill="rgba(34,211,238,0.18)" stroke="#22d3ee" stroke-width="1"/>
  <text x="74" y="103" fill="#67e8f9" font-size="7.5" text-anchor="middle">系统提示</text>
  <rect x="122" y="86" width="150" height="26" rx="4" fill="rgba(34,211,238,0.18)" stroke="#22d3ee" stroke-width="1"/>
  <text x="197" y="103" fill="#67e8f9" font-size="7.5" text-anchor="middle">工具定义（24K）</text>
  <rect x="276" y="86" width="150" height="26" rx="4" fill="rgba(34,211,238,0.18)" stroke="#22d3ee" stroke-width="1"/>
  <text x="351" y="103" fill="#67e8f9" font-size="7.5" text-anchor="middle">代码库索引（30K）</text>
  <rect x="430" y="86" width="120" height="26" rx="4" fill="rgba(34,211,238,0.18)" stroke="#22d3ee" stroke-width="1"/>
  <text x="490" y="103" fill="#67e8f9" font-size="7.5" text-anchor="middle">历史对话</text>
  <rect x="554" y="86" width="96" height="26" rx="4" fill="rgba(251,191,36,0.15)" stroke="#fbbf24" stroke-width="1"/>
  <text x="602" y="103" fill="#fbbf24" font-size="7.5" text-anchor="middle">用户问题</text>
  <text x="30" y="130" fill="#22d3ee" font-size="8">整段前缀可缓存 → 60K 命中，读价 0.1x</text>

  <text x="30" y="166" fill="#fda4af" font-size="9" font-weight="700">第 2 轮请求（系统提示第 3 行塞了时间戳）</text>
  <rect x="30" y="176" width="44" height="26" rx="4" fill="rgba(34,211,238,0.18)" stroke="#22d3ee" stroke-width="1"/>
  <text x="52" y="193" fill="#67e8f9" font-size="7.5" text-anchor="middle">前两行</text>
  <rect x="78" y="176" width="90" height="26" rx="4" fill="rgba(251,113,133,0.22)" stroke="#fb7185" stroke-width="1.4"/>
  <text x="123" y="193" fill="#fda4af" font-size="7.5" text-anchor="middle">当前时间 15:32</text>
  <rect x="172" y="176" width="150" height="26" rx="4" fill="rgba(251,113,133,0.12)" stroke="#fb7185" stroke-width="1"/>
  <text x="247" y="193" fill="#fda4af" font-size="7.5" text-anchor="middle">工具定义（24K）</text>
  <rect x="326" y="176" width="150" height="26" rx="4" fill="rgba(251,113,133,0.12)" stroke="#fb7185" stroke-width="1"/>
  <text x="401" y="193" fill="#fda4af" font-size="7.5" text-anchor="middle">代码库索引（30K）</text>
  <rect x="480" y="176" width="120" height="26" rx="4" fill="rgba(251,113,133,0.12)" stroke="#fb7185" stroke-width="1"/>
  <text x="540" y="193" fill="#fda4af" font-size="7.5" text-anchor="middle">历史对话</text>
  <rect x="604" y="176" width="46" height="26" rx="4" fill="rgba(251,191,36,0.15)" stroke="#fbbf24" stroke-width="1"/>
  <text x="627" y="193" fill="#fbbf24" font-size="7.5" text-anchor="middle">新问题</text>

  <path d="M 168 203 L 168 216 L 640 216" fill="none" stroke="#fb7185" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="404" y="231" fill="#fda4af" font-size="8" text-anchor="middle">从这里往后全部按全价重新 prefill</text>
  <text x="30" y="252" fill="#fda4af" font-size="8">命中 0 → 60K 全价重算，缓存写入费还白付了 1.25x</text>

  <rect x="30" y="272" width="300" height="146" rx="8" fill="rgba(34,211,238,0.07)" stroke="#22d3ee" stroke-width="1"/>
  <text x="180" y="294" fill="#67e8f9" font-size="10.5" font-weight="700" text-anchor="middle">正确结构：静态在前，动态在后</text>
  <text x="46" y="316" fill="#cbd5e1" font-size="8">· 系统提示、工具定义、参考文档</text>
  <text x="46" y="332" fill="#cbd5e1" font-size="8">· 顺序固定、内容冻结</text>
  <text x="46" y="352" fill="#cbd5e1" font-size="8">· 断点放在最大静态块末尾</text>
  <text x="46" y="372" fill="#64748b" font-size="7.5">时间戳、UUID、随机会话变量、用户问题</text>
  <text x="46" y="386" fill="#64748b" font-size="7.5">一律放最后，或直接删掉</text>
  <text x="46" y="406" fill="#67e8f9" font-size="8.5" font-weight="700">改动成本：挪一行代码的位置</text>

  <rect x="350" y="272" width="300" height="146" rx="8" fill="rgba(251,113,133,0.07)" stroke="#fb7185" stroke-width="1"/>
  <text x="500" y="294" fill="#fda4af" font-size="10.5" font-weight="700" text-anchor="middle">算例：30 轮 agent 会话</text>
  <text x="366" y="316" fill="#cbd5e1" font-size="8">稳定前缀 60K，每轮新增 2K</text>
  <text x="366" y="338" fill="#94a3b8" font-size="8">无缓存：约 2.73M input → $8.19</text>
  <text x="366" y="356" fill="#94a3b8" font-size="8">有缓存：约 1.179M 等效 → $3.54</text>
  <text x="366" y="380" fill="#fb7185" font-size="10" font-weight="700">差 57%</text>
  <text x="366" y="400" fill="#64748b" font-size="7.5">按 Claude Sonnet 4.6 $3/M input 计算；</text>
  <text x="366" y="412" fill="#64748b" font-size="7.5">5 分钟 TTL 缓存在第二次读取即回本</text>

  <text x="20" y="440" fill="#64748b" font-size="7.5">图3 · 缓存是前缀结构问题，不是开关问题</text>
</svg>
