<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 450">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap');
    text { font-family: 'JetBrains Mono','Noto Sans SC','PingFang SC',sans-serif; }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/></pattern>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#22d3ee"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#0f172a"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>
  <text x="20" y="30" fill="#e2e8f0" font-size="15" font-weight="700">图5 · 三层治理：收益递减，成本递增</text>
  <text x="20" y="48" fill="#94a3b8" font-size="9.5">从上往下做；第一层几乎零成本，第三层需要改工程结构</text>

  <rect x="40" y="72" width="600" height="98" rx="8" fill="rgba(34,211,238,0.10)" stroke="#22d3ee" stroke-width="1.4"/>
  <text x="60" y="94" fill="#67e8f9" font-size="11.5" font-weight="700">第一层 · 计价层</text>
  <text x="620" y="94" fill="#22d3ee" font-size="8.5" text-anchor="end">收益最高，成本最低</text>
  <text x="60" y="118" fill="#cbd5e1" font-size="8.5">· 先量自己的 input / output 比和 reasoning 占比，再选模型</text>
  <text x="60" y="136" fill="#cbd5e1" font-size="8.5">· 不要求实时的活全部走 Batch：50% 折扣 + 独立速率配额</text>
  <text x="60" y="158" fill="#64748b" font-size="7.5">常见错误：按定价页的 input 价格选模型，而你的负载是 output 主导</text>

  <rect x="40" y="188" width="600" height="98" rx="8" fill="rgba(251,191,36,0.09)" stroke="#fbbf24" stroke-width="1.2"/>
  <text x="60" y="210" fill="#fbbf24" font-size="11.5" font-weight="700">第二层 · 缓存层</text>
  <text x="620" y="210" fill="#fbbf24" font-size="8.5" text-anchor="end">改配置，投入产出比最高</text>
  <text x="60" y="234" fill="#cbd5e1" font-size="8.5">· prompt 拆成「静态块 + 动态尾巴」，静态顺序固定、内容冻结</text>
  <text x="60" y="252" fill="#cbd5e1" font-size="8.5">· 加前缀长度断言：低于厂商最小门槛（1024 / 4096）会静默失效</text>
  <text x="60" y="274" fill="#64748b" font-size="7.5">断点最多 4 个，放在最大静态块末尾；TTL 是滑动的，命中才免费刷新</text>

  <rect x="40" y="304" width="600" height="98" rx="8" fill="rgba(251,113,133,0.09)" stroke="#fb7185" stroke-width="1.2"/>
  <text x="60" y="326" fill="#fda4af" font-size="11.5" font-weight="700">第三层 · 循环层</text>
  <text x="620" y="326" fill="#fb7185" font-size="8.5" text-anchor="end">要改工程结构</text>
  <text x="60" y="350" fill="#cbd5e1" font-size="8.5">· 三重止损：轮次上限 / 累计金额上限 / 连续 N 轮无进展</text>
  <text x="60" y="368" fill="#cbd5e1" font-size="8.5">· 无进展的判定：最近 3 轮 diff 为空，或反复打开同一批文件</text>
  <text x="60" y="390" fill="#64748b" font-size="7.5">第三个最容易被忽略，但它拦住的正是 3336 次调用里的大部分无效往返</text>

  <text x="20" y="440" fill="#64748b" font-size="7.5">图5 · 结构问题是一次性的：调对一次，之后每个月的账单都是那个形状</text>
</svg>
