<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 450">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap');
    text { font-family: 'JetBrains Mono', 'Noto Sans SC', 'PingFang SC', monospace; }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <marker id="arrow-cyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#22d3ee"/>
    </marker>
    <marker id="arrow-violet" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#a78bfa"/>
    </marker>
    <marker id="arrow-emerald" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34d399"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#0f172a"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <!-- Title -->
  <text x="20" y="26" fill="#ffffff" font-size="16" font-weight="700">Laya GPU 快速路径：同一套决策，换一组融合核</text>
  <text x="20" y="44" fill="#94a3b8" font-size="10">FastLaya (fast.py) + tl_kernels.py：TileLang 融合核 + 16 位常驻权重 + CUDA graph</text>

  <!-- top note -->
  <rect x="24" y="58" width="632" height="30" rx="6" fill="rgba(15,23,42,0.5)" stroke="#1e293b" stroke-width="1.5"/>
  <text x="340" y="78" fill="#e2e8f0" font-size="9" text-anchor="middle">FastLaya.__init__ 复用 model.scorer / model.act_head（决策逻辑一处定义）；权重 16 位常驻，emb/RoPE upcast fp32 再读</text>

  <!-- left: stock -->
  <rect x="24" y="98" width="300" height="120" rx="8" fill="rgba(8,51,68,0.3)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="174" y="118" fill="#22d3ee" font-size="11" font-weight="600" text-anchor="middle">stock 路径（CPU / 无 CUDA）</text>
  <rect x="44" y="130" width="260" height="38" rx="6" fill="rgba(8,51,68,0.5)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="174" y="153" fill="#e2e8f0" font-size="10" text-anchor="middle">encoder + 2 层 head（重活）</text>
  <rect x="44" y="176" width="260" height="32" rx="6" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="174" y="197" fill="#a78bfa" font-size="10" text-anchor="middle">scorer / act_head（共享）</text>

  <!-- right: fast -->
  <rect x="356" y="98" width="300" height="170" rx="8" fill="rgba(76,29,149,0.3)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="506" y="118" fill="#a78bfa" font-size="11" font-weight="600" text-anchor="middle">FastLaya 路径（CUDA + tilelang）</text>
  <rect x="372" y="130" width="84" height="30" rx="5" fill="rgba(76,29,149,0.5)" stroke="#a78bfa" stroke-width="1.2"/>
  <text x="414" y="150" fill="#a78bfa" font-size="9" text-anchor="middle">gemm</text>
  <rect x="466" y="130" width="100" height="30" rx="5" fill="rgba(76,29,149,0.5)" stroke="#a78bfa" stroke-width="1.2"/>
  <text x="516" y="150" fill="#a78bfa" font-size="9" text-anchor="middle">gemm_geglu</text>
  <rect x="576" y="130" width="72" height="30" rx="5" fill="rgba(76,29,149,0.5)" stroke="#a78bfa" stroke-width="1.2"/>
  <text x="612" y="150" fill="#a78bfa" font-size="9" text-anchor="middle">add_ln</text>
  <rect x="372" y="168" width="84" height="30" rx="5" fill="rgba(76,29,149,0.5)" stroke="#a78bfa" stroke-width="1.2"/>
  <text x="414" y="188" fill="#a78bfa" font-size="9" text-anchor="middle">rope</text>
  <rect x="466" y="168" width="182" height="30" rx="5" fill="rgba(76,29,149,0.5)" stroke="#a78bfa" stroke-width="1.2"/>
  <text x="557" y="188" fill="#a78bfa" font-size="9" text-anchor="middle">attn (flash, 滑动窗口)</text>
  <text x="506" y="224" fill="#94a3b8" font-size="9" text-anchor="middle">残差流保 fp32（ModernBERT 残差激活 ~3e4，bf16 每层丢 ~100）</text>
  <text x="506" y="240" fill="#94a3b8" font-size="9" text-anchor="middle">M pad 到 16 倍数（TileLang 谓词处理越界行）</text>

  <!-- replace arrow -->
  <line x1="324" y1="149" x2="354" y2="149" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="339" y="143" fill="#94a3b8" font-size="8" text-anchor="middle">重活→融合核</text>

  <!-- shared box -->
  <rect x="262" y="286" width="156" height="52" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="340" y="308" fill="#34d399" font-size="10" font-weight="600" text-anchor="middle">共享 scorer / act_head</text>
  <text x="340" y="324" fill="#94a3b8" font-size="9" text-anchor="middle">(fast.py 复用，非重定义)</text>
  <line x1="174" y1="218" x2="318" y2="284" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrow-emerald)"/>
  <line x1="506" y1="268" x2="362" y2="286" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrow-emerald)"/>

  <!-- length bucket note -->
  <rect x="24" y="354" width="632" height="30" rx="6" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="340" y="374" fill="#fbbf24" font-size="9" text-anchor="middle">长度分桶：L&lt;=256 动态形 attn 核；&gt;256 每 64 预编译静态核；_encode_graphed 用 RLock 护静态缓冲</text>

  <text x="20" y="438" fill="#94a3b8" font-size="9">决策不变：校准 / 门控只有一处定义，fast 与 stock 在 '该信哪个答案' 上不会分叉</text>
</svg>
