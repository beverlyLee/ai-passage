<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 450">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap');
    text { font-family: 'JetBrains Mono', 'Noto Sans SC', 'PingFang SC', monospace; }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <marker id="arrow-cyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#22d3ee"/>
    </marker>
    <marker id="arrow-violet" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#a78bfa"/>
    </marker>
    <marker id="arrow-emerald" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34d399"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#0f172a"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <!-- Title -->
  <text x="20" y="26" fill="#ffffff" font-size="16" font-weight="700">Laya 决策头：一次前向同时给选项打分和判定动作</text>
  <text x="20" y="44" fill="#94a3b8" font-size="10">DecisionModel (common.py 149-218)：双向编码器 + 从零训练决策头，无自回归解码</text>

  <!-- encoder -->
  <rect x="36" y="64" width="190" height="52" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="131" y="86" fill="#22d3ee" font-size="10" font-weight="600" text-anchor="middle">encoder.last_hidden_state</text>
  <text x="131" y="102" fill="#94a3b8" font-size="9" text-anchor="middle">ModernBERT-large 双向编码</text>

  <!-- type_emb -->
  <rect x="262" y="64" width="150" height="52" rx="6" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="337" y="86" fill="#a78bfa" font-size="10" font-weight="600" text-anchor="middle">type_emb(qtype)</text>
  <text x="337" y="102" fill="#94a3b8" font-size="9" text-anchor="middle">按问题类型加偏置</text>

  <!-- head -->
  <rect x="448" y="64" width="190" height="52" rx="6" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="543" y="86" fill="#a78bfa" font-size="10" font-weight="600" text-anchor="middle">head: 2× TransformerEncoder</text>
  <text x="543" y="102" fill="#94a3b8" font-size="9" text-anchor="middle">pre-norm，两层</text>

  <!-- arrows across top -->
  <line x1="226" y1="90" x2="260" y2="90" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrow-cyan)"/>
  <text x="243" y="84" fill="#22d3ee" font-size="8" text-anchor="middle">h += type_emb</text>
  <line x1="412" y1="90" x2="446" y2="90" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrow-cyan)"/>

  <!-- gather -->
  <rect x="448" y="146" width="190" height="40" rx="6" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="543" y="170" fill="#a78bfa" font-size="10" font-weight="600" text-anchor="middle">marker gather (torch.gather)</text>
  <text x="543" y="184" fill="#94a3b8" font-size="9" text-anchor="middle">在 [MASK] 位置抽隐状态</text>
  <line x1="543" y1="116" x2="543" y2="144" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arrow-violet)"/>

  <!-- scorer -->
  <rect x="448" y="206" width="190" height="40" rx="6" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="543" y="230" fill="#a78bfa" font-size="10" font-weight="600" text-anchor="middle">scorer: LN→Linear→GELU→Linear(1)</text>
  <text x="543" y="244" fill="#94a3b8" font-size="9" text-anchor="middle">每个 marker 一个 logit</text>
  <line x1="543" y1="186" x2="543" y2="204" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arrow-violet)"/>

  <!-- softmax -->
  <rect x="448" y="266" width="190" height="40" rx="6" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="543" y="290" fill="#a78bfa" font-size="10" font-weight="600" text-anchor="middle">softmax(logits.detach())</text>
  <text x="543" y="304" fill="#94a3b8" font-size="9" text-anchor="middle">→ p（选项概率，无梯度）</text>
  <line x1="543" y1="246" x2="543" y2="264" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arrow-violet)"/>

  <!-- logits output -->
  <rect x="448" y="326" width="190" height="34" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="543" y="348" fill="#22d3ee" font-size="10" font-weight="600" text-anchor="middle">返回 logits（选项打分）</text>
  <line x1="543" y1="306" x2="543" y2="324" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arrow-violet)"/>

  <!-- pooled -->
  <rect x="36" y="206" width="200" height="34" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="136" y="228" fill="#34d399" font-size="10" font-weight="600" text-anchor="middle">pooled = h[:,0]（CLS 池化）</text>

  <!-- feats -->
  <rect x="36" y="256" width="200" height="44" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="136" y="278" fill="#34d399" font-size="10" font-weight="600" text-anchor="middle">feats = [top1, top1-top2,</text>
  <text x="136" y="292" fill="#34d399" font-size="10" font-weight="600" text-anchor="middle">  ent, k/255]</text>
  <line x1="136" y1="240" x2="136" y2="254" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrow-emerald)"/>

  <!-- act_head -->
  <rect x="262" y="256" width="180" height="52" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="352" y="278" fill="#34d399" font-size="10" font-weight="600" text-anchor="middle">act_head: Linear(d+4)→</text>
  <text x="352" y="292" fill="#34d399" font-size="10" font-weight="600" text-anchor="middle">GELU→Linear(2)</text>
  <text x="352" y="306" fill="#94a3b8" font-size="9" text-anchor="middle">判定 动不动 / 动哪类</text>
  <line x1="236" y1="278" x2="260" y2="278" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrow-emerald)"/>

  <!-- CLS arrow from head to pooled -->
  <line x1="448" y1="90" x2="240" y2="223" stroke="#64748b" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="330" y="150" fill="#94a3b8" font-size="8" text-anchor="middle">h[:,0]</text>

  <!-- act_logits output -->
  <rect x="262" y="326" width="180" height="34" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="352" y="348" fill="#34d399" font-size="10" font-weight="600" text-anchor="middle">返回 act_logits（动作判定）</text>
  <line x1="352" y1="308" x2="352" y2="324" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrow-emerald)"/>

  <!-- annotation -->
  <rect x="36" y="372" width="602" height="46" rx="6" fill="rgba(15,23,42,0.5)" stroke="#1e293b" stroke-width="1.5"/>
  <text x="337" y="392" fill="#e2e8f0" font-size="10" text-anchor="middle">无自回归解码：选项概率从 marker 隐状态 softmax 出，动作从 CLS 池化 + 4 维特征出</text>
  <text x="337" y="408" fill="#94a3b8" font-size="9" text-anchor="middle">输出 token 免费：同属 System 1 判断引擎，非 System 2 生成引擎</text>

  <text x="20" y="438" fill="#94a3b8" font-size="9">单选项：top2 补 0 使 margin=1.0（送 '完全确定' 信号）；k = 有效 marker 数（至少 2）</text>
</svg>
