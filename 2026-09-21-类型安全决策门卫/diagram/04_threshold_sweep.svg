<svg xmlns="http://www.w3.org/2000/svg" width="680" height="450" viewBox="0 0 680 450">
  <rect width="680" height="450" fill="#0f172a"/>
  <g stroke="#1e293b" stroke-width="1">
    <line x1="0" y1="120" x2="680" y2="120"/>
  </g>
  <text x="24" y="30" fill="#e2e8f0" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="17">阈值扫描：误拦截率 vs 误放行率随阈值变化</text>

  <g stroke="#475569" stroke-width="1.5">
    <line x1="80" y1="360" x2="610" y2="360"/>
    <line x1="80" y1="360" x2="80" y2="70"/>
  </g>

  <rect x="288" y="80" width="208" height="280" fill="#fbbf24" opacity="0.08"/>
  <text x="392" y="100" text-anchor="middle" fill="#fbbf24" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="12">权衡区</text>

  <polyline points="80,136 184,158 288,209 392,265 496,321 600,360" fill="none" stroke="#fb7185" stroke-width="2.5"/>
  <polyline points="80,352 184,332 288,293 392,242 496,186 600,122" fill="none" stroke="#22d3ee" stroke-width="2.5"/>

  <g fill="#fb7185">
    <circle cx="80" cy="136" r="3"/><circle cx="184" cy="158" r="3"/><circle cx="288" cy="209" r="3"/><circle cx="392" cy="265" r="3"/><circle cx="496" cy="321" r="3"/><circle cx="600" cy="360" r="3"/>
  </g>
  <g fill="#22d3ee">
    <circle cx="80" cy="352" r="3"/><circle cx="184" cy="332" r="3"/><circle cx="288" cy="293" r="3"/><circle cx="392" cy="242" r="3"/><circle cx="496" cy="186" r="3"/><circle cx="600" cy="122" r="3"/>
  </g>

  <text x="150" y="130" fill="#fb7185" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="11">误放行率 (越低越安全)</text>
  <text x="430" y="360" fill="#22d3ee" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="11">误拦截率 (越高越堵)</text>

  <text x="80" y="380" fill="#94a3b8" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="10">0.5</text>
  <text x="180" y="380" fill="#94a3b8" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="10">0.6</text>
  <text x="284" y="380" fill="#94a3b8" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="10">0.7</text>
  <text x="388" y="380" fill="#94a3b8" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="10">0.8</text>
  <text x="492" y="380" fill="#94a3b8" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="10">0.9</text>
  <text x="588" y="380" fill="#94a3b8" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="10">1.0</text>
  <text x="620" y="364" fill="#94a3b8" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="10">阈值→</text>

  <text x="80" y="70" fill="#94a3b8" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="10">比率↑</text>
  <text x="40" y="364" fill="#94a3b8" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="10">0%</text>
  <text x="36" y="80" fill="#94a3b8" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="10">100%</text>
</svg>
