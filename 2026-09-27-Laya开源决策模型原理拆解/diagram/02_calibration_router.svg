<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 450">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap');
    text { font-family: 'JetBrains Mono', 'Noto Sans SC', 'PingFang SC', monospace; }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <marker id="arrow-rose" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#fb7185"/>
    </marker>
    <marker id="arrow-cyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#22d3ee"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#0f172a"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <text x="20" y="28" fill="#ffffff" font-size="16" font-weight="700">置信度不能直接当真：校准 + Router 前置</text>

  <!-- ===== Left: calibration ===== -->
  <text x="40" y="52" fill="#fbbf24" font-size="12" font-weight="700">① 校准：置信度不能直接信</text>

  <rect x="40" y="66" width="290" height="74" rx="6" fill="#0f172a"/>
  <rect x="40" y="66" width="290" height="74" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="56" y="88" fill="#22d3ee" font-size="11" font-weight="600">发布版零样本 ECE = 0.207</text>
  <text x="56" y="108" fill="#94a3b8" font-size="9">整体偏高（in-task 才 0.060），必须校准后</text>
  <text x="56" y="124" fill="#94a3b8" font-size="9">才敢按阈值自动放行，否则会翻车。</text>

  <line x1="185" y1="140" x2="185" y2="156" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="40" y="156" width="290" height="70" rx="6" fill="#0f172a"/>
  <rect x="40" y="156" width="290" height="70" rx="6" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="56" y="178" fill="#fbbf24" font-size="11" font-weight="600">选择性自动化门控</text>
  <text x="56" y="198" fill="#ffffff" font-size="9">只放行 confidence &gt;= 0.85 的预测，</text>
  <text x="56" y="214" fill="#ffffff" font-size="9">其余交回人工，避免高信心瞎判断。</text>

  <line x1="185" y1="226" x2="185" y2="242" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="40" y="242" width="290" height="70" rx="6" fill="#0f172a"/>
  <rect x="40" y="242" width="290" height="70" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="56" y="264" fill="#34d399" font-size="11" font-weight="600">门控后的结果</text>
  <text x="56" y="284" fill="#ffffff" font-size="9">覆盖约 50% 工单，准确率 92.2%、</text>
  <text x="56" y="300" fill="#ffffff" font-size="9">ECE 0.041，剩下一半交人工。</text>

  <!-- ===== Right: Router ===== -->
  <text x="360" y="52" fill="#fb7185" font-size="12" font-weight="700">② Router：陌生脚本会翻车</text>

  <rect x="360" y="66" width="290" height="88" rx="6" fill="#0f172a"/>
  <rect x="360" y="66" width="290" height="88" rx="6" fill="rgba(136,19,55,0.4)" stroke="#fb7185" stroke-width="1.5"/>
  <text x="376" y="88" fill="#fb7185" font-size="11" font-weight="600">灾难案例</text>
  <text x="376" y="108" fill="#ffffff" font-size="9">高棉文（非拉丁）丢给英文 checkpoint，</text>
  <text x="376" y="124" fill="#ffffff" font-size="9">它仍吐出分布，信心报 <tspan fill="#fb7185" font-weight="700">0.952</tspan>，</text>
  <text x="376" y="140" fill="#ffffff" font-size="9">但实测准确率只有 <tspan fill="#fb7185" font-weight="700">0.000</tspan>。</text>

  <line x1="505" y1="154" x2="505" y2="172" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="360" y="172" width="290" height="64" rx="6" fill="#0f172a"/>
  <rect x="360" y="172" width="290" height="64" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="376" y="194" fill="#22d3ee" font-size="11" font-weight="600">Router 前置（纯 Python）</text>
  <text x="376" y="214" fill="#ffffff" font-size="9">按书写系统 / 语言选对 checkpoint，</text>
  <text x="376" y="228" fill="#ffffff" font-size="9">耗时 &lt; 0.5ms，比一次推理便宜得多。</text>

  <!-- checkpoint split -->
  <path d="M 505 236 C 505 244, 430 246, 430 254" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 505 236 C 505 244, 580 246, 580 254" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="360" y="256" width="140" height="64" rx="6" fill="#0f172a"/>
  <rect x="360" y="256" width="140" height="64" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="430" y="282" fill="#22d3ee" font-size="11" font-weight="600" text-anchor="middle">laya</text>
  <text x="430" y="302" fill="#94a3b8" font-size="9" text-anchor="middle">英文 · 421M</text>

  <rect x="510" y="256" width="140" height="64" rx="6" fill="#0f172a"/>
  <rect x="510" y="256" width="140" height="64" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="580" y="282" fill="#34d399" font-size="11" font-weight="600" text-anchor="middle">multilingual</text>
  <text x="580" y="302" fill="#94a3b8" font-size="9" text-anchor="middle">100+ 语言 · 322M</text>

  <!-- bottom note -->
  <text x="40" y="340" fill="#64748b" font-size="8">校准治的是「整体偏高」；Router 治的是「英文权重在没见过的书写系统上仍报高信心」。</text>
</svg>
