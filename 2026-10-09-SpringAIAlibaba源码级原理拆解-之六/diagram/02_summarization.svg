<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 580">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <marker id="arrow-cyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#22d3ee"/>
    </marker>
  </defs>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap');
    text { font-family: 'JetBrains Mono', 'Noto Sans SC', 'PingFang SC', sans-serif; }
  </style>

  <rect width="100%" height="100%" fill="#0f172a"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <text x="20" y="30" fill="#e2e8f0" font-size="15" font-weight="700">Summarization 在 BEFORE_MODEL 压缩上下文：保留首条、安全切点不拆散 AI/Tool 对</text>
  <text x="20" y="48" fill="#94a3b8" font-size="9">SummarizationHook.java：beforeModel(:103) → findSafeCutoff(:175) → createSummary(:263) → REPLACE(:166)</text>

  <!-- Arrows first -->
  <line x1="340" y1="108" x2="340" y2="128" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="340" y1="172" x2="340" y2="192" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="340" y1="244" x2="340" y2="264" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="340" y1="316" x2="340" y2="336" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="340" y1="388" x2="340" y2="408" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="340" y1="460" x2="340" y2="480" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- right 否 -->
  <line x1="400" y1="150" x2="470" y2="150" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- safeCutoff annotation arrow -->
  <line x1="470" y1="300" x2="540" y2="300" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrow-cyan)"/>

  <!-- beforeModel node -->
  <rect x="240" y="64" width="200" height="44" rx="6" fill="#0f172a"/>
  <rect x="240" y="64" width="200" height="44" rx="6" fill="rgba(59,130,246,0.3)" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="340" y="86" fill="white" font-size="10.5" font-weight="600" text-anchor="middle">beforeModel(:103) 模型调用前</text>
  <text x="340" y="100" fill="#94a3b8" font-size="8" text-anchor="middle">@HookPositions(BEFORE_MODEL)(:58)</text>

  <!-- Decision diamond -->
  <polygon points="340,128 400,166 340,204 280,166" fill="#0f172a"/>
  <polygon points="340,128 400,166 340,204 280,166" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="340" y="170" fill="white" font-size="10" font-weight="600" text-anchor="middle">令牌达阈值?</text>
  <text x="408" y="160" fill="#fb7185" font-size="8">否</text>
  <text x="272" y="216" fill="#34d399" font-size="8" text-anchor="end">是</text>

  <!-- not reach box -->
  <rect x="470" y="130" width="180" height="40" rx="6" fill="#0f172a"/>
  <rect x="470" y="130" width="180" height="40" rx="6" fill="rgba(59,130,246,0.3)" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="560" y="148" fill="white" font-size="9.5" font-weight="600" text-anchor="middle">原样返回(:104/:110)</text>
  <text x="560" y="161" fill="#94a3b8" font-size="8" text-anchor="middle">未设阈值或没到阈值</text>

  <!-- findSafeCutoff node -->
  <rect x="240" y="204" width="200" height="40" rx="6" fill="#0f172a"/>
  <rect x="240" y="204" width="200" height="40" rx="6" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="340" y="222" fill="white" font-size="10" font-weight="600" text-anchor="middle">findSafeCutoff(:117/:175)</text>
  <text x="340" y="236" fill="#94a3b8" font-size="8" text-anchor="middle">从目标切点往前找安全点(:183)</text>

  <!-- keep first + recent node -->
  <rect x="240" y="264" width="200" height="52" rx="6" fill="#0f172a"/>
  <rect x="240" y="264" width="200" height="52" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="340" y="286" fill="white" font-size="10" font-weight="600" text-anchor="middle">保留首条用户消息(:124)</text>
  <text x="340" y="302" fill="#94a3b8" font-size="8" text-anchor="middle">切点后近期消息原样留(:146)</text>
  <text x="340" y="316" fill="#94a3b8" font-size="8" text-anchor="middle">默认 keepFirstUserMessage=true(:78)</text>

  <!-- createSummary node -->
  <rect x="240" y="336" width="200" height="52" rx="6" fill="#0f172a"/>
  <rect x="240" y="336" width="200" height="52" rx="6" fill="rgba(59,130,246,0.3)" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="340" y="358" fill="white" font-size="10" font-weight="600" text-anchor="middle">createSummary(:142/:263)</text>
  <text x="340" y="374" fill="#94a3b8" font-size="8" text-anchor="middle">调 model.call(:278) 现生成摘要</text>
  <text x="340" y="388" fill="#94a3b8" font-size="8" text-anchor="middle">前缀 "## Previous..."(:75) 不加料(:63)</text>

  <!-- newMessages node -->
  <rect x="240" y="408" width="200" height="52" rx="6" fill="#0f172a"/>
  <rect x="240" y="408" width="200" height="52" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="340" y="430" fill="white" font-size="10" font-weight="600" text-anchor="middle">newMessages(:151)</text>
  <text x="340" y="446" fill="#94a3b8" font-size="8" text-anchor="middle">首条 + 摘要系统消息(:144) + 近期</text>
  <text x="340" y="460" fill="#94a3b8" font-size="8" text-anchor="middle">messagesToKeep 默认 20(:318)</text>

  <!-- REPLACE node -->
  <rect x="240" y="480" width="200" height="48" rx="22" fill="#0f172a"/>
  <rect x="240" y="480" width="200" height="48" rx="22" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="340" y="502" fill="white" font-size="10" font-weight="600" text-anchor="middle">UpdatePolicy.REPLACE(:166)</text>
  <text x="340" y="518" fill="#94a3b8" font-size="8" text-anchor="middle">整段替换，不是追加</text>

  <!-- safeCutoff annotation -->
  <rect x="540" y="276" width="120" height="48" rx="6" fill="#0f172a"/>
  <rect x="540" y="276" width="120" height="48" rx="6" fill="rgba(34,211,238,0.18)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="600" y="296" fill="white" font-size="8.5" font-weight="600" text-anchor="middle">isSafeCutoffPoint(:195)</text>
  <text x="600" y="312" fill="#94a3b8" font-size="7.5" text-anchor="middle">cutoffSeparatesToolPair(:240)</text>
  <text x="600" y="320" fill="#94a3b8" font-size="7.5" text-anchor="middle">范围5(:77) 不拆散对</text>
</svg>
