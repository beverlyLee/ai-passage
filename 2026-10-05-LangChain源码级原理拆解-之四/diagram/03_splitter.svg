<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 450" font-family="'PingFang SC','Noto Sans SC',sans-serif">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="680" height="450" fill="#0f172a"/>
  <rect width="680" height="450" fill="url(#grid)"/>

  <text x="340" y="30" fill="#e2e8f0" font-size="18" text-anchor="middle" font-weight="600">TextSplitter：切块是建模，不是切菜</text>
  <text x="340" y="49" fill="#64748b" font-size="11" text-anchor="middle">langchain_text_splitters 1.1.2 · character.py:88</text>

  <!-- input text -->
  <rect x="24" y="74" width="240" height="56" rx="10" fill="#0f172a" stroke="#94a3b8"/>
  <text x="144" y="98" fill="#e2e8f0" font-size="11" text-anchor="middle" font-weight="600">原始大文本（一整段手册）</text>
  <text x="144" y="116" fill="#94a3b8" font-size="9" text-anchor="middle">含多件事：OOM / 雪崩 / 积压</text>

  <!-- splitter -->
  <rect x="300" y="74" width="200" height="56" rx="10" fill="#0f172a" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="400" y="98" fill="#e2e8f0" font-size="11" text-anchor="middle" font-weight="600">RecursiveCharacter</text>
  <text x="400" y="114" fill="#e2e8f0" font-size="10" text-anchor="middle">TextSplitter</text>
  <text x="400" y="128" fill="#64748b" font-size="8.5" text-anchor="middle">character.py:88</text>

  <line x1="264" y1="102" x2="298" y2="102" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- separators priority -->
  <rect x="540" y="74" width="140" height="56" rx="10" fill="#0f172a" stroke="#fbbf24"/>
  <text x="610" y="94" fill="#fbbf24" font-size="9.5" text-anchor="middle" font-weight="600">分隔符优先级</text>
  <text x="610" y="110" fill="#e2e8f0" font-size="8.5" text-anchor="middle">["\n\n","\n"," ",""]</text>
  <text x="610" y="123" fill="#64748b" font-size="8" text-anchor="middle">从粗到细 character.py:95</text>

  <!-- _split_text recursive -->
  <rect x="40" y="170" width="280" height="64" rx="10" fill="#0f172a" stroke="#22d3ee"/>
  <text x="60" y="192" fill="#22d3ee" font-size="11" font-weight="600">_split_text（递归）</text>
  <text x="60" y="210" fill="#cbd5e1" font-size="9.5">找第一个能匹配的分隔符劈开</text>
  <text x="60" y="225" fill="#cbd5e1" font-size="9.5">每段超过 chunk_size 就继续递归</text>
  <text x="60" y="240" fill="#64748b" font-size="8.5">character.py:107</text>

  <!-- _merge_splits -->
  <rect x="360" y="170" width="280" height="64" rx="10" fill="#0f172a" stroke="#22d3ee"/>
  <text x="380" y="192" fill="#22d3ee" font-size="11" font-weight="600">_merge_splits（拼块）</text>
  <text x="380" y="210" fill="#cbd5e1" font-size="9.5">把小片段拼到不超过 chunk_size</text>
  <text x="380" y="225" fill="#cbd5e1" font-size="9.5">相邻块重叠 chunk_overlap 字符</text>
  <text x="380" y="240" fill="#64748b" font-size="8.5">base.py:152</text>

  <line x1="200" y1="130" x2="180" y2="168" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="400" y1="130" x2="500" y2="168" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="320" y1="202" x2="358" y2="202" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- length function -->
  <rect x="40" y="270" width="280" height="44" rx="8" fill="#0f172a" stroke="#a78bfa"/>
  <text x="60" y="290" fill="#a78bfa" font-size="10" font-weight="600">长度函数 _length_function</text>
  <text x="60" y="306" fill="#94a3b8" font-size="9">决定「多长算超」：字符数 / token 数</text>

  <!-- output chunks -->
  <rect x="360" y="270" width="280" height="44" rx="8" fill="#0f172a" stroke="#34d399"/>
  <text x="500" y="290" fill="#34d399" font-size="10" font-weight="600">输出 chunks（Document 列表）</text>
  <text x="500" y="306" fill="#94a3b8" font-size="9">本例切成 7 块，每块语义尽量完整</text>

  <line x1="180" y1="234" x2="180" y2="268" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="500" y1="234" x2="500" y2="268" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="320" y1="292" x2="358" y2="292" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- footer tips -->
  <text x="24" y="360" fill="#94a3b8" font-size="10">常见翻车点：</text>
  <text x="24" y="378" fill="#cbd5e1" font-size="10">chunk_size 太大 → 一块混多件事变噪声；太小 → 句子被腰斩语义断裂</text>
  <text x="24" y="396" fill="#cbd5e1" font-size="10">chunk_overlap 不是冗余，是让句尾句头都留在相邻块里，防语义被边界切断</text>
  <text x="24" y="414" fill="#cbd5e1" font-size="10">separators 是优先级数组不是一次性全用：先按空行，再换行，再空格，最后字符</text>
  <text x="24" y="432" fill="#cbd5e1" font-size="10">长度函数决定怎么算「长」：默认按字符，也可换 tiktoken / huggingface tokenizer</text>
</svg>
