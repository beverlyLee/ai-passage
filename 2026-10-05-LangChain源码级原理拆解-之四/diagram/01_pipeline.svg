<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 450" font-family="'PingFang SC','Noto Sans SC',sans-serif">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="680" height="450" fill="#0f172a"/>
  <rect width="680" height="450" fill="url(#grid)"/>

  <text x="340" y="30" fill="#e2e8f0" font-size="18" text-anchor="middle" font-weight="600">检索端到端链路：从一块文本到可检索的向量</text>
  <text x="340" y="49" fill="#64748b" font-size="11" text-anchor="middle">langchain-core 1.3.2 · langchain-text-splitters 1.1.2</text>

  <!-- indexing lane -->
  <text x="24" y="74" fill="#22d3ee" font-size="12" font-weight="600">建库路径 indexing</text>

  <rect x="24" y="82" width="132" height="46" rx="8" fill="#0f172a" stroke="#94a3b8"/>
  <text x="90" y="106" fill="#e2e8f0" font-size="11" text-anchor="middle">原始手册文本</text>
  <text x="90" y="121" fill="#94a3b8" font-size="9" text-anchor="middle">KB 一整段</text>

  <rect x="172" y="82" width="158" height="46" rx="8" fill="#0f172a" stroke="#22d3ee"/>
  <text x="251" y="102" fill="#e2e8f0" font-size="10.5" text-anchor="middle">RecursiveCharacter</text>
  <text x="251" y="117" fill="#e2e8f0" font-size="10.5" text-anchor="middle">TextSplitter</text>
  <text x="251" y="130" fill="#64748b" font-size="8.5" text-anchor="middle">character.py:88</text>

  <rect x="346" y="82" width="132" height="46" rx="8" fill="#0f172a" stroke="#22d3ee"/>
  <text x="412" y="106" fill="#e2e8f0" font-size="11" text-anchor="middle">chunks</text>
  <text x="412" y="121" fill="#94a3b8" font-size="9" text-anchor="middle">Document x7</text>

  <rect x="494" y="82" width="162" height="46" rx="8" fill="#0f172a" stroke="#a78bfa"/>
  <text x="575" y="102" fill="#e2e8f0" font-size="10.5" text-anchor="middle">Embeddings</text>
  <text x="575" y="117" fill="#a78bfa" font-size="9.5" text-anchor="middle">embed_documents</text>
  <text x="575" y="130" fill="#64748b" font-size="8.5" text-anchor="middle">embeddings.py:37</text>

  <line x1="156" y1="105" x2="170" y2="105" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="330" y1="105" x2="344" y2="105" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="478" y1="105" x2="492" y2="105" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- vector store -->
  <rect x="250" y="160" width="200" height="54" rx="10" fill="#0f172a" stroke="#34d399" stroke-width="1.5"/>
  <text x="350" y="184" fill="#e2e8f0" font-size="12" text-anchor="middle" font-weight="600">InMemoryVectorStore</text>
  <text x="350" y="201" fill="#34d399" font-size="9.5" text-anchor="middle">存向量 + 按余弦取 top-k</text>
  <text x="350" y="213" fill="#64748b" font-size="8.5" text-anchor="middle">in_memory.py:34</text>

  <line x1="575" y1="128" x2="575" y2="160" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="575" y1="160" x2="450" y2="160" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- query lane -->
  <text x="24" y="262" fill="#fbbf24" font-size="12" font-weight="600">查询路径 query</text>

  <rect x="24" y="270" width="150" height="46" rx="8" fill="#0f172a" stroke="#fbbf24"/>
  <text x="99" y="297" fill="#e2e8f0" font-size="10.5" text-anchor="middle">用户问：数据库</text>
  <text x="99" y="312" fill="#e2e8f0" font-size="10.5" text-anchor="middle">OOM 怎么处理</text>

  <rect x="194" y="270" width="150" height="46" rx="8" fill="#0f172a" stroke="#a78bfa"/>
  <text x="269" y="294" fill="#e2e8f0" font-size="10.5" text-anchor="middle">Embeddings</text>
  <text x="269" y="309" fill="#a78bfa" font-size="9.5" text-anchor="middle">embed_query</text>
  <text x="269" y="321" fill="#64748b" font-size="8.5" text-anchor="middle">embeddings.py:48</text>

  <rect x="364" y="270" width="162" height="46" rx="8" fill="#0f172a" stroke="#22d3ee"/>
  <text x="445" y="290" fill="#e2e8f0" font-size="10.5" text-anchor="middle">cosine_similarity</text>
  <text x="445" y="305" fill="#94a3b8" font-size="9.5" text-anchor="middle">与库里每个向量比</text>
  <text x="445" y="317" fill="#64748b" font-size="8.5" text-anchor="middle">in_memory.py:291</text>

  <rect x="544" y="270" width="124" height="46" rx="8" fill="#0f172a" stroke="#34d399"/>
  <text x="606" y="294" fill="#e2e8f0" font-size="10.5" text-anchor="middle">top-k</text>
  <text x="606" y="309" fill="#94a3b8" font-size="9.5" text-anchor="middle">Document 列表</text>

  <line x1="174" y1="293" x2="192" y2="293" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="344" y1="293" x2="362" y2="293" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="526" y1="293" x2="542" y2="293" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- store feeds vectors into cosine -->
  <path d="M350 214 L350 250 L445 250 L445 268" fill="none" stroke="#34d399" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="392" y="244" fill="#34d399" font-size="9" text-anchor="middle">库内向量</text>

  <!-- footer -->
  <text x="24" y="350" fill="#94a3b8" font-size="10">关键事实：</text>
  <text x="24" y="368" fill="#cbd5e1" font-size="10">1) Document 是检索载体，不是聊天消息（documents/base.py:288 的 docstring 明确区分）</text>
  <text x="24" y="386" fill="#cbd5e1" font-size="10">2) 切块默认分隔符优先级 ["\n\n","\n"," ",""]（character.py:95），chunk_overlap 防语义被切断</text>
  <text x="24" y="404" fill="#cbd5e1" font-size="10">3) 相似度默认是余弦，越大越像，路由直接 argsort()[::-1] 降序（in_memory.py:291）</text>
  <text x="24" y="422" fill="#cbd5e1" font-size="10">4) 查询走 embed_query，文档走 embed_documents，是两个独立方法（embeddings.py:37 / :48）</text>
</svg>
