<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 450" font-family="'JetBrains Mono','Noto Sans SC','PingFang SC',sans-serif">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1e293b" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="680" height="450" fill="#0f172a"/>
  <rect width="680" height="450" fill="url(#grid)"/>

  <text x="24" y="34" fill="#e2e8f0" font-size="16">DefaultBuilder 构建时序：NOOP 兜底发生在构造图时</text>

  <!-- 三根生命线 -->
  <line x1="80" y1="60" x2="80" y2="400" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="300" y1="60" x2="300" y2="400" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="540" y1="60" x2="540" y2="400" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4"/>
  <!-- 顶部角色 -->
  <rect x="42" y="48" width="76" height="26" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.2"/>
  <text x="80" y="66" fill="#e2e8f0" font-size="12" text-anchor="middle">你(调用方)</text>
  <rect x="250" y="48" width="100" height="26" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.2"/>
  <text x="300" y="66" fill="#e2e8f0" font-size="12" text-anchor="middle">DefaultBuilder</text>
  <rect x="478" y="48" width="124" height="26" rx="6" fill="rgba(76,29,149,0.3)" stroke="#a78bfa" stroke-width="1.2"/>
  <text x="540" y="66" fill="#e2e8f0" font-size="12" text-anchor="middle">ChatClient.Builder</text>

  <!-- 消息 1 -->
  <line x1="80" y1="100" x2="300" y2="100" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="150" y="94" fill="#94a3b8" font-size="11">.observationRegistry(reg) 可 null</text>

  <!-- 消息 2 -->
  <line x1="80" y1="135" x2="300" y2="135" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="150" y="129" fill="#94a3b8" font-size="11">.build()</text>

  <!-- 自调用：null 判定 -->
  <line x1="300" y1="170" x2="300" y2="170" stroke="#34d399" stroke-width="2.5"/>
  <text x="316" y="166" fill="#34d399" font-size="12">null 判定：== null ? NOOP : reg</text>
  <text x="316" y="184" fill="#94a3b8" font-size="11">兜底发生在构造图时，非运行时</text>

  <!-- 消息 3 -->
  <line x1="300" y1="225" x2="540" y2="225" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="360" y="219" fill="#94a3b8" font-size="11">透传 registry + 2 Convention</text>

  <!-- 消息 4 返回 -->
  <line x1="540" y1="270" x2="300" y2="270" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="360" y="264" fill="#94a3b8" font-size="11">图对象（共享同一 registry）</text>

  <!-- 运行时注释 -->
  <rect x="42" y="320" width="596" height="62" rx="8" fill="rgba(120,53,15,0.25)" stroke="#fbbf24" stroke-width="1.2"/>
  <text x="60" y="345" fill="#fbbf24" font-size="12">运行时：Spring AI 在 ChatClient / Advisor 层用 registry 包 Observation</text>
  <text x="60" y="368" fill="#94a3b8" font-size="11">若退化为 NOOP，则全程静默、无 span、Zipkin 空空如也</text>
</svg>
