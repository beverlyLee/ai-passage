<svg width="680" height="450" viewBox="0 0 680 450" xmlns="http://www.w3.org/2000/svg">
  <style>
    text { font-family: "JetBrains Mono","Noto Sans SC",ui-monospace,monospace; }
  </style>
  <rect width="680" height="450" fill="#0f172a"/>
  <g stroke="#1e293b" stroke-width="1"><line x1="0" y1="84" x2="680" y2="84"/></g>
  <text x="340" y="46" fill="#e2e8f0" font-size="21" text-anchor="middle" font-weight="bold">坑⑤ 上下文窗口溢出：关键 chunk 被预算挤掉</text>
  <text x="340" y="68" fill="#94a3b8" font-size="13" text-anchor="middle">top-k 按相似度排序，但排名靠前≠对当前问题最关键；预算一砍，答案依赖的 chunk 被截断</text>

  <!-- 排序后的 4 段 -->
  <text x="340" y="110" fill="#94a3b8" font-size="13" text-anchor="middle">检索返回的 4 段（按相似度排序，关键段排第 3）</text>
  <g font-size="12" text-anchor="middle">
    <rect x="18"  y="124" width="155" height="58" rx="9" fill="#0b2433" stroke="#22d3ee" stroke-width="2"/>
    <text x="95" y="150" fill="#22d3ee" font-weight="bold">#1 物流时效</text>
    <text x="95" y="170" fill="#94a3b8">score 0.41</text>

    <rect x="185" y="124" width="155" height="58" rx="9" fill="#0b2433" stroke="#22d3ee" stroke-width="2"/>
    <text x="262" y="150" fill="#22d3ee" font-weight="bold">#2 退换货范围</text>
    <text x="262" y="170" fill="#94a3b8">score 0.33</text>

    <rect x="352" y="124" width="155" height="58" rx="9" fill="#2a0f1a" stroke="#fb7185" stroke-width="2"/>
    <text x="429" y="150" fill="#fb7185" font-weight="bold">#3 退款到账</text>
    <text x="429" y="170" fill="#fb7185">score 0.28 · 关键</text>

    <rect x="519" y="124" width="143" height="58" rx="9" fill="#0b2433" stroke="#22d3ee" stroke-width="2"/>
    <text x="590" y="150" fill="#22d3ee" font-weight="bold">#4 发票说明</text>
    <text x="590" y="170" fill="#94a3b8">score 0.21</text>
  </g>

  <!-- 左：预算充足 -->
  <text x="174" y="222" fill="#22d3ee" font-size="14" text-anchor="middle" font-weight="bold">预算充足（保留全部）</text>
  <rect x="24" y="232" width="300" height="40" rx="8" fill="#0b2433" stroke="#22d3ee" stroke-width="2"/>
  <text x="174" y="257" fill="#22d3ee" font-size="12" text-anchor="middle">budget=4 → #1 #2 #3 #4 全进上下文</text>
  <g stroke="#64748b" stroke-width="2" fill="none"><path d="M174 272 V288"/></g>
  <rect x="24" y="294" width="300" height="44" rx="8" fill="#0b2433" stroke="#22d3ee" stroke-width="2"/>
  <text x="174" y="312" fill="#22d3ee" font-size="12" text-anchor="middle">关键段 #3「退款到账」在场</text>
  <text x="174" y="330" fill="#94a3b8" font-size="11" text-anchor="middle">答案可引用 → 正确</text>

  <!-- 右：预算不足截断 -->
  <text x="506" y="222" fill="#fb7185" font-size="14" text-anchor="middle" font-weight="bold">预算不足（截断）</text>
  <rect x="356" y="232" width="300" height="40" rx="8" fill="#2a0f1a" stroke="#fb7185" stroke-width="2"/>
  <text x="506" y="257" fill="#fb7185" font-size="12" text-anchor="middle">budget=2 → 只留 #1 #2，#3 #4 被砍</text>
  <g stroke="#64748b" stroke-width="2" fill="none"><path d="M506 272 V288"/></g>
  <rect x="356" y="294" width="300" height="44" rx="8" fill="#2a0f1a" stroke="#fb7185" stroke-width="2"/>
  <text x="506" y="312" fill="#fb7185" font-size="12" text-anchor="middle">关键段 #3「退款到账」被挤出</text>
  <text x="506" y="330" fill="#94a3b8" font-size="11" text-anchor="middle">答案缺证据 → 偏漏/编造</text>

  <text x="340" y="384" fill="#e2e8f0" font-size="13" text-anchor="middle" font-weight="bold">解法：预算按 chunk 数而非 token 计；关键段用重排/反问意图兜底，别只信 top-k 顺序</text>
  <text x="340" y="406" fill="#94a3b8" font-size="12" text-anchor="middle">真系统常接 reranker 模型 + 紧凑切分 + 上下文压缩，避免「有证据却塞不进窗口」</text>
</svg>
