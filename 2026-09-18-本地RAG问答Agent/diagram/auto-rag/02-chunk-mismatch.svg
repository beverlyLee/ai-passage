<svg width="680" height="450" viewBox="0 0 680 450" xmlns="http://www.w3.org/2000/svg">
  <style>
    text { font-family: "JetBrains Mono","Noto Sans SC",ui-monospace,monospace; }
  </style>
  <rect width="680" height="450" fill="#0f172a"/>
  <g stroke="#1e293b" stroke-width="1">
    <line x1="0" y1="84" x2="680" y2="84"/>
  </g>
  <text x="340" y="46" fill="#e2e8f0" font-size="21" text-anchor="middle" font-weight="bold">坑① 切分错位：把一句话的核心概念切成两半</text>
  <text x="340" y="68" fill="#94a3b8" font-size="13" text-anchor="middle">按字符硬切（fixed）切断语义，检索时两边都答不准；按句切（sentence）保留边界</text>

  <!-- 左：fixed 硬切（错） -->
  <text x="174" y="112" fill="#fb7185" font-size="14" text-anchor="middle" font-weight="bold">fixed · 按字符硬切</text>
  <rect x="24" y="124" width="300" height="40" rx="8" fill="#0b2433" stroke="#fb7185" stroke-width="2"/>
  <text x="174" y="149" fill="#94a3b8" font-size="11" text-anchor="middle">原始文档：…用户在签收商品后七天无理由退款…</text>

  <rect x="24" y="184" width="300" height="56" rx="8" fill="#2a0f1a" stroke="#fb7185" stroke-width="1.5"/>
  <text x="40" y="206" fill="#94a3b8" font-size="11">chunk1：…用户在签收商品后<tspan fill="#fb7185" font-weight="bold">七</tspan></text>
  <text x="40" y="226" fill="#94a3b8" font-size="11">（核心句被切断，只留住半截）</text>

  <rect x="24" y="252" width="300" height="56" rx="8" fill="#2a0f1a" stroke="#fb7185" stroke-width="1.5"/>
  <text x="40" y="274" fill="#94a3b8" font-size="11"><tspan fill="#fb7185" font-weight="bold">天无理由退款</tspan>。生鲜类不支持退款。</text>
  <text x="40" y="294" fill="#94a3b8" font-size="11">（另一半在下一个 chunk，单独看都不完整）</text>

  <text x="174" y="336" fill="#fb7185" font-size="13" text-anchor="middle">✗ 查询「七天无理由退款」两段都只命中半句</text>
  <text x="174" y="358" fill="#fb7185" font-size="13" text-anchor="middle">→ 相似度被稀释，top1 答不准</text>

  <!-- 右：sentence 切分（对） -->
  <text x="506" y="112" fill="#22d3ee" font-size="14" text-anchor="middle" font-weight="bold">sentence · 按句切分</text>
  <rect x="356" y="124" width="300" height="40" rx="8" fill="#0b2433" stroke="#22d3ee" stroke-width="2"/>
  <text x="506" y="149" fill="#94a3b8" font-size="11" text-anchor="middle">原始文档：…用户在签收商品后七天无理由退款…</text>

  <rect x="356" y="184" width="300" height="56" rx="8" fill="#0b2433" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="372" y="206" fill="#22d3ee" font-size="11">chunk1：…用户在签收商品后</text>
  <text x="372" y="226" fill="#22d3ee" font-size="11"><tspan font-weight="bold">七天无理由退款</tspan>。（完整保留）</text>

  <rect x="356" y="252" width="300" height="56" rx="8" fill="#0b2433" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="372" y="274" fill="#94a3b8" font-size="11">chunk2：生鲜类不支持退款。</text>
  <text x="372" y="294" fill="#94a3b8" font-size="11">（一句一段，语义不被切断）</text>

  <text x="506" y="336" fill="#22d3ee" font-size="13" text-anchor="middle">✓ 查询「七天无理由退款」整句命中 chunk1</text>
  <text x="506" y="358" fill="#22d3ee" font-size="13" text-anchor="middle">→ 相似度高，top1 答对</text>

  <text x="340" y="406" fill="#e2e8f0" font-size="13" text-anchor="middle" font-weight="bold">解法：切分守住「不切断核心概念」这条线（按标题 / 按句 / 按语义，而非按字符）</text>
</svg>
