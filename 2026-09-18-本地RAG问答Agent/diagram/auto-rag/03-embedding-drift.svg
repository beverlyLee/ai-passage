<svg width="680" height="450" viewBox="0 0 680 450" xmlns="http://www.w3.org/2000/svg">
  <style>
    text { font-family: "JetBrains Mono","Noto Sans SC",ui-monospace,monospace; }
  </style>
  <rect width="680" height="450" fill="#0f172a"/>
  <g stroke="#1e293b" stroke-width="1"><line x1="0" y1="84" x2="680" y2="84"/></g>
  <text x="340" y="46" fill="#e2e8f0" font-size="21" text-anchor="middle" font-weight="bold">坑② embedding 版本漂移：同一句话，换版本向量就对不上</text>
  <text x="340" y="68" fill="#94a3b8" font-size="13" text-anchor="middle">索引用 v1、查询用 v2，两个向量空间不交，余弦≈0，top1 直接答错</text>

  <rect x="240" y="100" width="200" height="44" rx="8" fill="#0b2433" stroke="#e2e8f0" stroke-width="2"/>
  <text x="340" y="127" fill="#e2e8f0" font-size="13" text-anchor="middle">同一句：七天无理由退款</text>

  <g stroke="#64748b" stroke-width="2" fill="none">
    <path d="M300 144 V188"/><path d="M380 144 V188"/>
  </g>

  <rect x="70" y="190" width="240" height="72" rx="10" fill="#0b2433" stroke="#22d3ee" stroke-width="2"/>
  <text x="190" y="216" fill="#22d3ee" font-size="14" text-anchor="middle" font-weight="bold">Embedder v1</text>
  <text x="190" y="238" fill="#94a3b8" font-size="12" text-anchor="middle">→ 向量A（落入空间①）</text>
  <text x="190" y="254" fill="#22d3ee" font-size="11" text-anchor="middle">[0.31, 0, 0.54, 0, 0.12 …]</text>

  <rect x="370" y="190" width="240" height="72" rx="10" fill="#2a0f1a" stroke="#fb7185" stroke-width="2"/>
  <text x="490" y="216" fill="#fb7185" font-size="14" text-anchor="middle" font-weight="bold">Embedder v2</text>
  <text x="490" y="238" fill="#94a3b8" font-size="12" text-anchor="middle">→ 向量B（落入空间②）</text>
  <text x="490" y="254" fill="#fb7185" font-size="11" text-anchor="middle">[0, 0.47, 0, 0.29, 0 …]</text>

  <!-- 两个不交的向量空间 -->
  <circle cx="250" cy="338" r="50" fill="#0b2433" stroke="#22d3ee" stroke-width="2"/>
  <circle cx="430" cy="338" r="50" fill="#2a0f1a" stroke="#fb7185" stroke-width="2"/>
  <text x="250" y="342" fill="#22d3ee" font-size="12" text-anchor="middle">空间①</text>
  <text x="430" y="342" fill="#fb7185" font-size="12" text-anchor="middle">空间②</text>
  <text x="340" y="412" fill="#e2e8f0" font-size="14" text-anchor="middle" font-weight="bold">两空间不交 → cosine = 0.000</text>
  <text x="340" y="434" fill="#94a3b8" font-size="12" text-anchor="middle">索引 v1 × 查询 v2：同句也检索不到，top1 答错</text>
</svg>
