<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 450" width="680" height="450" font-family="'PingFang SC','Noto Sans SC',sans-serif">
  <rect x="0" y="0" width="680" height="450" fill="#0f172a"/>
  <text x="340" y="34" fill="#e2e8f0" font-size="18" text-anchor="middle" font-weight="bold">三种管法：各自保留和丢弃什么</text>
  <text x="340" y="56" fill="#94a3b8" font-size="12" text-anchor="middle">八轮对话的上下文，三种策略下的保留情况</text>

  <!-- legend -->
  <rect x="470" y="20" width="16" height="16" fill="#22d3ee"/>
  <text x="492" y="33" fill="#cbd5e1" font-size="11">保留</text>
  <rect x="540" y="20" width="16" height="16" fill="#fb7185"/>
  <text x="562" y="33" fill="#cbd5e1" font-size="11">丢弃/易忘</text>
  <rect x="610" y="20" width="16" height="16" fill="#a78bfa"/>
  <text x="632" y="33" fill="#cbd5e1" font-size="11">摘要</text>

  <!-- helper to draw 8 turn boxes per row -->
  <!-- Panel A: 不压缩 全量 -->
  <text x="20" y="115" fill="#e2e8f0" font-size="13" font-weight="bold">不压缩</text>
  <text x="20" y="133" fill="#94a3b8" font-size="11">(全量重发)</text>
  <g>
    <rect x="140" y="100" width="50" height="34" rx="6" fill="#22d3ee"/>
    <rect x="198" y="100" width="50" height="34" rx="6" fill="#22d3ee"/>
    <rect x="256" y="100" width="50" height="34" rx="6" fill="#fb7185"/>
    <rect x="314" y="100" width="50" height="34" rx="6" fill="#fb7185"/>
    <rect x="372" y="100" width="50" height="34" rx="6" fill="#22d3ee"/>
    <rect x="430" y="100" width="50" height="34" rx="6" fill="#22d3ee"/>
    <rect x="488" y="100" width="50" height="34" rx="6" fill="#22d3ee"/>
    <rect x="546" y="100" width="50" height="34" rx="6" fill="#22d3ee"/>
    <text x="365" y="150" fill="#fb7185" font-size="11" text-anchor="middle">中间轮次易忘</text>
  </g>

  <!-- Panel B: 滑动窗口 留最近2轮 -->
  <text x="20" y="255" fill="#e2e8f0" font-size="13" font-weight="bold">滑动窗口</text>
  <text x="20" y="273" fill="#94a3b8" font-size="11">(留最近2轮)</text>
  <g>
    <rect x="140" y="240" width="50" height="34" rx="6" fill="#fb7185"/>
    <rect x="198" y="240" width="50" height="34" rx="6" fill="#fb7185"/>
    <rect x="256" y="240" width="50" height="34" rx="6" fill="#fb7185"/>
    <rect x="314" y="240" width="50" height="34" rx="6" fill="#fb7185"/>
    <rect x="372" y="240" width="50" height="34" rx="6" fill="#fb7185"/>
    <rect x="430" y="240" width="50" height="34" rx="6" fill="#fb7185"/>
    <rect x="488" y="240" width="50" height="34" rx="6" fill="#22d3ee"/>
    <rect x="546" y="240" width="50" height="34" rx="6" fill="#22d3ee"/>
    <text x="305" y="290" fill="#fb7185" font-size="11" text-anchor="middle">早期约定被整段丢弃</text>
  </g>

  <!-- Panel C: compaction 摘要 -->
  <text x="20" y="395" fill="#e2e8f0" font-size="13" font-weight="bold">compaction</text>
  <text x="20" y="413" fill="#94a3b8" font-size="11">(摘要旧轮次)</text>
  <g>
    <rect x="140" y="380" width="180" height="34" rx="6" fill="#a78bfa"/>
    <text x="230" y="402" fill="#0f172a" font-size="11" text-anchor="middle">旧轮次摘要</text>
    <rect x="330" y="380" width="50" height="34" rx="6" fill="#22d3ee"/>
    <rect x="388" y="380" width="50" height="34" rx="6" fill="#22d3ee"/>
    <rect x="446" y="380" width="50" height="34" rx="6" fill="#22d3ee"/>
    <rect x="504" y="380" width="50" height="34" rx="6" fill="#22d3ee"/>
    <text x="230" y="430" fill="#a78bfa" font-size="11" text-anchor="middle">早期关键约定留在摘要里</text>
  </g>
</svg>
