<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 450" font-family="'PingFang SC','Noto Sans SC',sans-serif">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="680" height="450" fill="#0f172a"/>
  <rect width="680" height="450" fill="url(#grid)"/>

  <text x="340" y="32" fill="#e2e8f0" font-size="18" text-anchor="middle" font-weight="600">条件路由、容错兜底与重试：组合原语三件套</text>
  <text x="340" y="52" fill="#64748b" font-size="11" text-anchor="middle">branch.py:42 / 189 · fallbacks.py:36 / 166 · retry.py:48 / 179 · langchain-core 1.3.2</text>

  <rect x="24" y="78" width="306" height="338" rx="10" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="40" y="100" fill="#fbbf24" font-size="12" text-anchor="start">RunnableBranch（branch.py:42 / 189）</text>

  <rect x="40" y="112" width="274" height="46" rx="8" fill="#0f172a"/>
  <rect x="40" y="112" width="274" height="46" rx="8" fill="rgba(8,51,68,0.7)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="55" y="133" fill="#e2e8f0" font-size="12" text-anchor="start">① cond1 真 → runnable1</text>
  <text x="55" y="150" fill="#94a3b8" font-size="9" text-anchor="start">顺序即优先级（branch.py:212）</text>

  <rect x="40" y="172" width="274" height="46" rx="8" fill="#0f172a"/>
  <rect x="40" y="172" width="274" height="46" rx="8" fill="rgba(8,51,68,0.7)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="55" y="193" fill="#e2e8f0" font-size="12" text-anchor="start">② cond2 真 → runnable2</text>
  <text x="55" y="210" fill="#94a3b8" font-size="9" text-anchor="start">命中即 break（branch.py:223）</text>

  <rect x="40" y="232" width="274" height="46" rx="8" fill="#0f172a"/>
  <rect x="40" y="232" width="274" height="46" rx="8" fill="rgba(8,51,68,0.7)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="55" y="253" fill="#e2e8f0" font-size="12" text-anchor="start">③ cond3 真 → runnable3</text>
  <text x="55" y="270" fill="#94a3b8" font-size="9" text-anchor="start">越具体越靠前</text>

  <rect x="40" y="306" width="274" height="46" rx="8" fill="#0f172a"/>
  <rect x="40" y="306" width="274" height="46" rx="8" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="55" y="333" fill="#e2e8f0" font-size="12" text-anchor="start">全假 → default.invoke</text>
  <text x="55" y="350" fill="#94a3b8" font-size="9" text-anchor="start">没有 default 则抛 ValueError</text>

  <path d="M 177 158 L 177 170" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 177 218 L 177 230" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 177 278 L 177 304" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="356" y="78" width="300" height="338" rx="10" fill="none" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="372" y="100" fill="#a78bfa" font-size="12" text-anchor="start">WithFallbacks（fallbacks.py:36 / 166）</text>

  <rect x="372" y="112" width="268" height="46" rx="8" fill="#0f172a"/>
  <rect x="372" y="112" width="268" height="46" rx="8" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="387" y="139" fill="#e2e8f0" font-size="12" text-anchor="start">主 runnable（先试）</text>

  <rect x="372" y="182" width="268" height="46" rx="8" fill="#0f172a"/>
  <rect x="372" y="182" width="268" height="46" rx="8" fill="rgba(8,51,68,0.7)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="387" y="209" fill="#e2e8f0" font-size="12" text-anchor="start">备选 runnable（fallback）</text>

  <path d="M 506 158 L 506 180" stroke="#fb7185" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="520" y="172" fill="#fb7185" font-size="9" text-anchor="start">抛 exceptions_to_handle</text>
  <text x="540" y="185" fill="#fb7185" font-size="9" text-anchor="start">（默认 Exception）</text>

  <rect x="372" y="252" width="268" height="46" rx="8" fill="#0f172a"/>
  <rect x="372" y="252" width="268" height="46" rx="8" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="387" y="279" fill="#e2e8f0" font-size="12" text-anchor="start">全失败 → raise first_error</text>
  <text x="387" y="296" fill="#94a3b8" font-size="9" text-anchor="start">fallbacks.py:199 起</text>

  <path d="M 506 228 L 506 250" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="372" y="324" fill="#a78bfa" font-size="11" text-anchor="start">Retry（retry.py:48 / 179）</text>
  <rect x="372" y="334" width="268" height="46" rx="8" fill="#0f172a"/>
  <rect x="372" y="334" width="268" height="46" rx="8" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="387" y="355" fill="#e2e8f0" font-size="12" text-anchor="start">同 runnable：tenacity 重试</text>
  <text x="387" y="372" fill="#94a3b8" font-size="9" text-anchor="start">按 retry_exception_types，指数退避+抖动</text>

  <text x="372" y="404" fill="#64748b" font-size="10" text-anchor="start">WithFallbacks 换一个执行体；Retry 把同一执行体多跑几次，实战常组合使用</text>
</svg>
