<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 450" font-family="'PingFang SC','Noto Sans SC',sans-serif">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="680" height="450" fill="#0f172a"/>
  <rect width="680" height="450" fill="url(#grid)"/>

  <text x="340" y="32" fill="#e2e8f0" font-size="18" text-anchor="middle" font-weight="600">RunnableParallel：同输入并发扇出，assign 合并回字典</text>
  <text x="340" y="52" fill="#64748b" font-size="11" text-anchor="middle">base.py:3609 / 3695 / 3878 · passthrough.py:74 / 207 / 352 · langchain-core 1.3.2</text>

  <rect x="30" y="84" width="170" height="58" rx="8" fill="#0f172a"/>
  <rect x="30" y="84" width="170" height="58" rx="8" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="115" y="108" fill="#e2e8f0" font-size="12" text-anchor="middle">输入字典</text>
  <text x="115" y="126" fill="#94a3b8" font-size="10" text-anchor="middle">{text, intent}</text>

  <rect x="230" y="84" width="240" height="58" rx="8" fill="#0f172a"/>
  <rect x="230" y="84" width="240" height="58" rx="8" fill="rgba(8,51,68,0.55)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="350" y="106" fill="#e2e8f0" font-size="12" text-anchor="middle">RunnablePassthrough.assign</text>
  <text x="350" y="124" fill="#94a3b8" font-size="10" text-anchor="middle">（passthrough.py:207）= RunnableAssign(Parallel)</text>

  <path d="M 200 113 L 228 113" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="240" y="160" fill="#64748b" font-size="10" text-anchor="middle">dict → RunnableParallel（base.py:6257 coerce 自动转换）</text>

  <text x="340" y="190" fill="#fbbf24" font-size="11" text-anchor="middle">并发扇出：同一 input，线程池 get_executor_for_config（base.py:3920）</text>

  <rect x="120" y="204" width="200" height="64" rx="8" fill="#0f172a"/>
  <rect x="120" y="204" width="200" height="64" rx="8" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="220" y="226" fill="#e2e8f0" font-size="12" text-anchor="middle">分支 extract（base.py:3695 coerce）</text>
  <text x="220" y="244" fill="#94a3b8" font-size="10" text-anchor="middle">读 input，返回 {entities: ...}</text>
  <text x="220" y="260" fill="#94a3b8" font-size="10" text-anchor="middle">键 = 分支名，合并进原字典</text>

  <rect x="360" y="204" width="200" height="64" rx="8" fill="#0f172a"/>
  <rect x="360" y="204" width="200" height="64" rx="8" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="460" y="226" fill="#e2e8f0" font-size="12" text-anchor="middle">分支 summarize</text>
  <text x="460" y="244" fill="#94a3b8" font-size="10" text-anchor="middle">读 input，返回 {summary: ...}</text>
  <text x="460" y="260" fill="#94a3b8" font-size="10" text-anchor="middle">键 = 分支名，合并进原字典</text>

  <path d="M 260 142 L 220 202" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 320 142 L 460 202" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="230" y="296" width="240" height="54" rx="8" fill="#0f172a"/>
  <rect x="230" y="296" width="240" height="54" rx="8" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="350" y="318" fill="#e2e8f0" font-size="12" text-anchor="middle">合并回原字典（passthrough.py:352）</text>
  <text x="350" y="336" fill="#94a3b8" font-size="10" text-anchor="middle">{**input, **parallel_result}</text>

  <path d="M 220 268 L 290 294" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 460 268 L 410 294" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="200" y="366" width="300" height="44" rx="8" fill="#0f172a"/>
  <rect x="200" y="366" width="300" height="44" rx="8" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="350" y="393" fill="#e2e8f0" font-size="12" text-anchor="middle">输出 {text, intent, extract, summary}</text>

  <path d="M 350 350 L 350 364" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="30" y="430" fill="#64748b" font-size="11" text-anchor="start">总耗时 ≈ 最慢分支（非各分支之和）；Passthrough 负责把原字典透传保底，不被并行覆盖</text>
</svg>
