<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 450" font-family="'PingFang SC','Noto Sans SC',sans-serif">
  <rect width="680" height="450" fill="#0f172a"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <text x="340" y="30" fill="#e2e8f0" font-size="18" text-anchor="middle">一行竖线如何编译成 RunnableSequence</text>
  <text x="340" y="50" fill="#64748b" font-size="11" text-anchor="middle">竖线做的是组装，不是执行</text>

  <!-- row1: prompt | model | parser -->
  <rect x="58" y="78" width="120" height="46" rx="8" fill="rgba(8,51,68,0.4)" stroke="#22d3ee"/>
  <text x="118" y="106" fill="#e2e8f0" font-size="15" text-anchor="middle">prompt</text>
  <text x="205" y="108" fill="#94a3b8" font-size="20" text-anchor="middle">|</text>
  <rect x="230" y="78" width="120" height="46" rx="8" fill="rgba(8,51,68,0.4)" stroke="#22d3ee"/>
  <text x="290" y="106" fill="#e2e8f0" font-size="15" text-anchor="middle">model</text>
  <text x="377" y="108" fill="#94a3b8" font-size="20" text-anchor="middle">|</text>
  <rect x="402" y="78" width="120" height="46" rx="8" fill="rgba(8,51,68,0.4)" stroke="#22d3ee"/>
  <text x="462" y="106" fill="#e2e8f0" font-size="15" text-anchor="middle">parser</text>

  <line x1="340" y1="124" x2="340" y2="152" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- row2: __or__ -->
  <rect x="150" y="152" width="380" height="60" rx="8" fill="rgba(8,51,68,0.5)" stroke="#22d3ee" stroke-width="2"/>
  <text x="340" y="178" fill="#e2e8f0" font-size="15" text-anchor="middle">prompt.__or__(model)</text>
  <text x="340" y="198" fill="#94a3b8" font-size="10" text-anchor="middle">base.py:648 → 返回 RunnableSequence(self, coerce_to_runnable(other)) · base.py:673</text>

  <line x1="340" y1="212" x2="340" y2="240" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- row3: coerce_to_runnable -->
  <rect x="150" y="240" width="380" height="50" rx="8" fill="rgba(120,53,15,0.35)" stroke="#fbbf24"/>
  <text x="340" y="262" fill="#e2e8f0" font-size="15" text-anchor="middle">coerce_to_runnable(thing)</text>
  <text x="340" y="282" fill="#94a3b8" font-size="10" text-anchor="middle">base.py:6623 · 把 RunnableLike 强制成 Runnable</text>

  <!-- three branches -->
  <path d="M260,290 L150,330" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#arrow)"/>
  <path d="M340,290 L340,330" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#arrow)"/>
  <path d="M420,290 L530,330" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#arrow)"/>

  <rect x="40" y="330" width="180" height="46" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399"/>
  <text x="130" y="352" fill="#e2e8f0" font-size="12" text-anchor="middle">callable → RunnableLambda</text>
  <text x="130" y="368" fill="#64748b" font-size="9" text-anchor="middle">base.py:6656</text>

  <rect x="250" y="330" width="180" height="46" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399"/>
  <text x="340" y="352" fill="#e2e8f0" font-size="12" text-anchor="middle">dict → RunnableParallel</text>
  <text x="340" y="368" fill="#64748b" font-size="9" text-anchor="middle">base.py:6658</text>

  <rect x="460" y="330" width="180" height="46" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399"/>
  <text x="550" y="352" fill="#e2e8f0" font-size="12" text-anchor="middle">Runnable → 原样返回</text>
  <text x="550" y="368" fill="#64748b" font-size="9" text-anchor="middle">base.py:6652</text>

  <!-- merge to output -->
  <path d="M130,376 L260,408" stroke="#22d3ee" stroke-width="1.3" marker-end="url(#arrow)"/>
  <path d="M340,376 L340,408" stroke="#22d3ee" stroke-width="1.3" marker-end="url(#arrow)"/>
  <path d="M550,376 L420,408" stroke="#22d3ee" stroke-width="1.3" marker-end="url(#arrow)"/>
  <rect x="200" y="408" width="280" height="34" rx="8" fill="rgba(8,51,68,0.55)" stroke="#22d3ee" stroke-width="2"/>
  <text x="340" y="430" fill="#e2e8f0" font-size="13" text-anchor="middle">RunnableSequence 计算图（for 循环链式）</text>
</svg>
