<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 450" font-family="'PingFang SC','Noto Sans SC',sans-serif">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#94a3b8"/>
    </marker>
    <marker id="arrow-cyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#22d3ee"/>
    </marker>
  </defs>
  <rect width="680" height="450" fill="#0f172a"/>
  <rect width="680" height="450" fill="url(#grid)"/>

  <text x="340" y="34" fill="#e2e8f0" font-size="18" text-anchor="middle">竖线组合：A | B 不是调用，是包成有向图</text>
  <text x="340" y="54" fill="#64748b" font-size="11" text-anchor="middle">langchain-core 1.3.2 · runnables/base.py</text>

  <text x="180" y="92" fill="#22d3ee" font-size="14" text-anchor="middle" font-weight="600">A | B</text>
  <text x="500" y="92" fill="#22d3ee" font-size="14" text-anchor="middle" font-weight="600">A | {"a": B, "b": C}</text>

  <rect x="55" y="108" width="250" height="44" rx="8" fill="rgba(8,51,68,0.45)" stroke="#22d3ee"/>
  <text x="180" y="127" fill="#e2e8f0" font-size="13" text-anchor="middle" font-weight="600">RunnableSequence</text>
  <text x="180" y="143" fill="#94a3b8" font-size="9" text-anchor="middle">base.py:2861 · invoke 即 for 循环链式喂值</text>

  <rect x="360" y="108" width="270" height="44" rx="8" fill="rgba(8,51,68,0.45)" stroke="#22d3ee"/>
  <text x="495" y="127" fill="#e2e8f0" font-size="13" text-anchor="middle" font-weight="600">RunnableParallel</text>
  <text x="495" y="143" fill="#94a3b8" font-size="9" text-anchor="middle">base.py:3609 · 同一输入扇出多分支汇总成字典</text>

  <line x1="180" y1="152" x2="180" y2="184" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrow-cyan)"/>
  <line x1="495" y1="152" x2="495" y2="184" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrow-cyan)"/>

  <g font-size="12" text-anchor="middle" font-weight="600">
    <rect x="70" y="190" width="84" height="40" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee"/>
    <text x="112" y="215" fill="#e2e8f0">A</text>
    <rect x="206" y="190" width="84" height="40" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399"/>
    <text x="248" y="215" fill="#e2e8f0">B</text>
  </g>
  <line x1="154" y1="210" x2="204" y2="210" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="180" y="240" fill="#94a3b8" font-size="9" text-anchor="middle">A 的输出喂给 B，串成一条链</text>

  <g font-size="12" text-anchor="middle" font-weight="600">
    <rect x="372" y="200" width="84" height="40" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee"/>
    <text x="414" y="225" fill="#e2e8f0">A</text>
    <rect x="486" y="178" width="84" height="36" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399"/>
    <text x="528" y="201" fill="#e2e8f0">B (key a)</text>
    <rect x="486" y="226" width="84" height="36" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399"/>
    <text x="528" y="249" fill="#e2e8f0">C (key b)</text>
  </g>
  <line x1="456" y1="220" x2="484" y2="196" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="456" y1="220" x2="484" y2="244" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="495" y="286" fill="#94a3b8" font-size="9" text-anchor="middle">A 扇出到 B、C，按 key 汇总成 dict</text>

  <rect x="40" y="306" width="600" height="56" rx="10" fill="rgba(120,53,15,0.25)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="340" y="330" fill="#e2e8f0" font-size="13" text-anchor="middle" font-weight="600">coerce_to_runnable（base.py:6257）</text>
  <text x="340" y="350" fill="#94a3b8" font-size="10" text-anchor="middle">裸函数 → RunnableLambda · 字典 → RunnableParallel · 已是 Runnable 原样返回</text>

  <text x="340" y="408" fill="#64748b" font-size="11" text-anchor="middle">竖线不是函数调用，是把 Runnable 包成一张有向图；管道里混写函数、字典、组件都不报错</text>
</svg>
