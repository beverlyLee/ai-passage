<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 450" font-family="'PingFang SC','Noto Sans SC',sans-serif">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="680" height="450" fill="#0f172a"/>
  <rect width="680" height="450" fill="url(#grid)"/>

  <text x="340" y="32" fill="#e2e8f0" font-size="18" text-anchor="middle" font-weight="600">竖线组合：运算符重载把 Runnable 包成 Sequence 与 Parallel，coerce 统一归一</text>
  <text x="340" y="52" fill="#64748b" font-size="11" text-anchor="middle">langchain-core · runnables/base.py</text>

  <!-- left region: operator overloading -->
  <rect x="24" y="72" width="320" height="300" rx="10" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="40" y="94" fill="#fbbf24" font-size="12" text-anchor="start">① 运算符重载：竖线怎么变成图</text>

  <g font-size="11" text-anchor="middle" font-weight="600">
    <rect x="44" y="108" width="88" height="40" rx="6" fill="#0f172a"/>
    <rect x="44" y="108" width="88" height="40" rx="6" fill="rgba(8,51,68,0.5)" stroke="#22d3ee"/>
    <text x="88" y="132" fill="#e2e8f0">A | B</text>

    <rect x="148" y="108" width="88" height="40" rx="6" fill="#0f172a"/>
    <rect x="148" y="108" width="88" height="40" rx="6" fill="rgba(30,41,59,0.5)" stroke="#94a3b8"/>
    <text x="192" y="125" fill="#e2e8f0">__or__(B)</text>
    <text x="192" y="139" fill="#94a3b8" font-size="8">魔法方法</text>

    <rect x="252" y="108" width="80" height="40" rx="6" fill="#0f172a"/>
    <rect x="252" y="108" width="80" height="40" rx="6" fill="rgba(120,53,15,0.3)" stroke="#fbbf24"/>
    <text x="292" y="125" fill="#e2e8f0">Sequence</text>
    <text x="292" y="139" fill="#fbbf24" font-size="8">:2861</text>

    <rect x="44" y="188" width="88" height="40" rx="6" fill="#0f172a"/>
    <rect x="44" y="188" width="88" height="40" rx="6" fill="rgba(8,51,68,0.5)" stroke="#22d3ee"/>
    <text x="88" y="205" fill="#e2e8f0">A | {…}</text>
    <text x="88" y="219" fill="#94a3b8" font-size="8">右侧字典</text>

    <rect x="148" y="188" width="88" height="40" rx="6" fill="#0f172a"/>
    <rect x="148" y="188" width="88" height="40" rx="6" fill="rgba(30,41,59,0.5)" stroke="#94a3b8"/>
    <text x="192" y="205" fill="#e2e8f0">__ror__(dict)</text>
    <text x="192" y="219" fill="#94a3b8" font-size="8">魔法方法</text>

    <rect x="252" y="188" width="80" height="40" rx="6" fill="#0f172a"/>
    <rect x="252" y="188" width="80" height="40" rx="6" fill="rgba(120,53,15,0.3)" stroke="#fbbf24"/>
    <text x="292" y="205" fill="#e2e8f0">Parallel</text>
    <text x="292" y="219" fill="#fbbf24" font-size="8">:3609</text>
  </g>

  <line x1="132" y1="128" x2="146" y2="128" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="236" y1="128" x2="250" y2="128" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="132" y1="208" x2="146" y2="208" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="236" y1="208" x2="250" y2="208" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="184" y="262" fill="#94a3b8" font-size="10" text-anchor="middle">竖线不是函数调用，是把 Runnable 包成有向图</text>

  <!-- right region: coerce -->
  <rect x="356" y="72" width="300" height="300" rx="10" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="372" y="94" fill="#fbbf24" font-size="12" text-anchor="start">② coerce_to_runnable :6257 归一</text>

  <g font-size="11" text-anchor="middle" font-weight="600">
    <rect x="372" y="116" width="120" height="36" rx="6" fill="#0f172a"/>
    <rect x="372" y="116" width="120" height="36" rx="6" fill="rgba(30,41,59,0.5)" stroke="#94a3b8"/>
    <text x="432" y="139" fill="#e2e8f0">callable 裸函数</text>

    <rect x="512" y="116" width="120" height="36" rx="6" fill="#0f172a"/>
    <rect x="512" y="116" width="120" height="36" rx="6" fill="rgba(76,29,149,0.4)" stroke="#a78bfa"/>
    <text x="572" y="139" fill="#e2e8f0">RunnableLambda</text>

    <rect x="372" y="176" width="120" height="36" rx="6" fill="#0f172a"/>
    <rect x="372" y="176" width="120" height="36" rx="6" fill="rgba(30,41,59,0.5)" stroke="#94a3b8"/>
    <text x="432" y="199" fill="#e2e8f0">dict 字典</text>

    <rect x="512" y="176" width="120" height="36" rx="6" fill="#0f172a"/>
    <rect x="512" y="176" width="120" height="36" rx="6" fill="rgba(120,53,15,0.3)" stroke="#fbbf24"/>
    <text x="572" y="199" fill="#e2e8f0">RunnableParallel</text>

    <rect x="372" y="236" width="120" height="36" rx="6" fill="#0f172a"/>
    <rect x="372" y="236" width="120" height="36" rx="6" fill="rgba(8,51,68,0.5)" stroke="#22d3ee"/>
    <text x="432" y="259" fill="#e2e8f0">Runnable</text>

    <rect x="512" y="236" width="120" height="36" rx="6" fill="#0f172a"/>
    <rect x="512" y="236" width="120" height="36" rx="6" fill="rgba(30,41,59,0.5)" stroke="#94a3b8"/>
    <text x="572" y="259" fill="#e2e8f0">原样返回</text>
  </g>

  <line x1="492" y1="134" x2="510" y2="134" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="492" y1="194" x2="510" y2="194" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="492" y1="254" x2="510" y2="254" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="506" y="306" fill="#94a3b8" font-size="10" text-anchor="middle">管道里混写函数、字典、正式组件都不报错，靠的就是这层归一</text>

  <text x="340" y="404" fill="#64748b" font-size="11" text-anchor="middle">左：竖线 / 字典触发什么类；右：任意输入如何被统一成 Runnable</text>

  <rect x="44" y="420" width="14" height="14" rx="3" fill="#22d3ee"/>
  <text x="64" y="431" fill="#94a3b8" font-size="10" text-anchor="start">入口表达式 / Runnable</text>
  <rect x="240" y="420" width="14" height="14" rx="3" fill="#fbbf24"/>
  <text x="260" y="431" fill="#94a3b8" font-size="10" text-anchor="start">结果类</text>
  <rect x="430" y="420" width="14" height="14" rx="3" fill="#94a3b8"/>
  <text x="450" y="431" fill="#94a3b8" font-size="10" text-anchor="start">运算符 / 待归一输入</text>
</svg>
