<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 450" font-family="'PingFang SC','Noto Sans SC',sans-serif">
  <rect width="680" height="450" fill="#0f172a"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <text x="340" y="30" fill="#e2e8f0" font-size="18" text-anchor="middle">RunnableParallel 扇入扇出</text>
  <text x="340" y="50" fill="#64748b" font-size="11" text-anchor="middle">同一份输入并发多分支，按 key 汇总成字典 · base.py:3864, 4181</text>

  <!-- input -->
  <rect x="30" y="195" width="120" height="56" rx="8" fill="rgba(8,51,68,0.4)" stroke="#22d3ee"/>
  <text x="90" y="216" fill="#e2e8f0" font-size="14" text-anchor="middle">同一份</text>
  <text x="90" y="234" fill="#e2e8f0" font-size="14" text-anchor="middle">input</text>

  <!-- fan-out hub -->
  <rect x="190" y="192" width="130" height="62" rx="10" fill="rgba(120,53,15,0.35)" stroke="#fbbf24"/>
  <text x="255" y="216" fill="#e2e8f0" font-size="14" text-anchor="middle">线程池</text>
  <text x="255" y="235" fill="#94a3b8" font-size="10" text-anchor="middle">扇出 fan-out</text>

  <line x1="150" y1="223" x2="188" y2="223" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- three branches -->
  <line x1="320" y1="205" x2="358" y2="92" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="325" y1="223" x2="363" y2="223" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="320" y1="241" x2="358" y2="354" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#arrow)"/>

  <rect x="360" y="70" width="150" height="44" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399"/>
  <text x="435" y="97" fill="#e2e8f0" font-size="13" text-anchor="middle">branch: A</text>
  <rect x="360" y="201" width="150" height="44" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399"/>
  <text x="435" y="228" fill="#e2e8f0" font-size="13" text-anchor="middle">branch: B</text>
  <rect x="360" y="332" width="150" height="44" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399"/>
  <text x="435" y="359" fill="#e2e8f0" font-size="13" text-anchor="middle">branch: C</text>

  <!-- merge to dict -->
  <line x1="510" y1="92" x2="548" y2="210" stroke="#22d3ee" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="510" y1="223" x2="548" y2="223" stroke="#22d3ee" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="510" y1="354" x2="548" y2="236" stroke="#22d3ee" stroke-width="1.3" marker-end="url(#arrow)"/>

  <rect x="548" y="192" width="110" height="62" rx="10" fill="rgba(76,29,149,0.4)" stroke="#a78bfa"/>
  <text x="603" y="216" fill="#e2e8f0" font-size="14" text-anchor="middle">dict</text>
  <text x="603" y="235" fill="#94a3b8" font-size="10" text-anchor="middle">汇总结收口</text>

  <line x1="603" y1="254" x2="575" y2="300" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="470" y="300" width="210" height="56" rx="8" fill="rgba(8,51,68,0.55)" stroke="#22d3ee" stroke-width="2"/>
  <text x="575" y="323" fill="#e2e8f0" font-size="14" text-anchor="middle">{"A", "B", "C"}</text>
  <text x="575" y="342" fill="#94a3b8" font-size="10" text-anchor="middle">下游用 result["key"] 取</text>

  <text x="340" y="420" fill="#64748b" font-size="10" text-anchor="middle">并发执行：总耗时≈最慢分支，而非各分支累加</text>
</svg>
