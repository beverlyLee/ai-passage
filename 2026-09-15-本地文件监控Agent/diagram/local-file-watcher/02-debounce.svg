<svg width="680" height="450" viewBox="0 0 680 450" xmlns="http://www.w3.org/2000/svg">
  <style>
    text { font-family: "JetBrains Mono","Noto Sans SC",ui-monospace,monospace; }
  </style>
  <rect width="680" height="450" fill="#0f172a"/>
  <text x="340" y="46" fill="#e2e8f0" font-size="21" text-anchor="middle" font-weight="bold">防抖：3 次 modify → 1 个事件</text>

  <!-- 左：无防抖 -->
  <text x="160" y="92" fill="#fb7185" font-size="15" text-anchor="middle" font-weight="bold">无防抖（刷屏）</text>
  <rect x="40" y="110" width="240" height="150" rx="8" fill="#1a0f17" stroke="#fb7185" stroke-width="1"/>
  <line x1="40" y1="200" x2="280" y2="200" stroke="#334155" stroke-width="1"/>
  <text x="50" y="200" fill="#94a3b8" font-size="11">时间 →</text>
  <!-- 3 spikes -->
  <g fill="#fb7185">
    <rect x="70" y="160" width="14" height="40" rx="2"/>
    <rect x="92" y="150" width="14" height="50" rx="2"/>
    <rect x="114" y="168" width="14" height="32" rx="2"/>
  </g>
  <text x="160" y="285" fill="#fb7185" font-size="13" text-anchor="middle">触发 3 次动作 / 评论</text>

  <!-- 右：有防抖 -->
  <text x="520" y="92" fill="#22d3ee" font-size="15" text-anchor="middle" font-weight="bold">有防抖（0.4s 窗口）</text>
  <rect x="400" y="110" width="240" height="150" rx="8" fill="#0b2433" stroke="#22d3ee" stroke-width="1"/>
  <line x1="400" y1="200" x2="640" y2="200" stroke="#334155" stroke-width="1"/>
  <!-- 3 spikes inside window -->
  <g fill="#475569">
    <rect x="430" y="160" width="14" height="40" rx="2"/>
    <rect x="452" y="150" width="14" height="50" rx="2"/>
    <rect x="474" y="168" width="14" height="32" rx="2"/>
  </g>
  <!-- debounce window -->
  <rect x="430" y="210" width="120" height="24" rx="4" fill="#133040" stroke="#22d3ee" stroke-dasharray="4 3"/>
  <text x="490" y="226" fill="#22d3ee" font-size="11" text-anchor="middle">0.4s 合并窗口</text>
  <!-- merged output -->
  <rect x="588" y="150" width="16" height="50" rx="2" fill="#22d3ee"/>
  <text x="520" y="285" fill="#22d3ee" font-size="13" text-anchor="middle">窗口末输出 1 个事件</text>

  <!-- 箭头 左->右 -->
  <g stroke="#64748b" stroke-width="2" fill="none"><path d="M300 185 H396"/></g>
  <g fill="#64748b"><path d="M396 185 l-8 -4 v8 z"/></g>

  <text x="340" y="370" fill="#cbd5e1" font-size="13" text-anchor="middle">同一文件的连续修改在窗口内合并，Agent 只处理「最终态」</text>
  <text x="340" y="396" fill="#94a3b8" font-size="12" text-anchor="middle">否则每敲一次键都触发一次分类 / 删除，瞬间刷屏</text>
</svg>
