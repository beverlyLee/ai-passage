<svg width="680" height="450" viewBox="0 0 680 450" xmlns="http://www.w3.org/2000/svg">
  <style>
    text { font-family: "JetBrains Mono","Noto Sans SC",ui-monospace,monospace; }
  </style>
  <rect width="680" height="450" fill="#0f172a"/>
  <text x="340" y="46" fill="#e2e8f0" font-size="21" text-anchor="middle" font-weight="bold">一次「保存」制造事件风暴</text>

  <!-- 编辑器保存框 -->
  <rect x="30" y="120" width="150" height="70" rx="10" fill="#0b2433" stroke="#22d3ee" stroke-width="2"/>
  <text x="105" y="158" fill="#22d3ee" font-size="14" text-anchor="middle" font-weight="bold">编辑器保存</text>
  <text x="105" y="178" fill="#94a3b8" font-size="12" text-anchor="middle">report.md</text>

  <!-- 风暴箭头 -->
  <g stroke="#fbbf24" stroke-width="2" fill="none">
    <path d="M180 130 C 240 110, 260 110, 300 130"/>
    <path d="M180 155 H300"/>
    <path d="M180 180 C 240 200, 260 200, 300 180"/>
    <path d="M180 195 C 240 220, 260 220, 300 200"/>
  </g>

  <!-- 事件队列 -->
  <rect x="300" y="100" width="350" height="130" rx="10" fill="#1a1407" stroke="#fbbf24" stroke-width="1"/>
  <text x="475" y="124" fill="#fbbf24" font-size="13" text-anchor="middle" font-weight="bold">watchdog 捕获到的原始事件</text>
  <g font-size="13" fill="#e2e8f0">
    <text x="320" y="150">1. create   report.md.tmp</text>
    <text x="320" y="172">2. modify   report.md.tmp</text>
    <text x="320" y="194">3. move     .tmp → report.md</text>
    <text x="320" y="216">4. modify   report.md</text>
  </g>

  <!-- 结论 -->
  <rect x="300" y="250" width="350" height="80" rx="10" fill="#0b2433" stroke="#22d3ee" stroke-width="1"/>
  <text x="475" y="282" fill="#22d3ee" font-size="14" text-anchor="middle" font-weight="bold">一次保存 = 4 个事件</text>
  <text x="475" y="308" fill="#94a3b8" font-size="12" text-anchor="middle">不合并 → 4 次分类 / 4 次推送 / 4 次误判</text>

  <text x="340" y="386" fill="#cbd5e1" font-size="13" text-anchor="middle">事件层（排除 .tmp + 防抖 + 幂等）把这 4 个收敛成 1 个「最终态」事件</text>
  <text x="340" y="412" fill="#94a3b8" font-size="12" text-anchor="middle">否则 Agent 会对临时文件误动作，或对同一改动重复执行</text>
</svg>
