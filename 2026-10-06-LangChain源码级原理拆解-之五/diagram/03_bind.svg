<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 450" font-family="'PingFang SC','Noto Sans SC',sans-serif">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="680" height="450" fill="#0f172a"/>
  <rect width="680" height="450" fill="url(#grid)"/>

  <text x="340" y="30" fill="#e2e8f0" font-size="18" text-anchor="middle" font-weight="600">模型侧：bind_tools 把工具交给模型，with_structured_output 要的是结构</text>
  <text x="340" y="49" fill="#64748b" font-size="11" text-anchor="middle">langchain-core 1.3.2 · chat_models.py</text>

  <!-- 工具箱 -->
  <rect x="24" y="110" width="180" height="64" rx="8" fill="#0f172a" stroke="#22d3ee"/>
  <text x="114" y="132" fill="#e2e8f0" font-size="11" text-anchor="middle" font-weight="600">工具箱</text>
  <text x="114" y="149" fill="#22d3ee" font-size="9" text-anchor="middle">已封装好的 BaseTool</text>
  <text x="114" y="163" fill="#94a3b8" font-size="8.5" text-anchor="middle">add / reverse_text / echo</text>

  <!-- chat model -->
  <rect x="280" y="100" width="200" height="76" rx="8" fill="#0f172a" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="380" y="124" fill="#e2e8f0" font-size="11" text-anchor="middle" font-weight="600">ChatModel</text>
  <text x="380" y="141" fill="#a78bfa" font-size="9.5" text-anchor="middle">bind_tools</text>
  <text x="380" y="155" fill="#a78bfa" font-size="9.5" text-anchor="middle">with_structured_output</text>
  <text x="380" y="169" fill="#64748b" font-size="8.5" text-anchor="middle">chat_models.py:2215 / 2234</text>

  <line x1="204" y1="142" x2="278" y2="142" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- branch A: bind_tools -->
  <rect x="40" y="250" width="270" height="84" rx="8" fill="#0f172a" stroke="#22d3ee"/>
  <text x="175" y="274" fill="#e2e8f0" font-size="11" text-anchor="middle" font-weight="600">bind_tools 路径</text>
  <text x="175" y="292" fill="#cbd5e1" font-size="9.5" text-anchor="middle">模型看到工具 schema，</text>
  <text x="175" y="307" fill="#cbd5e1" font-size="9.5" text-anchor="middle">自己决定调哪个，吐 AgentAction</text>
  <text x="175" y="323" fill="#64748b" font-size="8.5" text-anchor="middle">chat_models.py:2215</text>

  <!-- branch B: with_structured_output -->
  <rect x="370" y="250" width="270" height="84" rx="8" fill="#0f172a" stroke="#34d399"/>
  <text x="505" y="274" fill="#e2e8f0" font-size="11" text-anchor="middle" font-weight="600">with_structured_output</text>
  <text x="505" y="292" fill="#cbd5e1" font-size="9.5" text-anchor="middle">模型直接填好结构返回，</text>
  <text x="505" y="307" fill="#cbd5e1" font-size="9.5" text-anchor="middle">不是「调用动作」而是「填好的对象」</text>
  <text x="505" y="323" fill="#64748b" font-size="8.5" text-anchor="middle">chat_models.py:2234</text>

  <line x1="320" y1="176" x2="320" y2="248" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="440" y1="176" x2="440" y2="248" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- compatibility note -->
  <rect x="40" y="356" width="600" height="40" rx="8" fill="#0f172a" stroke="#64748b"/>
  <text x="340" y="374" fill="#cbd5e1" font-size="9.5" text-anchor="middle">关键事实：bind_tools 与 with_structured_output 都在聊天模型抽象之上，和之二的 Runnable 串法天然兼容</text>
  <text x="340" y="388" fill="#64748b" font-size="8.5" text-anchor="middle">两者区别：bind_tools 给模型「开权限」（让它吐调用动作），with_structured_output 要的是「直接落结构」</text>
</svg>
