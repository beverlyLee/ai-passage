<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 450" font-family="'PingFang SC','Noto Sans SC',sans-serif">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="680" height="450" fill="#0f172a"/>
  <rect width="680" height="450" fill="url(#grid)"/>

  <text x="340" y="30" fill="#e2e8f0" font-size="18" text-anchor="middle" font-weight="600">工具链路：三种造工具方式与 BaseTool 是 Runnable</text>
  <text x="340" y="49" fill="#64748b" font-size="11" text-anchor="middle">langchain-core 1.3.2</text>

  <!-- four factory boxes -->
  <rect x="16" y="78" width="150" height="58" rx="8" fill="#0f172a" stroke="#22d3ee"/>
  <text x="91" y="100" fill="#e2e8f0" font-size="11" text-anchor="middle" font-weight="600">@tool 装饰器</text>
  <text x="91" y="117" fill="#22d3ee" font-size="9.5" text-anchor="middle">convert.py:17</text>
  <text x="91" y="130" fill="#94a3b8" font-size="9" text-anchor="middle">= StructuredTool</text>

  <rect x="176" y="78" width="150" height="58" rx="8" fill="#0f172a" stroke="#fbbf24"/>
  <text x="251" y="100" fill="#e2e8f0" font-size="11" text-anchor="middle" font-weight="600">Tool.from_function</text>
  <text x="251" y="117" fill="#fbbf24" font-size="9.5" text-anchor="middle">simple.py:165</text>
  <text x="251" y="130" fill="#94a3b8" font-size="9" text-anchor="middle">= Tool 单输入</text>

  <rect x="336" y="78" width="158" height="58" rx="8" fill="#0f172a" stroke="#22d3ee"/>
  <text x="415" y="100" fill="#e2e8f0" font-size="11" text-anchor="middle" font-weight="600">StructuredTool</text>
  <text x="415" y="112" fill="#e2e8f0" font-size="10" text-anchor="middle">.from_function</text>
  <text x="415" y="127" fill="#64748b" font-size="9" text-anchor="middle">structured.py:133</text>
  <text x="415" y="139" fill="#94a3b8" font-size="9" text-anchor="middle">= 多参工具</text>

  <rect x="504" y="78" width="160" height="58" rx="8" fill="#0f172a" stroke="#a78bfa"/>
  <text x="584" y="100" fill="#e2e8f0" font-size="11" text-anchor="middle" font-weight="600">EchoTool</text>
  <text x="584" y="117" fill="#a78bfa" font-size="9.5" text-anchor="middle">class BaseTool</text>
  <text x="584" y="130" fill="#94a3b8" font-size="9" text-anchor="middle">最底层子类</text>

  <!-- convergence to BaseTool -->
  <line x1="91" y1="136" x2="240" y2="208" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="251" y1="136" x2="280" y2="208" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="415" y1="136" x2="400" y2="208" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="584" y1="136" x2="440" y2="208" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="240" y="208" width="200" height="62" rx="10" fill="#0f172a" stroke="#34d399" stroke-width="1.5"/>
  <text x="340" y="234" fill="#e2e8f0" font-size="13" text-anchor="middle" font-weight="600">BaseTool</text>
  <text x="340" y="252" fill="#34d399" font-size="9.5" text-anchor="middle">RunnableSerializable</text>
  <text x="340" y="264" fill="#64748b" font-size="8.5" text-anchor="middle">tools/base.py:405</text>

  <!-- Runnable capabilities -->
  <rect x="470" y="200" width="190" height="78" rx="10" fill="#0f172a" stroke="#34d399"/>
  <text x="565" y="222" fill="#e2e8f0" font-size="11" text-anchor="middle" font-weight="600">工具即 Runnable</text>
  <text x="565" y="240" fill="#cbd5e1" font-size="9.5" text-anchor="middle">run / invoke / batch</text>
  <text x="565" y="254" fill="#cbd5e1" font-size="9.5" text-anchor="middle">/ stream 全都有</text>
  <text x="565" y="270" fill="#64748b" font-size="8.5" text-anchor="middle">与之二管道天然兼容</text>
  <line x1="440" y1="240" x2="468" y2="240" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ToolException branch -->
  <rect x="24" y="300" width="220" height="46" rx="8" fill="#0f172a" stroke="#fb7185"/>
  <text x="134" y="320" fill="#fb7185" font-size="10.5" text-anchor="middle" font-weight="600">ToolException</text>
  <text x="134" y="336" fill="#94a3b8" font-size="9" text-anchor="middle">工具失败专用异常（base.py:390）</text>
  <line x1="240" y1="240" x2="150" y2="298" stroke="#fb7185" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="180" y="290" fill="#fb7185" font-size="9" text-anchor="middle">失败信号</text>

  <!-- footer -->
  <text x="24" y="372" fill="#94a3b8" font-size="10">关键事实：</text>
  <text x="24" y="390" fill="#cbd5e1" font-size="10">1) @tool 等价于 StructuredTool.from_function，靠类型标注 + docstring 推断 args schema</text>
  <text x="24" y="408" fill="#cbd5e1" font-size="10">2) Tool 是单输入工具（只能吃一个字符串）；双参函数必须用 StructuredTool.from_function</text>
  <text x="24" y="426" fill="#cbd5e1" font-size="10">3) BaseTool 父类是 RunnableSerializable，失败抛 ToolException 而非裸 Exception</text>
</svg>
