<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 450" font-family="'PingFang SC','Noto Sans SC',sans-serif">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="680" height="450" fill="#0f172a"/>
  <rect width="680" height="450" fill="url(#grid)"/>

  <text x="340" y="30" fill="#e2e8f0" font-size="18" text-anchor="middle" font-weight="600">智能体循环：AgentAction 执行成 AgentStep，再导向 AgentFinish</text>
  <text x="340" y="49" fill="#64748b" font-size="11" text-anchor="middle">langchain-core 1.3.2 · 真实循环在 langchain / langgraph</text>

  <!-- planner -->
  <rect x="24" y="86" width="170" height="56" rx="8" fill="#0f172a" stroke="#fbbf24"/>
  <text x="109" y="108" fill="#e2e8f0" font-size="11" text-anchor="middle" font-weight="600">planner（代替模型）</text>
  <text x="109" y="126" fill="#94a3b8" font-size="9" text-anchor="middle">看已走步骤决定下一步</text>

  <!-- AgentAction -->
  <rect x="250" y="86" width="180" height="56" rx="8" fill="#0f172a" stroke="#22d3ee"/>
  <text x="340" y="106" fill="#e2e8f0" font-size="11" text-anchor="middle" font-weight="600">AgentAction</text>
  <text x="340" y="123" fill="#22d3ee" font-size="9" text-anchor="middle">tool + tool_input</text>
  <text x="340" y="135" fill="#64748b" font-size="8.5" text-anchor="middle">agents.py:44</text>

  <!-- 工具执行 -->
  <rect x="490" y="86" width="170" height="56" rx="8" fill="#0f172a" stroke="#a78bfa"/>
  <text x="575" y="106" fill="#e2e8f0" font-size="11" text-anchor="middle" font-weight="600">在工具箱找工具执行</text>
  <text x="575" y="123" fill="#a78bfa" font-size="9" text-anchor="middle">BaseTool.invoke</text>
  <text x="575" y="135" fill="#64748b" font-size="8.5" text-anchor="middle">tools/base.py:405</text>

  <!-- AgentStep -->
  <rect x="490" y="190" width="170" height="56" rx="8" fill="#0f172a" stroke="#a78bfa"/>
  <text x="575" y="210" fill="#e2e8f0" font-size="11" text-anchor="middle" font-weight="600">AgentStep</text>
  <text x="575" y="227" fill="#a78bfa" font-size="9" text-anchor="middle">action + observation</text>
  <text x="575" y="239" fill="#64748b" font-size="8.5" text-anchor="middle">agents.py:131</text>

  <!-- AgentFinish -->
  <rect x="40" y="320" width="200" height="56" rx="8" fill="#0f172a" stroke="#34d399" stroke-width="1.5"/>
  <text x="140" y="342" fill="#e2e8f0" font-size="11" text-anchor="middle" font-weight="600">AgentFinish</text>
  <text x="140" y="359" fill="#34d399" font-size="9" text-anchor="middle">return_values 最终答案</text>
  <text x="140" y="371" fill="#64748b" font-size="8.5" text-anchor="middle">agents.py:146</text>

  <!-- arrows -->
  <line x1="194" y1="114" x2="248" y2="114" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="221" y="108" fill="#94a3b8" font-size="9" text-anchor="middle">继续</text>

  <line x1="430" y1="114" x2="488" y2="114" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <line x1="575" y1="142" x2="575" y2="188" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- loop back: AgentStep -> planner right side -->
  <path d="M490 218 L360 218 L360 300 L194 300 L194 146" fill="none" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="372" y="294" fill="#a78bfa" font-size="9" text-anchor="middle">观测塞回上下文</text>

  <!-- planner -> AgentFinish -->
  <line x1="109" y1="142" x2="109" y2="318" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="118" y="240" fill="#94a3b8" font-size="9" text-anchor="middle">收工</text>

  <!-- footer -->
  <text x="24" y="404" fill="#94a3b8" font-size="10">关键事实：</text>
  <text x="24" y="422" fill="#cbd5e1" font-size="10">1) agents.py 只有三个数据类，不是执行逻辑（44 / 146 / 131）；真实循环在 langchain / langgraph</text>
  <text x="280" y="422" fill="#cbd5e1" font-size="10">2) 本篇用确定性规划器代替模型，循环端到端跑通，输出「结果是 5」</text>
</svg>
