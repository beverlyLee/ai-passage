<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 450">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;family=Noto+Sans+SC:wght@400;500;700&amp;display=swap');
    text { font-family: 'JetBrains Mono','Noto Sans SC','PingFang SC',sans-serif; }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/></marker>
    <marker id="arrow-rose" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#fb7185"/></marker>
    <marker id="arrow-amber" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#fbbf24"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#0f172a"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <text x="20" y="30" fill="#e2e8f0" font-size="16" font-weight="700">图4 · 问题越“空”，它越敢编</text>
  <text x="20" y="46" fill="#64748b" font-size="9">原因3 — 你给的线索越少，它越用“最常见套路”填满 → 容易错</text>

  <!-- BAD prompt -->
  <text x="24" y="82" fill="#fb7185" font-size="12" font-weight="700">❌ 空泛的问法</text>
  <rect x="24" y="94" width="300" height="44" rx="8" fill="rgba(251,113,133,0.15)" stroke="#fb7185" stroke-width="1.2"/>
  <text x="40" y="122" fill="#fecdd3" font-size="11">“帮我写个牛逼的创业计划”</text>
  <line x1="174" y1="138" x2="174" y2="170" stroke="#fb7185" stroke-width="2" marker-end="url(#arrow-rose)"/>
  <rect x="24" y="174" width="300" height="58" rx="8" fill="rgba(30,41,59,0.4)" stroke="#475569" stroke-width="1"/>
  <text x="40" y="198" fill="#94a3b8" font-size="9">它不知道你要哪个行业、给谁看、</text>
  <text x="40" y="216" fill="#94a3b8" font-size="9">预算多少 → 只能套“最通用的模板”</text>
  <text x="40" y="234" fill="#fb7185" font-size="9" font-weight="600">模板里混着编出来的数据/案例</text>

  <!-- GOOD prompt -->
  <text x="356" y="82" fill="#34d399" font-size="12" font-weight="700">✅ 具体的问法</text>
  <rect x="356" y="94" width="300" height="44" rx="8" fill="rgba(52,211,153,0.15)" stroke="#34d399" stroke-width="1.2"/>
  <text x="372" y="116" fill="#a7f3d0" font-size="10">“我是大学生，想在校内做</text>
  <text x="372" y="132" fill="#a7f3d0" font-size="10">打印代取，预算 500，写计划”</text>
  <line x1="506" y1="138" x2="506" y2="170" stroke="#34d399" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="356" y="174" width="300" height="58" rx="8" fill="rgba(30,41,59,0.4)" stroke="#475569" stroke-width="1"/>
  <text x="372" y="198" fill="#94a3b8" font-size="9">线索够多 → 它接的是“贴合你情况</text>
  <text x="372" y="216" fill="#94a3b8" font-size="9">的下一步”，而不是瞎编套路</text>
  <text x="372" y="234" fill="#34d399" font-size="9" font-weight="600">再补一句“不确定处请标出来”更稳</text>

  <line x1="324" y1="120" x2="356" y2="120" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- insight -->
  <rect x="20" y="252" width="640" height="160" rx="8" fill="rgba(30,41,59,0.4)" stroke="#475569" stroke-width="1"/>
  <text x="36" y="280" fill="#e2e8f0" font-size="11" font-weight="600">本质：大模型是“接龙机器”，你给的上下文就是它的“方向盘”。</text>
  <text x="36" y="306" fill="#94a3b8" font-size="10">· 方向盘空 → 它往“最常见的老路”接，那条路上全是它脑补的通用内容。</text>
  <text x="36" y="330" fill="#94a3b8" font-size="10">· 方向盘满 → 它顺着你的真实情况接，落点更准，胡编空间被挤掉。</text>
  <text x="36" y="360" fill="#fbbf24" font-size="11" font-weight="600">→ 很多“幻觉”不是模型坏，是你的问题太好答、太空，它才放飞自我。</text>
  <text x="36" y="388" fill="#cbd5e1" font-size="9">记忆口诀：问题越具体，答案越靠谱；要它“说不准的地方标出来”，等于逼它别硬编。</text>
</svg>
