<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 450">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;family=Noto+Sans+SC:wght@400;500;700&amp;display=swap');
    text { font-family: 'JetBrains Mono','Noto Sans SC','PingFang SC',sans-serif; }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/></marker>
    <marker id="arrow-rose" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#fb7185"/></marker>
    <marker id="arrow-amber" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#fbbf24"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#0f172a"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <text x="20" y="30" fill="#e2e8f0" font-size="16" font-weight="700">图2 · 它靠“背”不是靠“查”</text>
  <text x="20" y="46" fill="#64748b" font-size="9">原因1 — 知识被“压缩”进大脑，提问时是在“闭卷默写”</text>

  <!-- LEFT: training compress -->
  <text x="24" y="80" fill="#e2e8f0" font-size="12" font-weight="700">① 训练时：把图书馆“压”进大脑</text>
  <rect x="24" y="92" width="300" height="92" rx="8" fill="rgba(30,41,59,0.5)" stroke="#60a5fa" stroke-width="1.2"/>
  <text x="40" y="116" fill="#94a3b8" font-size="10">成千上万本书 / 网页</text>
  <text x="40" y="138" fill="#94a3b8" font-size="10">↓ 被“压缩”成模型里的数字（参数）</text>
  <text x="40" y="166" fill="#60a5fa" font-size="10" font-weight="600">从此它“记住”了，但记的是概率，不是原文</text>

  <!-- RIGHT: inference = reciting -->
  <text x="356" y="80" fill="#e2e8f0" font-size="12" font-weight="700">② 提问时：闭卷默写</text>
  <rect x="356" y="92" width="300" height="92" rx="8" fill="rgba(30,41,59,0.5)" stroke="#fbbf24" stroke-width="1.2"/>
  <text x="372" y="116" fill="#94a3b8" font-size="10">你问它一个问题</text>
  <text x="372" y="138" fill="#94a3b8" font-size="10">它靠“背下来的概率”接出答案</text>
  <text x="372" y="166" fill="#fbbf24" font-size="10" font-weight="600">没背住 / 记混 → 就编一个“最像的”</text>

  <line x1="324" y1="138" x2="356" y2="138" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- open-book vs closed-book -->
  <text x="24" y="214" fill="#e2e8f0" font-size="12" font-weight="700">同样是答题，两种姿势：</text>
  <rect x="24" y="226" width="300" height="70" rx="8" fill="rgba(52,211,153,0.15)" stroke="#34d399" stroke-width="1.2"/>
  <text x="40" y="250" fill="#34d399" font-size="11" font-weight="600">开卷（联网 / 给它资料）</text>
  <text x="40" y="272" fill="#cbd5e1" font-size="9">答题时真去翻资料 → 仍可能翻错 / 抄错</text>
  <rect x="356" y="226" width="300" height="70" rx="8" fill="rgba(251,113,133,0.15)" stroke="#fb7185" stroke-width="1.2"/>
  <text x="372" y="250" fill="#fb7185" font-size="11" font-weight="600">闭卷（纯靠背，默认状态）</text>
  <text x="372" y="272" fill="#cbd5e1" font-size="9">没资料可查 → 接不出就靠编 → 幻觉高发</text>

  <!-- insight -->
  <rect x="20" y="316" width="640" height="96" rx="8" fill="rgba(30,41,59,0.4)" stroke="#475569" stroke-width="1"/>
  <text x="36" y="344" fill="#e2e8f0" font-size="11" font-weight="600">一句话：大模型不是“搜索引擎 + 脑子”，而是“把搜索结果背下来的人”。</text>
  <text x="36" y="370" fill="#94a3b8" font-size="10">背得再多也有死角；问到死角，它不会说“我不知道”，而是按概率硬接——这就是幻觉最常见的一条路。</text>
  <text x="36" y="396" fill="#cbd5e1" font-size="9">所以“它上网了就不会错”是误解：联网只是多给材料，闭卷变开卷，但开卷也会抄错。</text>
</svg>
