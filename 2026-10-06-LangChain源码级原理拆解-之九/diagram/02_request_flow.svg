<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 450" font-family="'PingFang SC','Noto Sans SC',sans-serif">
  <rect width="680" height="450" fill="#0f172a"/>
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
    <marker id="arrowc" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#22d3ee"/>
    </marker>
  </defs>
  <rect width="680" height="450" fill="url(#grid)"/>
  <text x="340" y="32" text-anchor="middle" fill="#e2e8f0" font-size="18">一次请求的数据流：字典逐站加字段，chunk 逐站透传</text>
  <text x="340" y="52" text-anchor="middle" fill="#64748b" font-size="11">langchain-core 1.3.2  ·  之六 / 之四 / 之三 / 之八</text>

  <!-- stage boxes centered, width 404 -->
  <rect x="138" y="78" width="404" height="44" rx="8" fill="#1e293b" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="340" y="105" text-anchor="middle" fill="#cbd5e1" font-size="13">输入 <tspan fill="#94a3b8" font-family="monospace">{question}</tspan>  + config 带 session_id</text>

  <line x1="340" y1="122" x2="340" y2="136" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="138" y="138" width="404" height="44" rx="8" fill="#1e293b" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="340" y="165" text-anchor="middle" fill="#fbbf24" font-size="13">RunnableWithMessageHistory 注入历史 → <tspan font-family="monospace">{question, history}</tspan></text>

  <line x1="340" y1="182" x2="340" y2="196" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="138" y="198" width="404" height="44" rx="8" fill="#1e293b" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="340" y="225" text-anchor="middle" fill="#a78bfa" font-size="13">assign 调检索器补 context → <tspan font-family="monospace">{question, history, context}</tspan></text>

  <!-- retriever side branch -->
  <rect x="556" y="198" width="108" height="44" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
  <text x="610" y="225" text-anchor="middle" fill="#34d399" font-size="12">FakeRetriever</text>
  <text x="610" y="240" text-anchor="middle" fill="#64748b" font-size="9">之四 返回 Document</text>
  <line x1="542" y1="220" x2="554" y2="220" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrow)"/>

  <line x1="340" y1="242" x2="340" y2="256" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="138" y="258" width="404" height="44" rx="8" fill="#1e293b" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="340" y="285" text-anchor="middle" fill="#cbd5e1" font-size="13">ChatPromptTemplate 组装成 <tspan fill="#22d3ee">list[BaseMessage]</tspan></text>

  <line x1="340" y1="302" x2="340" y2="316" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrowc)"/>
  <rect x="138" y="318" width="404" height="44" rx="8" fill="#1e293b" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="340" y="345" text-anchor="middle" fill="#22d3ee" font-size="13">FakeModel.stream 逐 token 产 <tspan font-family="monospace">AIMessageChunk</tspan></text>

  <line x1="340" y1="362" x2="340" y2="376" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrowc)"/>
  <rect x="138" y="378" width="404" height="40" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
  <text x="340" y="403" text-anchor="middle" fill="#34d399" font-size="13">StrOutputParser 逐 chunk 取 content → 字符串流（过滤空 token）</text>

  <!-- callback bracket -->
  <path d="M126,316 H138 V300 H542 V316 H554" fill="none" stroke="#fb7185" stroke-width="1.2"/>
  <text x="340" y="292" text-anchor="middle" fill="#fb7185" font-size="11">回调 TokenTracer.on_llm_new_token（之七）逐字计数</text>

  <text x="20" y="442" fill="#94a3b8" font-size="10">source: runnables/history.py:38  ·  runnables/passthrough.py:207  ·  output_parsers/transform.py:31</text>
  <text x="660" y="442" text-anchor="end" fill="#cbd5e1" font-size="10">02 / 03</text>
</svg>
