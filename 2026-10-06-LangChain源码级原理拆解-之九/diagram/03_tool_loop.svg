<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 450" font-family="'PingFang SC','Noto Sans SC',sans-serif">
  <rect width="680" height="450" fill="#0f172a"/>
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
    <marker id="arrowc" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#22d3ee"/>
    </marker>
    <marker id="arrowe" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#34d399"/>
    </marker>
  </defs>
  <rect width="680" height="450" fill="url(#grid)"/>
  <text x="340" y="34" text-anchor="middle" fill="#e2e8f0" font-size="18">工具调用循环：模型下指令、本地路由、结果回灌</text>
  <text x="340" y="54" text-anchor="middle" fill="#64748b" font-size="11">langchain-core 1.3.2  ·  之五 智能体与工具（离线模拟）</text>

  <!-- HumanMessage -->
  <rect x="40" y="178" width="128" height="50" rx="8" fill="#1e293b" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="104" y="200" text-anchor="middle" fill="#94a3b8" font-size="12">HumanMessage</text>
  <text x="104" y="218" text-anchor="middle" fill="#64748b" font-size="10">查物流 123</text>

  <!-- FakeToolModel -->
  <rect x="228" y="78" width="156" height="50" rx="8" fill="#1e293b" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="306" y="100" text-anchor="middle" fill="#22d3ee" font-size="12">FakeToolModel</text>
  <text x="306" y="118" text-anchor="middle" fill="#64748b" font-size="10">之三 聊天模型</text>

  <!-- tool_call -->
  <rect x="228" y="248" width="160" height="50" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
  <text x="308" y="270" text-anchor="middle" fill="#34d399" font-size="12">tool_call</text>
  <text x="308" y="288" text-anchor="middle" fill="#64748b" font-size="10">query_logistics {123}</text>

  <!-- run_tool_call -->
  <rect x="430" y="248" width="156" height="50" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="508" y="270" text-anchor="middle" fill="#34d399" font-size="12">run_tool_call</text>
  <text x="508" y="288" text-anchor="middle" fill="#64748b" font-size="10">确定性路由</text>

  <!-- ToolMessage -->
  <rect x="430" y="78" width="156" height="50" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
  <text x="508" y="100" text-anchor="middle" fill="#34d399" font-size="12">ToolMessage</text>
  <text x="508" y="118" text-anchor="middle" fill="#64748b" font-size="10">物流状态：运输中</text>

  <!-- AIMessage -->
  <rect x="606" y="178" width="64" height="50" rx="8" fill="#0f172a" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="638" y="200" text-anchor="middle" fill="#22d3ee" font-size="11">AIMessage</text>
  <text x="638" y="218" text-anchor="middle" fill="#64748b" font-size="9">已查到物流</text>

  <!-- arrows -->
  <line x1="168" y1="203" x2="226" y2="103" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="306" y1="128" x2="308" y2="246" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrowc)"/>
  <line x1="388" y1="273" x2="428" y2="273" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrowe)"/>
  <line x1="508" y1="248" x2="508" y2="130" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrowe)"/>
  <line x1="430" y1="103" x2="386" y2="100" stroke="#34d399" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrowe)"/>
  <text x="408" y="70" text-anchor="middle" fill="#34d399" font-size="10">结果回灌</text>
  <line x1="384" y1="110" x2="604" y2="200" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrowc)"/>

  <text x="340" y="360" text-anchor="middle" fill="#fbbf24" font-size="12">生产里这一步靠 model.bind_tools([...]) + tools_condition 跑；离线用假模型把同样消息流演示清楚</text>
  <text x="340" y="382" text-anchor="middle" fill="#64748b" font-size="11">第一次返回 tool_call，ToolMessage 回来后再自然语言收尾，循环一次即止</text>

  <text x="20" y="438" fill="#94a3b8" font-size="10">source: langchain_core/messages  ·  language_models/chat_models.py:710  ·  之五 工具调用消息流</text>
  <text x="660" y="438" text-anchor="end" fill="#cbd5e1" font-size="10">03 / 03</text>
</svg>
