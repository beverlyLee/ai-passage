<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 450" width="680" height="450" font-family="'Noto Sans SC',sans-serif">
  <defs>
    <marker id="ag3" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#34d399"/>
    </marker>
  </defs>
  <rect width="680" height="450" fill="#0f172a"/>
  <g stroke="#1e293b" stroke-width="1">
    <path d="M0 70 H680 M0 400 H680"/>
    <path d="M40 0 V450 M120 0 V450 M200 0 V450 M280 0 V450 M360 0 V450 M440 0 V450 M520 0 V450 M600 0 V450"/>
  </g>

  <text x="40" y="42" font-size="16" fill="#e2e8f0" font-weight="600">updateState：节点的返回值如何并入共享 Map</text>
  <text x="40" y="60" font-size="11" fill="#94a3b8">来自 AgentState.updateState 与 updatePartialStateFromSchema 字节码</text>

  <!-- 输入：partial + current -->
  <rect x="48" y="92" width="264" height="86" rx="8" fill="#0f172a" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="64" y="116" font-size="12" fill="#22d3ee" font-family="'JetBrains Mono','Noto Sans SC',monospace">partial（节点返回）</text>
  <text x="64" y="140" font-size="11" fill="#94a3b8" font-family="'JetBrains Mono','Noto Sans SC',monospace">messages = [bot…]</text>
  <text x="64" y="160" font-size="11" fill="#94a3b8" font-family="'JetBrains Mono','Noto Sans SC',monospace">stage = triaged</text>

  <rect x="368" y="92" width="264" height="86" rx="8" fill="#0f172a" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="384" y="116" font-size="12" fill="#c4b5fd" font-family="'JetBrains Mono','Noto Sans SC',monospace">current（共享 Map）</text>
  <text x="384" y="140" font-size="11" fill="#94a3b8" font-family="'JetBrains Mono','Noto Sans SC',monospace">messages = [user…]</text>
  <text x="384" y="160" font-size="11" fill="#94a3b8" font-family="'JetBrains Mono','Noto Sans SC',monospace">stage = received</text>

  <!-- 汇合箭头 -->
  <path d="M180 178 L320 214" stroke="#34d399" stroke-width="1.5" fill="none" marker-end="url(#ag3)"/>
  <path d="M500 178 L360 214" stroke="#34d399" stroke-width="1.5" fill="none" marker-end="url(#ag3)"/>

  <!-- 处理：updatePartialStateFromSchema -->
  <rect x="120" y="216" width="440" height="96" rx="10" fill="#0b1220" stroke="#34d399" stroke-width="1.5"/>
  <text x="140" y="242" font-size="13" fill="#6ee7b7" font-family="'JetBrains Mono','Noto Sans SC',monospace">updatePartialStateFromSchema</text>
  <text x="140" y="266" font-size="11" fill="#e2e8f0" font-family="'JetBrains Mono','Noto Sans SC',monospace">对 partial 的每个键 k：</text>
  <text x="140" y="286" font-size="11" fill="#7dd3fc" font-family="'JetBrains Mono','Noto Sans SC',monospace">channel.update(k, current[k], partial[k])</text>
  <text x="140" y="304" font-size="10" fill="#64748b" font-family="'JetBrains Mono','Noto Sans SC',monospace">即按该键的通道做一次归约（追加 / 覆盖 / 删除）</text>

  <!-- 汇合到收集 -->
  <path d="M340 312 L340 336" stroke="#34d399" stroke-width="1.5" fill="none" marker-end="url(#ag3)"/>

  <!-- 收集：updateState -->
  <rect x="120" y="338" width="440" height="52" rx="10" fill="#0b1220" stroke="#34d399" stroke-width="1.5"/>
  <text x="140" y="360" font-size="13" fill="#6ee7b7" font-family="'JetBrains Mono','Noto Sans SC',monospace">updateState 收集</text>
  <text x="140" y="380" font-size="11" fill="#e2e8f0" font-family="'JetBrains Mono','Noto Sans SC',monospace">partial 结果覆盖 current；值为 null 的键直接丢弃</text>

  <text x="40" y="424" font-size="11" fill="#94a3b8">所以「状态」只是 Map，「通道」是每个键的归约函数，updateState 是合并入口</text>
</svg>
