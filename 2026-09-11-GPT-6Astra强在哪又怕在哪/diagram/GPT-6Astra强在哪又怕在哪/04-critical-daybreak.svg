<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 450" width="680" height="450">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;family=Noto+Sans+SC:wght@400;700&amp;display=swap');
    text { font-family: 'Noto Sans SC','JetBrains Mono',monospace; }
  </style>
  <defs>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#1e293b" stroke-width="1"/>
    </pattern>
    <marker id="a-rose" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#fb7185"/>
    </marker>
    <marker id="a-cyan" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#22d3ee"/>
    </marker>
  </defs>
  <rect width="680" height="450" fill="#0f172a"/>
  <rect width="680" height="450" fill="url(#grid)"/>

  <text x="28" y="34" font-size="15" font-weight="700" fill="#f8fafc">04 · Critical 阈值与 Daybreak 门控</text>
  <text x="28" y="52" font-size="9.5" fill="#94a3b8">首个达 Critical 级：能在无逐步人类指导下自主链零日漏洞</text>

  <!-- critical badge -->
  <rect x="28" y="70" width="180" height="40" rx="8" fill="rgba(251,113,133,0.14)" stroke="#fb7185" stroke-width="2"/>
  <text x="118" y="95" font-size="13" font-weight="700" fill="#fb7185" text-anchor="middle">CRITICAL 级</text>

  <!-- public astra -->
  <rect x="28" y="126" width="300" height="70" rx="10" fill="rgba(148,163,184,0.07)" stroke="#64748b" stroke-width="1.6"/>
  <text x="48" y="150" font-size="11.5" font-weight="700" fill="#e2e8f0">公众 Astra（默认）</text>
  <text x="48" y="170" font-size="9.5" fill="#cbd5e1">✓ 防御：代码审查 / 打补丁</text>
  <text x="48" y="187" font-size="9.5" fill="#fecdd3">✗ 拒绝高级攻击 / 写 PoC exploit</text>

  <!-- daybreak -->
  <text x="28" y="228" font-size="10.5" font-weight="700" fill="#22d3ee">Daybreak 受信任访问计划</text>
  <rect x="28" y="238" width="300" height="70" rx="10" fill="rgba(34,211,238,0.08)" stroke="#22d3ee" stroke-width="1.6"/>
  <text x="48" y="262" font-size="11" font-weight="700" fill="#22d3ee">Daybreak Blue</text>
  <text x="48" y="280" font-size="9" fill="#cbd5e1">gpt-daybreak-blue-latest</text>
  <text x="48" y="296" font-size="9" fill="#cbd5e1">→ 映射 gpt-5.6-sol · 授权防御</text>

  <rect x="352" y="238" width="300" height="70" rx="10" fill="rgba(251,191,36,0.08)" stroke="#fbbf24" stroke-width="1.6"/>
  <text x="372" y="262" font-size="11" font-weight="700" fill="#fbbf24">Daybreak Red</text>
  <text x="372" y="280" font-size="9" fill="#cbd5e1">gpt-daybreak-red-latest</text>
  <text x="372" y="296" font-size="9" fill="#cbd5e1">→ 映射 gpt-5.6-cyber · 红队</text>

  <text x="352" y="328" font-size="8.8" fill="#fbbf24">⚠ Blue 不自动授权 Red，需单独审批</text>

  <!-- http 403 monitor -->
  <rect x="28" y="338" width="624" height="70" rx="10" fill="rgba(251,113,133,0.06)" stroke="#fb7185" stroke-width="1.4"/>
  <text x="48" y="362" font-size="11" font-weight="700" fill="#fb7185">生产监控：标记请求 → HTTP 403 终止（无通用续跑）</text>
  <text x="48" y="382" font-size="9.5" fill="#cbd5e1">error_type=invalid_request_error · code=misalignment_policy_violation</text>
  <text x="48" y="399" font-size="9.5" fill="#cbd5e1">Responses API（持久化推理/WebSocket/compaction）可被自动停；Chat Completions 在监控外</text>

  <text x="28" y="430" font-size="8.5" fill="#64748b">端点选择 = 安全路由决策：评测期 Astra 发现并链出 2 个未知零日（已向维护者披露）</text>
</svg>
