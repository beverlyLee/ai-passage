<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 450" width="680" height="450">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;family=Noto+Sans+SC:wght@400;700&amp;display=swap');
    text { font-family: 'Noto Sans SC','JetBrains Mono',monospace; }
  </style>
  <defs>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#1e293b" stroke-width="1"/>
    </pattern>
    <marker id="a-cyan" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#22d3ee"/>
    </marker>
    <marker id="a-rose" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#fb7185"/>
    </marker>
  </defs>
  <rect width="680" height="450" fill="#0f172a"/>
  <rect width="680" height="450" fill="url(#grid)"/>

  <text x="28" y="34" font-size="15" font-weight="700" fill="#f8fafc">01 · computer-use 架构：模型真的在「用电脑」</text>
  <text x="28" y="52" font-size="9.5" fill="#94a3b8">looped transformer + RL 执行反馈 + 原生多模态环境输入 → 能力跃迁的总根</text>

  <!-- core -->
  <rect x="250" y="92" width="180" height="58" rx="10" fill="rgba(34,211,238,0.10)" stroke="#22d3ee" stroke-width="2"/>
  <text x="340" y="116" font-size="13" font-weight="700" fill="#22d3ee" text-anchor="middle">looped transformer</text>
  <text x="340" y="135" font-size="9" fill="#cbd5e1" text-anchor="middle">recurrent depth · 推理在权重内循环</text>

  <!-- training -->
  <rect x="250" y="186" width="180" height="40" rx="8" fill="rgba(251,191,36,0.10)" stroke="#fbbf24" stroke-width="1.6"/>
  <text x="340" y="210" font-size="10.5" fill="#fbbf24" text-anchor="middle">RL with execution feedback</text>
  <text x="340" y="223" font-size="8.5" fill="#cbd5e1" text-anchor="middle">Stargate &gt;100K GPU 预训练</text>

  <!-- inputs -->
  <text x="28" y="280" font-size="10.5" font-weight="700" fill="#e2e8f0">原生摄取 · 交叉注意于环境信号</text>
  <rect x="28" y="290" width="155" height="34" rx="7" fill="rgba(148,163,184,0.08)" stroke="#64748b" stroke-width="1.4"/>
  <text x="105" y="311" font-size="9.5" fill="#e2e8f0" text-anchor="middle">屏幕帧缓冲</text>
  <rect x="195" y="290" width="155" height="34" rx="7" fill="rgba(148,163,184,0.08)" stroke="#64748b" stroke-width="1.4"/>
  <text x="272" y="311" font-size="9.5" fill="#e2e8f0" text-anchor="middle">OS accessibility tree</text>
  <rect x="362" y="290" width="155" height="34" rx="7" fill="rgba(148,163,184,0.08)" stroke="#64748b" stroke-width="1.4"/>
  <text x="439" y="311" font-size="9.5" fill="#e2e8f0" text-anchor="middle">实时 syscall telemetry</text>
  <rect x="529" y="290" width="123" height="34" rx="7" fill="rgba(148,163,184,0.08)" stroke="#64748b" stroke-width="1.4"/>
  <text x="590" y="311" font-size="9" fill="#e2e8f0" text-anchor="middle">合成硬件输入</text>

  <!-- output -->
  <rect x="250" y="356" width="180" height="40" rx="8" fill="rgba(251,113,133,0.10)" stroke="#fb7185" stroke-width="1.8"/>
  <text x="340" y="381" font-size="11" font-weight="700" fill="#fb7185" text-anchor="middle">动作输出 → 真实环境</text>

  <!-- arrows -->
  <line x1="340" y1="150" x2="340" y2="184" stroke="#fbbf24" stroke-width="1.6" marker-end="url(#a-rose)"/>
  <line x1="105" y1="290" x2="295" y2="150" stroke="#64748b" stroke-width="1.2" marker-end="url(#a-cyan)"/>
  <line x1="272" y1="290" x2="320" y2="150" stroke="#64748b" stroke-width="1.2" marker-end="url(#a-cyan)"/>
  <line x1="439" y1="290" x2="365" y2="150" stroke="#64748b" stroke-width="1.2" marker-end="url(#a-cyan)"/>
  <line x1="590" y1="290" x2="380" y2="150" stroke="#64748b" stroke-width="1.2" marker-end="url(#a-cyan)"/>
  <line x1="340" y1="226" x2="340" y2="290" stroke="#22d3ee" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="340" y1="396" x2="340" y2="404" stroke="#fb7185" stroke-width="1.6" marker-end="url(#a-rose)"/>

  <text x="28" y="436" font-size="8.5" fill="#64748b">代价：部分推理在可读 CoT 之外 → 可监控性下降（见 图6）</text>
</svg>
