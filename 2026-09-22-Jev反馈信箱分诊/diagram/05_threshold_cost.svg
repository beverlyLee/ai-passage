<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 450" font-family="'JetBrains Mono','Noto Sans SC',sans-serif">
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono&amp;family=Noto+Sans+SC:wght@400;700&amp;display=swap');</style>
  </defs>
  <rect width="680" height="450" fill="#0f172a"/>
  <g stroke="#1e293b" stroke-width="1">
    <line x1="0" y1="112" x2="680" y2="112"/><line x1="0" y1="225" x2="680" y2="225"/><line x1="0" y1="338" x2="680" y2="338"/>
    <line x1="340" y1="0" x2="340" y2="450"/>
  </g>
  <text x="24" y="34" fill="#e2e8f0" font-size="17" font-weight="700">置信度阈值，与每封成本</text>
  <text x="24" y="56" fill="#94a3b8" font-size="12">阈值由错误成本定；Jev 输出免费，便宜的前提是只做判断不做生成</text>

  <!-- 左：阈值 -->
  <rect x="24" y="80" width="310" height="344" rx="10" fill="#0c1f2e" stroke="#155e63"/>
  <text x="44" y="106" fill="#22d3ee" font-size="14" font-weight="700">阈值怎么定：错误成本决定下限</text>
  <g font-size="11" fill="#e2e8f0">
    <circle cx="50" cy="134" r="3" fill="#22d3ee"/><text x="62" y="138">部门置信 ≥ 0.7 → 自动派单</text>
    <circle cx="50" cy="160" r="3" fill="#22d3ee"/><text x="62" y="164">&lt; 0.7 → 转人工复核</text>
    <circle cx="50" cy="190" r="3" fill="#22d3ee"/><text x="62" y="194">Noul 阈值 0.5：需人过半转人</text>
  </g>
  <rect x="44" y="210" width="270" height="80" rx="8" fill="#063a44" stroke="#22d3ee"/>
  <text x="56" y="232" fill="#22d3ee" font-size="11" font-weight="700">为什么是 0.7 不是 0.95</text>
  <text x="56" y="252" fill="#a5f3fc" font-size="10">错派账单 / 漏派安全的代价</text>
  <text x="56" y="268" fill="#a5f3fc" font-size="10">&gt; 多花一次人审的成本</text>
  <text x="56" y="284" fill="#a5f3fc" font-size="10">所以阈值偏保守，宁可转人</text>
  <rect x="44" y="302" width="270" height="54" rx="8" fill="#111c33" stroke="#334155"/>
  <text x="56" y="324" fill="#e2e8f0" font-size="11" font-weight="700">阈值在代码里，不在模型里</text>
  <text x="56" y="344" fill="#94a3b8" font-size="10">随时改，不用重训；Jev 只给</text>
  <text x="56" y="358" fill="#94a3b8" font-size="10">判断，决定权始终在你手上</text>

  <!-- 右：成本 -->
  <rect x="356" y="80" width="300" height="344" rx="10" fill="#2a2410" stroke="#92660f"/>
  <text x="376" y="106" fill="#fbbf24" font-size="14" font-weight="700">每封成本≈$0.000007，输出免费</text>
  <g font-size="11" fill="#e2e8f0">
    <circle cx="382" cy="134" r="3" fill="#fbbf24"/><text x="394" y="138">单价 0.042 美元 / 百万输入 token</text>
    <circle cx="382" cy="162" r="3" fill="#fbbf24"/><text x="394" y="166">7 封 batch 实测：1209 token</text>
    <circle cx="382" cy="190" r="3" fill="#fbbf24"/><text x="394" y="194">→ $0.0000508（输出免费）</text>
    <circle cx="382" cy="218" r="3" fill="#fbbf24"/><text x="394" y="222">100 封 / 天 → 约 $0.0007 / 天</text>
  </g>
  <rect x="376" y="238" width="260" height="86" rx="8" fill="#3a2f10" stroke="#fbbf24"/>
  <text x="388" y="260" fill="#fbbf24" font-size="11" font-weight="700">对比聊天模型逐封生成</text>
  <text x="388" y="280" fill="#fde68a" font-size="10">读信 + 判断 + 写回，单封数秒</text>
  <text x="388" y="296" fill="#fde68a" font-size="10">且另计输出 token；量大时成本</text>
  <text x="388" y="312" fill="#fde68a" font-size="10">与延迟都被放大</text>
  <rect x="376" y="334" width="260" height="54" rx="8" fill="#111c33" stroke="#334155"/>
  <text x="388" y="356" fill="#e2e8f0" font-size="11" font-weight="700">贵的生成不做无用功</text>
  <text x="388" y="376" fill="#94a3b8" font-size="10">只让 LLM / 人接模糊或高危的信</text>

  <!-- 底部 -->
  <rect x="24" y="396" width="632" height="34" rx="8" fill="#111c33" stroke="#334155"/>
  <text x="36" y="418" fill="#e2e8f0" font-size="12">Jev 只做判断不做生成，所以判断不要钱 —— 把贵的部分留给真正需要它的那几封信</text>
</svg>
