<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 450" font-family="'JetBrains Mono','Noto Sans SC',sans-serif">
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono&amp;family=Noto+Sans+SC:wght@400;700&amp;display=swap');</style>
  </defs>
  <rect width="680" height="450" fill="#0f172a"/>
  <g stroke="#1e293b" stroke-width="1">
    <line x1="0" y1="112" x2="680" y2="112"/><line x1="0" y1="225" x2="680" y2="225"/><line x1="0" y1="338" x2="680" y2="338"/>
  </g>
  <text x="24" y="34" fill="#e2e8f0" font-size="17" font-weight="700">确定性路由：Jev 给判断，代码写规则</text>
  <text x="24" y="56" fill="#94a3b8" font-size="12">阈值由错误成本决定，不是厂商 SLA；以下队列分布来自 7 封样例实测</text>

  <!-- 输入块 -->
  <rect x="24" y="74" width="632" height="34" rx="8" fill="#111c33" stroke="#334155"/>
  <text x="40" y="96" fill="#22d3ee" font-size="11" font-weight="700">Jev 三问 → answers：department(choice, confidence) · urgency(score) · escalate(noul)</text>

  <!-- Tier1 安全 -->
  <rect x="24" y="118" width="632" height="54" rx="8" fill="#2a1622" stroke="#fb7185"/>
  <text x="40" y="140" fill="#fecaca" font-size="12" font-weight="700">① 若 部门 == security → 安全信号，永远人先看 + 置顶</text>
  <text x="40" y="160" fill="#fecaca" font-size="11">绝不经自动回复；assignee = security_oncall</text>
  <rect x="470" y="128" width="182" height="34" rx="6" fill="#7f1d1d"/>
  <text x="482" y="150" fill="#fecaca" font-size="12" font-weight="700">human_priority × 1</text>

  <!-- Tier2 灌水 -->
  <rect x="24" y="178" width="632" height="54" rx="8" fill="#111c33" stroke="#334155"/>
  <text x="40" y="200" fill="#e2e8f0" font-size="12" font-weight="700">②  elif 部门 == spam → 灌水直接丢弃，不占人工</text>
  <text x="40" y="220" fill="#94a3b8" font-size="11">assignee = none</text>
  <rect x="470" y="188" width="182" height="34" rx="6" fill="#1e293b"/>
  <text x="482" y="210" fill="#e2e8f0" font-size="12" font-weight="700">discard × 1</text>

  <!-- Tier3 需人/低置信 -->
  <rect x="24" y="238" width="632" height="54" rx="8" fill="#2a2410" stroke="#fbbf24"/>
  <text x="40" y="260" fill="#fde68a" font-size="12" font-weight="700">③  elif 需人 &gt; 0.5 或 部门置信 &lt; 0.7 → 转人工复核</text>
  <text x="40" y="280" fill="#fde68a" font-size="11">拿不准 / 愤怒投诉 / 法律 → assignee = triage_human</text>
  <rect x="470" y="248" width="182" height="34" rx="6" fill="#92660f"/>
  <text x="482" y="270" fill="#fde68a" font-size="12" font-weight="700">human_review × 2</text>

  <!-- Tier4 自动 -->
  <rect x="24" y="298" width="632" height="54" rx="8" fill="#0c1f2e" stroke="#155e63"/>
  <text x="40" y="320" fill="#a5f3fc" font-size="12" font-weight="700">④  else → 高置信自动派单到对应团队</text>
  <text x="40" y="340" fill="#a5f3fc" font-size="11">priority = P0..P3（按 score 映射）；assignee = team:部门</text>
  <rect x="470" y="308" width="182" height="34" rx="6" fill="#063a44"/>
  <text x="482" y="330" fill="#a5f3fc" font-size="12" font-weight="700">auto × 3</text>

  <!-- 底部 -->
  <rect x="24" y="362" width="632" height="64" rx="10" fill="#111c33" stroke="#334155"/>
  <text x="40" y="386" fill="#22d3ee" font-size="12" font-weight="700">代码写 if/elif 链，阈值 auto_threshold = 0.7 由错派代价决定，不在模型里</text>
  <text x="40" y="408" fill="#e2e8f0" font-size="11">贵的真人只接模糊或高危的信；阈值你随时能改，不用重训模型</text>
</svg>
