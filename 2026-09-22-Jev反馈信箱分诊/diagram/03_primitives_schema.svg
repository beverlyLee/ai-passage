<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 450" font-family="'JetBrains Mono','Noto Sans SC',sans-serif">
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono&amp;family=Noto+Sans+SC:wght@400;700&amp;display=swap');</style>
  </defs>
  <rect width="680" height="450" fill="#0f172a"/>
  <g stroke="#1e293b" stroke-width="1">
    <line x1="0" y1="112" x2="680" y2="112"/><line x1="0" y1="225" x2="680" y2="225"/><line x1="0" y1="338" x2="680" y2="338"/>
    <line x1="170" y1="0" x2="170" y2="450"/><line x1="340" y1="0" x2="340" y2="450"/><line x1="510" y1="0" x2="510" y2="450"/>
  </g>
  <text x="24" y="34" fill="#e2e8f0" font-size="17" font-weight="700">一次调用，三个原语并行且隔离：复合判断拆原子问题</text>
  <text x="24" y="56" fill="#94a3b8" font-size="12">把「这封该怎么处理」拆成 department / urgency / escalate，再用代码组合（官方明确建议）</text>

  <!-- 请求块 -->
  <rect x="24" y="76" width="632" height="40" rx="8" fill="#111c33" stroke="#334155"/>
  <text x="40" y="92" fill="#22d3ee" font-size="12" font-weight="700">POST /v1/systemone</text>
  <text x="200" y="92" fill="#e2e8f0" font-size="11">model = jev-latest</text>
  <text x="360" y="92" fill="#e2e8f0" font-size="11">questions = { department, urgency, escalate }</text>
  <text x="560" y="92" fill="#94a3b8" font-size="11">state = { subject, body }</text>

  <!-- 三张原语卡 -->
  <rect x="24" y="134" width="200" height="176" rx="10" fill="#0c1f2e" stroke="#155e63"/>
  <text x="40" y="158" fill="#22d3ee" font-size="14" font-weight="700">Choice</text>
  <text x="40" y="178" fill="#94a3b8" font-size="11">department 派哪个部门</text>
  <g font-size="11" fill="#e2e8f0">
    <text x="40" y="200">criteria：7 类团队</text>
    <text x="40" y="220">返回 choice</text>
    <text x="40" y="240">probabilities 归一</text>
    <text x="40" y="260">confidence 置信</text>
    <text x="40" y="284" fill="#a5f3fc">最多 255 个选项</text>
  </g>

  <rect x="240" y="134" width="200" height="176" rx="10" fill="#0c1f2e" stroke="#155e63"/>
  <text x="256" y="158" fill="#22d3ee" font-size="14" font-weight="700">Score</text>
  <text x="256" y="178" fill="#94a3b8" font-size="11">urgency 紧急程度</text>
  <g font-size="11" fill="#e2e8f0">
    <text x="256" y="200">有序刻度 1..4</text>
    <text x="256" y="220">返回 score</text>
    <text x="256" y="240">可卡在两档之间</text>
    <text x="256" y="260">（例 1.035）</text>
    <text x="256" y="284" fill="#a5f3fc">legend + confidence</text>
  </g>

  <rect x="456" y="134" width="200" height="176" rx="10" fill="#0c1f2e" stroke="#155e63"/>
  <text x="472" y="158" fill="#22d3ee" font-size="14" font-weight="700">Noul</text>
  <text x="472" y="178" fill="#94a3b8" font-size="11">escalate 要不要人</text>
  <g font-size="11" fill="#e2e8f0">
    <text x="472" y="200">返回 noul 0..1</text>
    <text x="472" y="220">无单独 confidence</text>
    <text x="472" y="240">0.5 = 拿不准</text>
    <text x="472" y="260">&gt; 0.5 倾向转人</text>
    <text x="472" y="284" fill="#a5f3fc">回答「是不是」</text>
  </g>

  <!-- 底部约束条 -->
  <rect x="24" y="330" width="632" height="98" rx="10" fill="#111c33" stroke="#334155"/>
  <text x="40" y="354" fill="#22d3ee" font-size="12" font-weight="700">三个问题并行隔离评估：增加问题几乎不增延迟、不产生 context rot</text>
  <g font-size="11" fill="#e2e8f0">
    <text x="40" y="378">预算：32K 共享上下文 / 64K 总请求；instructions 用点路径 ticket.body 指向字段切片</text>
    <text x="40" y="398">state 传 JSON 时，模型读切片而非整段乱翻，避免把无关上下文塞进共享预算</text>
    <text x="40" y="418">响应外壳：{ model, answers{...}, usage{input_tokens, output_tokens} }；输出 token 免费</text>
  </g>
</svg>
