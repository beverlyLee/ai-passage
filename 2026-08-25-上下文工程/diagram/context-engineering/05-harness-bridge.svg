<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 580">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;family=Noto+Sans+SC:wght@400;500;700&amp;display=swap');
    text { font-family: 'JetBrains Mono','Noto Sans SC','PingFang SC',sans-serif; }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <marker id="arrow-cyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#22d3ee"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34d399"/>
    </marker>
    <marker id="arrow-amber" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#fbbf24"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#0f172a"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <text x="20" y="30" fill="#e2e8f0" font-size="16" font-weight="700">图5 · 黑鲸 Harness：把上下文工程封装成受治理运行时</text>
  <text x="20" y="46" fill="#64748b" font-size="9">问题5 — 最火的新框架，踩中的正是这套老问题</text>

  <!-- Model box -->
  <rect x="40" y="250" width="150" height="80" rx="6" fill="#0f172a"/>
  <rect x="40" y="250" width="150" height="80" rx="6" fill="rgba(59,130,246,0.3)" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="115" y="284" fill="white" font-size="12" font-weight="600" text-anchor="middle">Model 模型</text>
  <text x="115" y="304" fill="#94a3b8" font-size="9" text-anchor="middle">推理引擎</text>

  <!-- Arrow Model -> Harness -->
  <line x1="190" y1="290" x2="226" y2="290" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Harness region -->
  <rect x="228" y="70" width="412" height="400" rx="12" fill="none" stroke="#22d3ee" stroke-width="1" stroke-dasharray="8,4"/>
  <text x="240" y="88" fill="#22d3ee" font-size="10" font-weight="600">DeepSeek 黑鲸 Harness 运行框架 · 2026-08-13 开源 · 一切皆插件</text>

  <!-- 6 control items -->
  <rect x="250" y="100" width="170" height="64" rx="6" fill="#0f172a"/>
  <rect x="250" y="100" width="170" height="64" rx="6" fill="rgba(59,130,246,0.3)" stroke="#60a5fa" stroke-width="2"/>
  <text x="335" y="126" fill="white" font-size="11" font-weight="700" text-anchor="middle">上下文 Context</text>
  <text x="335" y="144" fill="#94a3b8" font-size="8" text-anchor="middle">编译 / 约束 / 治理</text>

  <rect x="448" y="100" width="170" height="64" rx="6" fill="#0f172a"/>
  <rect x="448" y="100" width="170" height="64" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="533" y="126" fill="white" font-size="11" font-weight="600" text-anchor="middle">工具调用 Tool</text>
  <text x="533" y="144" fill="#94a3b8" font-size="8" text-anchor="middle">中介动作</text>

  <rect x="250" y="178" width="170" height="64" rx="6" fill="#0f172a"/>
  <rect x="250" y="178" width="170" height="64" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="335" y="204" fill="white" font-size="11" font-weight="600" text-anchor="middle">异常重试 Recovery</text>
  <text x="335" y="222" fill="#94a3b8" font-size="8" text-anchor="middle">失败自愈</text>

  <rect x="448" y="178" width="170" height="64" rx="6" fill="#0f172a"/>
  <rect x="448" y="178" width="170" height="64" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="533" y="204" fill="white" font-size="11" font-weight="600" text-anchor="middle">任务恢复 Restore</text>
  <text x="533" y="222" fill="#94a3b8" font-size="8" text-anchor="middle">断点续跑</text>

  <rect x="250" y="256" width="170" height="64" rx="6" fill="#0f172a"/>
  <rect x="250" y="256" width="170" height="64" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="335" y="282" fill="white" font-size="11" font-weight="600" text-anchor="middle">高风险审批 Approval</text>
  <text x="335" y="300" fill="#94a3b8" font-size="8" text-anchor="middle">人工/策略闸门</text>

  <rect x="448" y="256" width="170" height="64" rx="6" fill="#0f172a"/>
  <rect x="448" y="256" width="170" height="64" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="533" y="282" fill="white" font-size="11" font-weight="600" text-anchor="middle">长任务锁定 Goal-lock</text>
  <text x="533" y="300" fill="#94a3b8" font-size="8" text-anchor="middle">目标不漂移</text>

  <!-- Arrow region -> Agent -->
  <line x1="434" y1="470" x2="434" y2="500" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Agent = Model + Harness -->
  <rect x="280" y="502" width="320" height="56" rx="6" fill="#0f172a"/>
  <rect x="280" y="502" width="320" height="56" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="440" y="528" fill="white" font-size="13" font-weight="700" text-anchor="middle">Agent = Model + Harness</text>
  <text x="440" y="546" fill="#94a3b8" font-size="9" text-anchor="middle">Gartner：2027 重视语义组织 → 准确率 +80% / 成本 -60%</text>

  <!-- Context Engineering box (outside, bottom-left) -->
  <rect x="40" y="420" width="170" height="86" rx="6" fill="#0f172a"/>
  <rect x="40" y="420" width="170" height="86" rx="6" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="125" y="448" fill="white" font-size="11" font-weight="600" text-anchor="middle">上下文工程</text>
  <text x="125" y="466" fill="#94a3b8" font-size="9" text-anchor="middle">六层模型 / 四手法</text>
  <text x="125" y="482" fill="#94a3b8" font-size="9" text-anchor="middle">减法原则</text>
  <text x="125" y="498" fill="#fbbf24" font-size="8" text-anchor="middle">Harness 把它平台化</text>

  <!-- Bridge dashed connector 上下文 <-> 上下文工程 -->
  <line x1="210" y1="430" x2="250" y2="150" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrow-amber)"/>
  <line x1="210" y1="496" x2="250" y2="172" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrow-amber)"/>
  <rect x="60" y="280" width="150" height="44" rx="6" fill="rgba(30,41,59,0.85)" stroke="#fbbf24" stroke-width="1"/>
  <text x="135" y="298" fill="#fbbf24" font-size="8" text-anchor="middle">Harness 管的『上下文』</text>
  <text x="135" y="314" fill="#fbbf24" font-size="8" text-anchor="middle">⇄ 正是上下文工程</text>
</svg>
