<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 450">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;family=Noto+Sans+SC:wght@400;500;700&amp;display=swap');
    text { font-family: 'JetBrains Mono','Noto Sans SC','PingFang SC',sans-serif; }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <marker id="arrow-rose" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#fb7185"/>
    </marker>
    <marker id="arrow-amber" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#fbbf24"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#0f172a"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <!-- Title -->
  <text x="20" y="30" fill="#e2e8f0" font-size="16" font-weight="700">图1 · 生产静默失败：第一嫌疑不是模型</text>
  <text x="20" y="46" fill="#64748b" font-size="9">问题1 — 把“模型不行”这个直觉先划掉</text>

  <!-- Start: 生产静默失败 -->
  <rect x="210" y="64" width="260" height="58" rx="25" fill="#0f172a"/>
  <rect x="210" y="64" width="260" height="58" rx="25" fill="rgba(59,130,246,0.3)" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="340" y="88" fill="white" font-size="12" font-weight="600" text-anchor="middle">生产静默失败</text>
  <text x="340" y="106" fill="#94a3b8" font-size="9" text-anchor="middle">模型没报错 · 工具全 200 · 窗口没爆</text>

  <!-- Arrow down -->
  <line x1="340" y1="122" x2="340" y2="150" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Decision diamond -->
  <polygon points="340,156 430,210 340,264 250,210" fill="#0f172a"/>
  <polygon points="340,156 430,210 340,264 250,210" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="340" y="205" fill="white" font-size="10" font-weight="600" text-anchor="middle">第一嫌疑</text>
  <text x="340" y="221" fill="white" font-size="10" font-weight="600" text-anchor="middle">是模型能力问题?</text>

  <!-- Arrow down to context drift -->
  <line x1="340" y1="264" x2="340" y2="292" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="352" y="282" fill="#fb7185" font-size="8">否（数据表明）</text>

  <!-- Context drift box -->
  <rect x="190" y="292" width="300" height="66" rx="6" fill="#0f172a"/>
  <rect x="190" y="292" width="300" height="66" rx="6" fill="rgba(136,19,55,0.4)" stroke="#fb7185" stroke-width="1.5"/>
  <text x="340" y="318" fill="white" font-size="12" font-weight="600" text-anchor="middle">上下文漂移 / 记忆丢失</text>
  <text x="340" y="336" fill="#94a3b8" font-size="9" text-anchor="middle">METR: 约 65% 失败归因于此</text>
  <text x="340" y="350" fill="#94a3b8" font-size="9" text-anchor="middle">Chroma: 18 模型，越长越差</text>

  <!-- Arrow down -->
  <line x1="340" y1="358" x2="340" y2="388" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Real suspect -->
  <rect x="165" y="388" width="350" height="50" rx="6" fill="#0f172a"/>
  <rect x="165" y="388" width="350" height="50" rx="6" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="340" y="410" fill="white" font-size="11" font-weight="600" text-anchor="middle">真正的嫌疑：模型所看到的状态被污染</text>
  <text x="340" y="427" fill="#94a3b8" font-size="9" text-anchor="middle">不是模型 IQ，是它此刻“看到的东西”变了</text>

  <!-- Legend -->
  <rect x="500" y="380" width="160" height="56" rx="6" fill="rgba(30,41,59,0.5)" stroke="#475569" stroke-width="1"/>
  <rect x="512" y="392" width="14" height="10" rx="2" fill="rgba(59,130,246,0.3)" stroke="#60a5fa"/>
  <text x="532" y="401" fill="#94a3b8" font-size="8">蓝 = 故障现象</text>
  <rect x="512" y="410" width="14" height="10" rx="2" fill="rgba(136,19,55,0.4)" stroke="#fb7185"/>
  <text x="532" y="419" fill="#94a3b8" font-size="8">红 = 数据归因</text>
  <rect x="512" y="422" width="14" height="10" rx="2" fill="rgba(120,53,15,0.3)" stroke="#fbbf24"/>
  <text x="532" y="431" fill="#94a3b8" font-size="8">琥珀 = 结论</text>
</svg>
