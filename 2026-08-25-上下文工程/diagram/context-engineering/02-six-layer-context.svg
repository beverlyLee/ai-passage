<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 600">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;family=Noto+Sans+SC:wght@400;500;700&amp;display=swap');
    text { font-family: 'JetBrains Mono','Noto Sans SC','PingFang SC',sans-serif; }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <marker id="arrow-amber" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#fbbf24"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#0f172a"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <text x="20" y="30" fill="#e2e8f0" font-size="16" font-weight="700">图2 · 上下文窗口 = 一块 RAM：模型每步读取的 6 层</text>
  <text x="20" y="46" fill="#64748b" font-size="9">问题2 — 你敲的那行 prompt，只是第 1 层里的一小块</text>

  <!-- Region boundary -->
  <rect x="60" y="70" width="560" height="410" rx="12" fill="none" stroke="#fbbf24" stroke-width="1" stroke-dasharray="8,4"/>
  <text x="72" y="86" fill="#fbbf24" font-size="10" font-weight="600">Context Window 上下文窗口 = 模型每步“看到”的一切（一块 RAM）</text>

  <!-- Layer 1 -->
  <rect x="90" y="100" width="500" height="46" rx="6" fill="#0f172a"/>
  <rect x="90" y="100" width="500" height="46" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="104" y="120" fill="#22d3ee" font-size="10" font-weight="600">①</text>
  <text x="124" y="121" fill="white" font-size="11" font-weight="600">Instruction 指令层</text>
  <text x="124" y="138" fill="#94a3b8" font-size="9">系统提示 / 约束 / 输出格式（你写的那行字在这）</text>

  <!-- Layer 2 -->
  <rect x="90" y="154" width="500" height="46" rx="6" fill="#0f172a"/>
  <rect x="90" y="154" width="500" height="46" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="104" y="174" fill="#34d399" font-size="10" font-weight="600">②</text>
  <text x="124" y="175" fill="white" font-size="11" font-weight="600">User 用户层</text>
  <text x="124" y="192" fill="#94a3b8" font-size="9">身份 / 历史 / 偏好</text>

  <!-- Layer 3 -->
  <rect x="90" y="208" width="500" height="46" rx="6" fill="#0f172a"/>
  <rect x="90" y="208" width="500" height="46" rx="6" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="104" y="228" fill="#a78bfa" font-size="10" font-weight="600">③</text>
  <text x="124" y="229" fill="white" font-size="11" font-weight="600">Conversation 对话层</text>
  <text x="124" y="246" fill="#94a3b8" font-size="9">当前对话线程</text>

  <!-- Layer 4 -->
  <rect x="90" y="262" width="500" height="46" rx="6" fill="#0f172a"/>
  <rect x="90" y="262" width="500" height="46" rx="6" fill="rgba(59,130,246,0.3)" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="104" y="282" fill="#60a5fa" font-size="10" font-weight="600">④</text>
  <text x="124" y="283" fill="white" font-size="11" font-weight="600">Tool 工具层</text>
  <text x="124" y="300" fill="#94a3b8" font-size="9">外部系统 / MCP</text>

  <!-- Layer 5 -->
  <rect x="90" y="316" width="500" height="46" rx="6" fill="#0f172a"/>
  <rect x="90" y="316" width="500" height="46" rx="6" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="104" y="336" fill="#fbbf24" font-size="10" font-weight="600">⑤</text>
  <text x="124" y="337" fill="white" font-size="11" font-weight="600">Retrieval 检索层</text>
  <text x="124" y="354" fill="#94a3b8" font-size="9">动态检索的文档 / 数据</text>

  <!-- Layer 6 -->
  <rect x="90" y="370" width="500" height="46" rx="6" fill="#0f172a"/>
  <rect x="90" y="370" width="500" height="46" rx="6" fill="rgba(136,19,55,0.4)" stroke="#fb7185" stroke-width="1.5"/>
  <text x="104" y="390" fill="#fb7185" font-size="10" font-weight="600">⑥</text>
  <text x="124" y="391" fill="white" font-size="11" font-weight="600">Structured Output 输出层</text>
  <text x="124" y="408" fill="#94a3b8" font-size="9">格式 / schema</text>

  <!-- Arrow down to CPU -->
  <line x1="340" y1="480" x2="340" y2="508" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- CPU box -->
  <rect x="170" y="508" width="340" height="62" rx="6" fill="#0f172a"/>
  <rect x="170" y="508" width="340" height="62" rx="6" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="340" y="532" fill="white" font-size="12" font-weight="600" text-anchor="middle">LLM 这颗 CPU：只读取 6 层叠加后的“整体”</text>
  <text x="340" y="550" fill="#94a3b8" font-size="9" text-anchor="middle">Karpathy 类比：LLM = CPU · 上下文 = RAM · 你 = 操作系统</text>
  <text x="340" y="563" fill="#94a3b8" font-size="9" text-anchor="middle">输出质量 = 六层整体设计的结果，而非某一层</text>
</svg>
