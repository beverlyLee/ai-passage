<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 450" font-family="'PingFang SC','Noto Sans SC',sans-serif">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="680" height="450" fill="#0f172a"/>
  <rect width="680" height="450" fill="url(#grid)"/>

  <text x="340" y="30" fill="#e2e8f0" font-size="18" text-anchor="middle" font-weight="600">流式合并：五个字段，五套合并规则</text>
  <text x="340" y="49" fill="#64748b" font-size="11" text-anchor="middle">messages/ai.py:638 add_ai_message_chunks　·　base.py:366 merge_content</text>

  <!-- incoming chunks -->
  <text x="24" y="78" fill="#94a3b8" font-size="11" text-anchor="start">流入分片（同一 index 属于同一次调用）</text>

  <g font-size="9">
    <rect x="24" y="88" width="200" height="66" rx="6" fill="#0f172a"/>
    <rect x="24" y="88" width="200" height="66" rx="6" fill="rgba(8,51,68,0.55)" stroke="#22d3ee"/>
    <text x="36" y="106" fill="#e2e8f0" font-size="10">chunk 1　content="正在"</text>
    <text x="36" y="122" fill="#94a3b8" font-size="9">args: '{"order_id":</text>
    <text x="36" y="136" fill="#94a3b8" font-size="9">index: 0　id: call_1</text>
    <text x="36" y="149" fill="#64748b" font-size="8">usage in=30 out=1</text>

    <rect x="240" y="88" width="200" height="66" rx="6" fill="#0f172a"/>
    <rect x="240" y="88" width="200" height="66" rx="6" fill="rgba(8,51,68,0.55)" stroke="#22d3ee"/>
    <text x="252" y="106" fill="#e2e8f0" font-size="10">chunk 2　content="查询"</text>
    <text x="252" y="122" fill="#94a3b8" font-size="9">args: ' "12345"}'</text>
    <text x="252" y="136" fill="#94a3b8" font-size="9">index: 0　id: None</text>
    <text x="252" y="149" fill="#64748b" font-size="8">usage out=1</text>

    <rect x="456" y="88" width="200" height="66" rx="6" fill="#0f172a"/>
    <rect x="456" y="88" width="200" height="66" rx="6" fill="rgba(8,51,68,0.55)" stroke="#22d3ee"/>
    <text x="468" y="106" fill="#e2e8f0" font-size="10">chunk 3　content="订单"</text>
    <text x="468" y="122" fill="#94a3b8" font-size="9">无 tool_call_chunks</text>
    <text x="468" y="136" fill="#94a3b8" font-size="9">chunk_position: last</text>
    <text x="468" y="149" fill="#64748b" font-size="8">usage out=1</text>
  </g>

  <!-- merge box -->
  <line x1="124" y1="154" x2="300" y2="176" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="340" y1="154" x2="340" y2="176" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="556" y1="154" x2="380" y2="176" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="150" y="178" width="380" height="34" rx="8" fill="#0f172a"/>
  <rect x="150" y="178" width="380" height="34" rx="8" fill="rgba(76,29,149,0.4)" stroke="#a78bfa"/>
  <text x="340" y="199" fill="#e2e8f0" font-size="12" text-anchor="middle" font-weight="600">add_ai_message_chunks　ai.py:638</text>

  <!-- five merge rules -->
  <g font-size="9">
    <rect x="24" y="224" width="180" height="58" rx="6" fill="#0f172a"/>
    <rect x="24" y="224" width="180" height="58" rx="6" fill="rgba(8,51,68,0.55)" stroke="#22d3ee"/>
    <text x="36" y="242" fill="#e2e8f0" font-size="10">content</text>
    <text x="36" y="257" fill="#94a3b8" font-size="9">merge_content 分派 base.py:366</text>
    <text x="36" y="272" fill="#64748b" font-size="8">列表+字符串→追加末元素</text>

    <rect x="212" y="224" width="180" height="58" rx="6" fill="#0f172a"/>
    <rect x="212" y="224" width="180" height="58" rx="6" fill="rgba(8,51,68,0.55)" stroke="#22d3ee"/>
    <text x="224" y="242" fill="#e2e8f0" font-size="10">additional_kwargs</text>
    <text x="224" y="257" fill="#94a3b8" font-size="9">merge_dicts 字符串拼接</text>
    <text x="224" y="272" fill="#64748b" font-size="8">ai.py:652</text>

    <rect x="400" y="224" width="180" height="58" rx="6" fill="#0f172a"/>
    <rect x="400" y="224" width="180" height="58" rx="6" fill="rgba(8,51,68,0.55)" stroke="#22d3ee"/>
    <text x="412" y="242" fill="#e2e8f0" font-size="10">response_metadata</text>
    <text x="412" y="257" fill="#94a3b8" font-size="9">merge_dicts 字符串拼接</text>
    <text x="412" y="272" fill="#64748b" font-size="8">ai.py:655</text>

    <rect x="24" y="290" width="284" height="58" rx="6" fill="#0f172a"/>
    <rect x="24" y="290" width="284" height="58" rx="6" fill="rgba(120,53,15,0.3)" stroke="#fbbf24"/>
    <text x="36" y="308" fill="#e2e8f0" font-size="10">tool_call_chunks</text>
    <text x="36" y="323" fill="#fbbf24" font-size="9">merge_lists 按 index 配对 ai.py:660</text>
    <text x="36" y="338" fill="#64748b" font-size="8">index 才是归属依据 tool.py:261</text>

    <rect x="316" y="290" width="284" height="58" rx="6" fill="#0f172a"/>
    <rect x="316" y="290" width="284" height="58" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399"/>
    <text x="328" y="308" fill="#e2e8f0" font-size="10">usage_metadata</text>
    <text x="328" y="323" fill="#34d399" font-size="9">add_usage 数值相加 ai.py:679</text>
    <text x="328" y="338" fill="#64748b" font-size="8">_details 逐项加，total 自己求和</text>
  </g>

  <!-- result -->
  <line x1="166" y1="348" x2="300" y2="366" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="458" y1="348" x2="380" y2="366" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="60" y="368" width="560" height="56" rx="8" fill="#0f172a"/>
  <rect x="60" y="368" width="560" height="56" rx="8" fill="rgba(6,78,59,0.4)" stroke="#34d399"/>
  <text x="76" y="388" fill="#e2e8f0" font-size="10">content="正在查询订单"　usage in=30 out=3 total=33</text>
  <text x="76" y="405" fill="#34d399" font-size="9">tool_call　{"name": null, "args": "{\"order_id\": \"12345\"}", "index": 0, "id": null}</text>
  <text x="76" y="419" fill="#64748b" font-size="8">id 择优：供应商原始 id &gt; lc_* 自动 id（ai.py:687-704）　·　chunk_position 冒泡为 last</text>

  <text x="340" y="440" fill="#64748b" font-size="9" text-anchor="middle">别自己 collect 分片再拼，用 AIMessageChunk.__add__</text>
</svg>
