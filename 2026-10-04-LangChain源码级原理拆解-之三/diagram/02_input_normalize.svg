<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 450" font-family="'PingFang SC','Noto Sans SC',sans-serif">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="680" height="450" fill="#0f172a"/>
  <rect width="680" height="450" fill="url(#grid)"/>

  <text x="340" y="30" fill="#e2e8f0" font-size="18" text-anchor="middle" font-weight="600">两层输入归一：你写什么形状，就被转成什么消息</text>
  <text x="340" y="49" fill="#64748b" font-size="11" text-anchor="middle">utils.py:675 _convert_to_message　·　chat_models.py:444 _convert_input</text>

  <!-- layer 1: _convert_to_message -->
  <rect x="24" y="64" width="632" height="184" rx="10" fill="none" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="40" y="84" fill="#a78bfa" font-size="12" text-anchor="start" font-weight="600">第一层　_convert_to_message（messages/utils.py:675）四种输入形状</text>

  <!-- four input shapes -->
  <g font-size="10">
    <rect x="40" y="96" width="140" height="52" rx="6" fill="#0f172a"/>
    <rect x="40" y="96" width="140" height="52" rx="6" fill="rgba(76,29,149,0.4)" stroke="#a78bfa"/>
    <text x="110" y="116" fill="#e2e8f0" font-size="10" text-anchor="middle">BaseMessage 实例</text>
    <text x="110" y="133" fill="#94a3b8" font-size="9" text-anchor="middle">原样返回 :697</text>

    <rect x="192" y="96" width="140" height="52" rx="6" fill="#0f172a"/>
    <rect x="192" y="96" width="140" height="52" rx="6" fill="rgba(120,53,15,0.3)" stroke="#fbbf24"/>
    <text x="262" y="114" fill="#e2e8f0" font-size="10" text-anchor="middle">裸字符串</text>
    <text x="262" y="129" fill="#fbbf24" font-size="9" text-anchor="middle">硬编码为 human</text>
    <text x="262" y="143" fill="#64748b" font-size="8" text-anchor="middle">:701 坑一来源</text>

    <rect x="344" y="96" width="140" height="52" rx="6" fill="#0f172a"/>
    <rect x="344" y="96" width="140" height="52" rx="6" fill="rgba(8,51,68,0.55)" stroke="#22d3ee"/>
    <text x="414" y="114" fill="#e2e8f0" font-size="10" text-anchor="middle">二元组 (role, 模板)</text>
    <text x="414" y="132" fill="#94a3b8" font-size="9" text-anchor="middle">:704 按 role 取类</text>

    <rect x="496" y="96" width="144" height="52" rx="6" fill="#0f172a"/>
    <rect x="496" y="96" width="144" height="52" rx="6" fill="rgba(8,51,68,0.55)" stroke="#22d3ee"/>
    <text x="568" y="114" fill="#e2e8f0" font-size="10" text-anchor="middle">字典</text>
    <text x="568" y="130" fill="#94a3b8" font-size="9" text-anchor="middle">先 role 再 type :713</text>
    <text x="568" y="143" fill="#64748b" font-size="8" text-anchor="middle">content=None 兜空串 :717</text>
  </g>

  <!-- arrows down to result -->
  <line x1="110" y1="148" x2="180" y2="176" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="262" y1="148" x2="280" y2="176" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="414" y1="148" x2="400" y2="176" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="568" y1="148" x2="500" y2="176" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- result -->
  <rect x="180" y="178" width="320" height="56" rx="8" fill="#0f172a"/>
  <rect x="180" y="178" width="320" height="56" rx="8" fill="rgba(6,78,59,0.4)" stroke="#34d399"/>
  <text x="340" y="199" fill="#e2e8f0" font-size="12" text-anchor="middle" font-weight="600">list[BaseMessage]　统一的消息列表</text>
  <text x="340" y="219" fill="#94a3b8" font-size="9" text-anchor="middle">其它形状直接 NotImplementedError :727</text>

  <!-- layer 2: _convert_input -->
  <rect x="24" y="262" width="632" height="146" rx="10" fill="none" stroke="#22d3ee" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="40" y="282" fill="#22d3ee" font-size="12" text-anchor="start" font-weight="600">第二层　_convert_input（chat_models.py:444　与 llms.py:318 逐字相同）三种去向</text>

  <g font-size="10">
    <rect x="40" y="294" width="180" height="50" rx="6" fill="#0f172a"/>
    <rect x="40" y="294" width="180" height="50" rx="6" fill="rgba(8,51,68,0.55)" stroke="#22d3ee"/>
    <text x="130" y="314" fill="#e2e8f0" font-size="10" text-anchor="middle">PromptValue</text>
    <text x="130" y="331" fill="#94a3b8" font-size="9" text-anchor="middle">原样返回</text>

    <rect x="240" y="294" width="180" height="50" rx="6" fill="#0f172a"/>
    <rect x="240" y="294" width="180" height="50" rx="6" fill="rgba(8,51,68,0.55)" stroke="#22d3ee"/>
    <text x="330" y="314" fill="#e2e8f0" font-size="10" text-anchor="middle">str</text>
    <text x="330" y="331" fill="#94a3b8" font-size="9" text-anchor="middle">StringPromptValue</text>

    <rect x="440" y="294" width="200" height="50" rx="6" fill="#0f172a"/>
    <rect x="440" y="294" width="200" height="50" rx="6" fill="rgba(8,51,68,0.55)" stroke="#22d3ee"/>
    <text x="540" y="314" fill="#e2e8f0" font-size="10" text-anchor="middle">Sequence 消息列表</text>
    <text x="540" y="331" fill="#94a3b8" font-size="9" text-anchor="middle">ChatPromptValue</text>
  </g>

  <text x="340" y="362" fill="#fb7185" font-size="10" text-anchor="middle">传入其它形状（如整数）直接 ValueError，不做模糊处理</text>

  <!-- return type difference -->
  <rect x="40" y="374" width="290" height="30" rx="6" fill="#0f172a"/>
  <rect x="40" y="374" width="290" height="30" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399"/>
  <text x="185" y="394" fill="#e2e8f0" font-size="10" text-anchor="middle">BaseChatModel.invoke → AIMessage</text>

  <rect x="350" y="374" width="290" height="30" rx="6" fill="#0f172a"/>
  <rect x="350" y="374" width="290" height="30" rx="6" fill="rgba(120,53,15,0.3)" stroke="#fbbf24"/>
  <text x="495" y="394" fill="#e2e8f0" font-size="10" text-anchor="middle">BaseLLM.invoke → str（拿不到 usage）</text>

  <text x="340" y="428" fill="#64748b" font-size="9" text-anchor="middle">invoke 只是 generate_prompt 的语法糖　chat_models.py:466</text>
</svg>
