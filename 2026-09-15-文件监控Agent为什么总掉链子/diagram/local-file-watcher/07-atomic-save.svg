<svg width="680" height="450" viewBox="0 0 680 450" xmlns="http://www.w3.org/2000/svg">
  <style>
    text { font-family: "JetBrains Mono","Noto Sans SC",ui-monospace,monospace; }
  </style>
  <rect width="680" height="450" fill="#0f172a"/>
  <g stroke="#1e293b" stroke-width="1">
    <line x1="0" y1="80" x2="680" y2="80"/>
    <line x1="0" y1="330" x2="680" y2="330"/>
  </g>
  <text x="340" y="46" fill="#e2e8f0" font-size="20" text-anchor="middle" font-weight="bold">原子保存：宁可多 3 个事件，也要保命</text>

  <!-- 正确做法 4 步 -->
  <g fill="#0b2433" stroke="#22d3ee" stroke-width="1.8">
    <rect x="30" y="110" width="140" height="74" rx="10"/><text x="100" y="140" fill="#22d3ee" font-size="12" text-anchor="middle" font-weight="bold">① 写 xxx.tmp</text><text x="100" y="160" fill="#94a3b8" font-size="10" text-anchor="middle">新内容落临时文件</text><text x="100" y="176" fill="#94a3b8" font-size="10" text-anchor="middle">create+modify 事件</text>
    <rect x="185" y="110" width="140" height="74" rx="10"/><text x="255" y="140" fill="#22d3ee" font-size="12" text-anchor="middle" font-weight="bold">② fsync 落盘</text><text x="255" y="160" fill="#94a3b8" font-size="10" text-anchor="middle">刷到磁盘才保险</text><text x="255" y="176" fill="#94a3b8" font-size="10" text-anchor="middle">崩溃也不丢</text>
    <rect x="340" y="110" width="140" height="74" rx="10"/><text x="410" y="140" fill="#22d3ee" font-size="12" text-anchor="middle" font-weight="bold">③ rename 原子</text><text x="410" y="160" fill="#94a3b8" font-size="10" text-anchor="middle">同盘 rename 原子</text><text x="410" y="176" fill="#22d3ee" font-size="10" text-anchor="middle">无中间态</text>
    <rect x="495" y="110" width="155" height="74" rx="10"/><text x="572" y="140" fill="#22d3ee" font-size="12" text-anchor="middle" font-weight="bold">④ 旧 fd 仍可读</text><text x="572" y="160" fill="#94a3b8" font-size="10" text-anchor="middle">inode 不变</text><text x="572" y="176" fill="#94a3b8" font-size="10" text-anchor="middle">引用计数 &gt; 0</text>
  </g>
  <g stroke="#64748b" stroke-width="2" fill="none">
    <path d="M170 147 H183"/>
    <path d="M325 147 H338"/>
    <path d="M480 147 H493"/>
  </g>
  <g fill="#64748b">
    <path d="M183 147 l-8 -4 v8 z"/>
    <path d="M338 147 l-8 -4 v8 z"/>
    <path d="M493 147 l-8 -4 v8 z"/>
  </g>

  <!-- 对比：原地 overwrite 崩溃 -->
  <rect x="30" y="220" width="300" height="80" rx="10" fill="#2a0f1a" stroke="#fb7185" stroke-width="2"/>
  <text x="180" y="248" fill="#fb7185" font-size="13" text-anchor="middle" font-weight="bold">✗ 原地 overwrite 崩溃</text>
  <text x="180" y="270" fill="#94a3b8" font-size="11" text-anchor="middle">写到一半进程死 → 留下半截损坏文件</text>
  <text x="180" y="288" fill="#94a3b8" font-size="11" text-anchor="middle">用户打开即损坏，无法恢复</text>

  <!-- 正确结果 -->
  <rect x="350" y="220" width="300" height="80" rx="10" fill="#0b1f12" stroke="#22d3ee" stroke-width="2"/>
  <text x="500" y="248" fill="#22d3ee" font-size="13" text-anchor="middle" font-weight="bold">✓ rename 原子替换</text>
  <text x="500" y="270" fill="#94a3b8" font-size="11" text-anchor="middle">要么旧文件在，要么新文件在</text>
  <text x="500" y="288" fill="#94a3b8" font-size="11" text-anchor="middle">无中间态；代价是 3 个额外事件</text>

  <text x="340" y="360" fill="#cbd5e1" font-size="13" text-anchor="middle">你监控到的，正是这 3 个「保命」事件的副作用</text>
  <text x="340" y="386" fill="#94a3b8" font-size="12" text-anchor="middle">rename 同盘是原子操作（POSIX 保证）→ 编辑器宁可多事件也要保一致性</text>
</svg>
