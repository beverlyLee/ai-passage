<svg width="680" height="450" viewBox="0 0 680 450" xmlns="http://www.w3.org/2000/svg">
  <style>
    text { font-family: "JetBrains Mono","Noto Sans SC",ui-monospace,monospace; }
  </style>
  <rect width="680" height="450" fill="#0f172a"/>
  <g stroke="#1e293b" stroke-width="1">
    <line x1="0" y1="80" x2="680" y2="80"/>
    <line x1="0" y1="320" x2="680" y2="320"/>
  </g>
  <text x="340" y="46" fill="#e2e8f0" font-size="21" text-anchor="middle" font-weight="bold">本地文件监控 Agent：全链路</text>

  <!-- 阶段 1 -->
  <rect x="30" y="110" width="140" height="96" rx="10" fill="#0b2433" stroke="#22d3ee" stroke-width="2"/>
  <text x="100" y="142" fill="#22d3ee" font-size="15" text-anchor="middle" font-weight="bold">文件事件</text>
  <text x="100" y="166" fill="#94a3b8" font-size="12" text-anchor="middle">create / modify</text>
  <text x="100" y="184" fill="#94a3b8" font-size="12" text-anchor="middle">/ delete / move</text>

  <!-- 阶段 2 -->
  <rect x="190" y="110" width="140" height="96" rx="10" fill="#0b2433" stroke="#22d3ee" stroke-width="2"/>
  <text x="260" y="142" fill="#22d3ee" font-size="15" text-anchor="middle" font-weight="bold">事件层 Watcher</text>
  <text x="260" y="166" fill="#94a3b8" font-size="12" text-anchor="middle">排除 / 防抖 / 幂等</text>
  <text x="260" y="184" fill="#22d3ee" font-size="11" text-anchor="middle">→ 防刷屏</text>

  <!-- 阶段 3 -->
  <rect x="350" y="110" width="140" height="96" rx="10" fill="#2a1f0b" stroke="#fbbf24" stroke-width="2"/>
  <text x="420" y="142" fill="#fbbf24" font-size="15" text-anchor="middle" font-weight="bold">规则引擎</text>
  <text x="420" y="166" fill="#94a3b8" font-size="12" text-anchor="middle">白名单 / 规则</text>
  <text x="420" y="184" fill="#fbbf24" font-size="11" text-anchor="middle">→ 防误删</text>

  <!-- 阶段 4 -->
  <rect x="510" y="110" width="140" height="96" rx="10" fill="#2a0f1a" stroke="#fb7185" stroke-width="2"/>
  <text x="580" y="142" fill="#fb7185" font-size="15" text-anchor="middle" font-weight="bold">安全动作</text>
  <text x="580" y="166" fill="#94a3b8" font-size="12" text-anchor="middle">回收站 / 移动</text>
  <text x="580" y="184" fill="#fb7185" font-size="11" text-anchor="middle">→ 留后悔药</text>

  <!-- 箭头 -->
  <g stroke="#64748b" stroke-width="2" fill="none">
    <path d="M170 158 H188"/>
    <path d="M330 158 H348"/>
    <path d="M490 158 H508"/>
  </g>
  <g fill="#64748b">
    <path d="M188 158 l-8 -4 v8 z"/>
    <path d="M348 158 l-8 -4 v8 z"/>
    <path d="M508 158 l-8 -4 v8 z"/>
  </g>

  <!-- 底部说明 -->
  <text x="340" y="360" fill="#cbd5e1" font-size="13" text-anchor="middle">一次保存 ≠ 一个事件：编辑器会制造事件风暴，Watcher 合并它</text>
  <text x="340" y="386" fill="#94a3b8" font-size="12" text-anchor="middle">规则引擎先过白名单再过删除规则；删除默认 dry-run，真实落地走回收站</text>
</svg>
