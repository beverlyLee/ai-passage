<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 450">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap');
    text { font-family: 'JetBrains Mono','Noto Sans SC','PingFang SC',sans-serif; }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <marker id="arrow-rose" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#fb7185"/>
    </marker>
    <marker id="arrow-amber" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#fbbf24"/>
    </marker>
  </defs>
  <rect width="680" height="450" fill="#0f172a"/>
  <rect width="680" height="450" fill="url(#grid)"/>

  <text x="20" y="28" fill="#e2e8f0" font-size="16" font-weight="700">HTTP 服务与供应链闸门 · serve.py / revisions.py</text>

  <!-- arrows layer -->
  <line x1="340" y1="86" x2="340" y2="116" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="340" y1="156" x2="340" y2="186" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="340" y1="226" x2="340" y2="256" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="340" y1="296" x2="340" y2="326" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="150" y1="356" x2="150" y2="386" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#arrow-amber)"/>
  <line x1="530" y1="356" x2="530" y2="386" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- box1 request -->
  <rect x="210" y="56" width="260" height="30" rx="6" fill="#0f172a"/>
  <rect x="210" y="56" width="260" height="30" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="340" y="76" fill="#ffffff" font-size="11" font-weight="600" text-anchor="middle">HTTP 请求 /v1/systemone</text>

  <!-- box2 auth -->
  <rect x="210" y="116" width="260" height="30" rx="6" fill="#0f172a"/>
  <rect x="210" y="116" width="260" height="30" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="340" y="136" fill="#ffffff" font-size="10" font-weight="600" text-anchor="middle">hmac.compare_digest 字节级鉴权</text>

  <!-- box3 limits -->
  <rect x="180" y="186" width="320" height="30" rx="6" fill="#0f172a"/>
  <rect x="180" y="186" width="320" height="30" rx="6" fill="rgba(136,19,55,0.4)" stroke="#fb7185" stroke-width="1.5"/>
  <text x="340" y="206" fill="#ffffff" font-size="9" font-weight="600" text-anchor="middle">_check_request_limits 守卫：state 必填 / 选项≤100 / 状态≤50000 字符</text>

  <!-- box4 gate -->
  <rect x="170" y="256" width="340" height="30" rx="6" fill="#0f172a"/>
  <rect x="170" y="256" width="340" height="30" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="340" y="276" fill="#ffffff" font-size="9" font-weight="600" text-anchor="middle">asyncio.Lock 门 + Semaphore 准入 + 单 worker 线程池</text>

  <!-- box5 predict -->
  <rect x="190" y="326" width="300" height="30" rx="6" fill="#0f172a"/>
  <rect x="190" y="326" width="300" height="30" rx="6" fill="rgba(59,130,246,0.3)" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="340" y="346" fill="#ffffff" font-size="10" font-weight="600" text-anchor="middle">router.predict（system_one）</text>

  <!-- box6 digest -->
  <rect x="60" y="356" width="180" height="30" rx="6" fill="#0f172a"/>
  <rect x="60" y="356" width="180" height="30" rx="6" fill="rgba(120,53,15,0.4)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="150" y="376" fill="#ffffff" font-size="9" font-weight="600" text-anchor="middle">verify_digests SHA-256</text>

  <!-- box7 revisions -->
  <rect x="440" y="356" width="180" height="30" rx="6" fill="#0f172a"/>
  <rect x="440" y="356" width="180" height="30" rx="6" fill="rgba(120,53,15,0.4)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="530" y="376" fill="#ffffff" font-size="9" font-weight="600" text-anchor="middle">PINNED_REVISIONS 审核 SHA</text>

  <!-- legend -->
  <rect x="20" y="406" width="12" height="12" rx="3" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="38" y="416" fill="#94a3b8" font-size="9">请求入口</text>
  <rect x="130" y="406" width="12" height="12" rx="3" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="148" y="416" fill="#94a3b8" font-size="9">鉴权 / 调度处理</text>
  <rect x="280" y="406" width="12" height="12" rx="3" fill="rgba(136,19,55,0.4)" stroke="#fb7185" stroke-width="1.5"/>
  <text x="298" y="416" fill="#94a3b8" font-size="9">请求守卫（硬上限）</text>
  <rect x="420" y="406" width="12" height="12" rx="3" fill="rgba(59,130,246,0.3)" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="438" y="416" fill="#94a3b8" font-size="9">推理出口</text>
  <rect x="575" y="406" width="12" height="12" rx="3" fill="rgba(120,53,15,0.4)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="593" y="416" fill="#94a3b8" font-size="9">供应链闸门</text>
</svg>
