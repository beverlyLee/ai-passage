<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 450">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap');
    text { font-family: 'JetBrains Mono','Noto Sans SC','PingFang SC',sans-serif; }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <marker id="arrow-rose" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#fb7185"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#60a5fa"/>
    </marker>
  </defs>
  <rect width="680" height="450" fill="#0f172a"/>
  <rect width="680" height="450" fill="url(#grid)"/>

  <text x="20" y="28" fill="#e2e8f0" font-size="16" font-weight="700">语言检测启发式链路 · lang.py（纯标准库，零推理成本）</text>

  <!-- arrows layer -->
  <line x1="340" y1="86" x2="340" y2="116" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="340" y1="156" x2="340" y2="186" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="340" y1="226" x2="150" y2="262" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="340" y1="226" x2="530" y2="262" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="150" y1="324" x2="150" y2="352" stroke="#fb7185" stroke-width="1.5" marker-end="url(#arrow-rose)"/>
  <line x1="530" y1="324" x2="530" y2="352" stroke="#60a5fa" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

  <!-- box1 input -->
  <rect x="190" y="56" width="300" height="30" rx="6" fill="#0f172a"/>
  <rect x="190" y="56" width="300" height="30" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="340" y="76" fill="#ffffff" font-size="11" font-weight="600" text-anchor="middle">输入：state dict 或 文本</text>

  <!-- box2 state_text -->
  <rect x="190" y="116" width="300" height="30" rx="6" fill="#0f172a"/>
  <rect x="190" y="116" width="300" height="30" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="340" y="136" fill="#ffffff" font-size="11" font-weight="600" text-anchor="middle">state_text 截断 4000 字符</text>

  <!-- box3 script_counts -->
  <rect x="170" y="186" width="340" height="30" rx="6" fill="#0f172a"/>
  <rect x="170" y="186" width="340" height="30" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="340" y="206" fill="#ffffff" font-size="10" font-weight="600" text-anchor="middle">_script_counts：25 个 Unicode 脚本桶单次遍历</text>

  <!-- decision box -->
  <rect x="190" y="262" width="300" height="62" rx="6" fill="#0f172a"/>
  <rect x="190" y="262" width="300" height="62" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="340" y="284" fill="#ffffff" font-size="10" font-weight="600" text-anchor="middle">非拉丁字母占比判定</text>
  <text x="340" y="300" fill="#94a3b8" font-size="9" text-anchor="middle">NON_LATIN_FRACTION=0.2</text>
  <text x="340" y="314" fill="#94a3b8" font-size="9" text-anchor="middle">需 letters≥10 且占比≥NON_LATIN_MIN_FRACTION=0.1</text>

  <!-- non-latin branch -->
  <rect x="60" y="324" width="180" height="30" rx="6" fill="#0f172a"/>
  <rect x="60" y="324" width="180" height="30" rx="6" fill="rgba(136,19,55,0.4)" stroke="#fb7185" stroke-width="1.5"/>
  <text x="150" y="344" fill="#ffffff" font-size="10" font-weight="600" text-anchor="middle">is_english = False</text>

  <!-- latin branch -->
  <rect x="440" y="262" width="180" height="62" rx="6" fill="#0f172a"/>
  <rect x="440" y="262" width="180" height="62" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="530" y="284" fill="#ffffff" font-size="10" font-weight="600" text-anchor="middle">latin_profile 启发式</text>
  <text x="530" y="300" fill="#94a3b8" font-size="9" text-anchor="middle">10 语种停用词 + 变音符号率</text>
  <text x="530" y="314" fill="#94a3b8" font-size="9" text-anchor="middle">NON_EN_DIACRITIC_RATE=0.02</text>

  <!-- english terminal -->
  <rect x="440" y="352" width="180" height="30" rx="6" fill="#0f172a"/>
  <rect x="440" y="352" width="180" height="30" rx="6" fill="rgba(59,130,246,0.3)" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="530" y="372" fill="#ffffff" font-size="10" font-weight="600" text-anchor="middle">is_english? → english / ml</text>

  <!-- legend -->
  <rect x="20" y="398" width="12" height="12" rx="3" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="38" y="408" fill="#94a3b8" font-size="9">输入</text>
  <rect x="120" y="398" width="12" height="12" rx="3" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="138" y="408" fill="#94a3b8" font-size="9">脚本计数 / 启发式处理</text>
  <rect x="300" y="398" width="12" height="12" rx="3" fill="rgba(136,19,55,0.4)" stroke="#fb7185" stroke-width="1.5"/>
  <text x="318" y="408" fill="#94a3b8" font-size="9">非拉丁 → False</text>
  <rect x="470" y="398" width="12" height="12" rx="3" fill="rgba(59,130,246,0.3)" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="488" y="408" fill="#94a3b8" font-size="9">英文 → english</text>
</svg>
