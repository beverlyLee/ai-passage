<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 450">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap');
    text { font-family: 'JetBrains Mono','Noto Sans SC','PingFang SC',sans-serif; }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <marker id="arrow-amber" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#fbbf24"/>
    </marker>
    <marker id="arrow-rose" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#fb7185"/>
    </marker>
    <marker id="arrow-cyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#22d3ee"/>
    </marker>
  </defs>
  <rect width="680" height="450" fill="#0f172a"/>
  <rect width="680" height="450" fill="url(#grid)"/>

  <text x="20" y="28" fill="#e2e8f0" font-size="16" font-weight="700">email 清洗管线 · email.py</text>

  <!-- region boundary -->
  <rect x="20" y="140" width="640" height="270" rx="12" fill="none" stroke="#fbbf24" stroke-width="1" stroke-dasharray="8,4"/>
  <text x="32" y="156" fill="#fbbf24" font-size="9" font-weight="600">clean_email_body 四道闸 (英 / 葡 / 西 三语)</text>

  <!-- arrows layer -->
  <line x1="170" y1="82" x2="200" y2="82" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="380" y1="82" x2="410" y2="82" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="290" y1="109" x2="180" y2="160" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="180" y1="210" x2="180" y2="222" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="180" y1="272" x2="180" y2="284" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="180" y1="334" x2="180" y2="346" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="320" y1="371" x2="400" y2="275" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="500" y1="240" x2="495" y2="109" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrow-cyan)"/>

  <!-- box1 raw -->
  <rect x="20" y="55" width="150" height="54" rx="6" fill="#0f172a"/>
  <rect x="20" y="55" width="150" height="54" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="95" y="78" fill="#ffffff" font-size="12" font-weight="600" text-anchor="middle">原始邮件 raw</text>
  <text x="95" y="96" fill="#94a3b8" font-size="9" text-anchor="middle">含引文 / 签名 / 声明</text>

  <!-- box2 clean_email_body -->
  <rect x="200" y="55" width="180" height="54" rx="6" fill="#0f172a"/>
  <rect x="200" y="55" width="180" height="54" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="290" y="78" fill="#ffffff" font-size="12" font-weight="600" text-anchor="middle">clean_email_body</text>
  <text x="290" y="96" fill="#94a3b8" font-size="9" text-anchor="middle">max_chars = 3000</text>

  <!-- box3 email_state -->
  <rect x="410" y="55" width="170" height="54" rx="6" fill="#0f172a"/>
  <rect x="410" y="55" width="170" height="54" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="495" y="78" fill="#ffffff" font-size="12" font-weight="600" text-anchor="middle">email_state</text>
  <text x="495" y="96" fill="#94a3b8" font-size="9" text-anchor="middle">subject + body + from</text>

  <!-- box4 normalize -->
  <rect x="40" y="162" width="280" height="48" rx="6" fill="#0f172a"/>
  <rect x="40" y="162" width="280" height="48" rx="6" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="60" y="186" fill="#ffffff" font-size="11" font-weight="600" text-anchor="start">① 归一化换行 \r\n→\n + 超长截断</text>
  <text x="60" y="202" fill="#94a3b8" font-size="9" text-anchor="start">max_chars*4 先截断再正则</text>

  <!-- box5 cut quote -->
  <rect x="40" y="224" width="280" height="48" rx="6" fill="#0f172a"/>
  <rect x="40" y="224" width="280" height="48" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="60" y="248" fill="#ffffff" font-size="11" font-weight="600" text-anchor="start">② 切引文 history</text>
  <text x="60" y="264" fill="#94a3b8" font-size="9" text-anchor="start">On/Em/El wrote, From:/De:, &gt; 引用行</text>

  <!-- box6 cut signature -->
  <rect x="40" y="286" width="280" height="48" rx="6" fill="#0f172a"/>
  <rect x="40" y="286" width="280" height="48" rx="6" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="60" y="310" fill="#ffffff" font-size="11" font-weight="600" text-anchor="start">③ 切签名 &amp; 设备页脚</text>
  <text x="60" y="326" fill="#fde68a" font-size="9" text-anchor="start">仅后 60% 区间, 行长 ≤40/60</text>

  <!-- box7 disclaimer -->
  <rect x="40" y="348" width="280" height="48" rx="6" fill="#0f172a"/>
  <rect x="40" y="348" width="280" height="48" rx="6" fill="rgba(136,19,55,0.4)" stroke="#fb7185" stroke-width="1.5"/>
  <text x="60" y="372" fill="#ffffff" font-size="11" font-weight="600" text-anchor="start">④ 免责声明 段落级剥离</text>
  <text x="60" y="388" fill="#fecdd3" font-size="9" text-anchor="start">绑定名词, 不删裸词 (误删防护)</text>

  <!-- box8 clean output -->
  <rect x="400" y="240" width="200" height="70" rx="6" fill="#0f172a"/>
  <rect x="400" y="240" width="200" height="70" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="500" y="268" fill="#ffffff" font-size="12" font-weight="600" text-anchor="middle">清洗后正文</text>
  <text x="500" y="288" fill="#94a3b8" font-size="9" text-anchor="middle">真实请求保留</text>
  <text x="500" y="302" fill="#94a3b8" font-size="9" text-anchor="middle">引文 / 签名 / 声明剔除</text>

  <!-- legend -->
  <rect x="20" y="418" width="12" height="12" rx="3" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="38" y="428" fill="#94a3b8" font-size="9">输入 / 输出</text>
  <rect x="130" y="418" width="12" height="12" rx="3" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="148" y="428" fill="#94a3b8" font-size="9">切引文</text>
  <rect x="220" y="418" width="12" height="12" rx="3" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="238" y="428" fill="#94a3b8" font-size="9">切签名</text>
  <rect x="320" y="418" width="12" height="12" rx="3" fill="rgba(136,19,55,0.4)" stroke="#fb7185" stroke-width="1.5"/>
  <text x="338" y="428" fill="#94a3b8" font-size="9">删声明</text>
</svg>
