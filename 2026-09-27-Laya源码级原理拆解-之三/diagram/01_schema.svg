<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 450">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap');
    text { font-family: 'JetBrains Mono','Noto Sans SC','PingFang SC',sans-serif; }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <marker id="arrow-rose" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#fb7185"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#60a5fa"/>
    </marker>
  </defs>
  <rect width="680" height="450" fill="#0f172a"/>
  <rect width="680" height="450" fill="url(#grid)"/>

  <text x="20" y="28" fill="#e2e8f0" font-size="16" font-weight="700">schema 编译为三原语 · structured.py</text>

  <!-- arrows layer -->
  <line x1="130" y1="86" x2="150" y2="86" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="300" y1="86" x2="315" y2="86" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="390" y1="118" x2="67" y2="158" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="390" y1="118" x2="207" y2="158" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="390" y1="118" x2="347" y2="158" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="390" y1="118" x2="560" y2="158" stroke="#fb7185" stroke-width="1.5" marker-end="url(#arrow-rose)"/>
  <line x1="67" y1="215" x2="200" y2="282" stroke="#60a5fa" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <line x1="207" y1="215" x2="270" y2="282" stroke="#60a5fa" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <line x1="347" y1="215" x2="400" y2="282" stroke="#60a5fa" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

  <!-- box1 JSON Schema -->
  <rect x="10" y="58" width="120" height="56" rx="6" fill="#0f172a"/>
  <rect x="10" y="58" width="120" height="56" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="70" y="82" fill="#ffffff" font-size="12" font-weight="600" text-anchor="middle">JSON Schema</text>
  <text x="70" y="100" fill="#94a3b8" font-size="9" text-anchor="middle">object + properties</text>

  <!-- box2 plan_from_json_schema -->
  <rect x="150" y="58" width="150" height="56" rx="6" fill="#0f172a"/>
  <rect x="150" y="58" width="150" height="56" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="225" y="82" fill="#ffffff" font-size="11" font-weight="600" text-anchor="middle">plan_from_json_schema</text>
  <text x="225" y="100" fill="#94a3b8" font-size="9" text-anchor="middle">校验 ≤32 属性 / object</text>

  <!-- box3 _field dispatch -->
  <rect x="315" y="58" width="150" height="60" rx="6" fill="#0f172a"/>
  <rect x="315" y="58" width="150" height="60" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="390" y="82" fill="#ffffff" font-size="11" font-weight="600" text-anchor="middle">per-property _field</text>
  <text x="390" y="100" fill="#94a3b8" font-size="9" text-anchor="middle">按 type / enum / anyOf 分派</text>

  <!-- box4 choice -->
  <rect x="10" y="158" width="115" height="57" rx="6" fill="#0f172a"/>
  <rect x="10" y="158" width="115" height="57" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="67" y="182" fill="#ffffff" font-size="12" font-weight="600" text-anchor="middle">choice</text>
  <text x="67" y="200" fill="#94a3b8" font-size="9" text-anchor="middle">enum → 选项 (≤32)</text>

  <!-- box5 score -->
  <rect x="150" y="158" width="115" height="57" rx="6" fill="#0f172a"/>
  <rect x="150" y="158" width="115" height="57" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="207" y="182" fill="#ffffff" font-size="12" font-weight="600" text-anchor="middle">score</text>
  <text x="207" y="200" fill="#94a3b8" font-size="9" text-anchor="middle">int min/max → 刻度 (≤10)</text>

  <!-- box6 noul -->
  <rect x="290" y="158" width="115" height="57" rx="6" fill="#0f172a"/>
  <rect x="290" y="158" width="115" height="57" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="347" y="182" fill="#ffffff" font-size="12" font-weight="600" text-anchor="middle">noul</text>
  <text x="347" y="200" fill="#94a3b8" font-size="9" text-anchor="middle">bool → yes/no</text>

  <!-- box7 reject -->
  <rect x="480" y="158" width="160" height="57" rx="6" fill="#0f172a"/>
  <rect x="480" y="158" width="160" height="57" rx="6" fill="rgba(136,19,55,0.4)" stroke="#fb7185" stroke-width="1.5"/>
  <text x="560" y="180" fill="#ffffff" font-size="11" font-weight="600" text-anchor="middle">SchemaError</text>
  <text x="560" y="198" fill="#fecdd3" font-size="9" text-anchor="middle">拒 free string/array/object/$ref</text>

  <!-- final box -->
  <rect x="200" y="282" width="340" height="58" rx="6" fill="#0f172a"/>
  <rect x="200" y="282" width="340" height="58" rx="6" fill="rgba(59,130,246,0.3)" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="370" y="306" fill="#ffffff" font-size="12" font-weight="600" text-anchor="middle">questions dict → runner.predict → _project</text>
  <text x="370" y="324" fill="#bfdbfe" font-size="9" text-anchor="middle">→ schema 形状的值 (type-safe, 标签↦原值)</text>

  <!-- legend -->
  <rect x="20" y="375" width="12" height="12" rx="3" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="38" y="385" fill="#94a3b8" font-size="9">判断原语 / 输入</text>
  <rect x="160" y="375" width="12" height="12" rx="3" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="178" y="385" fill="#94a3b8" font-size="9">编译处理</text>
  <rect x="270" y="375" width="12" height="12" rx="3" fill="rgba(136,19,55,0.4)" stroke="#fb7185" stroke-width="1.5"/>
  <text x="288" y="385" fill="#94a3b8" font-size="9">拒绝</text>
  <rect x="350" y="375" width="12" height="12" rx="3" fill="rgba(59,130,246,0.3)" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="368" y="385" fill="#94a3b8" font-size="9">类型安全输出</text>
</svg>
