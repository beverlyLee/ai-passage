<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 450" width="680" height="450">
  <rect width="680" height="450" fill="#0f172a"/>
  <text x="340" y="34" fill="#22d3ee" font-family="'JetBrains Mono','Noto Sans SC',sans-serif" font-size="20" text-anchor="middle" font-weight="bold">子图怎么嵌进父图</text>
  <text x="340" y="58" fill="#94a3b8" font-family="'Noto Sans SC',sans-serif" font-size="13" text-anchor="middle">addSubgraph 把整张子图当成一个节点挂进父图</text>

  <!-- 父图虚线大框 -->
  <rect x="50" y="86" width="580" height="278" rx="12" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="62" y="106" fill="#94a3b8" font-family="'Noto Sans SC',sans-serif" font-size="12">父图 StateGraph（实线边）</text>

  <!-- 父图节点 -->
  <circle cx="110" cy="210" r="14" fill="#1e293b" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="110" y="214" fill="#22d3ee" font-family="'JetBrains Mono',monospace" font-size="10" text-anchor="middle">S</text>
  <rect x="150" y="190" width="70" height="40" rx="8" fill="#0f172a" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="185" y="215" fill="#e2e8f0" font-family="'JetBrains Mono',monospace" font-size="14" text-anchor="middle">节点 a</text>
  <rect x="300" y="190" width="92" height="40" rx="8" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="346" y="215" fill="#fbbf24" font-family="'JetBrains Mono',monospace" font-size="13" text-anchor="middle">子图 sub</text>
  <rect x="460" y="190" width="70" height="40" rx="8" fill="#0f172a" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="495" y="215" fill="#e2e8f0" font-family="'JetBrains Mono',monospace" font-size="14" text-anchor="middle">节点 b</text>
  <circle cx="600" cy="210" r="14" fill="#1e293b" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="600" y="214" fill="#22d3ee" font-family="'JetBrains Mono',monospace" font-size="10" text-anchor="middle">E</text>

  <line x1="124" y1="210" x2="150" y2="210" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="220" y1="210" x2="300" y2="210" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="392" y1="210" x2="460" y2="210" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="530" y1="210" x2="586" y2="210" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>

  <!-- 子图内部虚线小框 -->
  <rect x="286" y="248" width="120" height="92" rx="8" fill="none" stroke="#fbbf24" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="296" y="268" fill="#fbbf24" font-family="'Noto Sans SC',sans-serif" font-size="11">子图内部</text>
  <rect x="306" y="278" width="80" height="36" rx="6" fill="#0f172a" stroke="#34d399" stroke-width="1.5"/>
  <text x="346" y="301" fill="#a7f3d0" font-family="'JetBrains Mono',monospace" font-size="12" text-anchor="middle">subNode</text>
  <line x1="346" y1="230" x2="346" y2="278" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#arrY)"/>

  <text x="340" y="404" fill="#94a3b8" font-family="'Noto Sans SC',sans-serif" font-size="13" text-anchor="middle">子图内部有自己的 START/节点/END，父图只当成一个整体节点调用，运行时再展开</text>

  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arrY" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#fbbf24"/>
    </marker>
  </defs>
</svg>
