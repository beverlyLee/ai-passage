<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 450" width="680" height="450">
  <rect width="680" height="450" fill="#0f172a"/>
  <text x="340" y="34" fill="#22d3ee" font-family="'JetBrains Mono','Noto Sans SC',sans-serif" font-size="20" text-anchor="middle" font-weight="bold">状态怎么跨图传递</text>
  <text x="340" y="58" fill="#94a3b8" font-family="'Noto Sans SC',sans-serif" font-size="13" text-anchor="middle">父子图共享同一个 State 类型，子图写的字段直接合并回父图</text>

  <rect x="150" y="92" width="380" height="44" rx="8" fill="#0f172a" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="340" y="119" fill="#e2e8f0" font-family="'JetBrains Mono',monospace" font-size="13" text-anchor="middle">父图 a 之后  steps = [A]</text>

  <line x1="340" y1="136" x2="340" y2="158" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <text x="362" y="152" fill="#fbbf24" font-size="12" font-family="'Noto Sans SC',sans-serif">进入子图 sub</text>

  <rect x="120" y="158" width="440" height="44" rx="8" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="340" y="185" fill="#fde68a" font-family="'JetBrains Mono',monospace" font-size="13" text-anchor="middle">子图 subNode 追加  steps = [A, SUB]</text>

  <line x1="340" y1="202" x2="340" y2="224" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <text x="362" y="218" fill="#34d399" font-size="12" font-family="'Noto Sans SC',sans-serif">回到父图</text>

  <rect x="120" y="224" width="440" height="44" rx="8" fill="#0f172a" stroke="#34d399" stroke-width="1.5"/>
  <text x="340" y="251" fill="#a7f3d0" font-family="'JetBrains Mono',monospace" font-size="13" text-anchor="middle">父图 b 之后  steps = [A, SUB, B]</text>

  <!-- 前缀说明框 -->
  <rect x="120" y="296" width="440" height="80" rx="10" fill="#0f172a" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="140" y="322" fill="#a78bfa" font-family="'Noto Sans SC',sans-serif" font-size="13">子图节点名加前缀，避免和父图重名</text>
  <text x="140" y="348" fill="#e2e8f0" font-family="'JetBrains Mono',monospace" font-size="12">PREFIX_FORMAT = "%s-%s"</text>
  <text x="140" y="368" fill="#94a3b8" font-family="'JetBrains Mono',monospace" font-size="11">子图内部节点 subNode → 父图里叫 "sub-subNode"</text>

  <text x="340" y="412" fill="#94a3b8" font-family="'Noto Sans SC',sans-serif" font-size="13" text-anchor="middle">共享同一套通道，所以 steps 的累积不被隔离，A、SUB、B 同处一个列表</text>

  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>
</svg>
