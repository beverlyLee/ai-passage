<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 490">
  <style>
    text { font-family: 'JetBrains Mono', 'Noto Sans SC', 'PingFang SC', sans-serif; }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/></marker>
    <marker id="arrow-violet" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#a78bfa"/></marker>
    <marker id="arrow-emerald" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#34d399"/></marker>
  </defs>

  <rect width="680" height="490" fill="#0f172a"/>
  <rect width="680" height="490" fill="url(#grid)"/>

  <text x="30" y="28" fill="#e2e8f0" font-size="16" font-weight="700">Spring AI 底座速览</text>
  <text x="30" y="44" fill="#94a3b8" font-size="9">SAA 站在 Spring AI 肩膀上：底层原子能力都来自 spring-projects/spring-ai 与 spring-ai-extensions，SAA 只做上层编排</text>

  <!-- SAA 编排层 band (violet) -->
  <rect x="30" y="55" width="620" height="50" rx="8" fill="#0f172a"/>
  <rect x="30" y="55" width="620" height="50" rx="8" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="340" y="78" fill="white" font-size="12" font-weight="600" text-anchor="middle">SAA 编排层（graph-core + agent-framework）</text>
  <text x="340" y="96" fill="#c4b5fd" font-size="9" text-anchor="middle">在底座之上把多轮、多步、多智能体流程串起来</text>

  <!-- Spring AI 底座 region (emerald) -->
  <rect x="30" y="135" width="620" height="300" rx="12" fill="none" stroke="#34d399" stroke-width="1" stroke-dasharray="8,4"/>
  <text x="38" y="152" fill="#34d399" font-size="10" font-weight="600">Spring AI 底座（spring-projects/spring-ai + spring-ai-extensions）</text>

  <!-- Column 1 -->
  <rect x="50" y="165" width="180" height="80" rx="6" fill="#0f172a"/>
  <rect x="50" y="165" width="180" height="80" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="140" y="200" fill="white" font-size="12" font-weight="600" text-anchor="middle">ChatClient</text>
  <text x="140" y="222" fill="#a7f3d0" font-size="9" text-anchor="middle">与模型对话的核心入口</text>
  <rect x="50" y="285" width="180" height="80" rx="6" fill="#0f172a"/>
  <rect x="50" y="285" width="180" height="80" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="140" y="320" fill="white" font-size="12" font-weight="600" text-anchor="middle">RAG 抽象</text>
  <text x="140" y="342" fill="#a7f3d0" font-size="9" text-anchor="middle">检索增强生成</text>

  <!-- Column 2 -->
  <rect x="250" y="165" width="180" height="80" rx="6" fill="#0f172a"/>
  <rect x="250" y="165" width="180" height="80" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="340" y="200" fill="white" font-size="12" font-weight="600" text-anchor="middle">ChatMemory</text>
  <text x="340" y="222" fill="#a7f3d0" font-size="9" text-anchor="middle">多轮记忆</text>
  <rect x="250" y="285" width="180" height="80" rx="6" fill="#0f172a"/>
  <rect x="250" y="285" width="180" height="80" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="340" y="320" fill="white" font-size="12" font-weight="600" text-anchor="middle">Observation</text>
  <text x="340" y="342" fill="#a7f3d0" font-size="9" text-anchor="middle">链路可观测</text>

  <!-- Column 3 -->
  <rect x="450" y="165" width="180" height="80" rx="6" fill="#0f172a"/>
  <rect x="450" y="165" width="180" height="80" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="540" y="200" fill="white" font-size="11" font-weight="600" text-anchor="middle">ToolCallback / McpTool</text>
  <text x="540" y="222" fill="#a7f3d0" font-size="9" text-anchor="middle">工具与 MCP</text>
  <rect x="450" y="285" width="180" height="80" rx="6" fill="#0f172a"/>
  <rect x="450" y="285" width="180" height="80" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="540" y="320" fill="white" font-size="11" font-weight="600" text-anchor="middle">DashScopeChatModel</text>
  <text x="540" y="342" fill="#a7f3d0" font-size="9" text-anchor="middle">来自 spring-ai-extensions</text>

  <!-- Connector arrows -->
  <line x1="140" y1="105" x2="140" y2="163" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arrow-violet)"/>
  <line x1="340" y1="105" x2="340" y2="163" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arrow-violet)"/>
  <line x1="540" y1="105" x2="540" y2="163" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arrow-violet)"/>
  <line x1="140" y1="245" x2="140" y2="283" stroke="#34d399" stroke-width="1.3" marker-end="url(#arrow-emerald)"/>
  <line x1="340" y1="245" x2="340" y2="283" stroke="#34d399" stroke-width="1.3" marker-end="url(#arrow-emerald)"/>
  <line x1="540" y1="245" x2="540" y2="283" stroke="#34d399" stroke-width="1.3" marker-end="url(#arrow-emerald)"/>

  <text x="30" y="465" fill="#64748b" font-size="9">注：SAA 不重复造底层轮子，真正发 HTTP 请求给通义千问的是 DashScopeChatModel（spring-ai-extensions），SAA 只负责编排</text>
  <text x="30" y="482" fill="#64748b" font-size="8">图：小桃（桃西西呀）· 按 v1.1.2.2 / 7405a7d 核对</text>
</svg>
