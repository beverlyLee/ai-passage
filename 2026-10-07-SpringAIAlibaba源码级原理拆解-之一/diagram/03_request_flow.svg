<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 540">
  <style>
    text { font-family: 'JetBrains Mono', 'Noto Sans SC', 'PingFang SC', sans-serif; }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#94a3b8"/></marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#60a5fa"/></marker>
    <marker id="arrow-cyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#22d3ee"/></marker>
    <marker id="arrow-emerald" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#34d399"/></marker>
    <marker id="arrow-slate" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#94a3b8"/></marker>
    <marker id="arrow-violet" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#a78bfa"/></marker>
    <marker id="arrow-open" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polyline points="0 0, 10 3.5, 0 7" fill="none" stroke="#64748b" stroke-width="1.5"/></marker>
  </defs>

  <rect width="680" height="540" fill="#0f172a"/>
  <rect width="680" height="540" fill="url(#grid)"/>

  <text x="30" y="28" fill="#e2e8f0" font-size="16" font-weight="700">一次端到端请求数据流</text>
  <text x="30" y="44" fill="#94a3b8" font-size="9">用户消息 → Controller → Agent(CompiledGraph) → ChatClient → 通义千问；token 沿 Flux 流式回流，工具与多轮为两个关键分支</text>

  <!-- Actor boxes -->
  <!-- 用户/前端 -->
  <rect x="11" y="55" width="98" height="45" rx="6" fill="#0f172a"/>
  <rect x="11" y="55" width="98" height="45" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="60" y="83" fill="white" font-size="10" font-weight="600" text-anchor="middle">用户 / 前端</text>
  <!-- Controller -->
  <rect x="123" y="55" width="98" height="45" rx="6" fill="#0f172a"/>
  <rect x="123" y="55" width="98" height="45" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="172" y="83" fill="white" font-size="10" font-weight="600" text-anchor="middle">Controller</text>
  <!-- Agent -->
  <rect x="235" y="55" width="98" height="45" rx="6" fill="#0f172a"/>
  <rect x="235" y="55" width="98" height="45" rx="6" fill="rgba(59,130,246,0.3)" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="284" y="83" fill="white" font-size="10" font-weight="600" text-anchor="middle">Agent</text>
  <text x="284" y="96" fill="#93c5fd" font-size="8" text-anchor="middle">CompiledGraph</text>
  <!-- ChatClient -->
  <rect x="347" y="55" width="98" height="45" rx="6" fill="#0f172a"/>
  <rect x="347" y="55" width="98" height="45" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="396" y="83" fill="white" font-size="10" font-weight="600" text-anchor="middle">ChatClient</text>
  <!-- 通义千问 -->
  <rect x="459" y="55" width="98" height="45" rx="6" fill="#0f172a"/>
  <rect x="459" y="55" width="98" height="45" rx="6" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="508" y="83" fill="white" font-size="10" font-weight="600" text-anchor="middle">通义千问</text>
  <!-- ChatMemory -->
  <rect x="571" y="55" width="98" height="45" rx="6" fill="#0f172a"/>
  <rect x="571" y="55" width="98" height="45" rx="6" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="620" y="83" fill="white" font-size="10" font-weight="600" text-anchor="middle">ChatMemory</text>

  <!-- Lifelines -->
  <line x1="60" y1="100" x2="60" y2="472" stroke="#22d3ee" stroke-width="1" stroke-dasharray="6,4" opacity="0.5"/>
  <line x1="172" y1="100" x2="172" y2="472" stroke="#22d3ee" stroke-width="1" stroke-dasharray="6,4" opacity="0.5"/>
  <line x1="284" y1="100" x2="284" y2="472" stroke="#60a5fa" stroke-width="1" stroke-dasharray="6,4" opacity="0.5"/>
  <line x1="396" y1="100" x2="396" y2="472" stroke="#34d399" stroke-width="1" stroke-dasharray="6,4" opacity="0.5"/>
  <line x1="508" y1="100" x2="508" y2="472" stroke="#94a3b8" stroke-width="1" stroke-dasharray="6,4" opacity="0.5"/>
  <line x1="620" y1="100" x2="620" y2="472" stroke="#a78bfa" stroke-width="1" stroke-dasharray="6,4" opacity="0.5"/>

  <!-- Activation bars -->
  <rect x="167" y="118" width="10" height="252" rx="2" fill="rgba(8,51,68,0.6)" stroke="#22d3ee" stroke-width="1"/>
  <rect x="279" y="156" width="10" height="286" rx="2" fill="rgba(59,130,246,0.4)" stroke="#60a5fa" stroke-width="1"/>
  <rect x="391" y="194" width="10" height="136" rx="2" fill="rgba(6,78,59,0.6)" stroke="#34d399" stroke-width="1"/>
  <rect x="503" y="232" width="10" height="56" rx="2" fill="rgba(30,41,59,0.6)" stroke="#94a3b8" stroke-width="1"/>

  <!-- Messages -->
  <line x1="60" y1="118" x2="172" y2="118" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrow-cyan)"/>
  <text x="116" y="112" fill="#e2e8f0" font-size="9" text-anchor="middle">POST 用户消息</text>
  <line x1="172" y1="156" x2="284" y2="156" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrow-cyan)"/>
  <text x="228" y="150" fill="#e2e8f0" font-size="9" text-anchor="middle">invoke(OverAllState)</text>
  <line x1="284" y1="194" x2="396" y2="194" stroke="#60a5fa" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <text x="340" y="188" fill="#e2e8f0" font-size="9" text-anchor="middle">call(model, prompt)</text>
  <line x1="396" y1="232" x2="508" y2="232" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrow-emerald)"/>
  <text x="452" y="226" fill="#e2e8f0" font-size="9" text-anchor="middle">HTTP 请求</text>
  <line x1="508" y1="270" x2="396" y2="270" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="6,3" marker-end="url(#arrow-slate)"/>
  <text x="452" y="264" fill="#cbd5e1" font-size="9" text-anchor="middle">token 流 Flux</text>
  <line x1="396" y1="308" x2="284" y2="308" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrow-emerald)"/>
  <text x="340" y="302" fill="#e2e8f0" font-size="9" text-anchor="middle">Flux&lt;NodeOutput&gt; 回流</text>
  <line x1="284" y1="346" x2="172" y2="346" stroke="#60a5fa" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <text x="228" y="340" fill="#e2e8f0" font-size="9" text-anchor="middle">SSE 推送</text>
  <line x1="172" y1="358" x2="60" y2="358" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrow-cyan)"/>
  <text x="116" y="352" fill="#e2e8f0" font-size="9" text-anchor="middle">流式吐字</text>

  <!-- ReAct tool loop frame -->
  <rect x="235" y="372" width="170" height="64" rx="4" fill="none" stroke="#64748b" stroke-width="1" stroke-dasharray="4,3"/>
  <rect x="235" y="372" width="46" height="16" rx="3" fill="rgba(30,41,59,0.85)" stroke="#64748b" stroke-width="1"/>
  <text x="258" y="384" fill="#94a3b8" font-size="8" font-weight="600" text-anchor="middle">loop</text>
  <text x="289" y="384" fill="#94a3b8" font-size="8" font-style="italic">ReAct 工具循环</text>
  <path d="M 284,402 L 350,402 L 350,424 L 284,424" fill="none" stroke="#fb7185" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="356" y="416" fill="#fda4af" font-size="8">tool_call → 执行 → ToolMessage 回灌</text>

  <!-- Multiround memory -->
  <line x1="284" y1="448" x2="620" y2="448" stroke="#60a5fa" stroke-width="1.4" marker-end="url(#arrow-blue)"/>
  <text x="452" y="442" fill="#e2e8f0" font-size="9" text-anchor="middle">读 / 写多轮历史</text>
  <line x1="620" y1="460" x2="284" y2="460" stroke="#a78bfa" stroke-width="1.2" stroke-dasharray="6,3" marker-end="url(#arrow-violet)"/>
  <text x="452" y="472" fill="#c4b5fd" font-size="8" text-anchor="middle">历史上下文</text>

  <!-- Notes -->
  <text x="30" y="496" fill="#67e8f9" font-size="9">● 流式分支：token 一边回流一边吐给前端，前端先看到第一个字（CompiledGraph.stream 返回 Flux）</text>
  <text x="30" y="514" fill="#fda4af" font-size="9">● 工具分支：模型返回 tool_call 而非自然语言时，AgentToolNode 执行工具后把结果包成 ToolMessage 回灌模型，形成推理-行动循环</text>
  <text x="30" y="532" fill="#64748b" font-size="8">图：小桃（桃西西呀）· 按 v1.1.2.2 / 7405a7d 核对</text>
</svg>
