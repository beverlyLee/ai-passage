<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 450">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap');
    text { font-family: 'JetBrains Mono', 'Noto Sans SC', 'PingFang SC', monospace; }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <marker id="arrow-rose" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#fb7185"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#0f172a"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <!-- Title -->
  <text x="20" y="26" fill="#ffffff" font-size="16" font-weight="700">Agent.__init__ 一条龙：下载 → 校验 → 原子修配置 → 严格载入 → 设备 / 降级</text>
  <text x="20" y="44" fill="#94a3b8" font-size="10">每一步失败都提前拒绝，OOM 优雅降级到 CPU，绝不静默</text>

  <!-- Stage 1 -->
  <rect x="40" y="54" width="600" height="46" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="56" y="74" fill="#22d3ee" font-size="11" font-weight="600">1 · 解析 model_id（本地路径 or 远程仓库）</text>
  <text x="56" y="92" fill="#94a3b8" font-size="9">本地目录直接用；否则 snapshot_download（受 token / revision 约束）</text>
  <line x1="340" y1="100" x2="340" y2="110" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Stage 2 -->
  <rect x="40" y="110" width="600" height="46" rx="6" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="56" y="130" fill="#a78bfa" font-size="11" font-weight="600">2 · 下载受限 allow_patterns</text>
  <text x="56" y="148" fill="#94a3b8" font-size="9">只拉 rl_agent_config.json / model.safetensors / tokenizer/* / encoder/*（同仓子目录不整包下）</text>
  <line x1="340" y1="156" x2="340" y2="166" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Stage 3 -->
  <rect x="40" y="166" width="600" height="54" rx="6" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="56" y="186" fill="#a78bfa" font-size="11" font-weight="600">3 · verify_digests(SHA-256) + _fix_tokenizer_config（原子写）</text>
  <text x="56" y="204" fill="#94a3b8" font-size="9">载入前校验完整性；修 tokenizer_class / extra_special_tokens；tempfile + os.replace 不损坏共享 blob</text>
  <text x="56" y="216" fill="#94a3b8" font-size="8">缺失 artifact 抛 FileNotFoundError，digest 不符抛 ValueError，拒绝加载</text>
  <line x1="340" y1="220" x2="340" y2="230" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Stage 4 -->
  <rect x="40" y="230" width="600" height="56" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="56" y="250" fill="#34d399" font-size="11" font-weight="600">4 · build_model(pretrained=False) → load_file → 严格载入</text>
  <text x="56" y="268" fill="#94a3b8" font-size="9">build_model 跳过参数初始化；_verify_compatibility 校验 encoder / type_emb / scorer / act_head 四前缀形状</text>
  <text x="56" y="282" fill="#94a3b8" font-size="8">load_state_dict(strict=True)：架构不符直接 ValueError 拒绝</text>
  <line x1="340" y1="286" x2="340" y2="296" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Stage 5 -->
  <rect x="40" y="296" width="600" height="46" rx="6" fill="rgba(120,53,15,0.35)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="56" y="316" fill="#fbbf24" font-size="11" font-weight="600">5 · 温度钳制 + 逐设备 autocast 策略</text>
  <text x="56" y="334" fill="#94a3b8" font-size="9">clamp_temperature 越界即标未校准；CUDA bf16 / MPS fp16 门控 / XPU bf16 / CPU 仅 bf16 opt-in</text>
  <line x1="340" y1="342" x2="340" y2="352" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Stage 6 -->
  <rect x="40" y="352" width="600" height="62" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="56" y="372" fill="#22d3ee" font-size="11" font-weight="600">6 · model.to(device).eval() → 就绪 / OOM 降级</text>
  <text x="56" y="390" fill="#94a3b8" font-size="9">成功即就绪（约 35ms）；失败落 CPU 并告警约 10-15 倍更慢（约 200-500ms）</text>
  <text x="56" y="404" fill="#94a3b8" font-size="8">fast=True 触发 TileLang 前向（CUDA only）；reference_compile 默认 eager 不 torch.compile</text>

  <text x="40" y="436" fill="#94a3b8" font-size="9">整个流程在 Agent.__init__ 内串行完成；后续 predict 才走 Router → Agent.system_one</text>
</svg>
