<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 450" width="680" height="450">
<defs>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;family=Noto+Sans+SC:wght@400;500;700&amp;display=swap');
text{font-family:'Noto Sans SC','JetBrains Mono',sans-serif;}
.mono{font-family:'JetBrains Mono','Noto Sans SC',monospace;}
</style>
</defs>
<rect width="680" height="450" fill="#0f172a"/>
<text x="24" y="32" font-size="18" font-weight="700" fill="#e2e8f0">资本 vs 口碑：上星 ≠ 自动赚钱</text>
<text x="24" y="52" font-size="11" fill="#94a3b8">左：资本面（市值增逾百亿）；右：内容面（口碑两极）——两条线并不重合</text>

<!-- 左：资本面（涨 = 红） -->
<rect x="24" y="72" width="312" height="318" rx="8" fill="#1e293b" stroke="#fb7185"/>
<text x="40" y="98" font-size="14" font-weight="700" fill="#fb7185">资本面（涨）</text>

<rect x="40" y="112" width="280" height="64" rx="4" fill="#0f172a" stroke="#475569"/>
<text x="56" y="142" font-size="20" font-weight="700" fill="#fda4af" class="mono">20CM 涨停 ×2</text>
<text x="320" y="142" font-size="10" fill="#94a3b8" text-anchor="end">8/31 · 9/1</text>
<text x="56" y="162" font-size="9" fill="#64748b">芒果超媒连续两日涨停</text>

<rect x="40" y="184" width="280" height="64" rx="4" fill="#0f172a" stroke="#475569"/>
<text x="56" y="214" font-size="20" font-weight="700" fill="#fda4af" class="mono">逾百亿</text>
<text x="320" y="214" font-size="10" fill="#94a3b8" text-anchor="end">市值增量</text>
<text x="56" y="234" font-size="9" fill="#64748b">两日市值增逾百亿元</text>

<rect x="40" y="256" width="280" height="64" rx="4" fill="#0f172a" stroke="#475569"/>
<text x="56" y="286" font-size="20" font-weight="700" fill="#fda4af" class="mono">14.15→20.62</text>
<text x="320" y="286" font-size="10" fill="#94a3b8" text-anchor="end">约 +45%</text>
<text x="56" y="306" font-size="9" fill="#64748b">股价区间（元）</text>

<rect x="40" y="328" width="280" height="48" rx="4" fill="#3f1d29" stroke="#fb7185"/>
<text x="56" y="356" font-size="11" fill="#fda4af">全网曝光 19.6 亿 · 影视板块涨 6%</text>

<!-- 右：内容面（口碑两极） -->
<rect x="344" y="72" width="312" height="318" rx="8" fill="#1e293b" stroke="#334155"/>
<text x="360" y="98" font-size="14" font-weight="700" fill="#e2e8f0">内容面（口碑两极）</text>

<rect x="360" y="112" width="280" height="64" rx="4" fill="#0f172a" stroke="#34d399"/>
<text x="376" y="142" font-size="14" font-weight="700" fill="#6ee7b7">视觉震撼 ✓</text>
<text x="376" y="162" font-size="9" fill="#94a3b8">首播实时收视 0.3384%、同时段省卫第一</text>

<rect x="360" y="184" width="280" height="64" rx="4" fill="#0f172a" stroke="#fb7185"/>
<text x="376" y="214" font-size="14" font-weight="700" fill="#fda4af">手部穿帮 ✗</text>
<text x="376" y="234" font-size="9" fill="#94a3b8">青萝婆婆上台阶：手空变拐杖（物理异常）</text>

<rect x="360" y="256" width="280" height="64" rx="4" fill="#0f172a" stroke="#fb7185"/>
<text x="376" y="286" font-size="14" font-weight="700" fill="#fda4af">表情僵硬 ✗</text>
<text x="376" y="306" font-size="9" fill="#94a3b8">部分素材微表情不自然（文戏难）</text>

<rect x="360" y="328" width="280" height="48" rx="4" fill="#3f1d29" stroke="#fb7185"/>
<text x="376" y="356" font-size="11" fill="#fda4af">节奏偏慢 ✗ · 上星是特例，不是常态 ROI</text>

<rect x="24" y="400" width="632" height="34" rx="4" fill="#1e293b" stroke="#334155"/>
<text x="40" y="422" font-size="11" fill="#e2e8f0">坑 8：别把上星当常态 ROI —— 先按「开工四问」自测，再谈投入</text>
</svg>
