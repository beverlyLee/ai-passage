<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 450" width="680" height="450">
<defs>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;family=Noto+Sans+SC:wght@400;500;700&amp;display=swap');
text{font-family:'Noto Sans SC','JetBrains Mono',sans-serif;}
.mono{font-family:'JetBrains Mono','Noto Sans SC',monospace;}
</style>
<marker id="a1" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#22d3ee"/></marker>
<marker id="a2" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#fbbf24"/></marker>
<marker id="a3" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#34d399"/></marker>
<marker id="a4" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#fb7185"/></marker>
</defs>
<rect width="680" height="450" fill="#0f172a"/>
<text x="24" y="32" font-size="18" font-weight="700" fill="#e2e8f0">上星共创闭环：边审边播 + 反馈改剧情</text>
<text x="24" y="52" font-size="11" fill="#94a3b8">长叙事失控的解法不是「模型更聪明」，而是把可变状态外置成资产、让反馈回流</text>

<!-- ① -->
<rect x="24" y="88" width="180" height="72" rx="8" fill="#1e293b" stroke="#22d3ee"/>
<text x="114" y="114" font-size="12" font-weight="700" fill="#22d3ee" text-anchor="middle">① 边制作</text>
<text x="114" y="134" font-size="10" fill="#a5f3fc" text-anchor="middle">AIGC 生成</text>
<text x="114" y="150" font-size="9" fill="#64748b" text-anchor="middle">芒果灵创 40+ 模型</text>

<!-- ② -->
<rect x="250" y="88" width="180" height="72" rx="8" fill="#1e293b" stroke="#fbbf24"/>
<text x="340" y="114" font-size="12" font-weight="700" fill="#fbbf24" text-anchor="middle">② 边审核</text>
<text x="340" y="134" font-size="10" fill="#fde68a" text-anchor="middle">同步安全审核</text>
<text x="340" y="150" font-size="9" fill="#64748b" text-anchor="middle">广电级多层审核</text>

<!-- ③ -->
<rect x="476" y="88" width="180" height="72" rx="8" fill="#1e293b" stroke="#34d399"/>
<text x="566" y="114" font-size="12" font-weight="700" fill="#34d399" text-anchor="middle">③ 边播出</text>
<text x="566" y="134" font-size="10" fill="#6ee7b7" text-anchor="middle">芒果TV + 湖南卫视</text>
<text x="566" y="150" font-size="9" fill="#64748b" text-anchor="middle">18:00 / 20:00 黄金档</text>

<!-- ④ -->
<rect x="476" y="204" width="180" height="72" rx="8" fill="#1e293b" stroke="#fb7185"/>
<text x="566" y="230" font-size="12" font-weight="700" fill="#fb7185" text-anchor="middle">④ 观众反馈</text>
<text x="566" y="250" font-size="10" fill="#fda4af" text-anchor="middle">弹幕 / 收视 / 口碑</text>
<text x="566" y="266" font-size="9" fill="#64748b" text-anchor="middle">实时回流</text>

<!-- ⑤ -->
<rect x="24" y="204" width="180" height="72" rx="8" fill="#1e293b" stroke="#34d399"/>
<text x="114" y="230" font-size="12" font-weight="700" fill="#34d399" text-anchor="middle">⑤ 回流调整</text>
<text x="114" y="250" font-size="10" fill="#6ee7b7" text-anchor="middle">剧情 / 资产入库</text>
<text x="114" y="266" font-size="9" fill="#64748b" text-anchor="middle">反馈影响后续集</text>

<!-- 箭头 -->
<line x1="206" y1="124" x2="246" y2="124" stroke="#22d3ee" stroke-width="2" marker-end="url(#a1)"/>
<line x1="432" y1="124" x2="472" y2="124" stroke="#fbbf24" stroke-width="2" marker-end="url(#a2)"/>
<line x1="566" y1="162" x2="566" y2="200" stroke="#34d399" stroke-width="2" marker-end="url(#a3)"/>
<line x1="472" y1="240" x2="208" y2="240" stroke="#fb7185" stroke-width="2" marker-end="url(#a4)"/>
<line x1="114" y1="202" x2="114" y2="164" stroke="#34d399" stroke-width="2" marker-end="url(#a3)"/>

<!-- 资产回流 -->
<rect x="24" y="292" width="632" height="60" rx="6" fill="#1e293b" stroke="#334155"/>
<text x="40" y="314" font-size="11" font-weight="700" fill="#e2e8f0">资产回流库：109 个角色资产 + 143 个场景资产</text>
<text x="40" y="334" font-size="10" fill="#94a3b8">跨集复用、新资产回流库 → 成为下一季创作起点；复用率越高，边际成本越低</text>

<!-- 实例 -->
<rect x="24" y="362" width="632" height="70" rx="6" fill="#3f1d29" stroke="#fb7185"/>
<text x="40" y="384" font-size="11" font-weight="700" fill="#fda4af">实例：「广电 21 条」后首部「边制作、边审核、边播出」的长剧</text>
<text x="40" y="404" font-size="10" fill="#fda4af">反一号原设定牛魔王 → 生成猕猴王后临时改设为猕猴王（观众反馈真的改动了剧情）</text>
<text x="40" y="422" font-size="10" fill="#94a3b8">流程从「先做完再送审」变成「边播边收反馈」，叙事与资产都在滚动更新</text>
</svg>
