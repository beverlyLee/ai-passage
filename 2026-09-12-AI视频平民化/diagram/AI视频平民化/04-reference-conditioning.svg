<svg viewBox="0 0 680 450" width="680" height="450" xmlns="http://www.w3.org/2000/svg">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&amp;family=Noto+Sans+SC:wght@400;500;700&amp;display=swap');
    text { font-family: 'Noto Sans SC', 'JetBrains Mono', sans-serif; }
    .mono { font-family: 'JetBrains Mono', monospace; }
  </style>
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#1e293b" stroke-width="1"/>
    </pattern>
    <marker id="a-cyan" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#22d3ee"/>
    </marker>
    <marker id="a-rose" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#fb7185"/>
    </marker>
  </defs>
  <rect width="680" height="450" fill="#0f172a"/>
  <rect width="680" height="450" fill="url(#grid)"/>

  <text x="24" y="34" fill="#e2e8f0" font-size="15" font-weight="700">图4 · 参考条件化：把「身份」变成显式条件</text>
  <text x="24" y="52" fill="#64748b" font-size="9.5" class="mono">解决「同一个人每帧都变脸」——参考 cross-attention 锁死角色，而非靠语义自对齐</text>
  <line x1="24" y1="64" x2="656" y2="64" stroke="#1e293b" stroke-width="1"/>

  <!-- OLD -->
  <text x="24" y="92" fill="#fb7185" font-size="12" font-weight="700">旧：提示词写细 → 隐式涌现</text>
  <rect x="24" y="102" width="180" height="46" rx="6" fill="#1e293b" stroke="#fb7185" stroke-width="1"/>
  <text x="34" y="124" fill="#e2e8f0" font-size="10.5">「红衣女孩」提示词</text>
  <text x="34" y="141" fill="#fb7185" font-size="9.5">✗ 每 2 秒换一张脸</text>
  <text x="220" y="129" fill="#94a3b8" font-size="9" class="mono">身份未显式约束</text>

  <!-- NEW -->
  <text x="24" y="178" fill="#22d3ee" font-size="12" font-weight="700">新：显式参考条件注入</text>
  <rect x="24" y="188" width="150" height="60" rx="6" fill="#0b3b46" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="34" y="210" fill="#a5f3fc" font-size="10">参考素材</text>
  <text x="34" y="226" fill="#94a3b8" font-size="9" class="mono">图/视频/音频</text>
  <text x="34" y="240" fill="#94a3b8" font-size="9" class="mono">作为 K/V</text>
  <line x1="174" y1="218" x2="212" y2="218" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#a-cyan)"/>
  <rect x="216" y="188" width="190" height="60" rx="6" fill="#0b3b46" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="226" y="210" fill="#a5f3fc" font-size="10">reference</text>
  <text x="226" y="226" fill="#a5f3fc" font-size="10">cross-attention</text>
  <text x="226" y="242" fill="#94a3b8" font-size="9" class="mono">生成帧 Q 查参考</text>
  <line x1="406" y1="218" x2="444" y2="218" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#a-cyan)"/>
  <rect x="448" y="188" width="160" height="60" rx="6" fill="#0b3b46" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="458" y="210" fill="#a5f3fc" font-size="10">生成帧</text>
  <text x="458" y="226" fill="#a5f3fc" font-size="10">像素级一致</text>
  <text x="458" y="242" fill="#22d3ee" font-size="9" class="mono">✓ 脸由参考决定</text>

  <!-- numbers -->
  <rect x="24" y="276" width="628" height="86" rx="8" fill="#1e293b" stroke="#22d3ee" stroke-width="1"/>
  <text x="40" y="300" fill="#22d3ee" font-size="11.5" font-weight="700">三线的参考能力（已核实）</text>
  <text x="40" y="322" fill="#e2e8f0" font-size="10.5">• 通义万相 Wan3.0：文本+图像+音频+视频 4 模态联合参考，单次 ≤ 20 份，像素级一致</text>
  <text x="40" y="342" fill="#e2e8f0" font-size="10.5">• Seedance 2.5：30 图 + 10 视频 + 10 音频 = 50 参考，新增白模/绿幕参考</text>
  <text x="40" y="358" fill="#e2e8f0" font-size="10.5">• 可灵 Kling：图生视频 + Motion Brush，锁死参考图人物/物体再让区域运动</text>

  <text x="24" y="390" fill="#64748b" font-size="9" class="mono">机制：身份是「一等条件」而非「隐式涌现」，漂移被结构性压住——连续剧级可控性由此而来。</text>
</svg>
