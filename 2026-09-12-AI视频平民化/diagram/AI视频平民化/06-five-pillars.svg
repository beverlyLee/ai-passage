<svg viewBox="0 0 680 450" width="680" height="450" xmlns="http://www.w3.org/2000/svg">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&amp;family=Noto+Sans+SC:wght@400;500;700&amp;display=swap');
    text { font-family: 'Noto Sans SC', 'JetBrains Mono', sans-serif; }
    .mono { font-family: 'JetBrains Mono', monospace; }
  </style>
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#1e293b" stroke-width="1"/>
    </pattern>
    <marker id="a-cyan" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#22d3ee"/>
    </marker>
  </defs>
  <rect width="680" height="450" fill="#0f172a"/>
  <rect width="680" height="450" fill="url(#grid)"/>

  <text x="24" y="34" fill="#e2e8f0" font-size="15" font-weight="700">图6 · 平民化五线闭环：五拐点汇聚成「平民可用」</text>
  <text x="24" y="52" fill="#64748b" font-size="9.5" class="mono">不是某一招神功，而是五条工程线在同一时间窗口同时被击穿</text>
  <line x1="24" y1="64" x2="656" y2="64" stroke="#1e293b" stroke-width="1"/>

  <!-- five pillars -->
  <rect x="24" y="92" width="118" height="64" rx="8" fill="#1e293b" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="34" y="116" fill="#22d3ee" font-size="11.5" font-weight="700">① 算力墙</text>
  <text x="34" y="136" fill="#94a3b8" font-size="9" class="mono">O(N²)→O(N)</text>
  <text x="34" y="150" fill="#94a3b8" font-size="9" class="mono">单卡 13s</text>

  <rect x="158" y="92" width="118" height="64" rx="8" fill="#1e293b" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="168" y="116" fill="#22d3ee" font-size="11.5" font-weight="700">② 声画同出</text>
  <text x="168" y="136" fill="#94a3b8" font-size="9" class="mono">同 latent</text>
  <text x="168" y="150" fill="#94a3b8" font-size="9" class="mono">对口型成片</text>

  <rect x="292" y="92" width="118" height="64" rx="8" fill="#1e293b" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="302" y="116" fill="#22d3ee" font-size="11.5" font-weight="700">③ 流式</text>
  <text x="302" y="136" fill="#94a3b8" font-size="9" class="mono">AR-DiT</text>
  <text x="302" y="150" fill="#94a3b8" font-size="9" class="mono">即产即播</text>

  <rect x="426" y="92" width="118" height="64" rx="8" fill="#1e293b" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="436" y="116" fill="#22d3ee" font-size="11.5" font-weight="700">④ 参考条件</text>
  <text x="436" y="136" fill="#94a3b8" font-size="9" class="mono">锁死身份</text>
  <text x="436" y="150" fill="#94a3b8" font-size="9" class="mono">像素级一致</text>

  <rect x="560" y="92" width="118" height="64" rx="8" fill="#1e293b" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="570" y="116" fill="#22d3ee" font-size="11.5" font-weight="700">⑤ 分发闭环</text>
  <text x="570" y="136" fill="#94a3b8" font-size="9" class="mono">价格/平台</text>
  <text x="570" y="150" fill="#94a3b8" font-size="9" class="mono">/开源</text>

  <!-- arrows to center -->
  <line x1="83" y1="156" x2="300" y2="232" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#a-cyan)"/>
  <line x1="217" y1="156" x2="310" y2="232" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#a-cyan)"/>
  <line x1="351" y1="156" x2="320" y2="232" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#a-cyan)"/>
  <line x1="485" y1="156" x2="360" y2="232" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#a-cyan)"/>
  <line x1="619" y1="156" x2="370" y2="232" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#a-cyan)"/>

  <!-- center -->
  <circle cx="340" cy="270" r="56" fill="#0b3b46" stroke="#fbbf24" stroke-width="2"/>
  <text x="340" y="264" fill="#fbbf24" font-size="14" font-weight="700" text-anchor="middle">平民可用</text>
  <text x="340" y="284" fill="#a5f3fc" font-size="10" text-anchor="middle">2026 拐点叠加</text>

  <!-- bottom takeaway -->
  <rect x="24" y="344" width="628" height="60" rx="8" fill="#1e293b" stroke="#fbbf24" stroke-width="1"/>
  <text x="40" y="368" fill="#fbbf24" font-size="11.5" font-weight="700">回扣标题：Sora 退场 ≠ AI 视频凉了</text>
  <text x="40" y="388" fill="#e2e8f0" font-size="10">退场的是「闭源高价单点」模式，国产三线用全产业链平民化接住了需求——任何一条拐点迟到，平民化都立不住。</text>

  <text x="24" y="424" fill="#64748b" font-size="9" class="mono">对应正文小结表：太慢→算力墙｜无声→声画同出｜不能实时→流式｜变脸→参考条件化｜贵且封闭→分发闭环</text>
</svg>
