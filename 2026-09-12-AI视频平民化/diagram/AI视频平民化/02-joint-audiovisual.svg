<svg viewBox="0 0 680 450" width="680" height="450" xmlns="http://www.w3.org/2000/svg">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&amp;family=Noto+Sans+SC:wght@400;500;700&amp;display=swap');
    text { font-family: 'Noto Sans SC', 'JetBrains Mono', sans-serif; }
    .mono { font-family: 'JetBrains Mono', monospace; }
  </style>
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#1e293b" stroke-width="1"/>
    </pattern>
    <marker id="a-cyan" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#22d3ee"/>
    </marker>
    <marker id="a-rose" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#fb7185"/>
    </marker>
  </defs>
  <rect width="680" height="450" fill="#0f172a"/>
  <rect width="680" height="450" fill="url(#grid)"/>

  <text x="24" y="34" fill="#e2e8f0" font-size="15" font-weight="700">图2 · 声画同出：同 latent 空间联合去噪</text>
  <text x="24" y="52" fill="#64748b" font-size="9.5" class="mono">告别「画完再配音」——声画由同一组潜变量在每步去噪中互相约束</text>
  <line x1="24" y1="64" x2="656" y2="64" stroke="#1e293b" stroke-width="1"/>

  <!-- OLD path -->
  <text x="24" y="92" fill="#fb7185" font-size="12" font-weight="700">旧：画完再配音（口型错位）</text>
  <rect x="24" y="102" width="120" height="46" rx="6" fill="#1e293b" stroke="#fb7185" stroke-width="1"/>
  <text x="34" y="128" fill="#e2e8f0" font-size="10.5">视频模型</text>
  <text x="34" y="143" fill="#94a3b8" font-size="9" class="mono">无声</text>
  <line x1="144" y1="125" x2="184" y2="125" stroke="#fb7185" stroke-width="1.5" marker-end="url(#a-rose)"/>
  <rect x="188" y="102" width="120" height="46" rx="6" fill="#1e293b" stroke="#fb7185" stroke-width="1"/>
  <text x="198" y="128" fill="#e2e8f0" font-size="10.5">TTS 音频</text>
  <text x="198" y="143" fill="#94a3b8" font-size="9" class="mono">独立采样</text>
  <line x1="308" y1="125" x2="348" y2="125" stroke="#fb7185" stroke-width="1.5" marker-end="url(#a-rose)"/>
  <rect x="352" y="102" width="150" height="46" rx="6" fill="#1e293b" stroke="#fb7185" stroke-width="1"/>
  <text x="362" y="125" fill="#e2e8f0" font-size="10.5">对齐后处理</text>
  <text x="362" y="143" fill="#fb7185" font-size="9.5">✗ 口型/重音割裂</text>

  <!-- NEW path -->
  <text x="24" y="186" fill="#22d3ee" font-size="12" font-weight="700">新：联合去噪（原生声画同出）</text>
  <rect x="24" y="196" width="130" height="54" rx="6" fill="#0b3b46" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="34" y="218" fill="#a5f3fc" font-size="10.5">提示词</text>
  <text x="34" y="234" fill="#94a3b8" font-size="9" class="mono">文/图/音/视频</text>
  <line x1="154" y1="223" x2="196" y2="223" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#a-cyan)"/>
  <rect x="200" y="196" width="170" height="54" rx="6" fill="#0b3b46" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="210" y="216" fill="#a5f3fc" font-size="10.5">同 latent 编码</text>
  <text x="210" y="232" fill="#94a3b8" font-size="9" class="mono">声+画进同一空间</text>
  <text x="210" y="245" fill="#22d3ee" font-size="9" class="mono">↓ 每步联合去噪</text>
  <line x1="370" y1="223" x2="412" y2="223" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#a-cyan)"/>
  <rect x="416" y="196" width="190" height="54" rx="6" fill="#0b3b46" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="426" y="218" fill="#a5f3fc" font-size="10.5">成片（对口型）</text>
  <text x="426" y="234" fill="#94a3b8" font-size="9" class="mono">跨模态互相 attend</text>
  <text x="426" y="247" fill="#22d3ee" font-size="9" class="mono">✓ 口型/重音天然对齐</text>

  <!-- joint denoise detail -->
  <rect x="24" y="276" width="628" height="64" rx="8" fill="#1e293b" stroke="#22d3ee" stroke-width="1"/>
  <text x="40" y="300" fill="#22d3ee" font-size="11.5" font-weight="700">机制：联合注意力里视频 token ↔ 音频 token 互相 attend</text>
  <text x="40" y="320" fill="#e2e8f0" font-size="10.5">同一组潜变量同时决定「嘴形」与「声音」→ 说话动作在声、画两通道被同一约束</text>
  <text x="40" y="336" fill="#94a3b8" font-size="9.5" class="mono">Wan3.0 All-in-One / Seedance 2.5 统一音视频架构 / 可灵 2.0 Master 可选音轨</text>

  <text x="24" y="372" fill="#64748b" font-size="9" class="mono">代价：latent 维度更高、KV cache 更大，但换来可直接用的成片，省掉三段后处理流水。</text>
</svg>
