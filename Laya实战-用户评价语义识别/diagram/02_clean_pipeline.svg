<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 450">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap');
      text { font-family: 'JetBrains Mono','Noto Sans SC','PingFang SC',sans-serif; }
    </style>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#0f172a"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <text x="20" y="28" fill="#ffffff" font-size="16" font-weight="700">评价清洗四道闸 (clean_review)</text>
  <text x="20" y="46" fill="#94a3b8" font-size="9">email.py 复用 · 判断之前先去噪声</text>

  <rect x="230" y="55" width="220" height="46" rx="6" fill="#0f172a"/>
  <rect x="230" y="55" width="220" height="46" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="340" y="75" fill="#ffffff" font-size="12" font-weight="600" text-anchor="middle">原始评价</text>
  <text x="340" y="91" fill="#94a3b8" font-size="9" text-anchor="middle">含默认好评 / emoji 刷屏 / 空白</text>

  <line x1="340" y1="101" x2="340" y2="132" stroke="#64748b" marker-end="url(#arrow)"/>
  <line x1="90" y1="132" x2="600" y2="132" stroke="#64748b"/>
  <line x1="90" y1="132" x2="90" y2="150" stroke="#64748b" marker-end="url(#arrow)"/>
  <line x1="260" y1="132" x2="260" y2="150" stroke="#64748b" marker-end="url(#arrow)"/>
  <line x1="430" y1="132" x2="430" y2="150" stroke="#64748b" marker-end="url(#arrow)"/>
  <line x1="600" y1="132" x2="600" y2="150" stroke="#64748b" marker-end="url(#arrow)"/>

  <rect x="20" y="150" width="140" height="64" rx="6" fill="#0f172a"/>
  <rect x="20" y="150" width="140" height="64" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="90" y="174" fill="#ffffff" font-size="11" font-weight="600" text-anchor="middle">① 归一空白</text>
  <text x="90" y="194" fill="#94a3b8" font-size="9" text-anchor="middle">压平换行与全角空格</text>

  <rect x="190" y="150" width="140" height="64" rx="6" fill="#0f172a"/>
  <rect x="190" y="150" width="140" height="64" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="260" y="174" fill="#ffffff" font-size="11" font-weight="600" text-anchor="middle">② 剥离噪声</text>
  <text x="260" y="194" fill="#94a3b8" font-size="9" text-anchor="middle">删默认好评等空话</text>

  <rect x="360" y="150" width="140" height="64" rx="6" fill="#0f172a"/>
  <rect x="360" y="150" width="140" height="64" rx="6" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="430" y="174" fill="#ffffff" font-size="11" font-weight="600" text-anchor="middle">③ 压缩 emoji</text>
  <text x="430" y="194" fill="#94a3b8" font-size="9" text-anchor="middle">连续表情压成 1 个</text>

  <rect x="530" y="150" width="140" height="64" rx="6" fill="#0f172a"/>
  <rect x="530" y="150" width="140" height="64" rx="6" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="600" y="174" fill="#ffffff" font-size="11" font-weight="600" text-anchor="middle">④ 超长截断</text>
  <text x="600" y="194" fill="#94a3b8" font-size="9" text-anchor="middle">头80 + 尾40 拼接</text>

  <line x1="90" y1="214" x2="90" y2="228" stroke="#64748b" marker-end="url(#arrow)"/>
  <line x1="260" y1="214" x2="260" y2="228" stroke="#64748b" marker-end="url(#arrow)"/>
  <line x1="430" y1="214" x2="430" y2="228" stroke="#64748b" marker-end="url(#arrow)"/>
  <line x1="600" y1="214" x2="600" y2="228" stroke="#64748b" marker-end="url(#arrow)"/>
  <line x1="90" y1="228" x2="600" y2="228" stroke="#64748b"/>
  <line x1="340" y1="228" x2="340" y2="300" stroke="#64748b" marker-end="url(#arrow)"/>

  <rect x="230" y="300" width="220" height="46" rx="6" fill="#0f172a"/>
  <rect x="230" y="300" width="220" height="46" rx="6" fill="rgba(59,130,246,0.3)" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="340" y="320" fill="#ffffff" font-size="12" font-weight="600" text-anchor="middle">清洗后评价</text>
  <text x="340" y="336" fill="#94a3b8" font-size="9" text-anchor="middle">可直接进入判断</text>

  <rect x="30" y="372" width="620" height="44" rx="6" fill="rgba(136,19,55,0.3)" stroke="#fb7185" stroke-width="1"/>
  <text x="40" y="390" fill="#fb7185" font-size="9" font-weight="600">纪律：剥离噪声绑定名词</text>
  <text x="40" y="406" fill="#e2e8f0" font-size="9">只删 默认好评 这种固定四字词，绝不误删含默认二字的真实诉求句（例：默认设置下导出乱序）</text>
</svg>
