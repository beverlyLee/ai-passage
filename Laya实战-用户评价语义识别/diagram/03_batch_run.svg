<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 450">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap');
      text { font-family: 'JetBrains Mono','Noto Sans SC','PingFang SC',sans-serif; }
    </style>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <marker id="arrow-rose" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#fb7185"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#0f172a"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <text x="20" y="28" fill="#ffffff" font-size="16" font-weight="700">一条评价 → 多原子判断 → 按维度聚合</text>
  <text x="20" y="46" fill="#94a3b8" font-size="9">demo_run_reviews.py · 多语种启发式（mock 模型）</text>

  <rect x="240" y="58" width="200" height="40" rx="6" fill="#0f172a"/>
  <rect x="240" y="58" width="200" height="40" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="340" y="83" fill="#ffffff" font-size="11" font-weight="600" text-anchor="middle">原始评价（R03 中文）</text>

  <rect x="250" y="112" width="180" height="36" rx="6" fill="#0f172a"/>
  <rect x="250" y="112" width="180" height="36" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="340" y="135" fill="#ffffff" font-size="11" font-weight="600" text-anchor="middle">清洗 clean_review</text>

  <rect x="235" y="162" width="210" height="36" rx="6" fill="#0f172a"/>
  <rect x="235" y="162" width="210" height="36" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="340" y="185" fill="#ffffff" font-size="11" font-weight="600" text-anchor="middle">拆原子从句（连词+句末切分）</text>

  <line x1="340" y1="98" x2="340" y2="112" stroke="#64748b" marker-end="url(#arrow)"/>
  <line x1="340" y1="148" x2="340" y2="162" stroke="#64748b" marker-end="url(#arrow)"/>
  <line x1="340" y1="198" x2="340" y2="204" stroke="#64748b"/>
  <line x1="110" y1="204" x2="570" y2="204" stroke="#64748b"/>
  <line x1="110" y1="204" x2="110" y2="210" stroke="#64748b" marker-end="url(#arrow)"/>
  <line x1="340" y1="204" x2="340" y2="210" stroke="#64748b" marker-end="url(#arrow)"/>
  <line x1="570" y1="204" x2="570" y2="210" stroke="#64748b" marker-end="url(#arrow)"/>

  <rect x="20" y="210" width="180" height="76" rx="8" fill="#0f172a"/>
  <rect x="20" y="210" width="180" height="76" rx="8" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="110" y="232" fill="#ffffff" font-size="11" font-weight="600" text-anchor="middle">功能 aspect</text>
  <text x="110" y="252" fill="#94a3b8" font-size="9" text-anchor="middle">polarity = neutral</text>
  <text x="110" y="272" fill="#fb7185" font-size="9" text-anchor="middle">appeal = 0.9 诉求!</text>

  <rect x="250" y="210" width="180" height="76" rx="8" fill="#0f172a"/>
  <rect x="250" y="210" width="180" height="76" rx="8" fill="rgba(136,19,55,0.3)" stroke="#fb7185" stroke-width="1.5"/>
  <text x="340" y="232" fill="#ffffff" font-size="11" font-weight="600" text-anchor="middle">价格 aspect</text>
  <text x="340" y="252" fill="#fb7185" font-size="9" text-anchor="middle">polarity = negative</text>
  <text x="340" y="272" fill="#94a3b8" font-size="9" text-anchor="middle">appeal = 0.1</text>

  <rect x="480" y="210" width="180" height="76" rx="8" fill="#0f172a"/>
  <rect x="480" y="210" width="180" height="76" rx="8" fill="rgba(136,19,55,0.3)" stroke="#fb7185" stroke-width="1.5"/>
  <text x="570" y="232" fill="#ffffff" font-size="11" font-weight="600" text-anchor="middle">客服 aspect</text>
  <text x="570" y="252" fill="#fb7185" font-size="9" text-anchor="middle">polarity = negative</text>
  <text x="570" y="272" fill="#94a3b8" font-size="9" text-anchor="middle">appeal = 0.1</text>

  <line x1="110" y1="286" x2="110" y2="294" stroke="#64748b" marker-end="url(#arrow)"/>
  <line x1="340" y1="286" x2="340" y2="294" stroke="#64748b" marker-end="url(#arrow)"/>
  <line x1="570" y1="286" x2="570" y2="294" stroke="#64748b" marker-end="url(#arrow)"/>
  <line x1="110" y1="294" x2="570" y2="294" stroke="#64748b"/>
  <line x1="340" y1="294" x2="340" y2="300" stroke="#64748b" marker-end="url(#arrow)"/>

  <rect x="245" y="300" width="190" height="36" rx="6" fill="#0f172a"/>
  <rect x="245" y="300" width="190" height="36" rx="6" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="340" y="323" fill="#ffffff" font-size="11" font-weight="600" text-anchor="middle">按维度聚合</text>

  <rect x="235" y="350" width="210" height="42" rx="6" fill="#0f172a"/>
  <rect x="235" y="350" width="210" height="42" rx="6" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="340" y="372" fill="#ffffff" font-size="11" font-weight="600" text-anchor="middle">结构化判断</text>
  <text x="340" y="386" fill="#a78bfa" font-size="9" text-anchor="middle">actionable 标记 → 优先处理</text>

  <line x1="340" y1="336" x2="340" y2="350" stroke="#64748b" marker-end="url(#arrow)"/>

  <rect x="30" y="404" width="620" height="38" rx="6" fill="rgba(136,19,55,0.3)" stroke="#fb7185" stroke-width="1"/>
  <text x="40" y="420" fill="#fb7185" font-size="9" font-weight="600">局部窗口判极性</text>
  <text x="40" y="435" fill="#e2e8f0" font-size="9">R05 葡语：到货21天但质量好 → 物流=negative 被正确救回，不与被夸的质量互相抵消</text>
</svg>
