<svg viewBox="0 0 680 450" width="680" height="450" xmlns="http://www.w3.org/2000/svg">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&amp;family=Noto+Sans+SC:wght@400;500;700&amp;display=swap');
    text { font-family: 'Noto Sans SC', 'JetBrains Mono', sans-serif; }
    .mono { font-family: 'JetBrains Mono', monospace; }
  </style>
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#1e293b" stroke-width="1"/>
    </pattern>
    <marker id="a-cyan" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#22d3ee"/>
    </marker>
  </defs>
  <rect width="680" height="450" fill="#0f172a"/>
  <rect width="680" height="450" fill="url(#grid)"/>

  <text x="24" y="34" fill="#e2e8f0" font-size="15" font-weight="700">图3 · 反复核验的认知税：BCG「AI brain fry」</text>
  <text x="24" y="52" fill="#64748b" font-size="9.5" class="mono">HBR 2026-03 · 1488 名美国员工 · 高监管强度量化（机制②）</text>
  <line x1="24" y1="64" x2="656" y2="64" stroke="#1e293b" stroke-width="1"/>

  <rect x="24" y="84" width="300" height="156" rx="8" fill="#1e293b" stroke="#fb7185" stroke-width="1.5"/>
  <text x="40" y="110" fill="#fb7185" font-size="12" font-weight="700">高监管 AI 输出 →</text>
  <text x="40" y="142" fill="#e2e8f0" font-size="14">心理努力 <tspan fill="#fbbf24" font-weight="700">+14%</tspan></text>
  <text x="40" y="174" fill="#e2e8f0" font-size="14">心理疲劳 <tspan fill="#fbbf24" font-weight="700">+12%</tspan></text>
  <text x="40" y="206" fill="#e2e8f0" font-size="14">信息过载 <tspan fill="#fbbf24" font-weight="700">+19%</tspan></text>

  <line x1="328" y1="162" x2="364" y2="162" stroke="#22d3ee" stroke-width="2" marker-end="url(#a-cyan)"/>

  <rect x="372" y="84" width="284" height="156" rx="8" fill="#1e293b" stroke="#fb7185" stroke-width="1.5"/>
  <text x="388" y="110" fill="#fb7185" font-size="12" font-weight="700">脑疲劳者的后续 →</text>
  <text x="388" y="142" fill="#e2e8f0" font-size="14">决策疲劳 <tspan fill="#fb7185" font-weight="700">+33%</tspan></text>
  <text x="388" y="174" fill="#e2e8f0" font-size="14">小错 <tspan fill="#fb7185" font-weight="700">+11%</tspan></text>
  <text x="388" y="206" fill="#e2e8f0" font-size="14">大错 <tspan fill="#fb7185" font-weight="700">+39%</tspan></text>

  <rect x="24" y="264" width="632" height="44" rx="8" fill="#0b3b46" stroke="#22d3ee" stroke-width="1"/>
  <text x="40" y="291" fill="#a5f3fc" font-size="12" font-weight="700">核验不是免费动作 —— 它吃的是心理带宽，且从没被记进任何账本（解法：给核验设上限 / 排期）</text>

  <text x="24" y="344" fill="#64748b" font-size="9" class="mono">来源：BCG「AI brain fry」研究（HBR，2026-03，n=1488 美国员工）；高监管强度三指标与脑疲劳后果均经原文核实</text>
  <text x="24" y="360" fill="#64748b" font-size="9" class="mono">注：与第14篇同根——生成带宽暴涨，判断（核验）带宽没动，且这环几乎未被工具化。</text>
</svg>
