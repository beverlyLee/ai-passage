<svg viewBox="0 0 680 450" width="680" height="450" xmlns="http://www.w3.org/2000/svg">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&amp;family=Noto+Sans+SC:wght@400;500;700&amp;display=swap');
    text { font-family: 'Noto Sans SC', 'JetBrains Mono', sans-serif; }
    .mono { font-family: 'JetBrains Mono', monospace; }
  </style>
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#1e293b" stroke-width="1"/>
    </pattern>
    <marker id="a-cyan" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#22d3ee"/>
    </marker>
  </defs>
  <rect width="680" height="450" fill="#0f172a"/>
  <rect width="680" height="450" fill="url(#grid)"/>

  <text x="24" y="34" fill="#e2e8f0" font-size="15" font-weight="700">图1 · 外滩大会「AI 科技人文十问」：提问权第一次回到普通人</text>
  <text x="24" y="52" fill="#64748b" font-size="9.5" class="mono">2026-09-08 发布 · Q1 来自 37 岁公司白领张珺 · 往年提问权属院士 / CEO / AI 实验室</text>
  <line x1="24" y1="64" x2="656" y2="64" stroke="#1e293b" stroke-width="1"/>

  <rect x="24" y="84" width="632" height="84" rx="8" fill="#1e293b" stroke="#fb7185" stroke-width="1.5"/>
  <text x="40" y="116" fill="#fb7185" font-size="16" font-weight="700">「都说 AI 让效率变高，为什么我们反而更累了？」</text>
  <text x="40" y="142" fill="#94a3b8" font-size="10.5">—— 外滩大会十问 · 排第一的问题 · 提问人：张珺（37 岁公司白领）</text>

  <rect x="24" y="196" width="290" height="92" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
  <text x="40" y="222" fill="#94a3b8" font-size="12" font-weight="700">往年：提问权在谁手里</text>
  <text x="40" y="246" fill="#e2e8f0" font-size="11">院士 · 科技公司 CEO</text>
  <text x="40" y="266" fill="#e2e8f0" font-size="11">AI 实验室 · 投资人</text>

  <line x1="320" y1="242" x2="356" y2="242" stroke="#22d3ee" stroke-width="2" marker-end="url(#a-cyan)"/>
  <text x="324" y="234" fill="#22d3ee" font-size="9.5" class="mono">转移</text>

  <rect x="366" y="196" width="290" height="92" rx="8" fill="#0b3b46" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="382" y="222" fill="#22d3ee" font-size="12" font-weight="700">2026：提问权回到普通人</text>
  <text x="382" y="246" fill="#e2e8f0" font-size="11">第一次从精英 / AI 转回</text>
  <text x="382" y="266" fill="#a5f3fc" font-size="11" font-weight="600">一个打工人</text>

  <rect x="24" y="312" width="632" height="44" rx="8" fill="#0b3b46" stroke="#22d3ee" stroke-width="1"/>
  <text x="40" y="339" fill="#a5f3fc" font-size="12" font-weight="700">提问权转移本身，就是「全民效率悖论」被公开认领的信号——它横跨打工人 / 学生 / 创作者 / 管理者</text>

  <text x="24" y="392" fill="#64748b" font-size="9" class="mono">来源：外滩大会 2026「AI 科技人文十问」（2026-09-08 发布），Q1 原文与张珺身份经报道核实</text>
</svg>
