<svg viewBox="0 0 680 450" width="680" height="450" xmlns="http://www.w3.org/2000/svg">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&amp;family=Noto+Sans+SC:wght@400;500;700&amp;display=swap');
    text { font-family: 'Noto Sans SC', 'JetBrains Mono', sans-serif; }
    .mono { font-family: 'JetBrains Mono', monospace; }
  </style>
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#1e293b" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="680" height="450" fill="#0f172a"/>
  <rect width="680" height="450" fill="url(#grid)"/>

  <text x="24" y="34" fill="#e2e8f0" font-size="15" font-weight="700">图2 · 期望-现实鸿沟：省 11h，但 6.4h 在 botsitting</text>
  <text x="24" y="52" fill="#64748b" font-size="9.5" class="mono">Glean Work AI Index 2026 (6000 人) · Foxit 调研 · 数据见正文机制①</text>
  <line x1="24" y1="64" x2="656" y2="64" stroke="#1e293b" stroke-width="1"/>

  <rect x="24" y="84" width="200" height="156" rx="8" fill="#1e293b" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="40" y="110" fill="#22d3ee" font-size="12" font-weight="700">Glean 知识工作者</text>
  <text x="40" y="138" fill="#e2e8f0" font-size="11">周省 <tspan fill="#22d3ee" font-weight="700">11h</tspan></text>
  <text x="40" y="162" fill="#e2e8f0" font-size="11">botsitting <tspan fill="#fb7185" font-weight="700">6.4h</tspan></text>
  <text x="40" y="186" fill="#e2e8f0" font-size="11">净 <tspan fill="#fbbf24" font-weight="700">4.6h</tspan></text>
  <text x="40" y="214" fill="#64748b" font-size="10">仅 13% 组织见增益</text>

  <rect x="240" y="84" width="200" height="156" rx="8" fill="#1e293b" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="256" y="110" fill="#22d3ee" font-size="12" font-weight="700">Foxit 高管</text>
  <text x="256" y="138" fill="#e2e8f0" font-size="11">周省 <tspan fill="#22d3ee" font-weight="700">4.6h</tspan></text>
  <text x="256" y="162" fill="#e2e8f0" font-size="11">校验 <tspan fill="#fb7185" font-weight="700">4.33h</tspan></text>
  <text x="256" y="186" fill="#e2e8f0" font-size="11">净 <tspan fill="#fbbf24" font-weight="700">16 分钟</tspan></text>
  <text x="256" y="214" fill="#64748b" font-size="10">纸面盈利，组织无感</text>

  <rect x="456" y="84" width="200" height="156" rx="8" fill="#1e293b" stroke="#fb7185" stroke-width="1.5"/>
  <text x="472" y="110" fill="#fb7185" font-size="12" font-weight="700">终端用户</text>
  <text x="472" y="138" fill="#e2e8f0" font-size="11">周省 <tspan fill="#22d3ee" font-weight="700">4.6h</tspan></text>
  <text x="472" y="162" fill="#e2e8f0" font-size="11">校验 <tspan fill="#fb7185" font-weight="700">4.77h</tspan></text>
  <text x="472" y="186" fill="#fb7185" font-size="11" font-weight="700">净亏 14 分钟</text>
  <text x="472" y="214" fill="#64748b" font-size="10">真亏：免费质检员</text>

  <rect x="24" y="264" width="632" height="44" rx="8" fill="#0b3b46" stroke="#22d3ee" stroke-width="1"/>
  <text x="40" y="291" fill="#a5f3fc" font-size="12" font-weight="700">总根：生成带宽暴涨，判断带宽没动 —— 省下的时间先被「核验」抵扣，不进真实产能</text>

  <text x="24" y="344" fill="#64748b" font-size="9" class="mono">来源：Glean Work AI Index 2026（11h 省 / 6.4h botsitting / 13% 组织增益）；Foxit（省 4.6h vs 校验 4h20m 净 16 分钟）</text>
  <text x="24" y="360" fill="#64748b" font-size="9" class="mono">注意：Glean 含「超 1/3 会话直接失败需重做」，净增益已被重做进一步侵蚀。</text>
</svg>
