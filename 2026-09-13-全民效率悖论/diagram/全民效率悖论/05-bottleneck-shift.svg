<svg viewBox="0 0 680 450" width="680" height="450" xmlns="http://www.w3.org/2000/svg">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&amp;family=Noto+Sans+SC:wght@400;500;700&amp;display=swap');
    text { font-family: 'Noto Sans SC', 'JetBrains Mono', sans-serif; }
    .mono { font-family: 'JetBrains Mono', monospace; }
  </style>
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#1e293b" stroke-width="1"/>
    </pattern>
    <marker id="a-cyan" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#22d3ee"/>
    </marker>
  </defs>
  <rect width="680" height="450" fill="#0f172a"/>
  <rect width="680" height="450" fill="url(#grid)"/>

  <text x="24" y="34" fill="#e2e8f0" font-size="15" font-weight="700">图5 · 稀缺资源转移：从「生成」到「判断」</text>
  <text x="24" y="52" fill="#64748b" font-size="9.5" class="mono">Berkeley Haas 民族志 · Workday 2026 · Upwork · 机制④（与第14篇同根，扩到全民）</text>
  <line x1="24" y1="64" x2="656" y2="64" stroke="#1e293b" stroke-width="1"/>

  <rect x="40" y="100" width="200" height="92" rx="8" fill="#1e293b" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="56" y="132" fill="#22d3ee" font-size="13" font-weight="700">内容生成</text>
  <text x="56" y="158" fill="#94a3b8" font-size="11">旧瓶颈 · 已被压到</text>
  <text x="56" y="176" fill="#94a3b8" font-size="11">近零成本</text>

  <line x1="244" y1="146" x2="300" y2="146" stroke="#22d3ee" stroke-width="2" marker-end="url(#a-cyan)"/>
  <text x="252" y="138" fill="#22d3ee" font-size="9.5" class="mono">稀缺资源转移</text>

  <rect x="312" y="100" width="200" height="92" rx="8" fill="#0b3b46" stroke="#fb7185" stroke-width="1.5"/>
  <text x="328" y="132" fill="#fb7185" font-size="13" font-weight="700">判断 / 验证</text>
  <text x="328" y="158" fill="#a5f3fc" font-size="11">新瓶颈 · 且未被</text>
  <text x="328" y="176" fill="#a5f3fc" font-size="11">工具化、未进 KPI</text>

  <rect x="24" y="224" width="200" height="68" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="40" y="250" fill="#e2e8f0" font-size="11" font-weight="700">Berkeley 民族志</text>
  <text x="40" y="272" fill="#94a3b8" font-size="10.5">intensification</text>
  <text x="40" y="288" fill="#94a3b8" font-size="10.5">工作量无形攀升</text>

  <rect x="240" y="224" width="200" height="68" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="256" y="250" fill="#e2e8f0" font-size="11" font-weight="700">Workday（3200 人）</text>
  <text x="256" y="272" fill="#94a3b8" font-size="10.5">近 40% 时间</text>
  <text x="256" y="288" fill="#94a3b8" font-size="10.5">花在核验 AI 输出</text>

  <rect x="456" y="224" width="200" height="68" rx="8" fill="#1e293b" stroke="#fb7185" stroke-width="1"/>
  <text x="472" y="250" fill="#fb7185" font-size="11" font-weight="700">Upwork</text>
  <text x="472" y="272" fill="#94a3b8" font-size="10.5">81% 抬高产出预期</text>
  <text x="472" y="288" fill="#94a3b8" font-size="10.5">71% 员工 burnout</text>

  <rect x="24" y="312" width="632" height="44" rx="8" fill="#0b3b46" stroke="#22d3ee" stroke-width="1"/>
  <text x="40" y="339" fill="#a5f3fc" font-size="12" font-weight="700">瓶颈已换人，KPI 没换：还在数产出量、看生成速度，于是「工作被强化」而非「被替代」</text>

  <text x="24" y="392" fill="#64748b" font-size="9" class="mono">来源：UC Berkeley Haas 8 个月民族志（~200 人）；Workday 2026（n=3200）；Upwork（81% 抬高预期 / 71% burnout）</text>
</svg>
