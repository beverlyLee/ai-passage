<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 450">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;family=Noto+Sans+SC:wght@400;500;700&amp;display=swap');
    text { font-family: 'JetBrains Mono','Noto Sans SC','PingFang SC',sans-serif; }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/></marker>
    <marker id="arrow-rose" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#fb7185"/></marker>
    <marker id="arrow-amber" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#fbbf24"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#0f172a"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <text x="20" y="30" fill="#e2e8f0" font-size="16" font-weight="700">图4 · 激活里的“离群值”，是量化的天敌</text>
  <text x="20" y="46" fill="#64748b" font-size="9">原理钩子 — 为什么激活比权重更难压</text>

  <!-- histogram of activation values -->
  <text x="40" y="78" fill="#e2e8f0" font-size="12" font-weight="700">某个激活通道的数值分布</text>
  <!-- bell-ish bars -->
  <rect x="50" y="250" width="22" height="40" rx="2" fill="rgba(59,130,246,0.35)" stroke="#60a5fa" stroke-width="1"/>
  <rect x="76" y="230" width="22" height="60" rx="2" fill="rgba(59,130,246,0.35)" stroke="#60a5fa" stroke-width="1"/>
  <rect x="102" y="200" width="22" height="90" rx="2" fill="rgba(59,130,246,0.35)" stroke="#60a5fa" stroke-width="1"/>
  <rect x="128" y="170" width="22" height="120" rx="2" fill="rgba(59,130,246,0.35)" stroke="#60a5fa" stroke-width="1"/>
  <rect x="154" y="160" width="22" height="130" rx="2" fill="rgba(59,130,246,0.35)" stroke="#60a5fa" stroke-width="1"/>
  <rect x="180" y="175" width="22" height="115" rx="2" fill="rgba(59,130,246,0.35)" stroke="#60a5fa" stroke-width="1"/>
  <rect x="206" y="205" width="22" height="85" rx="2" fill="rgba(59,130,246,0.35)" stroke="#60a5fa" stroke-width="1"/>
  <rect x="232" y="235" width="22" height="55" rx="2" fill="rgba(59,130,246,0.35)" stroke="#60a5fa" stroke-width="1"/>
  <rect x="258" y="258" width="22" height="32" rx="2" fill="rgba(59,130,246,0.35)" stroke="#60a5fa" stroke-width="1"/>
  <!-- outlier spike in red -->
  <rect x="300" y="78" width="22" height="212" rx="2" fill="rgba(251,113,133,0.40)" stroke="#fb7185" stroke-width="1.4"/>
  <text x="311" y="70" fill="#fb7185" font-size="11" font-weight="700" text-anchor="middle">离群值</text>

  <text x="40" y="312" fill="#94a3b8" font-size="9">大部分值都挤在小范围 → 量化友好</text>
  <text x="300" y="312" fill="#fb7185" font-size="9" text-anchor="middle">单点极端大 → 拉爆 scale</text>

  <!-- right: model size -> more outliers -->
  <rect x="360" y="80" width="300" height="232" rx="6" fill="rgba(30,41,59,0.4)" stroke="#475569" stroke-width="1"/>
  <text x="376" y="102" fill="#e2e8f0" font-size="10" font-weight="700">模型越大，离群值越多（Kurtosis ↑）</text>
  <text x="376" y="126" fill="#94a3b8" font-size="9">小模型：分布乖、好压</text>
  <rect x="376" y="134" width="120" height="14" rx="3" fill="rgba(52,211,153,0.35)" stroke="#34d399" stroke-width="1"/>
  <text x="504" y="146" fill="#34d399" font-size="9">离群值少</text>

  <text x="376" y="180" fill="#94a3b8" font-size="9">大模型：尾巴越来越厚</text>
  <rect x="376" y="188" width="250" height="14" rx="3" fill="rgba(251,191,36,0.35)" stroke="#fbbf24" stroke-width="1"/>
  <text x="376" y="222" fill="#94a3b8" font-size="9">→ 对激活量化（W8A8）更敏感</text>
  <rect x="376" y="240" width="290" height="14" rx="3" fill="rgba(251,113,133,0.35)" stroke="#fb7185" stroke-width="1"/>
  <text x="376" y="276" fill="#fb7185" font-size="9" font-weight="700">→ 多步推理 / 自检能力最先掉</text>
  <text x="376" y="298" fill="#94a3b8" font-size="9">（arXiv:2402.18158：量化最伤“慢思考”）</text>

  <rect x="20" y="330" width="640" height="96" rx="6" fill="rgba(30,41,59,0.4)" stroke="#475569" stroke-width="1"/>
  <text x="36" y="352" fill="#e2e8f0" font-size="11" font-weight="600">为什么 AWQ 比 GPTQ 更稳？</text>
  <text x="36" y="372" fill="#94a3b8" font-size="9">AWQ 主张“只保护少量重要权重、其余照压”，本质是绕开离群值对整体 scale 的破坏；而粗暴均匀量化会被那根红柱子带崩。</text>
  <text x="36" y="390" fill="#94a3b8" font-size="9">这也是“同精度下大模型反而更脆”的根源：容量越大，激活尾巴越厚，量化容错越低。</text>
  <text x="36" y="408" fill="#cbd5e1" font-size="9">启示：压大模型别只压权重，激活（W8A8 / SmoothQuant）和 KV 都要一并照顾。</text>
  <text x="36" y="424" fill="#94a3b8" font-size="9">SmoothQuant 把离群值“平移”到权重上再量化，正是为这个毛病开的药。</text>
</svg>
