<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 450">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;family=Noto+Sans+SC:wght@400;500;700&amp;display=swap');
    text { font-family: 'JetBrains Mono','Noto Sans SC','PingFang SC',sans-serif; }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/></marker>
    <marker id="arrow-rose" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#fb7185"/></marker>
    <marker id="arrow-amber" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#fbbf24"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#0f172a"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <text x="20" y="30" fill="#e2e8f0" font-size="16" font-weight="700">图1 · 把 7B 的精度往下压，体积怎么缩</text>
  <text x="20" y="46" fill="#64748b" font-size="9">现象钩子 — 精度（bit/权重）每降一档，文件就小一截</text>

  <!-- bars: baseline FP16 height 320 at x=40; each GB ~ 22px -->
  <!-- FP16 14GB -->
  <rect x="50" y="120" width="66" height="280" rx="3" fill="rgba(59,130,246,0.35)" stroke="#60a5fa" stroke-width="1.2"/>
  <text x="83" y="112" fill="#60a5fa" font-size="11" font-weight="700" text-anchor="middle">14 GB</text>
  <text x="83" y="414" fill="#94a3b8" font-size="9" text-anchor="middle">FP16</text>

  <!-- Q8_0 7.2GB -->
  <rect x="138" y="262" width="66" height="138" rx="3" fill="rgba(59,130,246,0.35)" stroke="#60a5fa" stroke-width="1.2"/>
  <text x="171" y="254" fill="#60a5fa" font-size="11" font-weight="700" text-anchor="middle">7.2 GB</text>
  <text x="171" y="414" fill="#94a3b8" font-size="9" text-anchor="middle">Q8_0</text>

  <!-- Q5_K_M 4.8GB -->
  <rect x="226" y="313" width="66" height="87" rx="3" fill="rgba(52,211,153,0.30)" stroke="#34d399" stroke-width="1.2"/>
  <text x="259" y="305" fill="#34d399" font-size="11" font-weight="700" text-anchor="middle">4.8 GB</text>
  <text x="259" y="414" fill="#94a3b8" font-size="9" text-anchor="middle">Q5_K_M</text>

  <!-- Q4_K_M 4.1GB (sweet spot) -->
  <rect x="314" y="329" width="66" height="71" rx="3" fill="rgba(52,211,153,0.30)" stroke="#34d399" stroke-width="1.4"/>
  <text x="347" y="321" fill="#34d399" font-size="11" font-weight="700" text-anchor="middle">4.1 GB</text>
  <text x="347" y="414" fill="#fbbf24" font-size="9" font-weight="700" text-anchor="middle">Q4_K_M ★</text>

  <!-- Q3_K_M 3.3GB -->
  <rect x="402" y="347" width="66" height="53" rx="3" fill="rgba(251,191,36,0.30)" stroke="#fbbf24" stroke-width="1.2"/>
  <text x="435" y="339" fill="#fbbf24" font-size="11" font-weight="700" text-anchor="middle">3.3 GB</text>
  <text x="435" y="414" fill="#94a3b8" font-size="9" text-anchor="middle">Q3_K_M</text>

  <!-- Q2_K 2.7GB -->
  <rect x="490" y="360" width="66" height="40" rx="3" fill="rgba(251,113,133,0.30)" stroke="#fb7185" stroke-width="1.2"/>
  <text x="523" y="352" fill="#fb7185" font-size="11" font-weight="700" text-anchor="middle">2.7 GB</text>
  <text x="523" y="414" fill="#94a3b8" font-size="9" text-anchor="middle">Q2_K</text>

  <!-- IQ1_S 1.9GB -->
  <rect x="578" y="378" width="66" height="22" rx="3" fill="rgba(251,113,133,0.30)" stroke="#fb7185" stroke-width="1.2"/>
  <text x="611" y="370" fill="#fb7185" font-size="11" font-weight="700" text-anchor="middle">1.9 GB</text>
  <text x="611" y="414" fill="#94a3b8" font-size="9" text-anchor="middle">IQ1_S</text>

  <text x="360" y="70" fill="#64748b" font-size="9" text-anchor="middle">↓ 同一份权重，精度每降一档，体积近乎等比缩小</text>

  <rect x="20" y="424" width="640" height="18" rx="6" fill="rgba(30,41,59,0.4)" stroke="#475569" stroke-width="1"/>
  <text x="36" y="437" fill="#e2e8f0" font-size="9" font-weight="600">7B 数值：FP16≈14GB；Q8_0≈7.2GB；Q4_K_M≈4.1GB（质量/体积甜点）；IQ1_S≈1.9GB（仅适合测试）。</text>
</svg>
