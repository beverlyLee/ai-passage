<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 450" font-family="'Noto Sans SC','PingFang SC','JetBrains Mono',sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#22d3ee"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="680" height="450" fill="#0f172a"/>
  <text x="24" y="38" fill="#e2e8f0" font-size="22">一次查询的完整数据流</text>
  <text x="24" y="62" fill="#94a3b8" font-size="13">命中任一分叉即返回；全未命中才调 LLM 并写回</text>

  <!-- 查询进入 -->
  <rect x="240" y="64" width="200" height="32" rx="8" fill="#22d3ee"/>
  <text x="340" y="85" fill="#0f172a" font-size="15" text-anchor="middle">查询进入</text>
  <line x1="340" y1="96" x2="340" y2="104" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>

  <!-- 归一化 -->
  <rect x="140" y="104" width="400" height="40" rx="8" fill="#94a3b8"/>
  <text x="340" y="129" fill="#0f172a" font-size="14" text-anchor="middle">归一化：小写 / 去标点 / 去 PII</text>
  <line x1="340" y1="144" x2="340" y2="152" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>

  <!-- L1 -->
  <rect x="140" y="152" width="400" height="40" rx="8" fill="#34d399"/>
  <text x="340" y="177" fill="#0f172a" font-size="14" text-anchor="middle">L1 精确匹配：SHA256 归一化串完全相同？</text>
  <rect x="560" y="158" width="110" height="30" rx="8" fill="#1e293b" stroke="#34d399"/>
  <text x="615" y="178" fill="#34d399" font-size="12" text-anchor="middle">精确命中→</text>
  <line x1="540" y1="173" x2="560" y2="173" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="340" y1="192" x2="340" y2="200" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>

  <!-- 向量化+ANN -->
  <rect x="140" y="200" width="400" height="40" rx="8" fill="#a78bfa"/>
  <text x="340" y="225" fill="#0f172a" font-size="14" text-anchor="middle">向量化 embedding + ANN 检索（限定租户/版本分区）</text>
  <line x1="340" y1="240" x2="340" y2="248" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>

  <!-- 比较 τ -->
  <rect x="140" y="248" width="400" height="40" rx="8" fill="#fbbf24"/>
  <text x="340" y="273" fill="#0f172a" font-size="14" text-anchor="middle">取 top-1 相似度，与阈值 τ 比较</text>
  <rect x="560" y="254" width="110" height="30" rx="8" fill="#1e293b" stroke="#34d399"/>
  <text x="615" y="274" fill="#34d399" font-size="12" text-anchor="middle">语义命中→</text>
  <line x1="540" y1="269" x2="560" y2="269" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="340" y1="288" x2="340" y2="296" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>

  <!-- 调 LLM + 写回 -->
  <rect x="140" y="296" width="400" height="40" rx="8" fill="#fb7185"/>
  <text x="340" y="321" fill="#0f172a" font-size="14" text-anchor="middle">未命中：调用 LLM 生成 → 写回 L1+L2</text>
  <line x1="340" y1="336" x2="340" y2="344" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>

  <!-- 返回响应 -->
  <rect x="140" y="344" width="520" height="44" rx="10" fill="#0f172a" stroke="#22d3ee"/>
  <text x="400" y="372" fill="#e2e8f0" font-size="14" text-anchor="middle">返回响应</text>

  <!-- 右侧命中回流线 -->
  <line x1="670" y1="173" x2="670" y2="366" stroke="#475569" stroke-width="2"/>
  <line x1="660" y1="173" x2="670" y2="173" stroke="#475569" stroke-width="2"/>
  <line x1="660" y1="269" x2="670" y2="269" stroke="#475569" stroke-width="2"/>

  <!-- 写回回路 -->
  <path d="M540,316 L600,316 L600,224 L540,224" fill="none" stroke="#fb7185" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arr)"/>
  <text x="606" y="272" fill="#fb7185" font-size="11">写回</text>

  <!-- judge 注释 -->
  <rect x="24" y="300" width="210" height="40" rx="8" fill="#0f172a" stroke="#fb7185" stroke-dasharray="5,4"/>
  <text x="34" y="318" fill="#fb7185" font-size="12">可选 LLM judge：</text>
  <text x="34" y="334" fill="#94a3b8" font-size="11">边界命中再复核，防假阳性</text>
  <line x1="234" y1="320" x2="260" y2="268" stroke="#fb7185" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr)"/>
</svg>
