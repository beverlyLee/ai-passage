<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 450" font-family="'Noto Sans SC','PingFang SC','JetBrains Mono',sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="680" height="450" fill="#0f172a"/>
  <text x="24" y="38" fill="#e2e8f0" font-size="22">语义缓存：三层读取架构</text>
  <text x="24" y="62" fill="#94a3b8" font-size="13">越往下越慢越贵；命中任一层即跳过下层</text>

  <!-- 查询进入 -->
  <rect x="250" y="80" width="180" height="34" rx="8" fill="#22d3ee"/>
  <text x="340" y="102" fill="#0f172a" font-size="16" text-anchor="middle">用户查询</text>
  <line x1="340" y1="114" x2="340" y2="138" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>

  <!-- L1 -->
  <rect x="70" y="138" width="400" height="58" rx="10" fill="#34d399"/>
  <text x="86" y="164" fill="#0f172a" font-size="15">L1 精确缓存 · SHA256 归一化串匹配</text>
  <text x="86" y="186" fill="#0f172a" font-size="13">完全相同的问题 · ~0.1ms · 零成本</text>
  <rect x="500" y="148" width="160" height="38" rx="8" fill="#1e293b" stroke="#34d399"/>
  <text x="580" y="172" fill="#34d399" font-size="14" text-anchor="middle">命中 → 返回</text>
  <line x1="470" y1="167" x2="500" y2="167" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>

  <line x1="270" y1="196" x2="270" y2="214" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <text x="150" y="210" fill="#94a3b8" font-size="12">未命中 ▼</text>

  <!-- L2 -->
  <rect x="70" y="214" width="400" height="58" rx="10" fill="#a78bfa"/>
  <text x="86" y="240" fill="#0f172a" font-size="15">L2 语义缓存 · embedding + 余弦相似度 ≥ τ</text>
  <text x="86" y="262" fill="#0f172a" font-size="13">意思相同的问题 · 5-15ms · 跳过 LLM</text>
  <rect x="500" y="224" width="160" height="38" rx="8" fill="#1e293b" stroke="#a78bfa"/>
  <text x="580" y="248" fill="#a78bfa" font-size="14" text-anchor="middle">命中 → 返回</text>
  <line x1="470" y1="243" x2="500" y2="243" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>

  <line x1="270" y1="272" x2="270" y2="290" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <text x="150" y="286" fill="#94a3b8" font-size="12">未命中 ▼</text>

  <!-- L3 -->
  <rect x="70" y="290" width="400" height="58" rx="10" fill="#fbbf24"/>
  <text x="86" y="316" fill="#0f172a" font-size="15">L3 直接调用大模型</text>
  <text x="86" y="338" fill="#0f172a" font-size="13">兜底 · 500ms+ · 真实成本</text>
  <rect x="500" y="300" width="160" height="38" rx="8" fill="#1e293b" stroke="#fbbf24"/>
  <text x="580" y="324" fill="#fbbf24" font-size="14" text-anchor="middle">调用 → 返回</text>
  <line x1="470" y1="319" x2="500" y2="319" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>

  <!-- 右侧命中回流线 -->
  <line x1="660" y1="167" x2="660" y2="372" stroke="#475569" stroke-width="2"/>

  <!-- 返回响应 -->
  <rect x="70" y="370" width="590" height="46" rx="10" fill="#0f172a" stroke="#22d3ee"/>
  <text x="365" y="399" fill="#e2e8f0" font-size="14" text-anchor="middle">返回响应：命中 L1/L2 即省下 L3 的延迟与费用；三层都未命中才花真钱</text>
</svg>
