<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 450" width="680" height="450">
  <rect width="680" height="450" fill="#0f172a"/>
  <text x="340" y="34" fill="#22d3ee" font-family="'JetBrains Mono','Noto Sans SC',sans-serif" font-size="20" text-anchor="middle" font-weight="bold">MessagesState 长什么样</text>
  <text x="340" y="58" fill="#94a3b8" font-family="'Noto Sans SC',sans-serif" font-size="13" text-anchor="middle">prebuilt 包里预置好的消息状态，开箱即用</text>

  <!-- 左：MessagesState 类 -->
  <rect x="40" y="88" width="300" height="262" rx="10" fill="#0f172a" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="190" y="118" fill="#a78bfa" font-family="'JetBrains Mono',monospace" font-size="16" text-anchor="middle" font-weight="bold">MessagesState&lt;T&gt;</text>
  <text x="190" y="140" fill="#94a3b8" font-family="'JetBrains Mono',monospace" font-size="12" text-anchor="middle">extends AgentState</text>
  <line x1="60" y1="154" x2="320" y2="154" stroke="#334155" stroke-width="1"/>
  <text x="60" y="182" fill="#e2e8f0" font-family="'JetBrains Mono',monospace" font-size="12">SCHEMA.messages →</text>
  <text x="60" y="204" fill="#34d399" font-family="'JetBrains Mono',monospace" font-size="12">AppenderChannel</text>
  <text x="80" y="224" fill="#94a3b8" font-family="'Noto Sans SC',sans-serif" font-size="11">（去重追加）</text>
  <text x="60" y="256" fill="#e2e8f0" font-family="'JetBrains Mono',monospace" font-size="12">messages() → List&lt;T&gt;  全量</text>
  <text x="60" y="286" fill="#e2e8f0" font-family="'JetBrains Mono',monospace" font-size="12">lastMessage() → Optional&lt;T&gt;</text>
  <text x="60" y="316" fill="#e2e8f0" font-family="'JetBrains Mono',monospace" font-size="12">lastMinus(int) → Optional&lt;T&gt;</text>

  <!-- 右：MessagesStateGraph 类 -->
  <rect x="360" y="88" width="280" height="262" rx="10" fill="#0f172a" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="500" y="118" fill="#22d3ee" font-family="'JetBrains Mono',monospace" font-size="15" text-anchor="middle" font-weight="bold">MessagesStateGraph&lt;T&gt;</text>
  <text x="500" y="140" fill="#94a3b8" font-family="'JetBrains Mono',monospace" font-size="12" text-anchor="middle">extends StateGraph&lt;</text>
  <text x="500" y="158" fill="#94a3b8" font-family="'JetBrains Mono',monospace" font-size="12" text-anchor="middle">  MessagesState&lt;T&gt;&gt;</text>
  <line x1="380" y1="172" x2="620" y2="172" stroke="#334155" stroke-width="1"/>
  <text x="380" y="200" fill="#e2e8f0" font-family="'Noto Sans SC',sans-serif" font-size="12">无参构造器：</text>
  <text x="380" y="222" fill="#e2e8f0" font-family="'JetBrains Mono',monospace" font-size="12">内部用 SCHEMA +</text>
  <text x="380" y="242" fill="#e2e8f0" font-family="'JetBrains Mono',monospace" font-size="12">AgentStateFactory</text>
  <text x="380" y="274" fill="#e2e8f0" font-family="'Noto Sans SC',sans-serif" font-size="12">直接用，不必自己</text>
  <text x="380" y="294" fill="#e2e8f0" font-family="'Noto Sans SC',sans-serif" font-size="12">再定义 messages 通道</text>

  <!-- 箭头：MessagesState -> MessagesStateGraph 表示 SCHEMA 复用 -->
  <line x1="340" y1="220" x2="360" y2="220" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <text x="350" y="212" fill="#94a3b8" font-size="10" font-family="'Noto Sans SC',sans-serif" text-anchor="middle">SCHEMA 复用</text>

  <text x="340" y="400" fill="#94a3b8" font-family="'Noto Sans SC',sans-serif" font-size="13" text-anchor="middle">泛型 T 是消息元素的类型，Demo6 取 String</text>
  <text x="340" y="424" fill="#94a3b8" font-family="'Noto Sans SC',sans-serif" font-size="13" text-anchor="middle">运行时类型擦除，不影响 appender 通道的归约行为</text>

  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>
</svg>
