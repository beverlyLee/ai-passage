<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 450" font-family="'PingFang SC','Noto Sans SC',sans-serif">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="680" height="450" fill="#0f172a"/>
  <rect width="680" height="450" fill="url(#grid)"/>

  <text x="340" y="30" fill="#e2e8f0" font-size="18" text-anchor="middle" font-weight="600">RunnableWithMessageHistory：自动读写历史</text>
  <text x="340" y="49" fill="#64748b" font-size="11" text-anchor="middle">langchain-core 1.3.2</text>

  <!-- get_session_history -->
  <rect x="24" y="88" width="180" height="80" rx="10" fill="#0f172a" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="44" y="112" fill="#e2e8f0" font-size="12" font-weight="600">get_session_history</text>
  <text x="44" y="129" fill="#22d3ee" font-size="9.5">:35  Callabl</text>
  <text x="44" y="146" fill="#94a3b8" font-size="9">session_id -> STORE[id]</text>

  <!-- wrapper -->
  <rect x="240" y="88" width="416" height="80" rx="10" fill="#0f172a" stroke="#34d399" stroke-width="1.5"/>
  <text x="260" y="112" fill="#e2e8f0" font-size="13" font-weight="600">RunnableWithMessageHistory</text>
  <text x="260" y="129" fill="#34d399" font-size="9.5">runnables/history.py:38  包裹一个 Runnable</text>
  <text x="260" y="148" fill="#e2e8f0" font-size="10">input_messages_key = "input" :231</text>
  <text x="470" y="148" fill="#cbd5e1" font-size="10">history :239 / output :235</text>

  <!-- wrapped runnable -->
  <rect x="240" y="216" width="416" height="74" rx="10" fill="#0f172a" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="260" y="240" fill="#e2e8f0" font-size="12" font-weight="600">被包的 Runnable（例：fake_chat）</text>
  <text x="260" y="258" fill="#a78bfa" font-size="9.5">收到 {input, history}，返回 {output}</text>
  <text x="260" y="277" fill="#94a3b8" font-size="9">history 是本轮之前累积的历史消息列表</text>

  <!-- store -->
  <rect x="24" y="216" width="180" height="74" rx="10" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="44" y="240" fill="#e2e8f0" font-size="12" font-weight="600">STORE[session_id]</text>
  <text x="44" y="257" fill="#fbbf24" font-size="9.5">内存历史存储</text>
  <text x="44" y="277" fill="#94a3b8" font-size="9">Human + AI 交替累积</text>

  <!-- arrows: A->B, B->C, C->D, D->B(read) -->
  <line x1="204" y1="128" x2="238" y2="128" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="221" y="121" fill="#94a3b8" font-size="9" text-anchor="middle">提供 store</text>
  <line x1="448" y1="168" x2="448" y2="214" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="456" y="194" fill="#94a3b8" font-size="9">invoke 传 {input,history}</text>
  <line x1="240" y1="253" x2="206" y2="253" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="223" y="246" fill="#94a3b8" font-size="9" text-anchor="middle">写回</text>
  <path d="M 114 216 L 114 196 L 280 196 L 280 168" fill="none" stroke="#fb7185" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="150" y="188" fill="#fb7185" font-size="9">读取 _enter_history :512</text>

  <!-- footer -->
  <text x="24" y="372" fill="#94a3b8" font-size="10">关键事实：</text>
  <text x="24" y="392" fill="#cbd5e1" font-size="10">1) 调用前 _enter_history 读历史、调用后 _exit_history 写 Human+AI 回 store（history.py:512 / 538）。</text>
  <text x="24" y="412" fill="#cbd5e1" font-size="10">2) 三个 key 把字典拆成「用户输入 / 历史 / 输出」三份（history.py:231 / 239 / 235）。</text>
  <text x="24" y="432" fill="#cbd5e1" font-size="10">3) 历史在外部 store，按 session_id 取，多轮天然按会话隔离。</text>
</svg>
