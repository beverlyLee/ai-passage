<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 450">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <marker id="arr-rose" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#fb7185"/>
    </marker>
    <style>
      text { font-family: 'JetBrains Mono','Noto Sans SC','PingFang SC',sans-serif; }
    </style>
  </defs>

  <rect width="100%" height="100%" fill="#0f172a"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <!-- title -->
  <text x="20" y="32" fill="#ffffff" font-size="14" font-weight="700">计量埋点数据流向：请求 → 网关打点 → 时序库 → 看板/告警</text>

  <!-- ===== pipeline boxes (row y=90, h=58, cy=119) ===== -->
  <!-- Client -->
  <rect x="30" y="90" width="120" height="58" rx="8" fill="#0f172a"/>
  <rect x="30" y="90" width="120" height="58" rx="8" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="90" y="116" fill="#ffffff" font-size="12" font-weight="600" text-anchor="middle">客户端请求</text>
  <text x="90" y="134" fill="#94a3b8" font-size="9" text-anchor="middle">tenant-A / chat</text>

  <!-- Gateway (instrumentation) -->
  <rect x="200" y="90" width="160" height="58" rx="8" fill="#0f172a"/>
  <rect x="200" y="90" width="160" height="58" rx="8" fill="rgba(251,146,60,0.18)" stroke="#fb923c" stroke-width="1.5"/>
  <text x="280" y="116" fill="#ffffff" font-size="12" font-weight="600" text-anchor="middle">网关中间件</text>
  <text x="280" y="134" fill="#94a3b8" font-size="9" text-anchor="middle">每次请求都打点</text>

  <!-- TSDB -->
  <rect x="400" y="90" width="140" height="58" rx="8" fill="#0f172a"/>
  <rect x="400" y="90" width="140" height="58" rx="8" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="470" y="116" fill="#ffffff" font-size="12" font-weight="600" text-anchor="middle">时序库</text>
  <text x="470" y="134" fill="#94a3b8" font-size="9" text-anchor="middle">Prometheus / OTel</text>

  <!-- Dashboard -->
  <rect x="560" y="90" width="110" height="58" rx="8" fill="#0f172a"/>
  <rect x="560" y="90" width="110" height="58" rx="8" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="615" y="116" fill="#ffffff" font-size="12" font-weight="600" text-anchor="middle">看板</text>
  <text x="615" y="134" fill="#94a3b8" font-size="9" text-anchor="middle">Grafana</text>

  <!-- arrows -->
  <line x1="150" y1="119" x2="198" y2="119" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="360" y1="119" x2="398" y2="119" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="540" y1="119" x2="558" y2="119" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ===== dimension chips below gateway ===== -->
  <text x="280" y="172" fill="#fbbf24" font-size="10" font-weight="600" text-anchor="middle">每个指标都带 4 维标签 ↓</text>
  <g>
    <rect x="112" y="182" width="78" height="34" rx="6" fill="#0f172a"/>
    <rect x="112" y="182" width="78" height="34" rx="6" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.2"/>
    <text x="151" y="203" fill="#ffffff" font-size="11" font-weight="600" text-anchor="middle">租户</text>
  </g>
  <g>
    <rect x="198" y="182" width="78" height="34" rx="6" fill="#0f172a"/>
    <rect x="198" y="182" width="78" height="34" rx="6" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.2"/>
    <text x="237" y="203" fill="#ffffff" font-size="11" font-weight="600" text-anchor="middle">模型</text>
  </g>
  <g>
    <rect x="284" y="182" width="78" height="34" rx="6" fill="#0f172a"/>
    <rect x="284" y="182" width="78" height="34" rx="6" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.2"/>
    <text x="323" y="203" fill="#ffffff" font-size="11" font-weight="600" text-anchor="middle">路由·端点</text>
  </g>
  <g>
    <rect x="370" y="182" width="92" height="34" rx="6" fill="#0f172a"/>
    <rect x="370" y="182" width="92" height="34" rx="6" fill="rgba(136,19,55,0.4)" stroke="#fb7185" stroke-width="1.2"/>
    <text x="416" y="203" fill="#ffffff" font-size="10" font-weight="600" text-anchor="middle">状态 200·429·5xx</text>
  </g>

  <!-- alert branch from TSDB -->
  <line x1="470" y1="148" x2="470" y2="190" stroke="#fb7185" stroke-width="1.5" marker-end="url(#arr-rose)"/>
  <rect x="400" y="192" width="140" height="42" rx="8" fill="#0f172a"/>
  <rect x="400" y="192" width="140" height="42" rx="8" fill="rgba(136,19,55,0.4)" stroke="#fb7185" stroke-width="1.5"/>
  <text x="470" y="211" fill="#ffffff" font-size="11" font-weight="600" text-anchor="middle">告警</text>
  <text x="470" y="227" fill="#94a3b8" font-size="9" text-anchor="middle">p99&gt;阈值 / 429%突增</text>

  <!-- ===== method note under dashboard ===== -->
  <rect x="560" y="182" width="110" height="52" rx="8" fill="#0f172a"/>
  <rect x="560" y="182" width="110" height="52" rx="8" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.2"/>
  <text x="615" y="202" fill="#ffffff" font-size="10" font-weight="600" text-anchor="middle">记录方式</text>
  <text x="615" y="218" fill="#94a3b8" font-size="9" text-anchor="middle">RED + 直方图</text>
  <text x="615" y="230" fill="#94a3b8" font-size="9" text-anchor="middle">分位数</text>

  <!-- bottom caption -->
  <text x="20" y="430" fill="#94a3b8" font-size="10">正确埋点 = 每次请求带 4 维标签，按 RED（速率 / 错误 / 时延）记录，时延用直方图存「分布」而非一个数。</text>
</svg>
