<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 450" width="680" height="450">
  <rect width="680" height="450" fill="#0f172a"/>
  <text x="340" y="34" fill="#22d3ee" font-family="'JetBrains Mono','Noto Sans SC',sans-serif" font-size="20" text-anchor="middle" font-weight="bold">条件边：下一步由运行时状态决定</text>
  <text x="340" y="58" fill="#94a3b8" font-family="'Noto Sans SC',sans-serif" font-size="13" text-anchor="middle">addConditionalEdges 的三个角色：源节点、判定动作、映射表</text>

  <!-- 源节点 classify -->
  <rect x="40" y="110" width="180" height="58" rx="8" fill="#1e293b" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="130" y="134" fill="#22d3ee" font-family="'Noto Sans SC',sans-serif" font-size="14" text-anchor="middle">classify 节点</text>
  <text x="130" y="156" fill="#e2e8f0" font-family="'JetBrains Mono',monospace" font-size="12" text-anchor="middle">写 category 到 state</text>

  <!-- 判定动作 -->
  <rect x="270" y="100" width="220" height="78" rx="8" fill="#0f172a" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="380" y="124" fill="#a78bfa" font-family="'Noto Sans SC',sans-serif" font-size="13" text-anchor="middle">AsyncEdgeAction.apply</text>
  <text x="380" y="146" fill="#e2e8f0" font-family="'JetBrains Mono',monospace" font-size="11" text-anchor="middle">读 state.category</text>
  <text x="380" y="166" fill="#c4b5fd" font-family="'JetBrains Mono',monospace" font-size="11" text-anchor="middle">返回 "spam" 这样的键</text>

  <!-- 映射表 -->
  <rect x="270" y="220" width="220" height="96" rx="8" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="380" y="244" fill="#fbbf24" font-family="'Noto Sans SC',sans-serif" font-size="13" text-anchor="middle">mapping 表（键到节点）</text>
  <text x="380" y="266" fill="#e2e8f0" font-family="'JetBrains Mono',monospace" font-size="11" text-anchor="middle">spam → handleSpam</text>
  <text x="380" y="286" fill="#e2e8f0" font-family="'JetBrains Mono',monospace" font-size="11" text-anchor="middle">question → handleQuestion</text>
  <text x="380" y="306" fill="#e2e8f0" font-family="'JetBrains Mono',monospace" font-size="11" text-anchor="middle">other → handleOther</text>

  <!-- 目标节点 -->
  <rect x="540" y="208" width="120" height="40" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
  <text x="600" y="232" fill="#34d399" font-family="'JetBrains Mono',monospace" font-size="12" text-anchor="middle">handleSpam</text>
  <rect x="540" y="258" width="120" height="40" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
  <text x="600" y="282" fill="#34d399" font-family="'JetBrains Mono',monospace" font-size="12" text-anchor="middle">handleQuestion</text>
  <rect x="540" y="308" width="120" height="40" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
  <text x="600" y="332" fill="#34d399" font-family="'JetBrains Mono',monospace" font-size="12" text-anchor="middle">handleOther</text>

  <!-- 连接线 -->
  <line x1="220" y1="139" x2="268" y2="139" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="380" y1="178" x2="380" y2="218" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="490" y1="268" x2="538" y2="228" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="490" y1="268" x2="538" y2="278" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="490" y1="268" x2="538" y2="328" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>

  <text x="340" y="398" fill="#e2e8f0" font-family="'Noto Sans SC',sans-serif" font-size="14" text-anchor="middle">判定动作读的是当前 state，所以路由依据是运行时数据，不是写死的图结构</text>
  <text x="340" y="424" fill="#94a3b8" font-family="'Noto Sans SC',sans-serif" font-size="13" text-anchor="middle">action 返回的字符串去 mapping 里查，查到的目标节点才是真正的下一步</text>

  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>
</svg>
