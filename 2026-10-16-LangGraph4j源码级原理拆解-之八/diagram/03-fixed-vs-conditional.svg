<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 450" width="680" height="450">
  <rect width="680" height="450" fill="#0f172a"/>
  <text x="340" y="34" fill="#22d3ee" font-family="'JetBrains Mono','Noto Sans SC',sans-serif" font-size="20" text-anchor="middle" font-weight="bold">固定边 与 条件边 的取舍</text>
  <text x="340" y="58" fill="#94a3b8" font-family="'Noto Sans SC',sans-serif" font-size="13" text-anchor="middle">一个源节点只能选一种出边，两者不是叠加关系</text>

  <!-- 左：固定边 -->
  <rect x="30" y="78" width="290" height="34" rx="8" fill="#1e293b" stroke="#fb7185" stroke-width="1.5"/>
  <text x="175" y="100" fill="#fb7185" font-family="'Noto Sans SC',sans-serif" font-size="14" text-anchor="middle">addEdge（固定边）</text>

  <rect x="55" y="128" width="240" height="46" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>
  <text x="175" y="156" fill="#e2e8f0" font-family="'JetBrains Mono',monospace" font-size="12" text-anchor="middle">addEdge("a", "b")</text>

  <line x1="175" y1="174" x2="175" y2="198" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="55" y="198" width="240" height="46" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>
  <text x="175" y="226" fill="#e2e8f0" font-family="'Noto Sans SC',sans-serif" font-size="12" text-anchor="middle">a 跑完永远去 b</text>

  <text x="175" y="288" fill="#fca5a5" font-family="'Noto Sans SC',sans-serif" font-size="12" text-anchor="middle">适合：流程唯一、无分支</text>
  <text x="175" y="310" fill="#fca5a5" font-family="'Noto Sans SC',sans-serif" font-size="12" text-anchor="middle">如 START→节点→END</text>

  <!-- 右：条件边 -->
  <rect x="360" y="78" width="290" height="34" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
  <text x="505" y="100" fill="#34d399" font-family="'Noto Sans SC',sans-serif" font-size="14" text-anchor="middle">addConditionalEdges（条件边）</text>

  <rect x="385" y="128" width="240" height="46" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>
  <text x="505" y="156" fill="#e2e8f0" font-family="'JetBrains Mono',monospace" font-size="11" text-anchor="middle">addConditionalEdges("a", act, map)</text>

  <line x1="505" y1="174" x2="505" y2="198" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="385" y="198" width="240" height="46" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>
  <text x="505" y="226" fill="#e2e8f0" font-family="'Noto Sans SC',sans-serif" font-size="12" text-anchor="middle">a 跑完去哪个，由运行时决定</text>

  <text x="505" y="288" fill="#a7f3d0" font-family="'Noto Sans SC',sans-serif" font-size="12" text-anchor="middle">适合：分类、审批、重试、路由</text>
  <text x="505" y="310" fill="#a7f3d0" font-family="'Noto Sans SC',sans-serif" font-size="12" text-anchor="middle">如按状态选不同处理分支</text>

  <text x="340" y="392" fill="#e2e8f0" font-family="'Noto Sans SC',sans-serif" font-size="14" text-anchor="middle">同一个源节点要么用固定边，要么用条件边，不能同时挂两种出边</text>
  <text x="340" y="420" fill="#94a3b8" font-family="'Noto Sans SC',sans-serif" font-size="13" text-anchor="middle">需要“先固定再条件”时，把固定边接到一个中间节点，再从这个节点发条件边</text>

  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>
</svg>
