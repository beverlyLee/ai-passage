<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 450">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap');
      text { font-family: 'JetBrains Mono','Noto Sans SC','PingFang SC',sans-serif; }
    </style>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <marker id="arrow-cyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#22d3ee"/>
    </marker>
    <marker id="arrow-emerald" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34d399"/>
    </marker>
    <marker id="arrow-violet" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#a78bfa"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#0f172a"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <text x="20" y="28" fill="#ffffff" font-size="16" font-weight="700">评价 Schema 编译成 Laya 三原语</text>
  <text x="20" y="46" fill="#94a3b8" font-size="9">structured.py · plan_from_json_schema 编译漏斗</text>

  <rect x="210" y="62" width="260" height="54" rx="6" fill="#0f172a"/>
  <rect x="210" y="62" width="260" height="54" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="340" y="84" fill="#ffffff" font-size="12" font-weight="600" text-anchor="middle">评价语义分析 JSON Schema</text>
  <text x="340" y="102" fill="#94a3b8" font-size="9" text-anchor="middle">aspect · polarity · appeal</text>

  <rect x="230" y="146" width="220" height="46" rx="6" fill="#0f172a"/>
  <rect x="230" y="146" width="220" height="46" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="340" y="166" fill="#ffffff" font-size="11" font-weight="600" text-anchor="middle">plan_from_json_schema</text>
  <text x="340" y="182" fill="#94a3b8" font-size="9" text-anchor="middle">编译期校验 · 顶层属性 ≤ 32</text>

  <line x1="340" y1="116" x2="340" y2="146" stroke="#64748b" marker-end="url(#arrow)"/>
  <line x1="300" y1="192" x2="120" y2="250" stroke="#64748b" marker-end="url(#arrow-cyan)"/>
  <line x1="340" y1="192" x2="340" y2="250" stroke="#64748b" marker-end="url(#arrow-emerald)"/>
  <line x1="380" y1="192" x2="560" y2="250" stroke="#64748b" marker-end="url(#arrow-violet)"/>

  <rect x="30" y="250" width="180" height="120" rx="8" fill="#0f172a"/>
  <rect x="30" y="250" width="180" height="120" rx="8" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="120" y="276" fill="#ffffff" font-size="12" font-weight="600" text-anchor="middle">aspect</text>
  <text x="120" y="298" fill="#22d3ee" font-size="10" text-anchor="middle">↓ Choice 原语</text>
  <text x="120" y="320" fill="#94a3b8" font-size="9" text-anchor="middle">枚举维度 7 项</text>
  <text x="120" y="338" fill="#94a3b8" font-size="9" text-anchor="middle">project 反向映射</text>
  <text x="120" y="356" fill="#94a3b8" font-size="9" text-anchor="middle">输出空间预先枚举</text>

  <rect x="250" y="250" width="180" height="120" rx="8" fill="#0f172a"/>
  <rect x="250" y="250" width="180" height="120" rx="8" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="340" y="276" fill="#ffffff" font-size="12" font-weight="600" text-anchor="middle">polarity</text>
  <text x="340" y="298" fill="#34d399" font-size="10" text-anchor="middle">↓ Score 原语</text>
  <text x="340" y="320" fill="#94a3b8" font-size="9" text-anchor="middle">整数刻度 0→2</text>
  <text x="340" y="338" fill="#94a3b8" font-size="9" text-anchor="middle">span=3 ≤ 10</text>
  <text x="340" y="356" fill="#94a3b8" font-size="9" text-anchor="middle">legend 负/中/正</text>

  <rect x="470" y="250" width="180" height="120" rx="8" fill="#0f172a"/>
  <rect x="470" y="250" width="180" height="120" rx="8" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="560" y="276" fill="#ffffff" font-size="12" font-weight="600" text-anchor="middle">appeal</text>
  <text x="560" y="298" fill="#a78bfa" font-size="10" text-anchor="middle">↓ Noul 原语</text>
  <text x="560" y="320" fill="#94a3b8" font-size="9" text-anchor="middle">连续值 0.0→1.0</text>
  <text x="560" y="338" fill="#94a3b8" font-size="9" text-anchor="middle">不确定即升级</text>
  <text x="560" y="356" fill="#94a3b8" font-size="9" text-anchor="middle">诉求强度连续量</text>

  <rect x="30" y="392" width="620" height="40" rx="6" fill="rgba(136,19,55,0.3)" stroke="#fb7185" stroke-width="1"/>
  <text x="40" y="409" fill="#fb7185" font-size="9" font-weight="600">编译期拒绝</text>
  <text x="40" y="424" fill="#e2e8f0" font-size="9">自由 string / 数组 / 对象 直接报错；顶层属性 &gt; 32 或 Score 跨度 &gt; 10 拒绝</text>
</svg>
