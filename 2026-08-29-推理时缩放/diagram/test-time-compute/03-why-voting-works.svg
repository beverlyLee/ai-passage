<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 450">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;family=Noto+Sans+SC:wght@400;500;700&amp;display=swap');
    text { font-family: 'JetBrains Mono','Noto Sans SC','PingFang SC',sans-serif; }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/></marker>
    <marker id="arrow-rose" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#fb7185"/></marker>
    <marker id="arrow-amber" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#fbbf24"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#0f172a"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <text x="20" y="30" fill="#e2e8f0" font-size="16" font-weight="700">图3 · 为什么"多想几遍取多数"能答对：正确路径收敛，错误路径发散</text>
  <text x="20" y="46" fill="#64748b" font-size="9">问题3 — 投票只在答案可枚举时成立</text>

  <!-- LEFT cluster -->
  <rect x="40" y="78" width="220" height="24" rx="12" fill="#0f172a"/>
  <rect x="40" y="78" width="220" height="24" rx="12" fill="rgba(52,211,153,0.18)" stroke="#34d399" stroke-width="1.2"/>
  <text x="150" y="94" fill="#34d399" font-size="10" font-weight="600" text-anchor="middle">正确推理：多条不同路径</text>

  <rect x="50" y="116" width="64" height="30" rx="5" fill="#0f172a" stroke="#475569" stroke-width="1"/>
  <text x="82" y="135" fill="#cbd5e1" font-size="10" text-anchor="middle">解法A</text>
  <rect x="130" y="116" width="64" height="30" rx="5" fill="#0f172a" stroke="#475569" stroke-width="1"/>
  <text x="162" y="135" fill="#cbd5e1" font-size="10" text-anchor="middle">解法B</text>
  <rect x="210" y="116" width="64" height="30" rx="5" fill="#0f172a" stroke="#475569" stroke-width="1"/>
  <text x="242" y="135" fill="#cbd5e1" font-size="10" text-anchor="middle">解法C</text>

  <rect x="110" y="178" width="110" height="42" rx="6" fill="#0f172a"/>
  <rect x="110" y="178" width="110" height="42" rx="6" fill="rgba(52,211,153,0.25)" stroke="#34d399" stroke-width="1.6"/>
  <text x="165" y="204" fill="#34d399" font-size="15" font-weight="700" text-anchor="middle">42 ✓</text>

  <line x1="82" y1="146" x2="150" y2="178" stroke="#34d399" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="162" y1="146" x2="165" y2="178" stroke="#34d399" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="242" y1="146" x2="180" y2="178" stroke="#34d399" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- RIGHT cluster -->
  <rect x="420" y="78" width="220" height="24" rx="12" fill="#0f172a"/>
  <rect x="420" y="78" width="220" height="24" rx="12" fill="rgba(136,19,55,0.3)" stroke="#fb7185" stroke-width="1.2"/>
  <text x="530" y="94" fill="#fb7185" font-size="10" font-weight="600" text-anchor="middle">错误推理：各自飘散</text>

  <rect x="430" y="116" width="64" height="30" rx="5" fill="#0f172a" stroke="#475569" stroke-width="1"/>
  <text x="462" y="135" fill="#cbd5e1" font-size="10" text-anchor="middle">错解D</text>
  <rect x="510" y="116" width="64" height="30" rx="5" fill="#0f172a" stroke="#475569" stroke-width="1"/>
  <text x="542" y="135" fill="#cbd5e1" font-size="10" text-anchor="middle">错解E</text>
  <rect x="580" y="116" width="64" height="30" rx="5" fill="#0f172a" stroke="#475569" stroke-width="1"/>
  <text x="612" y="135" fill="#cbd5e1" font-size="10" text-anchor="middle">错解F</text>

  <rect x="430" y="178" width="64" height="34" rx="5" fill="#0f172a" stroke="#fb7185" stroke-width="1.3"/>
  <text x="462" y="200" fill="#fb7185" font-size="13" font-weight="700" text-anchor="middle">37</text>
  <rect x="510" y="178" width="64" height="34" rx="5" fill="#0f172a" stroke="#fb7185" stroke-width="1.3"/>
  <text x="542" y="200" fill="#fb7185" font-size="13" font-weight="700" text-anchor="middle">19</text>
  <rect x="580" y="178" width="64" height="34" rx="5" fill="#0f172a" stroke="#fb7185" stroke-width="1.3"/>
  <text x="612" y="200" fill="#fb7185" font-size="13" font-weight="700" text-anchor="middle">0</text>

  <line x1="462" y1="146" x2="462" y2="178" stroke="#fb7185" stroke-width="1.1" marker-end="url(#arrow-rose)"/>
  <line x1="542" y1="146" x2="542" y2="178" stroke="#fb7185" stroke-width="1.1" marker-end="url(#arrow-rose)"/>
  <line x1="612" y1="146" x2="612" y2="178" stroke="#fb7185" stroke-width="1.1" marker-end="url(#arrow-rose)"/>

  <text x="430" y="232" fill="#fb7185" font-size="9">错误答案彼此不同 → 不形成多数</text>

  <!-- center vote node -->
  <rect x="240" y="296" width="200" height="46" rx="8" fill="#0f172a"/>
  <rect x="240" y="296" width="200" height="46" rx="8" fill="rgba(251,191,36,0.22)" stroke="#fbbf24" stroke-width="1.6"/>
  <text x="340" y="318" fill="#fbbf24" font-size="12" font-weight="600" text-anchor="middle">多数投票</text>
  <text x="340" y="334" fill="#fbbf24" font-size="10" text-anchor="middle">→ 42（收敛点胜出）</text>

  <line x1="165" y1="220" x2="300" y2="296" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrow)"/>

  <rect x="40" y="372" width="600" height="58" rx="6" fill="rgba(30,41,59,0.4)" stroke="#475569" stroke-width="1"/>
  <text x="56" y="394" fill="#e2e8f0" font-size="11" font-weight="600">投票成立的硬前提：答案空间离散、可聚合（数学 / 选择题 / 代码单测）。</text>
  <text x="56" y="414" fill="#94a3b8" font-size="9">开放式生成（写作、长代码修改、设计）答案无法比较 → 多数投票失效。这也解释了推理模型对"创作类"任务帮助有限。</text>
</svg>
