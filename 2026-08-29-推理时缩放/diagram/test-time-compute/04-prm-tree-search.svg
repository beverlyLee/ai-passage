<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 450">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;family=Noto+Sans+SC:wght@400;500;700&amp;display=swap');
    text { font-family: 'JetBrains Mono','Noto Sans SC','PingFang SC',sans-serif; }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/></marker>
    <marker id="arrow-rose" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#fb7185"/></marker>
    <marker id="arrow-amber" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#fbbf24"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#0f172a"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <text x="20" y="30" fill="#e2e8f0" font-size="16" font-weight="700">图4 · 过程奖励 PRM + 树搜索：o1 / DeepSeek-R1 的核心引擎</text>
  <text x="20" y="46" fill="#64748b" font-size="9">问题4 — 给每一步打分，再搜索</text>

  <!-- ORM/PRM callout -->
  <rect x="430" y="56" width="230" height="58" rx="6" fill="rgba(30,41,59,0.5)" stroke="#475569" stroke-width="1"/>
  <text x="444" y="76" fill="#94a3b8" font-size="9">ORM：只判最终答案（信号稀疏，</text>
  <text x="444" y="90" fill="#94a3b8" font-size="9">不知错在第几步）</text>
  <text x="444" y="106" fill="#60a5fa" font-size="9">PRM：判每一步（精确定位错步，</text>
  <text x="444" y="118" fill="#60a5fa" font-size="9">但标注极贵）</text>

  <!-- root -->
  <rect x="150" y="116" width="80" height="28" rx="6" fill="#0f172a" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="190" y="134" fill="#e2e8f0" font-size="11" font-weight="600" text-anchor="middle">问题</text>

  <!-- L1 -->
  <rect x="40" y="158" width="130" height="38" rx="6" fill="#0f172a"/>
  <rect x="40" y="158" width="130" height="38" rx="6" fill="rgba(52,211,153,0.22)" stroke="#34d399" stroke-width="1.4"/>
  <text x="105" y="180" fill="#34d399" font-size="11" font-weight="600" text-anchor="middle">步1 · PRM 0.9 ✓</text>
  <text x="105" y="193" fill="#94a3b8" font-size="8" text-anchor="middle">高</text>

  <rect x="200" y="158" width="130" height="38" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1.2"/>
  <text x="265" y="180" fill="#cbd5e1" font-size="11" font-weight="600" text-anchor="middle">步1 · PRM 0.5</text>
  <text x="265" y="193" fill="#94a3b8" font-size="8" text-anchor="middle">中</text>

  <rect x="360" y="158" width="130" height="38" rx="6" fill="#0f172a"/>
  <rect x="360" y="158" width="130" height="38" rx="6" fill="rgba(136,19,55,0.3)" stroke="#fb7185" stroke-width="1.4"/>
  <text x="425" y="180" fill="#fb7185" font-size="11" font-weight="600" text-anchor="middle">步1 · PRM 0.2 ✗</text>
  <text x="425" y="193" fill="#94a3b8" font-size="8" text-anchor="middle">低</text>

  <line x1="190" y1="144" x2="105" y2="158" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="190" y1="144" x2="265" y2="158" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="190" y1="144" x2="425" y2="158" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- L2 -->
  <rect x="30" y="216" width="110" height="38" rx="6" fill="#0f172a"/>
  <rect x="30" y="216" width="110" height="38" rx="6" fill="rgba(52,211,153,0.22)" stroke="#34d399" stroke-width="1.4"/>
  <text x="85" y="238" fill="#34d399" font-size="11" font-weight="600" text-anchor="middle">步2 · 0.8 ✓</text>
  <text x="85" y="251" fill="#94a3b8" font-size="8" text-anchor="middle">高</text>

  <rect x="150" y="216" width="110" height="38" rx="6" fill="#0f172a" stroke="#fb7185" stroke-width="1.3"/>
  <text x="205" y="238" fill="#fb7185" font-size="11" font-weight="600" text-anchor="middle">步2 · 0.3</text>
  <text x="205" y="251" fill="#94a3b8" font-size="8" text-anchor="middle">低</text>

  <rect x="200" y="216" width="110" height="38" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1.2"/>
  <text x="255" y="238" fill="#cbd5e1" font-size="11" font-weight="600" text-anchor="middle">步2 · 0.6</text>
  <text x="255" y="251" fill="#94a3b8" font-size="8" text-anchor="middle">中</text>

  <line x1="105" y1="196" x2="85" y2="216" stroke="#34d399" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="105" y1="196" x2="205" y2="216" stroke="#64748b" stroke-width="1.1" marker-end="url(#arrow)"/>
  <line x1="265" y1="196" x2="255" y2="216" stroke="#64748b" stroke-width="1.1" marker-end="url(#arrow)"/>

  <text x="425" y="240" fill="#fb7185" font-size="10" font-weight="600" text-anchor="middle">✂ 剪枝</text>

  <!-- L3 -->
  <rect x="30" y="274" width="110" height="36" rx="6" fill="#0f172a"/>
  <rect x="30" y="274" width="110" height="36" rx="6" fill="rgba(52,211,153,0.22)" stroke="#34d399" stroke-width="1.4"/>
  <text x="85" y="296" fill="#34d399" font-size="11" font-weight="600" text-anchor="middle">步3 · 0.9</text>

  <rect x="200" y="274" width="110" height="36" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1.1"/>
  <text x="255" y="296" fill="#cbd5e1" font-size="11" font-weight="600" text-anchor="middle">步3 · 0.5</text>

  <line x1="85" y1="254" x2="85" y2="274" stroke="#34d399" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="255" y1="254" x2="255" y2="274" stroke="#64748b" stroke-width="1.1" marker-end="url(#arrow)"/>

  <!-- answer -->
  <rect x="30" y="328" width="110" height="30" rx="6" fill="#0f172a"/>
  <rect x="30" y="328" width="110" height="30" rx="6" fill="rgba(52,211,153,0.3)" stroke="#34d399" stroke-width="1.6"/>
  <text x="85" y="348" fill="#34d399" font-size="12" font-weight="700" text-anchor="middle">答案 ✓</text>
  <line x1="85" y1="310" x2="85" y2="328" stroke="#34d399" stroke-width="1.3" marker-end="url(#arrow)"/>

  <text x="275" y="350" fill="#fbbf24" font-size="9">绿色路径 = 最优推理链</text>

  <rect x="40" y="378" width="600" height="50" rx="6" fill="rgba(30,41,59,0.4)" stroke="#475569" stroke-width="1"/>
  <text x="56" y="400" fill="#e2e8f0" font-size="11" font-weight="600">搜索（beam / MCTS）按 PRM 剪枝 + 回溯 → 最优推理链。</text>
  <text x="56" y="418" fill="#94a3b8" font-size="9">这正是 o1 / DeepSeek-R1 等推理模型的核心引擎；R1-Zero 纯 RL 还自发涌现反思 / 验证。代价：弱验证器接强搜索会得到"更自信的错误"。</text>
</svg>
