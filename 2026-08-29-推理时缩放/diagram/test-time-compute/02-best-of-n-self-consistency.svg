<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 450">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;family=Noto+Sans+SC:wght@400;500;700&amp;display=swap');
    text { font-family: 'JetBrains Mono','Noto Sans SC','PingFang SC',sans-serif; }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/></marker>
    <marker id="arrow-rose" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#fb7185"/></marker>
    <marker id="arrow-amber" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#fbbf24"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#0f172a"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <text x="20" y="30" fill="#e2e8f0" font-size="16" font-weight="700">图2 · 最朴素的招：Best-of-N 采样 + Self-Consistency 投票</text>
  <text x="20" y="46" fill="#64748b" font-size="9">问题2 — 多采样几条路，再选 / 再投票</text>

  <!-- prompt -->
  <rect x="290" y="56" width="100" height="26" rx="13" fill="#0f172a"/>
  <rect x="290" y="56" width="100" height="26" rx="13" fill="rgba(148,163,184,0.18)" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="340" y="73" fill="#e2e8f0" font-size="11" font-weight="600" text-anchor="middle">问题 x</text>

  <!-- 8 candidate boxes -->
  <rect x="56" y="98" width="64" height="44" rx="6" fill="#0f172a" stroke="#34d399" stroke-width="1.4"/>
  <text x="88" y="114" fill="#94a3b8" font-size="8" text-anchor="middle">路径1</text><text x="88" y="132" fill="#34d399" font-size="14" font-weight="700" text-anchor="middle">42</text>
  <rect x="128" y="98" width="64" height="44" rx="6" fill="#0f172a" stroke="#34d399" stroke-width="1.4"/>
  <text x="160" y="114" fill="#94a3b8" font-size="8" text-anchor="middle">路径2</text><text x="160" y="132" fill="#34d399" font-size="14" font-weight="700" text-anchor="middle">42</text>
  <rect x="200" y="98" width="64" height="44" rx="6" fill="#0f172a" stroke="#34d399" stroke-width="1.4"/>
  <text x="232" y="114" fill="#94a3b8" font-size="8" text-anchor="middle">路径3</text><text x="232" y="132" fill="#34d399" font-size="14" font-weight="700" text-anchor="middle">42</text>
  <rect x="272" y="98" width="64" height="44" rx="6" fill="#0f172a" stroke="#34d399" stroke-width="1.4"/>
  <text x="304" y="114" fill="#94a3b8" font-size="8" text-anchor="middle">路径4</text><text x="304" y="132" fill="#34d399" font-size="14" font-weight="700" text-anchor="middle">42</text>
  <rect x="344" y="98" width="64" height="44" rx="6" fill="#0f172a" stroke="#34d399" stroke-width="1.4"/>
  <text x="376" y="114" fill="#94a3b8" font-size="8" text-anchor="middle">路径5</text><text x="376" y="132" fill="#34d399" font-size="14" font-weight="700" text-anchor="middle">42</text>
  <rect x="416" y="98" width="64" height="44" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1.2"/>
  <text x="448" y="114" fill="#94a3b8" font-size="8" text-anchor="middle">路径6</text><text x="448" y="132" fill="#cbd5e1" font-size="14" font-weight="700" text-anchor="middle">37</text>
  <rect x="488" y="98" width="64" height="44" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1.2"/>
  <text x="520" y="114" fill="#94a3b8" font-size="8" text-anchor="middle">路径7</text><text x="520" y="132" fill="#cbd5e1" font-size="14" font-weight="700" text-anchor="middle">19</text>
  <rect x="560" y="98" width="64" height="44" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1.2"/>
  <text x="592" y="114" fill="#94a3b8" font-size="8" text-anchor="middle">路径8</text><text x="592" y="132" fill="#cbd5e1" font-size="14" font-weight="700" text-anchor="middle">88</text>

  <line x1="340" y1="82" x2="88" y2="98" stroke="#64748b" stroke-width="0.8"/>
  <line x1="340" y1="82" x2="160" y2="98" stroke="#64748b" stroke-width="0.8"/>
  <line x1="340" y1="82" x2="232" y2="98" stroke="#64748b" stroke-width="0.8"/>
  <line x1="340" y1="82" x2="304" y2="98" stroke="#64748b" stroke-width="0.8"/>
  <line x1="340" y1="82" x2="376" y2="98" stroke="#64748b" stroke-width="0.8"/>
  <line x1="340" y1="82" x2="448" y2="98" stroke="#64748b" stroke-width="0.8"/>
  <line x1="340" y1="82" x2="520" y2="98" stroke="#64748b" stroke-width="0.8"/>
  <line x1="340" y1="82" x2="592" y2="98" stroke="#64748b" stroke-width="0.8"/>

  <!-- LEFT method: Best-of-N -->
  <rect x="40" y="182" width="280" height="98" rx="6" fill="#0f172a"/>
  <rect x="40" y="182" width="280" height="98" rx="6" fill="rgba(59,130,246,0.16)" stroke="#60a5fa" stroke-width="1.2"/>
  <text x="180" y="200" fill="#e2e8f0" font-size="11" font-weight="600" text-anchor="middle">Best-of-N：验证器逐条打分</text>
  <rect x="60" y="210" width="240" height="30" rx="5" fill="#0f172a" stroke="#475569" stroke-width="1"/>
  <text x="180" y="229" fill="#cbd5e1" font-size="10" text-anchor="middle">验证器对 8 条候选评分</text>
  <line x1="180" y1="240" x2="180" y2="248" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="60" y="248" width="240" height="28" rx="5" fill="#0f172a"/>
  <rect x="60" y="248" width="240" height="28" rx="5" fill="rgba(52,211,153,0.22)" stroke="#34d399" stroke-width="1.2"/>
  <text x="180" y="266" fill="#34d399" font-size="10" font-weight="600" text-anchor="middle">最终答案 = 42（score 最高）</text>

  <!-- RIGHT method: Self-Consistency -->
  <rect x="360" y="182" width="280" height="98" rx="6" fill="#0f172a"/>
  <rect x="360" y="182" width="280" height="98" rx="6" fill="rgba(120,53,15,0.22)" stroke="#fbbf24" stroke-width="1.2"/>
  <text x="500" y="200" fill="#e2e8f0" font-size="11" font-weight="600" text-anchor="middle">Self-Consistency：取答案众数</text>
  <rect x="380" y="210" width="240" height="30" rx="5" fill="#0f172a" stroke="#475569" stroke-width="1"/>
  <text x="500" y="229" fill="#cbd5e1" font-size="10" text-anchor="middle">8 条路径 → 统计最终答案</text>
  <line x1="500" y1="240" x2="500" y2="248" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="380" y="248" width="240" height="28" rx="5" fill="#0f172a"/>
  <rect x="380" y="248" width="240" height="28" rx="5" fill="rgba(251,191,36,0.22)" stroke="#fbbf24" stroke-width="1.2"/>
  <text x="500" y="266" fill="#fbbf24" font-size="10" font-weight="600" text-anchor="middle">42 出现 5 / 8 → 采用</text>

  <text x="40" y="306" fill="#e2e8f0" font-size="11" font-weight="600">一次回答 = 候选生成 + 选择 / 聚合</text>
  <text x="40" y="326" fill="#94a3b8" font-size="9">多采样是"有预算的 fallback"，不是默认把每个请求 ×N——否则直接放大成本与尾延迟。</text>
  <text x="40" y="346" fill="#94a3b8" font-size="9">风险：候选高度相关 → 投票只是复制同一种错误；答案不可枚举（写作 / 长代码）→ 无法聚合。</text>
  <text x="40" y="370" fill="#fb7185" font-size="9">落地建议：只在「高价值 + 高不确定 + 可自动判分」的请求上触发 self-consistency。</text>
</svg>
