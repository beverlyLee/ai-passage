<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 450">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;family=Noto+Sans+SC:wght@400;500;700&amp;display=swap');
    text { font-family: 'JetBrains Mono','Noto Sans SC','PingFang SC',sans-serif; }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <marker id="arrow-rose" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#fb7185"/>
    </marker>
    <marker id="arrow-amber" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#fbbf24"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#0f172a"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <text x="20" y="30" fill="#e2e8f0" font-size="16" font-weight="700">图1 · 单 Agent vs 多 Agent：瓶颈在"单点上下文"</text>
  <text x="20" y="46" fill="#64748b" font-size="9">问题1 — 一个大脑包揽"想+记+验" vs 一群分工并行</text>

  <!-- 同难题 center tag -->
  <rect x="300" y="64" width="80" height="26" rx="13" fill="#0f172a"/>
  <rect x="300" y="64" width="80" height="26" rx="13" fill="rgba(59,130,246,0.3)" stroke="#60a5fa" stroke-width="1.2"/>
  <text x="340" y="81" fill="#e2e8f0" font-size="11" font-weight="600" text-anchor="middle">同难题</text>

  <!-- LEFT: single agent -->
  <rect x="40" y="100" width="250" height="34" rx="6" fill="#0f172a"/>
  <rect x="40" y="100" width="250" height="34" rx="6" fill="rgba(136,19,55,0.35)" stroke="#fb7185" stroke-width="1.4"/>
  <text x="165" y="121" fill="white" font-size="12" font-weight="600" text-anchor="middle">单 Agent（同一块上下文）</text>

  <rect x="70" y="148" width="190" height="38" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1"/>
  <text x="165" y="171" fill="#cbd5e1" font-size="11" text-anchor="middle">① 规划</text>
  <line x1="165" y1="186" x2="165" y2="198" stroke="#64748b" stroke-width="1.4" marker-end="url(#arrow)"/>
  <rect x="70" y="198" width="190" height="38" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1"/>
  <text x="165" y="221" fill="#cbd5e1" font-size="11" text-anchor="middle">② 执行</text>
  <line x1="165" y1="236" x2="165" y2="248" stroke="#64748b" stroke-width="1.4" marker-end="url(#arrow)"/>
  <rect x="70" y="248" width="190" height="38" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1"/>
  <text x="165" y="271" fill="#cbd5e1" font-size="11" text-anchor="middle">③ 自查</text>

  <rect x="40" y="312" width="250" height="60" rx="6" fill="#0f172a"/>
  <rect x="40" y="312" width="250" height="60" rx="6" fill="rgba(136,19,55,0.4)" stroke="#fb7185" stroke-width="1.5"/>
  <text x="165" y="336" fill="white" font-size="12" font-weight="600" text-anchor="middle">单点上下文瓶颈</text>
  <text x="165" y="354" fill="#94a3b8" font-size="9" text-anchor="middle">第三步易忘第一步的约束</text>
  <text x="165" y="368" fill="#94a3b8" font-size="9" text-anchor="middle">注意力被自身稀释</text>

  <!-- RIGHT: multi agent -->
  <rect x="390" y="100" width="250" height="34" rx="6" fill="#0f172a"/>
  <rect x="390" y="100" width="250" height="34" rx="6" fill="rgba(59,130,246,0.3)" stroke="#60a5fa" stroke-width="1.4"/>
  <text x="515" y="121" fill="white" font-size="12" font-weight="600" text-anchor="middle">编排者 Orchestrator（拆任务）</text>

  <rect x="390" y="150" width="120" height="46" rx="6" fill="#0f172a" stroke="#60a5fa" stroke-width="1.2"/>
  <text x="450" y="172" fill="#e2e8f0" font-size="11" font-weight="600" text-anchor="middle">Planner</text>
  <text x="450" y="187" fill="#94a3b8" font-size="8" text-anchor="middle">规划</text>
  <rect x="530" y="150" width="110" height="46" rx="6" fill="#0f172a" stroke="#60a5fa" stroke-width="1.2"/>
  <text x="585" y="172" fill="#e2e8f0" font-size="11" font-weight="600" text-anchor="middle">Worker</text>
  <text x="585" y="187" fill="#94a3b8" font-size="8" text-anchor="middle">执行</text>
  <rect x="390" y="206" width="120" height="46" rx="6" fill="#0f172a" stroke="#60a5fa" stroke-width="1.2"/>
  <text x="450" y="228" fill="#e2e8f0" font-size="11" font-weight="600" text-anchor="middle">Critic</text>
  <text x="450" y="243" fill="#94a3b8" font-size="8" text-anchor="middle">挑错</text>
  <rect x="530" y="206" width="110" height="46" rx="6" fill="#0f172a" stroke="#60a5fa" stroke-width="1.2"/>
  <text x="585" y="228" fill="#e2e8f0" font-size="11" font-weight="600" text-anchor="middle">Verifier</text>
  <text x="585" y="243" fill="#94a3b8" font-size="8" text-anchor="middle">验收</text>

  <line x1="450" y1="196" x2="470" y2="266" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="585" y1="196" x2="565" y2="266" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="450" y1="252" x2="480" y2="266" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="585" y1="252" x2="550" y2="266" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrow)"/>

  <rect x="390" y="266" width="250" height="40" rx="6" fill="#0f172a"/>
  <rect x="390" y="266" width="250" height="40" rx="6" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.4"/>
  <text x="515" y="290" fill="white" font-size="11" font-weight="600" text-anchor="middle">聚合：投票 / 辩论 → 最终答案</text>
  <text x="515" y="326" fill="#94a3b8" font-size="9" text-anchor="middle">各自上下文干净，互不拖累</text>

  <!-- legend -->
  <rect x="500" y="346" width="160" height="64" rx="6" fill="rgba(30,41,59,0.5)" stroke="#475569" stroke-width="1"/>
  <rect x="512" y="358" width="14" height="10" rx="2" fill="rgba(136,19,55,0.4)" stroke="#fb7185"/>
  <text x="532" y="367" fill="#94a3b8" font-size="8">红 = 单点瓶颈</text>
  <rect x="512" y="376" width="14" height="10" rx="2" fill="rgba(59,130,246,0.3)" stroke="#60a5fa"/>
  <text x="532" y="385" fill="#94a3b8" font-size="8">蓝 = 分工 Agent</text>
  <rect x="512" y="392" width="14" height="10" rx="2" fill="rgba(120,53,15,0.3)" stroke="#fbbf24"/>
  <text x="532" y="401" fill="#94a3b8" font-size="8">琥珀 = 聚合结论</text>
</svg>