<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 450">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;family=Noto+Sans+SC:wght@400;500;700&amp;display=swap');
    text { font-family: 'JetBrains Mono','Noto Sans SC','PingFang SC',sans-serif; }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <marker id="arrow-amber" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#fbbf24"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#0f172a"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <text x="20" y="30" fill="#e2e8f0" font-size="16" font-weight="700">图4 · 聚合与投票：N 个候选 → 验证器 → 胜出</text>
  <text x="20" y="46" fill="#64748b" font-size="9">问题4 — 聚合策略直接决定系统上限（Best-of-N / Self-Consistency）</text>

  <!-- candidate boxes -->
  <rect x="40" y="70" width="160" height="58" rx="6" fill="#0f172a" stroke="#60a5fa" stroke-width="1.2"/>
  <text x="120" y="98" fill="#e2e8f0" font-size="12" font-weight="600" text-anchor="middle">候选答案 1</text>
  <text x="120" y="116" fill="#94a3b8" font-size="9" text-anchor="middle">Worker A 采样</text>
  <rect x="260" y="70" width="160" height="58" rx="6" fill="#0f172a" stroke="#60a5fa" stroke-width="1.2"/>
  <text x="340" y="98" fill="#e2e8f0" font-size="12" font-weight="600" text-anchor="middle">候选答案 2</text>
  <text x="340" y="116" fill="#94a3b8" font-size="9" text-anchor="middle">Worker B 采样</text>
  <rect x="480" y="70" width="160" height="58" rx="6" fill="#0f172a" stroke="#60a5fa" stroke-width="1.2"/>
  <text x="560" y="98" fill="#e2e8f0" font-size="12" font-weight="600" text-anchor="middle">候选答案 3</text>
  <text x="560" y="116" fill="#94a3b8" font-size="9" text-anchor="middle">Worker C 采样</text>

  <line x1="120" y1="128" x2="300" y2="170" stroke="#64748b" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="340" y1="128" x2="340" y2="170" stroke="#64748b" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="560" y1="128" x2="380" y2="170" stroke="#64748b" stroke-width="1.3" marker-end="url(#arrow)"/>

  <!-- verifier -->
  <rect x="240" y="170" width="200" height="46" rx="6" fill="#0f172a"/>
  <rect x="240" y="170" width="200" height="46" rx="6" fill="rgba(59,130,246,0.3)" stroke="#60a5fa" stroke-width="1.4"/>
  <text x="340" y="194" fill="white" font-size="12" font-weight="600" text-anchor="middle">验证器 Verifier</text>
  <text x="340" y="210" fill="#94a3b8" font-size="9" text-anchor="middle">按"可验证性"筛选候选</text>

  <line x1="290" y1="216" x2="160" y2="252" stroke="#64748b" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="390" y1="216" x2="520" y2="252" stroke="#64748b" stroke-width="1.3" marker-end="url(#arrow)"/>

  <!-- two strategies -->
  <rect x="60" y="252" width="200" height="52" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1"/>
  <text x="160" y="278" fill="#e2e8f0" font-size="12" font-weight="600" text-anchor="middle">多数投票</text>
  <text x="160" y="294" fill="#94a3b8" font-size="9" text-anchor="middle">Self-Consistency</text>
  <rect x="420" y="252" width="200" height="52" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1"/>
  <text x="520" y="278" fill="#e2e8f0" font-size="12" font-weight="600" text-anchor="middle">辩论 Debate</text>
  <text x="520" y="294" fill="#94a3b8" font-size="9" text-anchor="middle">互相质证后收敛</text>

  <line x1="160" y1="304" x2="320" y2="338" stroke="#64748b" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="520" y1="304" x2="360" y2="338" stroke="#64748b" stroke-width="1.3" marker-end="url(#arrow)"/>

  <!-- final answer -->
  <rect x="220" y="338" width="240" height="46" rx="6" fill="#0f172a"/>
  <rect x="220" y="338" width="240" height="46" rx="6" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.4"/>
  <text x="340" y="362" fill="white" font-size="12" font-weight="700" text-anchor="middle">最终答案</text>
  <text x="340" y="378" fill="#94a3b8" font-size="9" text-anchor="middle">Best-of-N：小模型+并行探索可超大模型</text>

  <text x="20" y="412" fill="#94a3b8" font-size="9">前提：任务可被验证、答案可比对。GPT-5.6 ultra 在 BrowseComp / Terminal-Bench 这类可验证基准上把曲线推到左上。</text>
</svg>