<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 450">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;family=Noto+Sans+SC:wght@400;500;700&amp;display=swap');
    text { font-family: 'JetBrains Mono','Noto Sans SC','PingFang SC',sans-serif; }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <marker id="arrow-rose" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#fb7185"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#0f172a"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <text x="20" y="30" fill="#e2e8f0" font-size="16" font-weight="700">图3 · Agent 通信：中央黑板 + 消息传递 + 上下文隔离</text>
  <text x="20" y="46" fill="#64748b" font-size="9">问题3 — 系统 1+1&gt;2 还是互相污染，取决于通信协议</text>

  <!-- blackboard center -->
  <rect x="250" y="180" width="180" height="92" rx="8" fill="#0f172a"/>
  <rect x="250" y="180" width="180" height="92" rx="8" fill="rgba(59,130,246,0.28)" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="340" y="208" fill="white" font-size="12" font-weight="700" text-anchor="middle">共享黑板 Blackboard</text>
  <text x="340" y="226" fill="#94a3b8" font-size="9" text-anchor="middle">全局可读状态</text>
  <text x="340" y="242" fill="#94a3b8" font-size="9" text-anchor="middle">谁都能写 / 往后读</text>
  <text x="340" y="258" fill="#94a3b8" font-size="9" text-anchor="middle">（LangGraph 共享状态）</text>

  <!-- agents -->
  <rect x="55" y="70" width="130" height="50" rx="6" fill="#0f172a" stroke="#60a5fa" stroke-width="1.2"/>
  <text x="120" y="100" fill="#e2e8f0" font-size="12" font-weight="600" text-anchor="middle">Agent A</text>
  <rect x="495" y="70" width="130" height="50" rx="6" fill="#0f172a" stroke="#60a5fa" stroke-width="1.2"/>
  <text x="560" y="100" fill="#e2e8f0" font-size="12" font-weight="600" text-anchor="middle">Agent B</text>
  <rect x="55" y="330" width="130" height="50" rx="6" fill="#0f172a" stroke="#60a5fa" stroke-width="1.2"/>
  <text x="120" y="360" fill="#e2e8f0" font-size="12" font-weight="600" text-anchor="middle">Agent C</text>
  <rect x="495" y="330" width="130" height="50" rx="6" fill="#0f172a" stroke="#60a5fa" stroke-width="1.2"/>
  <text x="560" y="360" fill="#e2e8f0" font-size="12" font-weight="600" text-anchor="middle">Agent D</text>

  <!-- read/write arrows agent<->board -->
  <line x1="185" y1="95" x2="250" y2="210" stroke="#64748b" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="250" y1="220" x2="185" y2="110" stroke="#64748b" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="495" y1="95" x2="430" y2="210" stroke="#64748b" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="430" y1="220" x2="495" y2="110" stroke="#64748b" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="120" y1="320" x2="300" y2="272" stroke="#64748b" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="300" y1="262" x2="120" y2="335" stroke="#64748b" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="560" y1="320" x2="380" y2="272" stroke="#64748b" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="380" y1="262" x2="560" y2="335" stroke="#64748b" stroke-width="1.3" marker-end="url(#arrow)"/>

  <!-- message passing dashed between A and B -->
  <line x1="185" y1="80" x2="495" y2="80" stroke="#fb7185" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#arrow-rose)"/>
  <text x="340" y="72" fill="#fb7185" font-size="9" text-anchor="middle">消息传递（点对点）</text>

  <!-- isolation note -->
  <rect x="55" y="262" width="160" height="56" rx="6" fill="rgba(30,41,59,0.5)" stroke="#475569" stroke-width="1"/>
  <rect x="67" y="274" width="14" height="10" rx="2" fill="rgba(59,130,246,0.3)" stroke="#60a5fa"/>
  <text x="87" y="283" fill="#94a3b8" font-size="8">蓝 = 写/读黑板</text>
  <rect x="67" y="290" width="14" height="10" rx="2" fill="rgba(136,19,55,0.4)" stroke="#fb7185"/>
  <text x="87" y="299" fill="#94a3b8" font-size="8">红 = 私信(隔离)</text>
  <text x="67" y="313" fill="#94a3b8" font-size="8">子任务上下文互不污染</text>

  <text x="430" y="402" fill="#94a3b8" font-size="9">混合常态：全局放共识，敏感细节走私信；隔离是防止"互相污染"的护栏。</text>
  <text x="430" y="418" fill="#64748b" font-size="8">Anthropic 子 Agent = 把子任务上下文隔离子 Agent。</text>
</svg>