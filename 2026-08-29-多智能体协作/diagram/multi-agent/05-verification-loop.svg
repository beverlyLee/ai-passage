<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 450">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;family=Noto+Sans+SC:wght@400;500;700&amp;display=swap');
    text { font-family: 'JetBrains Mono','Noto Sans SC','PingFang SC',sans-serif; }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <marker id="arrow-amber" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#fbbf24"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#0f172a"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <text x="20" y="30" fill="#e2e8f0" font-size="16" font-weight="700">图5 · 验证闭环 + 长程状态：AVO 靠持久记忆拿下 ARC-AGI-3 满分</text>
  <text x="20" y="46" fill="#64748b" font-size="9">问题5 — 多智能体的边界：可被拆、可被验，才碾压单 Agent</text>

  <text x="340" y="148" fill="#fbbf24" font-size="12" font-weight="700" text-anchor="middle">长程自治闭环</text>

  <!-- cycle nodes -->
  <rect x="270" y="70" width="140" height="50" rx="6" fill="#0f172a" stroke="#60a5fa" stroke-width="1.3"/>
  <text x="340" y="100" fill="#e2e8f0" font-size="12" font-weight="600" text-anchor="middle">① 任务 Task</text>

  <rect x="470" y="178" width="140" height="50" rx="6" fill="#0f172a" stroke="#60a5fa" stroke-width="1.3"/>
  <text x="540" y="208" fill="#e2e8f0" font-size="12" font-weight="600" text-anchor="middle">② 行动 Act</text>

  <rect x="270" y="300" width="140" height="50" rx="6" fill="#0f172a" stroke="#60a5fa" stroke-width="1.3"/>
  <text x="340" y="330" fill="#e2e8f0" font-size="12" font-weight="600" text-anchor="middle">③ 反馈 Feedback</text>

  <rect x="70" y="178" width="140" height="50" rx="6" fill="#0f172a"/>
  <rect x="70" y="178" width="140" height="50" rx="6" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.3"/>
  <text x="140" y="200" fill="white" font-size="12" font-weight="600" text-anchor="middle">④ 持久记忆</text>
  <text x="140" y="216" fill="#94a3b8" font-size="9" text-anchor="middle">Memory 更新</text>

  <!-- cycle arrows clockwise -->
  <line x1="410" y1="108" x2="478" y2="178" stroke="#64748b" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="470" y1="228" x2="412" y2="300" stroke="#64748b" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="270" y1="325" x2="212" y2="253" stroke="#64748b" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="140" y1="178" x2="288" y2="108" stroke="#fbbf24" stroke-width="1.4" marker-end="url(#arrow-amber)"/>

  <!-- AVO note -->
  <rect x="40" y="372" width="600" height="58" rx="6" fill="#0f172a"/>
  <rect x="40" y="372" width="600" height="58" rx="6" fill="rgba(136,19,55,0.3)" stroke="#fb7185" stroke-width="1.4"/>
  <text x="60" y="396" fill="white" font-size="12" font-weight="600">NVIDIA AVO：持久记忆 + 监督 → ARC-AGI-3 满分（100.00 RHAE，25 环境 183 关全通，6624 次动作）</text>
  <text x="60" y="414" fill="#94a3b8" font-size="9">系统级架构把模型能力持续转成自主进展；但多 Agent 的 token 开销更高——ultra 用更高消耗换更强结果。</text>

  <text x="40" y="448" fill="#64748b" font-size="8">判断要不要上多智能体：这活拆得开吗？验得出吗？两个都是 yes 才上。</text>
</svg>