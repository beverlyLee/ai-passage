<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 450">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <marker id="arrow-emerald" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34d399"/>
    </marker>
    <marker id="arrow-cyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#22d3ee"/>
    </marker>
    <style>
      text { font-family: 'JetBrains Mono', 'Noto Sans SC', 'PingFang SC', sans-serif; }
    </style>
  </defs>

  <rect width="680" height="450" fill="#0f172a"/>
  <rect width="680" height="450" fill="url(#grid)"/>

  <text x="24" y="30" fill="#ffffff" font-size="16" font-weight="700">IVF 与 HNSW：两种加速机理</text>

  <!-- 左：IVF -->
  <rect x="24" y="46" width="320" height="384" rx="10" fill="rgba(120,53,15,0.10)" stroke="#fbbf24" stroke-width="1.2"/>
  <text x="184" y="68" fill="#fbbf24" font-size="12" font-weight="600" text-anchor="middle">IVF：先聚类分区再查</text>

  <!-- 空间区域 -->
  <rect x="60" y="92" width="248" height="224" rx="4" fill="rgba(30,41,59,0.4)" stroke="#475569" stroke-width="1"/>
  <!-- 分区虚线 -->
  <line x1="184" y1="92" x2="184" y2="316" stroke="#475569" stroke-width="1" stroke-dasharray="5,4"/>
  <line x1="60" y1="169" x2="308" y2="169" stroke="#475569" stroke-width="1" stroke-dasharray="5,4"/>
  <line x1="60" y1="246" x2="308" y2="246" stroke="#475569" stroke-width="1" stroke-dasharray="5,4"/>
  <!-- 高亮的 2 个被扫簇（右列） -->
  <rect x="184" y="92" width="124" height="77" rx="3" fill="rgba(52,211,153,0.10)" stroke="#34d399" stroke-width="1.4"/>
  <rect x="184" y="169" width="124" height="77" rx="3" fill="rgba(52,211,153,0.10)" stroke="#34d399" stroke-width="1.4"/>
  <!-- 簇中心（琥珀） -->
  <g fill="#fbbf24">
    <circle cx="122" cy="130" r="4"/><circle cx="246" cy="130" r="4"/>
    <circle cx="122" cy="207" r="4"/><circle cx="246" cy="207" r="4"/>
    <circle cx="122" cy="281" r="4"/><circle cx="246" cy="281" r="4"/>
  </g>
  <!-- 数据点（暗） -->
  <g fill="#475569">
    <circle cx="95" cy="115" r="2.5"/><circle cx="150" cy="150" r="2.5"/><circle cx="100" cy="190" r="2.5"/><circle cx="140" cy="230" r="2.5"/><circle cx="90" cy="270" r="2.5"/><circle cx="150" cy="300" r="2.5"/>
    <circle cx="210" cy="115" r="2.5"/><circle cx="270" cy="140" r="2.5"/><circle cx="230" cy="185" r="2.5"/><circle cx="290" cy="225" r="2.5"/><circle cx="205" cy="260" r="2.5"/><circle cx="280" cy="295" r="2.5"/>
  </g>
  <!-- 查询点 -->
  <circle cx="210" cy="150" r="5" fill="#22d3ee" stroke="#ffffff" stroke-width="1"/>
  <text x="210" y="142" fill="#22d3ee" font-size="9" text-anchor="middle">q</text>
  <!-- 查询到最近两簇中心的箭头 -->
  <line x1="210" y1="150" x2="246" y2="130" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrow-emerald)"/>
  <line x1="210" y1="150" x2="246" y2="207" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrow-emerald)"/>
  <text x="184" y="344" fill="#34d399" font-size="10" font-weight="600" text-anchor="middle">nprobe=2：只扫最近 2 个簇</text>
  <text x="184" y="364" fill="#94a3b8" font-size="9" text-anchor="middle">nprobe 越大召回越高、越慢</text>
  <text x="184" y="380" fill="#64748b" font-size="8" text-anchor="middle">本文 demo：1→40 召回 0.35→1.00</text>
  <text x="184" y="412" fill="#64748b" font-size="8" text-anchor="middle">nprobe=nlist 时退化为暴力全扫</text>

  <!-- 右：HNSW -->
  <rect x="356" y="46" width="300" height="384" rx="10" fill="rgba(6,78,59,0.10)" stroke="#34d399" stroke-width="1.2"/>
  <text x="506" y="68" fill="#34d399" font-size="12" font-weight="600" text-anchor="middle">HNSW：多层可导航小世界图</text>

  <!-- layer2 -->
  <g>
    <line x1="430" y1="110" x2="490" y2="110" stroke="#475569" stroke-width="1"/>
    <line x1="490" y1="110" x2="550" y2="110" stroke="#475569" stroke-width="1"/>
    <circle cx="430" cy="110" r="4" fill="#64748b"/><circle cx="490" cy="110" r="4" fill="#64748b"/><circle cx="550" cy="110" r="4" fill="#64748b"/>
  </g>
  <text x="386" y="114" fill="#94a3b8" font-size="9">L2</text>
  <!-- layer1 -->
  <g>
    <line x1="400" y1="170" x2="450" y2="170" stroke="#475569" stroke-width="1"/>
    <line x1="450" y1="170" x2="500" y2="170" stroke="#475569" stroke-width="1"/>
    <line x1="500" y1="170" x2="550" y2="170" stroke="#475569" stroke-width="1"/>
    <line x1="550" y1="170" x2="600" y2="170" stroke="#475569" stroke-width="1"/>
    <circle cx="400" cy="170" r="4" fill="#64748b"/><circle cx="450" cy="170" r="4" fill="#64748b"/><circle cx="500" cy="170" r="4" fill="#64748b"/><circle cx="550" cy="170" r="4" fill="#64748b"/><circle cx="600" cy="170" r="4" fill="#64748b"/>
  </g>
  <text x="386" y="174" fill="#94a3b8" font-size="9">L1</text>
  <!-- layer0 -->
  <g>
    <line x1="380" y1="250" x2="420" y2="250" stroke="#475569" stroke-width="1"/>
    <line x1="420" y1="250" x2="460" y2="250" stroke="#475569" stroke-width="1"/>
    <line x1="460" y1="250" x2="500" y2="250" stroke="#475569" stroke-width="1"/>
    <line x1="500" y1="250" x2="540" y2="250" stroke="#475569" stroke-width="1"/>
    <line x1="540" y1="250" x2="580" y2="250" stroke="#475569" stroke-width="1"/>
    <line x1="580" y1="250" x2="620" y2="250" stroke="#475569" stroke-width="1"/>
    <circle cx="380" cy="250" r="4" fill="#64748b"/><circle cx="420" cy="250" r="4" fill="#64748b"/><circle cx="460" cy="250" r="4" fill="#64748b"/><circle cx="500" cy="250" r="4" fill="#64748b"/><circle cx="540" cy="250" r="4" fill="#64748b"/><circle cx="580" cy="250" r="4" fill="#64748b"/><circle cx="620" cy="250" r="4" fill="#64748b"/>
  </g>
  <text x="386" y="254" fill="#94a3b8" font-size="9">L0</text>

  <!-- 导航路径（高亮） -->
  <line x1="430" y1="110" x2="450" y2="170" stroke="#22d3ee" stroke-width="1.6" marker-end="url(#arrow-cyan)"/>
  <line x1="450" y1="170" x2="460" y2="250" stroke="#22d3ee" stroke-width="1.6" marker-end="url(#arrow-cyan)"/>
  <circle cx="430" cy="110" r="5" fill="#22d3ee" stroke="#fff" stroke-width="1"/>
  <circle cx="450" cy="170" r="5" fill="#22d3ee" stroke="#fff" stroke-width="1"/>
  <circle cx="460" cy="250" r="5" fill="#22d3ee" stroke="#fff" stroke-width="1"/>
  <text x="356" y="290" fill="#22d3ee" font-size="9">入口 → 逐层贪心下降</text>

  <text x="506" y="324" fill="#34d399" font-size="10" font-weight="600" text-anchor="middle">efSearch：每层保留的候选宽度</text>
  <text x="506" y="344" fill="#94a3b8" font-size="9" text-anchor="middle">越大越准、越慢（召回同样是旋钮）</text>
  <text x="506" y="376" fill="#64748b" font-size="8" text-anchor="middle">SIFT1M 上：efSearch 16→256，召回@10 约 90%→99.5%</text>
  <text x="506" y="392" fill="#64748b" font-size="8" text-anchor="middle">查询复杂度约 O(log n) 跳数</text>
  <text x="506" y="414" fill="#64748b" font-size="8" text-anchor="middle">FAISS/pgvector/Qdrant/Weaviate/Milvus 默认都带 HNSW</text>
</svg>
