<svg width="680" height="450" viewBox="0 0 680 450" xmlns="http://www.w3.org/2000/svg">
  <style>
    text { font-family: "JetBrains Mono","Noto Sans SC",ui-monospace,monospace; }
  </style>
  <rect width="680" height="450" fill="#0f172a"/>
  <g stroke="#1e293b" stroke-width="1">
    <line x1="0" y1="86" x2="680" y2="86"/>
    <line x1="0" y1="262" x2="680" y2="262"/>
  </g>
  <text x="340" y="46" fill="#e2e8f0" font-size="21" text-anchor="middle" font-weight="bold">邮件自动分类 Agent：分类层 + 动作层</text>
  <text x="340" y="68" fill="#94a3b8" font-size="13" text-anchor="middle">分类层防「分错」，动作层防「动错」——两层各架一道闸</text>

  <!-- 阶段 -->
  <rect x="28" y="120" width="132" height="92" rx="10" fill="#0b2433" stroke="#22d3ee" stroke-width="2"/>
  <text x="94" y="152" fill="#22d3ee" font-size="14" text-anchor="middle" font-weight="bold">邮件对象</text>
  <text x="94" y="176" fill="#94a3b8" font-size="11" text-anchor="middle">带状态: 已读/未读</text>
  <text x="94" y="194" fill="#94a3b8" font-size="11" text-anchor="middle">文件夹归属 / flags</text>

  <rect x="186" y="120" width="146" height="92" rx="10" fill="#0b2433" stroke="#22d3ee" stroke-width="2"/>
  <text x="259" y="152" fill="#22d3ee" font-size="14" text-anchor="middle" font-weight="bold">分类层</text>
  <text x="259" y="176" fill="#94a3b8" font-size="11" text-anchor="middle">白名单 / 规则裁决</text>
  <text x="259" y="194" fill="#22d3ee" font-size="11" text-anchor="middle">/ 隐私脱敏</text>

  <rect x="358" y="120" width="146" height="92" rx="10" fill="#2a0f1a" stroke="#fb7185" stroke-width="2"/>
  <text x="431" y="152" fill="#fb7185" font-size="14" text-anchor="middle" font-weight="bold">动作层</text>
  <text x="431" y="176" fill="#94a3b8" font-size="11" text-anchor="middle">白名单&gt;dry-run</text>
  <text x="431" y="194" fill="#fb7185" font-size="11" text-anchor="middle">&gt;回收站 + 幂等</text>

  <rect x="528" y="120" width="132" height="92" rx="10" fill="#2a1f0b" stroke="#fbbf24" stroke-width="2"/>
  <text x="594" y="152" fill="#fbbf24" font-size="14" text-anchor="middle" font-weight="bold">IMAP</text>
  <text x="594" y="176" fill="#94a3b8" font-size="11" text-anchor="middle">安全落地</text>
  <text x="594" y="194" fill="#fbbf24" font-size="11" text-anchor="middle">move 非 expunge</text>

  <g stroke="#64748b" stroke-width="2" fill="none">
    <path d="M160 166 H184"/>
    <path d="M332 166 H356"/>
    <path d="M504 166 H526"/>
  </g>

  <!-- 分类层坑 -->
  <text x="190" y="246" fill="#22d3ee" font-size="13" text-anchor="middle" font-weight="bold">分类层 · 对「邮件对象」建模错</text>
  <g fill="#0b2433" stroke="#22d3ee" stroke-width="1.5">
    <rect x="28" y="288" width="320" height="34" rx="6"/>
    <rect x="28" y="330" width="320" height="34" rx="6"/>
    <rect x="28" y="372" width="320" height="34" rx="6"/>
  </g>
  <text x="44" y="310" fill="#94a3b8" font-size="12">① 误标垃圾：老板邮件被判进垃圾箱</text>
  <text x="44" y="352" fill="#94a3b8" font-size="12">② 隐私泄露：身份证/银行卡明文落库</text>
  <text x="44" y="394" fill="#94a3b8" font-size="12">③ 规则冲突：多规则争抢同一封邮件</text>

  <!-- 动作层坑 -->
  <text x="510" y="246" fill="#fb7185" font-size="13" text-anchor="middle" font-weight="bold">动作层 · 对「不可逆动作」建模错</text>
  <g fill="#2a0f1a" stroke="#fb7185" stroke-width="1.5">
    <rect x="356" y="288" width="300" height="34" rx="6"/>
    <rect x="356" y="330" width="300" height="34" rx="6"/>
    <rect x="356" y="372" width="300" height="34" rx="6"/>
  </g>
  <text x="372" y="310" fill="#cbd5e1" font-size="12">④ 误删邮件：expunge 不可逆</text>
  <text x="372" y="352" fill="#cbd5e1" font-size="12">⑤ 静默失败：连接断未告警（呼应#23）</text>
  <text x="372" y="394" fill="#cbd5e1" font-size="12">⑥ 重复触发：同封邮件动两次</text>
</svg>
