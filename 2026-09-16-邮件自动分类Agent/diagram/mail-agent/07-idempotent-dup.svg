<svg width="680" height="450" viewBox="0 0 680 450" xmlns="http://www.w3.org/2000/svg">
  <style>
    text { font-family: "JetBrains Mono","Noto Sans SC",ui-monospace,monospace; }
  </style>
  <rect width="680" height="450" fill="#0f172a"/>
  <text x="340" y="46" fill="#e2e8f0" font-size="20" text-anchor="middle" font-weight="bold">踩坑⑥ 重复触发：同封邮件动两次</text>

  <rect x="40" y="80" width="290" height="300" rx="10" fill="#2a0f1a" stroke="#fb7185" stroke-width="2"/>
  <text x="60" y="112" fill="#fb7185" font-size="14" font-weight="bold">❌ 无幂等</text>
  <text x="60" y="146" fill="#94a3b8" font-size="12">at-least-once 轮询</text>
  <text x="60" y="180" fill="#e2e8f0" font-size="12">同一 uid=u3 被触发 2 次</text>
  <text x="60" y="214" fill="#94a3b8" font-size="12">第 1 次: 移入 账单</text>
  <text x="60" y="248" fill="#94a3b8" font-size="12">第 2 次: 再次移动 / 误删</text>
  <text x="60" y="300" fill="#fb7185" font-size="12">→ 重复动作</text>
  <text x="60" y="332" fill="#fb7185" font-size="12">→ 状态错乱 / 误删</text>
  <text x="60" y="364" fill="#94a3b8" font-size="11">（重要邮件被二次处理）</text>

  <rect x="350" y="80" width="290" height="300" rx="10" fill="#0b2433" stroke="#22d3ee" stroke-width="2"/>
  <text x="370" y="112" fill="#22d3ee" font-size="14" font-weight="bold">✅ UID 幂等去重</text>
  <text x="370" y="146" fill="#94a3b8" font-size="12">processed = {uid}</text>
  <text x="370" y="180" fill="#e2e8f0" font-size="12">同一 uid=u3 触发 2 次</text>
  <text x="370" y="214" fill="#94a3b8" font-size="12">第 1 次: 执行 + 记 uid</text>
  <text x="370" y="248" fill="#94a3b8" font-size="12">第 2 次: 命中集合跳过</text>
  <text x="370" y="300" fill="#22d3ee" font-size="12">→ 只动一次</text>
  <text x="370" y="332" fill="#22d3ee" font-size="12">→ 状态稳定</text>
  <text x="370" y="364" fill="#94a3b8" font-size="11">（邮件监控是 at-least-once）</text>

  <rect x="40" y="396" width="600" height="34" rx="6" fill="#2a1f0b" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="340" y="418" fill="#fbbf24" font-size="12" text-anchor="middle">必须自己用 UID 把重复投递收敛成「有效一次」（见 02 的 processed 集合）</text>
</svg>
