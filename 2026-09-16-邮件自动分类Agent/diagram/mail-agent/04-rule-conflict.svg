<svg width="680" height="450" viewBox="0 0 680 450" xmlns="http://www.w3.org/2000/svg">
  <style>
    text { font-family: "JetBrains Mono","Noto Sans SC",ui-monospace,monospace; }
  </style>
  <rect width="680" height="450" fill="#0f172a"/>
  <text x="340" y="46" fill="#e2e8f0" font-size="20" text-anchor="middle" font-weight="bold">踩坑③ 规则冲突：多规则争抢同一封</text>

  <rect x="40" y="80" width="600" height="56" rx="10" fill="#0b2433" stroke="#22d3ee" stroke-width="2"/>
  <text x="60" y="104" fill="#e2e8f0" font-size="12">同一封邮件 同时命中: 「发票」(→账单) 且 「中奖」(→垃圾箱)</text>
  <text x="60" y="126" fill="#94a3b8" font-size="11">规则引擎必须把「竞争」变成「确定裁决」</text>

  <rect x="40" y="170" width="600" height="56" rx="10" fill="#2a1f0b" stroke="#fbbf24" stroke-width="2"/>
  <text x="60" y="194" fill="#fbbf24" font-size="13" font-weight="bold">规则按 priority 排序裁决</text>
  <text x="60" y="216" fill="#94a3b8" font-size="11">发票(priority=1) &gt; 中奖(priority=5) → 高优先级胜出</text>

  <g stroke="#64748b" stroke-width="2" fill="none">
    <path d="M200 226 V288"/>
    <path d="M480 226 V288"/>
  </g>

  <rect x="40" y="290" width="290" height="120" rx="10" fill="#0b2433" stroke="#22d3ee" stroke-width="2"/>
  <text x="60" y="320" fill="#22d3ee" font-size="14" font-weight="bold">✅ 优先级裁决</text>
  <text x="60" y="350" fill="#94a3b8" font-size="12">高优先级(发票,pri=1)胜出</text>
  <text x="60" y="378" fill="#22d3ee" font-size="12">→ 移入 账单</text>
  <text x="60" y="400" fill="#94a3b8" font-size="11">结果稳定可预测</text>

  <rect x="350" y="290" width="290" height="120" rx="10" fill="#2a0f1a" stroke="#fb7185" stroke-width="2"/>
  <text x="370" y="320" fill="#fb7185" font-size="14" font-weight="bold">❌ 无优先级</text>
  <text x="370" y="350" fill="#94a3b8" font-size="12">依赖规则书写顺序 / 随机</text>
  <text x="370" y="378" fill="#fb7185" font-size="12">→ 结果不确定</text>
  <text x="370" y="400" fill="#94a3b8" font-size="11">今天进账单，明天进垃圾箱</text>

  <rect x="40" y="420" width="600" height="22" rx="6" fill="#0b2433" stroke="#1e293b" stroke-width="1"/>
  <text x="340" y="435" fill="#94a3b8" font-size="11" text-anchor="middle">多规则竞争必须显式优先级，否则同一封邮件的命运随执行顺序漂移</text>
</svg>
