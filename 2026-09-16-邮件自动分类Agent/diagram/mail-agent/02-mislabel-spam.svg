<svg width="680" height="450" viewBox="0 0 680 450" xmlns="http://www.w3.org/2000/svg">
  <style>
    text { font-family: "JetBrains Mono","Noto Sans SC",ui-monospace,monospace; }
  </style>
  <rect width="680" height="450" fill="#0f172a"/>
  <line x1="340" y1="100" x2="340" y2="400" stroke="#1e293b" stroke-width="1"/>
  <text x="340" y="46" fill="#e2e8f0" font-size="20" text-anchor="middle" font-weight="bold">踩坑① 误标垃圾：把老板邮件丢进垃圾箱</text>
  <text x="340" y="70" fill="#94a3b8" font-size="13" text-anchor="middle">白名单优先级 &gt; 关键词评分，否则一封垃圾词邮件就出事</text>

  <!-- 左：白名单 -->
  <rect x="40" y="100" width="250" height="74" rx="10" fill="#0b2433" stroke="#22d3ee" stroke-width="2"/>
  <text x="56" y="128" fill="#22d3ee" font-size="13">发件人: boss@company.com</text>
  <text x="56" y="150" fill="#94a3b8" font-size="11">正文: 优惠 中奖 免费 立即领取</text>

  <rect x="40" y="200" width="250" height="64" rx="10" fill="#0b2433" stroke="#22d3ee" stroke-width="2"/>
  <text x="56" y="228" fill="#22d3ee" font-size="13" font-weight="bold">白名单优先闸</text>
  <text x="56" y="250" fill="#94a3b8" font-size="11">命中 → 跳过所有垃圾规则</text>

  <rect x="40" y="300" width="250" height="64" rx="10" fill="#0b2433" stroke="#22d3ee" stroke-width="2"/>
  <text x="56" y="328" fill="#22d3ee" font-size="13" font-weight="bold">判定: normal</text>
  <text x="56" y="350" fill="#94a3b8" font-size="11">留在 INBOX，原样保留</text>

  <!-- 右：普通发件人 -->
  <rect x="390" y="100" width="250" height="74" rx="10" fill="#2a0f1a" stroke="#fb7185" stroke-width="2"/>
  <text x="406" y="128" fill="#fb7185" font-size="13">发件人: spam@unk.com</text>
  <text x="406" y="150" fill="#94a3b8" font-size="11">正文: 优惠 中奖 免费 领取</text>

  <rect x="390" y="200" width="250" height="64" rx="10" fill="#2a0f1a" stroke="#fb7185" stroke-width="2"/>
  <text x="406" y="228" fill="#fb7185" font-size="13" font-weight="bold">关键词评分 &gt;= 3</text>
  <text x="406" y="250" fill="#94a3b8" font-size="11">无白名单 → 判垃圾</text>

  <rect x="390" y="300" width="250" height="64" rx="10" fill="#2a0f1a" stroke="#fb7185" stroke-width="2"/>
  <text x="406" y="328" fill="#fb7185" font-size="13" font-weight="bold">判定: spam</text>
  <text x="406" y="350" fill="#94a3b8" font-size="11">移入 垃圾箱</text>

  <g stroke="#64748b" stroke-width="2" fill="none">
    <path d="M165 174 V198"/>
    <path d="M165 264 V298"/>
    <path d="M515 174 V198"/>
    <path d="M515 264 V298"/>
  </g>

  <rect x="40" y="392" width="600" height="36" rx="6" fill="#2a1f0b" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="340" y="415" fill="#fbbf24" font-size="12" text-anchor="middle">白名单优先级 &gt; 关键词评分：老板的垃圾词邮件永远不进垃圾箱（见 01_mail_classifier.py）</text>
</svg>
